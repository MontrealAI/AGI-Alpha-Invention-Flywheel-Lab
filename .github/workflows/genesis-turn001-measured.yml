name: GENESIS 001 measured-laboratory successor
on:
  pull_request:
    paths:
      - 'campaign/genesis_turn001/**'
      - '.github/workflows/genesis-turn001-measured.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measured-source-and-earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Obtain the measured lab dataset from the source-matched prior run
        run: |
          mkdir -p "$RUNNER_TEMP/battery-source"
          gh run download 41931850452 --repo MontrealAI/AGI-Alpha-Invention-Flywheel-Lab --name battery100-results --dir "$RUNNER_TEMP/battery-source"
          python - <<'PY'
          import os, zipfile
          root=os.environ['RUNNER_TEMP']
          with zipfile.ZipFile(os.path.join(root,'source-battery100.zip'),'w',zipfile.ZIP_DEFLATED) as z:
              for name in ('evaluation.json','cycle_capacities.csv','sealed_predictions.json'):
                  z.write(os.path.join(root,'battery-source',name),arcname=name)
          PY
      - name: Independent negative controls on measured physical data
        run: |
          python -B -m campaign.genesis_turn001.physical_successor test --upstream-zip "$RUNNER_TEMP/source-battery100.zip"
      - name: Install existing native financial runtime dependencies
        run: |
          python -m pip install -r requirements-omega-mechanisms-v3.txt
      - name: Run native simulated earnings, followed by real-data research successor
        run: |
          python -B -m campaign.genesis_turn001.native_turn run --output "$RUNNER_TEMP/genesis-native-central"
          python -B -m campaign.genesis_turn001.native_turn audit --output "$RUNNER_TEMP/genesis-native-central"
          python -B -m campaign.genesis_turn001.physical_successor run --upstream-zip "$RUNNER_TEMP/source-battery100.zip" --native-dir "$RUNNER_TEMP/genesis-native-central" --output "$RUNNER_TEMP/genesis-measured-turn"
          python -B -m campaign.genesis_turn001.physical_successor audit --upstream-zip "$RUNNER_TEMP/source-battery100.zip" --native-dir "$RUNNER_TEMP/genesis-native-central" --output "$RUNNER_TEMP/genesis-measured-turn"
      - name: Adversarial report tampering must fail the independent audit
        run: |
          cp "$RUNNER_TEMP/genesis-measured-turn/PUBLIC_REPORT.json" "$RUNNER_TEMP/saved-report.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'genesis-measured-turn/PUBLIC_REPORT.json'
          d=json.loads(p.read_text())
          d['actual_revenue_usd']=1000000
          p.write_text(json.dumps(d))
          PY
          if python -B -m campaign.genesis_turn001.physical_successor audit --upstream-zip "$RUNNER_TEMP/source-battery100.zip" --native-dir "$RUNNER_TEMP/genesis-native-central" --output "$RUNNER_TEMP/genesis-measured-turn"; then
            echo "FAIL: forged revenue was accepted" >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/saved-report.json" "$RUNNER_TEMP/genesis-measured-turn/PUBLIC_REPORT.json"
          python -B -m campaign.genesis_turn001.physical_successor audit --upstream-zip "$RUNNER_TEMP/source-battery100.zip" --native-dir "$RUNNER_TEMP/genesis-native-central" --output "$RUNNER_TEMP/genesis-measured-turn"
      - name: Retain only public safe results; never signer or raw datasets
        if: always()
        run: |
          mkdir -p inspection-only
          if test -f "$RUNNER_TEMP/genesis-measured-turn/PUBLIC_REPORT.json"; then
            cp "$RUNNER_TEMP/genesis-measured-turn/PUBLIC_REPORT.json" inspection-only/GENESIS_PHYSICAL_REPORT.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genesis001-measured-successor-public-result
          path: inspection-only
          if-no-files-found: warn
