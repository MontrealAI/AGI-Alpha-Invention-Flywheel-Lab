name: EIT183 source-bound physical ordinary control
on:
  push:
    branches: [experiment/blue-sky-eit-paired-voltage183-20261119]
    paths:
      - 'campaign/eit-paired-observatory183/**'
      - 'research/eit_physical_control183/**'
      - 'tests/test_eit_physical_control183.py'
      - '.github/workflows/eit-paired183.yml'
  pull_request:
    paths:
      - 'campaign/eit-paired-observatory183/**'
      - 'research/eit_physical_control183/**'
      - 'tests/test_eit_physical_control183.py'
      - '.github/workflows/eit-paired183.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline-refusals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-pinned format libraries
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1
      - name: Verify exact head and nine unchanged offline checks
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -B -m unittest -v tests.test_eit_physical_control183

  physical-byte-inventory:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned physical-data-only open-source format dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1
      - name: Execute frozen exact-head test and obtain public measured data
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -B -m unittest -v tests.test_eit_physical_control183
          /usr/bin/time -f 'real_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' \
            -o "$RUNNER_TEMP/eit183-resource.txt" \
            python -B -m research.eit_physical_control183.control --out "$RUNNER_TEMP/EIT183_CONTRAST.json"
          cat "$RUNNER_TEMP/eit183-resource.txt"
      - name: Upload hashes and small measured-array receipt, no raw archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit183-ordinary-physical-pair-${{ github.sha }}
          path: |
            ${{ runner.temp }}/EIT183_CONTRAST.json
            ${{ runner.temp }}/eit183-resource.txt
          retention-days: 14
