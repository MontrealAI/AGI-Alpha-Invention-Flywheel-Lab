name: Omega private-information mechanism qualification
on:
  pull_request:
    paths:
      - 'mechanism_harness/**'
      - 'tests/test_omega_mechanisms_v3.py'
      - 'campaign/omega-inventor/**'
      - 'requirements-omega-mechanisms-v3.txt'
      - 'requirements-commercial010.txt'
      - 'adaptive_enterprise/**'
      - 'commercial/**'
      - 'connected_enterprise/**'
      - 'enterprise/**'
      - '.github/workflows/omega-mechanisms-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-mechanisms-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  construct-verify-operate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install opt-in pinned dependencies and preserve public source
        shell: bash
        run: |
          python -m pip install -r requirements-omega-mechanisms-v3.txt
          git rev-parse HEAD > "$RUNNER_TEMP/SOURCE_COMMIT.txt"
          git archive --format=zip --output="$RUNNER_TEMP/omega-v3-runtime-source.zip" HEAD mechanism_harness adaptive_enterprise commercial connected_enterprise enterprise experiments vendor portfolio25 production060 inventory061 flexibility063 tests/test_omega_mechanisms_v3.py campaign/omega-inventor requirements-commercial010.txt requirements-omega-mechanisms-v3.txt
      - name: Independent strategic and native fault tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_omega_mechanisms_v3.py -v 2>&1 | tee "$RUNNER_TEMP/omega-v3-tests.log"
      - name: Registered fresh mechanism construction and exact incentive checks
        run: |
          python -m mechanism_harness.mechanism_campaign --output "$RUNNER_TEMP/omega-v3-campaign.json"
          python -m mechanism_harness.mechanism_campaign --audit --output "$RUNNER_TEMP/omega-v3-campaign.json"
      - name: Matched native commercial alternatives
        shell: bash
        run: |
          set -euo pipefail
          for arm in generated standard full_control; do
            python -m mechanism_harness.mechanism_native run --arm "$arm" --output "$RUNNER_TEMP/omega-v3-$arm"
            python -m mechanism_harness.mechanism_native audit --output "$RUNNER_TEMP/omega-v3-$arm" > "$RUNNER_TEMP/omega-v3-$arm-audit.json"
          done
          sha256sum "$RUNNER_TEMP/omega-v3-generated/NATIVE_EXPORT.json" > "$RUNNER_TEMP/omega-v3-before.sha256"
          python -m mechanism_harness.mechanism_native resume --output "$RUNNER_TEMP/omega-v3-generated"
          sha256sum -c "$RUNNER_TEMP/omega-v3-before.sha256"
      - name: Refusal and copycat financial counterexamples
        shell: bash
        run: |
          set -euo pipefail
          for stress in no_demand copycat; do
            python -m mechanism_harness.mechanism_native run --stress "$stress" --output "$RUNNER_TEMP/omega-v3-$stress"
            python -m mechanism_harness.mechanism_native audit --output "$RUNNER_TEMP/omega-v3-$stress" > "$RUNNER_TEMP/omega-v3-$stress-audit.json"
          done
      - name: Export compact public evidence, never recovery authority
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          study=json.loads((temp/'omega-v3-campaign.json').read_text())
          report={'source_commit':(temp/'SOURCE_COMMIT.txt').read_text().strip(),
                  'actual_revenue_usd':0,'broad_objective_established':False,
                  'campaign':{k:v for k,v in study.items() if k!='cases'},'businesses':{}}
          for label in ('generated','standard','full_control','no_demand','copycat'):
            root=temp/('omega-v3-'+label);r=json.loads((root/'REPORT.json').read_text())
            report['businesses'][label]={k:r[k] for k in ('arm','stress','opportunities','settled_buyers','declined_buyers','refunded_buyers','native_summary','clock','scope')}
            report['businesses'][label]['successor_verified']=None if r['successor'] is None else r['successor']['verified']
            report['businesses'][label]['hashes']={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ('REPORT.json','NATIVE_EXPORT.json')}
          (temp/'omega-v3-public.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Preserve explicit public allowlist
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-mechanisms-v3-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/SOURCE_COMMIT.txt
            ${{ runner.temp }}/omega-v3-runtime-source.zip
            ${{ runner.temp }}/omega-v3-tests.log
            ${{ runner.temp }}/omega-v3-campaign.json
            ${{ runner.temp }}/omega-v3-*-audit.json
            ${{ runner.temp }}/omega-v3-public.json
          if-no-files-found: warn
