name: Governance native risk152 first-party synthetic qualification
on:
  pull_request:
    paths:
      - '.github/workflows/governance-native-risk152.yml'
      - 'products/governance_impact140/native_risk152.py'
      - 'tests/test_governance_native_risk152.py'
      - 'campaign/governance-native-risk152/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/governance-native-risk152.yml'
      - 'products/governance_impact140/native_risk152.py'
      - 'tests/test_governance_native_risk152.py'
      - 'campaign/governance-native-risk152/**'
permissions:
  contents: read
concurrency:
  group: governance-native-risk152-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
    steps:
      - name: Record job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-source adversarial tests including optimized Python
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python -B -m unittest discover -s tests -p 'test_governance_native_risk152.py' -v
          python -O -B -m unittest discover -s tests -p 'test_governance_native_risk152.py' -v
          python -B -m unittest discover -s tests -p 'test_governance_impact140.py' -v
      - name: Build deterministic key-free exact-source ZIP
        id: build
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          names = (
              "products/governance_impact140/native_risk152.py",
              "tests/test_governance_native_risk152.py",
              "campaign/governance-native-risk152/PROTOCOL.md",
          )
          out = Path(os.environ["RUNNER_TEMP"]) / "native-risk152"
          out.mkdir(exist_ok=False)
          payloads = {}
          for name in names:
              path = Path(name)
              assert path.is_file() and not path.is_symlink(), name
              payloads[name] = path.read_bytes()
          manifest = {
              "schema": "agi-alpha/native-risk152/standalone-v1",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "files": {name: hashlib.sha256(payloads[name]).hexdigest()
                        for name in names},
              "limit": "synthetic source-only, no authenticated evaluation or government qualification",
          }
          payloads["MANIFEST.json"] = (json.dumps(manifest, sort_keys=True, indent=2) + "\n").encode()
          archive = out / "native-risk152-source.zip"
          with zipfile.ZipFile(archive, "w") as z:
              for name, raw in sorted(payloads.items()):
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, raw)
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write("archive_sha256=" + sha + "\n")
          print("SOURCE_COMMIT", manifest["source_commit"])
          print("SOURCE_ONLY_ZIP_SHA256", sha)
          PY
      - name: Publish allowlisted nonprivate source ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-risk152-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-risk152/native-risk152-source.zip
          if-no-files-found: error
  downloaded:
    needs: [source]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      ARCHIVE_SHA256: ${{ needs.source.outputs.archive_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-risk152-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-risk152-downloaded
      - name: Audit actual downloaded ZIP against source, paths, and prior-job SHA
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python -B - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path
          archive = Path(os.environ["RUNNER_TEMP"]) / "native-risk152-downloaded/native-risk152-source.zip"
          raw = archive.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ["ARCHIVE_SHA256"]
          expected = {
              "products/governance_impact140/native_risk152.py",
              "tests/test_governance_native_risk152.py",
              "campaign/governance-native-risk152/PROTOCOL.md",
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "native-risk152-clean"
          target.mkdir(exist_ok=False)
          with zipfile.ZipFile(archive) as z:
              members = z.infolist()
              names = [m.filename for m in members]
              assert len(names) == len(set(names)) and set(names) == expected | {"MANIFEST.json"}
              assert all(not n.startswith("/") and ".." not in Path(n).parts for n in names)
              assert all(stat.S_IFMT(m.external_attr >> 16) == stat.S_IFREG for m in members)
              manifest = json.loads(z.read("MANIFEST.json"))
              assert manifest["source_commit"] == os.environ["SOURCE_COMMIT"]
              assert set(manifest["files"]) == expected
              for name in expected:
                  payload = z.read(name)
                  sha = hashlib.sha256(payload).hexdigest()
                  assert sha == manifest["files"][name] and payload == Path(name).read_bytes()
                  dest = target / name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(payload)
          print("CLEAN_DOWNLOADED_SOURCE_MATCH_PASS", os.environ["SOURCE_COMMIT"])
          PY
      - name: Independently execute extracted-source T1-T10 and CLI
        run: |
          cd "$RUNNER_TEMP/native-risk152-clean"
          python -B -m unittest discover -s tests -p 'test_governance_native_risk152.py' -v
          python -B - <<'PY'
          import json
          from pathlib import Path
          from tests.test_governance_native_risk152 import sample
          from products.governance_impact140.native_risk152 import main
          Path("synthetic.json").write_text(json.dumps(sample()))
          receipt = main(["--input", "synthetic.json", "--output", "receipt.json"])
          assert receipt["signals"]["accuracy"]["observed"] == {"numerator": 1, "denominator": 1}
          assert receipt["authorization"] == "NO_REVIEW_NO_COMPLIANCE_NO_REAL_WORLD_PERFORMANCE"
          print("CLEAN_DOWNLOADED_NATIVE_METRIC_CLI_PASS")
          PY
