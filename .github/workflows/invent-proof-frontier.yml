name: INVENT and PROOF OMEGA bounded frontier qualification

on:
  pull_request:
    paths:
      - 'products/invent-omega/**'
      - 'products/proof-omega/**'
      - 'products/unlock-omega/**'
      - '.github/workflows/invent-proof-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invent-proof-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: PROOF adversarial unit tests
        run: python3 -m unittest discover -s products/proof-omega/tests -v
      - name: PROOF bounded complete-domain demonstration and independent replay
        run: |
          python3 products/proof-omega/proof.py demo
          python3 products/proof-omega/proof.py invent products/proof-omega/example.json \
            --output "$RUNNER_TEMP/proof-contract.json" \
            --report "$RUNNER_TEMP/proof-report.json"
          python3 products/proof-omega/proof.py replay "$RUNNER_TEMP/proof-contract.json" "$RUNNER_TEMP/proof-report.json"
      - name: INVENT adversarial comparator unit tests
        run: python3 -m unittest discover -s products/invent-omega/tests -v
      - name: INVENT default network-disabled Docker acceptance
        run: python3 products/invent-omega/invent.py demo
