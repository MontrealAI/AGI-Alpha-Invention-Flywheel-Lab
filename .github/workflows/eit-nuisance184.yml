name: EIT184 matched all-column nuisance control
on:
  push:
    branches: [experiment/eit184-gain-drift-nuisance-control-20261119]
    paths:
      - 'campaign/eit-nuisance184/**'
      - 'research/eit_nuisance184/**'
      - 'tests/test_eit_nuisance184.py'
      - '.github/workflows/eit-nuisance184.yml'
  pull_request:
    paths:
      - 'campaign/eit-nuisance184/**'
      - 'research/eit_nuisance184/**'
      - 'tests/test_eit_nuisance184.py'
      - '.github/workflows/eit-nuisance184.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  registered-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Register actual hosted execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact pinned source-format dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1
      - name: Exact-head invariant and ten frozen refusal/math tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -B -m unittest -v tests.test_eit_nuisance184

  one-physical-pair:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Register actual hosted execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned public scientific format dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1
      - name: One frozen-source pair and all 16 held-out columns
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -B -m unittest -v tests.test_eit_nuisance184
          /usr/bin/time -f 'real_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' \
            -o "$RUNNER_TEMP/EIT184_RESOURCES.txt" \
            python -B -m research.eit_nuisance184.control --out "$RUNNER_TEMP/EIT184_NUISANCE.json"
          cat "$RUNNER_TEMP/EIT184_RESOURCES.txt"
      - name: Upload compact pinned public-only result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit184-public-nuisance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/EIT184_NUISANCE.json
            ${{ runner.temp }}/EIT184_RESOURCES.txt
          retention-days: 14
