name: Independent CAS conflicting valid signed tickets
on:
  push:
    branches:
      - qualification/completion024-installed-cas-independent-20261107
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conflicting-forward-source-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record actual job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify literal tested commit and pre-execution protocol freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 79e2860dd1bf865918a21fe8e66d07aed63a90ed HEAD
          git show 79e2860dd1bf865918a21fe8e66d07aed63a90ed:qualification/completion024-independent/CONFLICTING_TICKETS_PROTOCOL.md > "$RUNNER_TEMP/FROZEN_PROTOCOL.md"
          cmp "$RUNNER_TEMP/FROZEN_PROTOCOL.md" qualification/completion024-independent/CONFLICTING_TICKETS_PROTOCOL.md
          sha256sum qualification/completion024-independent/CONFLICTING_TICKETS_PROTOCOL.md tests/test_completion024_conflicting_cas_tickets_independent.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing supported pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r requirements-cycle004.txt numpy==2.3.5 scipy==1.17.0
      - name: Run fixed two-process conflicting ticket fork rejection
        run: |
          /usr/bin/time -v python -B -m unittest tests.test_completion024_conflicting_cas_tickets_independent -v
      - name: Declare exact tested commit after full pass
        if: success()
        run: git rev-parse HEAD
