name: AGI ALPHA FLYWHEEL 2026 11 02 Report
on:
  pull_request:
    paths:
      - 'docs/agi-alpha-flywheel-report-20261102/**'
      - 'docs/research/agi-alpha-flywheel-20261102-report.pdf'
      - '.github/workflows/agi-alpha-flywheel-report.yml'
  push:
    branches: [main]
    paths:
      - 'docs/agi-alpha-flywheel-report-20261102/**'
      - 'docs/research/agi-alpha-flywheel-20261102-report.pdf'
      - '.github/workflows/agi-alpha-flywheel-report.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flywheel-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      report_artifact_id: ${{ steps.report_assets.outputs.artifact-id }}
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            docs/agi-alpha-flywheel-report-20261102
            docs/research/agi-alpha-flywheel-20261102-report.pdf
          sparse-checkout-cone-mode: false
      - name: Install the standard LaTeX and PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Compile the report and audit compact evidence
        run: |
          make -C docs/agi-alpha-flywheel-report-20261102 check
          python3 docs/agi-alpha-flywheel-report-20261102/verify.py
      - name: Assemble the inspected paper and self-contained source
        run: python3 docs/agi-alpha-flywheel-report-20261102/package.py --output "$RUNNER_TEMP/flywheel-report-publication"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: report_assets
        with:
          name: agi-alpha-flywheel-report-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flywheel-report-publication/
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: docs/agi-alpha-flywheel-report-20261102
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.report_artifact_id }}
          path: ${{ runner.temp }}/flywheel-report-publication
          merge-multiple: true
      - name: Publish and verify the distinct report edition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat docs/agi-alpha-flywheel-report-20261102/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="agi-alpha-flywheel-report-20261102-v${version}"
          assets="$RUNNER_TEMP/flywheel-report-publication"
          cd "$assets"
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Verify existing edition; never overwrite an earlier release."
          else
            gh release create "$tag" "$assets/AGI_ALPHA_FLYWHEEL_2026_11_02_REPORT.pdf" "$assets/AGI_ALPHA_FLYWHEEL_2026_11_02_REPORT_SOURCE.zip" "$assets/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AGI ALPHA FLYWHEEL · 2 November 2026 Report" --notes-file docs/agi-alpha-flywheel-report-20261102/RELEASE_NOTES.md --latest=false
          fi
          mkdir "$RUNNER_TEMP/verified-flywheel-report"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern AGI_ALPHA_FLYWHEEL_2026_11_02_REPORT.pdf --pattern AGI_ALPHA_FLYWHEEL_2026_11_02_REPORT_SOURCE.zip --pattern SHA256SUMS --dir "$RUNNER_TEMP/verified-flywheel-report"
          cd "$RUNNER_TEMP/verified-flywheel-report"
          sha256sum --check SHA256SUMS
          cmp "$assets/SHA256SUMS" SHA256SUMS
