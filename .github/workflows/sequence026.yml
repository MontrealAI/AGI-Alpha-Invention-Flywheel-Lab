name: Public mechanism sequence 026 development
on:
  workflow_dispatch:
  pull_request:
    # Explicit protocol/configuration changes or manual execution request a cohort.
    paths:
      - '.github/workflows/sequence026.yml'
      - 'scripts/run_sequence026.py'
      - 'scripts/run_commoncost026.py'
      - 'scripts/run_strategic024.py'
      - 'campaign/sequence-026/**'
permissions:
  contents: read
concurrency:
  group: sequence026-${{ github.ref }}
  cancel-in-progress: false
jobs:
  business:
    name: ${{ matrix.case }} / ${{ matrix.seed }} / ${{ matrix.arm }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [central, menu_central, menu_overlap_wiring_fixture, menu_adverse]
        seed: [2610311726]
        arm: [joint, sequence]
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Sequence, common-cost and actual channel contract regressions
        run: |
          python -m unittest discover -s tests -p "test_sequence*.py" -v
          python -m unittest discover -s tests -p test_common_cost026.py -v
          python -m unittest discover -s tests -p "test_connected_channel*.py" -v
      - name: Fixed horizon, useful-output audit and completed resume
        run: python scripts/run_sequence026.py --case '${{ matrix.case }}' --seed '${{ matrix.seed }}' --arm '${{ matrix.arm }}' --output "$RUNNER_TEMP/sequence026"
      - name: Browser-readable compact outcome
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'sequence026/public/SUMMARY.json'
          r=json.loads(p.read_text()) if p.exists() else {'status':'NO_RECEIPT'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Sequence development — conditional simulation\n')
              f.write('Low-invoice fixture tests wiring only, never economic confirmation. No annual scale or autonomous invention claim.\n')
              f.write('```json\n'+json.dumps({k:r.get(k) for k in ('status','case','seed','arm','summary','paid_jobs','investments','resume_financially_unchanged','error')},indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sequence026-${{ matrix.case }}-${{ matrix.seed }}-${{ matrix.arm }}-${{ github.sha }}
          path: ${{ runner.temp }}/sequence026/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
