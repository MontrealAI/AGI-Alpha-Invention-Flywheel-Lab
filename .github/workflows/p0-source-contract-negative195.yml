name: P0 pinned source API negative qualification 195
on:
  pull_request:
    paths:
      - scripts/p0_source_contracts.py
      - .github/workflows/p0-source-contract-negative195.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-negative-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      P0_TARGET: f0987aa48d5c9136b28540f54eabf5367e63bbe6
      P0_OWNER: ced6c1cb004887dcdafaea59a2976020be649f8e
    steps:
      - name: Record execution clock start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute negative and corrected synthetic API fixtures
        run: python -B scripts/p0_source_contracts.py --self-test
      - name: Verify immutable target and owner Git objects
        run: |
          git cat-file -e "${P0_TARGET}^{commit}"
          git cat-file -e "${P0_OWNER}^{commit}"
      - name: Execute source-bound incompatibility witness without account reads
        run: |
          python -B scripts/p0_source_contracts.py \
            --target "$P0_TARGET" --owner "$P0_OWNER" --expect-blocked \
            --output "$RUNNER_TEMP/P0_SOURCE_API_NEGATIVE195.json"
      - name: Preserve immutable negative result and resource record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-source-api-negative195-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/P0_SOURCE_API_NEGATIVE195.json
          if-no-files-found: warn
