name: Independent Omega native contractual cost witness
on:
  pull_request:
    paths:
      - 'mechanism_harness/native_cost_witness.py'
      - 'tests/test_omega_native_cost_witness.py'
      - 'docs/omega-native-cost-witness/**'
      - '.github/workflows/omega-native-cost-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-native-cost-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-contractual-cost-check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Confirm exact source and python syntax
        run: |
          git rev-parse HEAD
          python -m py_compile mechanism_harness/native_cost_witness.py tests/test_omega_native_cost_witness.py
      - name: Install existing canonical finance dependencies
        run: python -m pip install -r requirements-commercial010.txt
      - name: Frozen intact control and six distinct missing-cost and undercharge trials
        run: python -m unittest discover -s tests -p test_omega_native_cost_witness.py -v
