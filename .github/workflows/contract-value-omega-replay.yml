name: Contract Value Omega independent financial source replay
on:
  pull_request:
    paths:
      - 'research/contract-value-omega-replay/**'
      - 'products/contract_value_omega/verify_replay.py'
      - 'tests/test_contract_value_omega_replay.py'
      - '.github/workflows/contract-value-omega-replay.yml'
  push:
    branches:
      - 'review/contract-value-omega-source-replay-20261116'
    paths:
      - 'research/contract-value-omega-replay/**'
      - 'products/contract_value_omega/verify_replay.py'
      - 'tests/test_contract_value_omega_replay.py'
      - '.github/workflows/contract-value-omega-replay.yml'
permissions:
  contents: read
jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual hosted execution window
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Existing buyer financial regression suite
        run: python3 -m unittest discover -s tests -p 'test_contract_value_omega.py' -v
      - name: Frozen independent financial-source replay regression suite
        run: python3 -m unittest discover -s tests -p 'test_contract_value_omega_replay.py' -v
      - name: Actual clean buyer demo and original verifier
        run: |
          python3 -m products.contract_value_omega.run --input products/contract_value_omega/demo --output "$RUNNER_TEMP/review"
          python3 -m products.contract_value_omega.verify --input products/contract_value_omega/demo --report "$RUNNER_TEMP/review"
      - name: Supplemental source-derived replay of released-shape buyer review
        run: python3 -m products.contract_value_omega.verify_replay --input products/contract_value_omega/demo --report "$RUNNER_TEMP/review"

      - name: Build reproducible source-only buyer ZIP and run clean extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          root=Path("products/contract_value_omega")
          out=Path("/tmp/contract-value-replay-edition.zip")
          source=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for f in sorted(root.rglob("*")):
                  if not f.is_file() or "__pycache__" in f.parts or f.suffix==".pyc":
                      continue
                  info=zipfile.ZipInfo(f.as_posix(),date_time=(2026,11,16,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  archive.writestr(info,f.read_bytes())
              info=zipfile.ZipInfo("SOURCE-REVISION.txt",date_time=(2026,11,16,0,0,0))
              info.compress_type=zipfile.ZIP_DEFLATED
              archive.writestr(info,source+"\\n")
          print("Buyer source ZIP bytes",out.stat().st_size,"source",source)
          PY
          mkdir -p "$RUNNER_TEMP/extracted-review"
          unzip -q /tmp/contract-value-replay-edition.zip -d "$RUNNER_TEMP/extracted-review"
          (
            cd "$RUNNER_TEMP/extracted-review"
            python3 -m products.contract_value_omega.run --input products/contract_value_omega/demo --output "$RUNNER_TEMP/clean-buyer-review"
            python3 -m products.contract_value_omega.verify --input products/contract_value_omega/demo --report "$RUNNER_TEMP/clean-buyer-review"
            python3 -m products.contract_value_omega.verify_replay --input products/contract_value_omega/demo --report "$RUNNER_TEMP/clean-buyer-review"
          )
          sha256sum /tmp/contract-value-replay-edition.zip
      - name: Publish source-only buyer ZIP and synthetic proof of clean operation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-value-omega-replay-${{ github.sha }}
          path: |
            /tmp/contract-value-replay-edition.zip
            ${{ runner.temp }}/clean-buyer-review/
          retention-days: 30
          if-no-files-found: error
