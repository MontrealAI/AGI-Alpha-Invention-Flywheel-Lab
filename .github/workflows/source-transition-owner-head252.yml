name: P0-252 synthetic owner-head fork rejection
on:
  pull_request:
    paths:
      - 'research/source_transition_trust246/FORK252_PROTOCOL.md'
      - 'research/source_transition_trust246/owner_head252.py'
      - 'research/source_transition_trust246/test_owner_head252.py'
      - 'research/source_transition_trust246/owner_durable251.py'
      - 'research/source_transition_trust246/owner_signed_boundary250.py'
      - 'research/source_transition_trust246/owner_wire248.py'
      - '.github/workflows/source-transition-owner-head252.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0252-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  exact-head-owner-fork-exclusion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout exact PR source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Obtain pinned immutable owner evidence decoder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --fail --location --silent --show-error --max-time 60 --retry 0 \
            'https://raw.githubusercontent.com/MontrealAI/AGI-Alpha-Invention-Flywheel-Lab/ced6c1cb004887dcdafaea59a2976020be649f8e/connected_enterprise/transition_evidence.py' \
            -o "$RUNNER_TEMP/p0252-old-owner.py"
      - name: Run all nine preregistered tests without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0252-home"
          cd research/source_transition_trust246
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p0252-home" \
            PINNED_OWNER_SOURCE="$RUNNER_TEMP/p0252-old-owner.py" \
            PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v test_owner_head252.py
      - name: Generate bounded nonsecret exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0252-receipt"
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('research/source_transition_trust246')
          names = ['FORK252_PROTOCOL.md','owner_head252.py','test_owner_head252.py',
                   'owner_durable251.py','owner_signed_boundary250.py','owner_wire248.py']
          old = (Path(os.environ['RUNNER_TEMP'])/'p0252-old-owner.py').read_bytes()
          sha = hashlib.sha1(b'blob '+str(len(old)).encode()+b'\\0'+old).hexdigest()
          assert sha == '2397091ef8e1960ad13950693d5b3cd04e2ff7c5'
          receipt = {
              'schema': 'agi-alpha/p0-252-synthetic-owner-head/v1',
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'protocol_commit': '4c4b262f886c3e1630a697eff82e9d3a6e67c0a1',
              'historical_owner_git_blob': sha,
              'source_file_sha256': {p: hashlib.sha256((root/p).read_bytes()).hexdigest() for p in names},
              'registered_tests': 9, 'registered_tests_exit_zero': True,
              'different_target_fork_tested': True,
              'synthetic_keys_persisted': False,
              'historical_account_or_credentials_accessed': False,
              'actual_financial_owner_signer_repaired': False,
              'actual_native_account_migration_qualified': False,
              'uncooperative_writers_excluded': False,
              'protected_release_or_commerce_qualified': False,
              'actual_host_model_billing_usd': None,
          }
          (Path(os.environ['RUNNER_TEMP'])/'p0252-receipt'/'RESULT.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2)+'\\n')
          PY
      - name: Upload receipt without test keys or state
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0252-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0252-receipt/RESULT.json
          if-no-files-found: error
          retention-days: 7
