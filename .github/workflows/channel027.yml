name: "🌌♾️ AGI ALPHA Flywheel Harness — Native channel menu wiring"
on:
  pull_request:
    paths:
      - '.github/workflows/channel027.yml'
      - 'scripts/run_channel027_smoke.py'
      - 'campaign/channel-027/**'
      - 'connected_enterprise/channel_menu.py'
      - 'connected_enterprise/engine.py'
      - 'connected_enterprise/joint_planning.py'
      - 'connected_enterprise/strategic_audit.py'
      - 'connected_enterprise/finance.py'
      - 'connected_enterprise/verify.py'
      - 'adaptive_enterprise/instruments.py'
      - 'tests/test_connected_channel*.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: channel027-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  native-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - run: python -m unittest discover -s tests -p 'test_connected_channel*.py' -v
      - name: Reproduce exposed native menu wiring and independent audits
        run: python scripts/run_channel027_smoke.py --output "$RUNNER_TEMP/channel027"
      - name: Public compact receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel027-engineering
          path: ${{ runner.temp }}/channel027/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
