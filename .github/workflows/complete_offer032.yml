name: "🌌♾️ AGI ALPHA Flywheel Harness — Complete useful-offer selection"
on:
  pull_request:
    paths:
      - 'scripts/run_complete_offer032.py'
      - 'scripts/summarize_complete_offer032.py'
      - 'campaign/complete-offer-032/**'
      - '.github/workflows/complete_offer032.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete_offer032-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    name: Native smoke / ${{ matrix.arm }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [restricted, menu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Focused decision and package checks
        run: |
          python -m unittest discover -s tests -p 'test_complete_offer*.py' -v
          python -m unittest discover -s tests -p 'test_connected_complete_offer.py' -v
          python -m unittest discover -s tests -p 'test_receivables_packet033.py' -v
          python -m unittest discover -s tests -p 'test_common_cost*.py' -v
          python -m unittest discover -s tests -p 'test_strategic024.py' -v
          python -m unittest discover -s tests -p 'test_connected_channel_menu027.py' -v
          python -m unittest discover -s tests -p 'test_snapshot_reuse030.py' -v
          python -m unittest discover -s tests -p 'test_native_trailing_profit029.py' -v
      - name: Run fixed native business and separate financial/operating audit
        run: python scripts/run_complete_offer032.py --stage smoke --case positive --seed 2610312204 --arm '${{ matrix.arm }}' --output "$RUNNER_TEMP/complete_offer032"
      - name: Write browser-readable outcome
        if: always()
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'complete_offer032/public/SUMMARY.json'
          if not p.exists():
              text = 'No completed receipt was produced. See execution logs; this is not a successful business result.'
          else:
              r = json.loads(p.read_text())
              text = '\n'.join(['## Conditional simulated business',
                  'Status: ' + str(r.get('status')),
                  'Case / seed / arm: ' + str(r.get('case')) + ' / ' + str(r.get('seed')) + ' / ' + str(r.get('arm')),
                  'Paid deliveries: ' + str(r.get('paid_jobs')),
                  'Native financial summary (micro-USD): ' + json.dumps(r.get('summary'), sort_keys=True),
                  'Conditional commercial gate: ' + str(r.get('conditional_simulated_commercial_success')),
                  'Actual commerce: none. Host/model/integration billing is not measured. No annualized or billion-dollar claim.',
                  'Finite development comparison, not global game-theoretic optimality.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(text + '\n')
          PYCODE
      - name: Publish compact public result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete_offer032-smoke-${{ matrix.arm }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/complete_offer032/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
  scale:
    name: Matched 28-day / ${{ matrix.case }} / ${{ matrix.seed }} / ${{ matrix.arm }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [positive, self_service, nonpayment]
        seed: [2610312205, 2610312206]
        arm: [restricted, menu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Execute full fixed horizon and settlement drain
        run: python scripts/run_complete_offer032.py --stage scale --case '${{ matrix.case }}' --seed '${{ matrix.seed }}' --arm '${{ matrix.arm }}' --output "$RUNNER_TEMP/complete_offer032"
      - name: Write browser-readable outcome
        if: always()
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'complete_offer032/public/SUMMARY.json'
          if not p.exists():
              text = 'No completed receipt was produced. See execution logs; this is not a successful business result.'
          else:
              r = json.loads(p.read_text())
              text = '\n'.join(['## Conditional simulated business',
                  'Status: ' + str(r.get('status')),
                  'Case / seed / arm: ' + str(r.get('case')) + ' / ' + str(r.get('seed')) + ' / ' + str(r.get('arm')),
                  'Paid deliveries: ' + str(r.get('paid_jobs')),
                  'Native financial summary (micro-USD): ' + json.dumps(r.get('summary'), sort_keys=True),
                  'Conditional commercial gate: ' + str(r.get('conditional_simulated_commercial_success')),
                  'Actual commerce: none. Host/model/integration billing is not measured. No annualized or billion-dollar claim.',
                  'Finite development comparison, not global game-theoretic optimality.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(text + '\n')
          PYCODE
      - name: Publish compact public result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete_offer032-scale-${{ matrix.case }}-${{ matrix.seed }}-${{ matrix.arm }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/complete_offer032/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
  compare:
    name: Reconcile every fixed pair
    if: always()
    needs: [smoke, scale]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: complete_offer032-*
          path: ${{ runner.temp }}/complete_offer032-receipts
      - name: Compare all registered pairs, including adverse outcomes
        run: python scripts/summarize_complete_offer032.py --input "$RUNNER_TEMP/complete_offer032-receipts" --output "$RUNNER_TEMP/complete_offer032-comparison"
      - name: Publish compact paired comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete_offer032-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/complete_offer032-comparison/COMPARISON.json
          if-no-files-found: warn
          retention-days: 30
