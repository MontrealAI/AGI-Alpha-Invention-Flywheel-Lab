name: EIT40 registered physical response experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/eit40/**'
      - '.github/workflows/eit40-physical.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check literal source SHA and hashes
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sha256sum research/eit40/PREREGISTRATION.md research/eit40/model.py research/eit40/run.py research/eit40/test_model.py
          sha256sum research/measurement_compiler/core.py research/measurement_compiler/calibrated.py research/measurement_compiler/run.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install scientific dependency wheels
        run: python -m pip install --only-binary=:all: -r campaign/measurement-compiler-001/requirements.txt
      - name: Adversarial boundary unit tests
        run: |
          python -m unittest research.eit40.test_model -v
          python -O -m unittest research.eit40.test_model -v
      - name: Download two SHA256-pinned original physical data archives
        run: python campaign/measurement-compiler-001/fetch_data.py --output "$RUNNER_TEMP/eit40-data"
      - name: Execute only the frozen four-fold development, then obey its stop
        run: |
          python -m research.eit40.run develop --data "$RUNNER_TEMP/eit40-data" --output "$RUNNER_TEMP/eit40-development"
          if grep -q '"all_four_within_five_percent": true' "$RUNNER_TEMP/eit40-development/DEVELOPMENT.json"; then
            python -m research.eit40.run confirm --data "$RUNNER_TEMP/eit40-data" --freeze "$RUNNER_TEMP/eit40-development/DEVELOPMENT.json" --output "$RUNNER_TEMP/eit40-retrospective"
          else
            echo "REGISTERED_SCIENTIFIC_STOP: development failed; do not open prior exposed evaluation data"
          fi
      - name: Retain pass and failure research receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit40-scientific-evidence
          path: |
            ${{ runner.temp }}/eit40-development/DEVELOPMENT.json
            ${{ runner.temp }}/eit40-retrospective/RETROSPECTIVE.json
          if-no-files-found: warn
