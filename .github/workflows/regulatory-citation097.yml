name: Public regulatory citation097 — frozen source and bounded public observation
on:
  push:
    branches: [research/public-regulatory-citation097-20261108]
  pull_request:
    paths:
      - "campaign/regulatory-citation097/**"
      - "research/regulatory_citation097.py"
      - "tests/test_regulatory_citation097.py"
      - ".github/workflows/regulatory-citation097.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-public-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify source head and immutable preregistration ancestor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e 71c9a2c96e351c2eaa3b1ffecec654422ce91cfa:campaign/regulatory-citation097/PROTOCOL.md
          git show 71c9a2c96e351c2eaa3b1ffecec654422ce91cfa:campaign/regulatory-citation097/PROTOCOL.md | cmp - campaign/regulatory-citation097/PROTOCOL.md
          git merge-base --is-ancestor 71c9a2c96e351c2eaa3b1ffecec654422ce91cfa HEAD
      - name: Execute all preregistered C0-C9 adversarial synthetic cases
        run: python -B -m unittest tests.test_regulatory_citation097 -v
      - name: Attempt each frozen official public source once and independently check claimed passages
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.regulatory_citation097 observe --output "$RUNNER_TEMP/REGULATORY_CITATION097_RESULT.json"
      - name: Hash key-free source report when present
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/REGULATORY_CITATION097_RESULT.json"; then
            sha256sum "$RUNNER_TEMP/REGULATORY_CITATION097_RESULT.json" | tee "$RUNNER_TEMP/REGULATORY_CITATION097_SHA256.txt"
          fi
      - name: Preserve actual positive OR negative fixed observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regulatory-citation097-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/REGULATORY_CITATION097_RESULT.json
            ${{ runner.temp }}/REGULATORY_CITATION097_SHA256.txt
          if-no-files-found: warn
