name: P0-246 historical signer target-code trust-boundary negative witness
on:
  pull_request:
    paths:
      - 'research/source_transition_trust246/**'
      - '.github/workflows/source-transition-trust246.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0246-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  historical-owner-negative-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Exact immutable source checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run exact pinned owner and safe synthetic controls
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s research/source_transition_trust246 -p test_witness.py -v
      - name: Emit negative-witness receipt, explicitly not release approval
        run: |
          mkdir -p "$RUNNER_TEMP/p0246"
          python3 -B research/source_transition_trust246/witness.py --report "$RUNNER_TEMP/p0246/RESULT.json"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          base=Path("research/source_transition_trust246")
          out=Path(os.environ["RUNNER_TEMP"])/"p0246"
          result=json.loads((out/"RESULT.json").read_text())
          assert result["actual_secret_read"] is False
          assert result["release_go"] is False
          assert result["owner_source"]["target_supplied_python_interpreted"]
          report={
            "schema":"agi-alpha/p0-246-ci-receipt/v1",
            "executing_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "protocol_sha256":hashlib.sha256((base/"PROTOCOL.md").read_bytes()).hexdigest(),
            "script_sha256":hashlib.sha256((base/"witness.py").read_bytes()).hexdigest(),
            "tests_sha256":hashlib.sha256((base/"test_witness.py").read_bytes()).hexdigest(),
            "negative_witness":result,
            "owner_account_or_key_access":False,
            "actual_billing_usd":None,
            "actual_paid_commerce_usd":None,
            "native_trailing365_profit_usd":None
          }
          (out/"RECEIPT.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          PY
      - name: Retain compact source-only negative receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0246-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0246/RECEIPT.json
          if-no-files-found: error
          retention-days: 7
