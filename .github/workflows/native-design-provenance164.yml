name: Native design041 source-plan timing164 adversarial qualification
on:
  pull_request:
    paths:
      - "campaign/native-design-provenance164/**"
      - "tests/test_design_provenance_time164.py"
      - "connected_enterprise/design_flywheel.py"
      - ".github/workflows/native-design-provenance164.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-source-link-time-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Fixed synthetic provenance-time cases
        run: python -m unittest -v tests.test_design_provenance_time164
      - name: Existing corrected shared-loss and heldout controls
        run: python -m unittest -v tests.test_connected_design_flywheel041
