name: "🌌♾️ AGI ALPHA Flywheel Harness: isolated continuation proof"
on:
  pull_request:
    paths:
      - 'scripts/prove_harness_continuation.py'
      - 'tests/test_harness_continuation.py'
      - '.github/workflows/harness-continuation.yml'
      - 'connected_enterprise/**'
      - 'adaptive_enterprise/**'
      - 'commercial/**'
      - 'enterprise/runner.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harness-continuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  same-runner-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - run: python -m unittest discover -s tests -p 'test_harness_continuation.py' -v
      - name: Register isolated synthetic accounts and compare interrupted with uninterrupted operation
        run: python scripts/prove_harness_continuation.py --receipt "$RUNNER_TEMP/continuation/RECEIPT.json"
      - name: Publish compact non-authority receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-continuation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/continuation/RECEIPT.json
          if-no-files-found: error
