name: EIT105 external physical acquisition-contract preflight
on:
  pull_request:
    paths:
      - 'research/eit_external105/**'
      - 'tests/test_eit_external105.py'
      - '.github/workflows/eit-external105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-physical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform execution start
        run: echo "AGI_JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact executing source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Fail-closed synthetic adversarial checks
        run: |
          python3 -m unittest tests.test_eit_external105 -v
          python3 -O -m unittest tests.test_eit_external105 -v
      - name: One source-bound external physical preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research.eit_external105.preflight --masked > "$RUNNER_TEMP/EIT105_PREFLIGHT.json"
          python3 - "$RUNNER_TEMP/EIT105_PREFLIGHT.json" "$(git rev-parse HEAD)" <<'PY'
          import json, sys
          obj=json.load(open(sys.argv[1],encoding='utf-8'))
          obj['executing_head_sha']=sys.argv[2]
          with open(sys.argv[1],'w',encoding='utf-8') as handle:
              json.dump(obj,handle,indent=2,sort_keys=True)
          assert obj['frozen_protocol_sha']=='21c2b7972f4c73e27d1255b0186d530297b55826'
          assert len(obj['inputs'])==2
          assert obj['new_physical_acquisitions']==0
          assert obj['real_collections_usd']==0
          assert obj['decision']=='HOLD_NO_BID_NO_DEPLOY'
          assert obj['prospective_amendment2_sha']=='676c26fd002e0c939ec305e98a57cc97169ec3bc'
          assert obj['original_strict_contract_status']=='FAILED_EXPLICIT_NA'
          assert obj['masked_contract_status']=='SOURCE_INVENTORY_ONLY'
          assert obj['masked_acquisition_inventory']['measurement_rows']>0
          assert obj['masked_acquisition_inventory']['no_imputation']
          print("EIT105_MASKED_SOURCE_INVENTORY_ONLY_ORIGINAL_STRICT_FAILURE_PRESERVED")
          PY
          sha256sum "$RUNNER_TEMP/EIT105_PREFLIGHT.json"
          cat "$RUNNER_TEMP/EIT105_PREFLIGHT.json"
      - name: Retain small key-free source-contract receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit105-external-physical-preflight
          path: ${{ runner.temp }}/EIT105_PREFLIGHT.json
          if-no-files-found: error
