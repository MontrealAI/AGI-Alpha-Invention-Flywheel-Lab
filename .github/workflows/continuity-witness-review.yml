name: CONTINUITY Omega independent synthetic witness custody review
on:
  pull_request:
    paths:
      - 'reviews/continuity-restored-obligations-20261106/witness_chain.py'
      - 'tests/test_continuity_witness_custody_review.py'
      - '.github/workflows/continuity-witness-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install free public-key verification dependency
        run: python3 -m pip install --only-binary=:all: cryptography==46.0.4
      - name: Verify synthetic independent witness custody
        run: python3 -m unittest discover -s tests -p 'test_continuity_witness_custody_review.py' -v
