name: "🌌♾️ AGI ALPHA Flywheel Harness — Fresh capital packages"
on:
  pull_request:
    paths:
      - '.github/workflows/capital025.yml'
      - 'scripts/run_capital025.py'
      - 'scripts/summarize_capital025.py'
      - 'campaign/capital-025/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capital025-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Native maturity, unpaid claims, provider default and cash safety
        run: |
          python -m unittest discover -s tests -p 'test_fresh_native_capital.py' -v
          python -m unittest discover -s tests -p 'test_capital025_inventory.py' -v
          python -m unittest discover -s tests -p 'test_cash_opportunity025.py' -v
  integration:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        policy: [incumbent, joint]
        liability: [permanent, prospective]
        capital: [low]
        seed: [2610311643]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Execute fixed horizon and native operating audit
        run: python scripts/run_capital025.py --stage integration --capital '${{ matrix.capital }}' --seed '${{ matrix.seed }}' --policy '${{ matrix.policy }}' --liability '${{ matrix.liability }}' --output "$RUNNER_TEMP/capital025"
      - name: Retain compact success or failure receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital025-integration-${{ matrix.capital }}-${{ matrix.seed }}-${{ matrix.policy }}-${{ matrix.liability }}
          path: ${{ runner.temp }}/capital025/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
  long:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        policy: [incumbent, joint]
        liability: [permanent, prospective]
        capital: [low, reference]
        seed: [2610311644, 2610311645]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Execute fixed horizon and native operating audit
        run: python scripts/run_capital025.py --stage long --capital '${{ matrix.capital }}' --seed '${{ matrix.seed }}' --policy '${{ matrix.policy }}' --liability '${{ matrix.liability }}' --output "$RUNNER_TEMP/capital025"
      - name: Retain compact success or failure receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital025-long-${{ matrix.capital }}-${{ matrix.seed }}-${{ matrix.policy }}-${{ matrix.liability }}
          path: ${{ runner.temp }}/capital025/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
  compare:
    needs: [focused, integration, long]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: capital025-*
          path: ${{ runner.temp }}/capital025-receipts
      - name: Verify full fixed membership and retain losses or failures
        run: python scripts/summarize_capital025.py --input "$RUNNER_TEMP/capital025-receipts" --output "$RUNNER_TEMP/capital025-comparison"
      - name: Publish compact comparison only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital025-comparison
          path: ${{ runner.temp }}/capital025-comparison/COMPARISON.json
          if-no-files-found: error
          retention-days: 30
