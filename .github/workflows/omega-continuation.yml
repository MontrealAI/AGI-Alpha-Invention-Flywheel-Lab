name: Omega observation and seller continuation
on:
  pull_request:
    paths:
      - 'omega/**'
      - 'commercial/ledger.py'
      - 'connected_enterprise/finance.py'
      - 'campaign/omega-continuation-bdd6/**'
      - 'campaign/omega-corrected-232221a5/**'
      - '.github/workflows/omega-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned existing dependencies
        run: python -m pip install -r omega/requirements.txt
      - name: Source matched buyer, independent observation and native lifecycle regressions
        run: python -m unittest discover -s omega -t . -p 'test_*.py' -v
      - name: Platform and retained harness contracts
        run: |
          python -m unittest discover -s tests -p 'test_connected_platform_runtime064.py' -v
          python -m unittest discover -s tests -p 'test_mechanism_harness_026.py' -v
          python -m unittest discover -s tests -p 'test_connected_finance.py' -v
      - name: Registered observation comparison
        run: python -m omega.observation_run --output "$RUNNER_TEMP/omega-observation.json"
      - name: Native seller engineering fixture and same account recovery
        run: |
          python -m omega.seller_lifecycle --output "$RUNNER_TEMP/omega-delivery" --interrupt-after A-fund
          python -m omega.seller_lifecycle --output "$RUNNER_TEMP/omega-delivery" --resume
          python -m omega.seller_lifecycle --output "$RUNNER_TEMP/omega-delivery" --audit
      - name: Corrected native commerce and complete acquisition-path comparison
        run: python campaign/omega-corrected-232221a5/reproduce.py --output "$RUNNER_TEMP/omega-corrected"
