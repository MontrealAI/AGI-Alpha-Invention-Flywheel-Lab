name: Omega continuation exact-source qualification
on:
  pull_request:
    paths:
      - 'omega/**'
      - 'tests/test_omega_commerce.py'
      - 'campaign/omega-continuation-20261103/**'
      - '.github/workflows/omega-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-qualified-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing pinned dependencies
        run: python -m pip install -r omega/requirements.txt
      - name: Verify independent acceptance and buyer/seller recovery
        run: python -m unittest omega.test_process omega.test_process_independent tests.test_omega_commerce -v
      - name: Run finite comparison without a new seller account
        run: |
          python -m omega.continuation --output "$RUNNER_TEMP/omega-continuation"
          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/omega-continuation/RESULT.json")); assert r["comparison"]["ties"]==20; assert r["authoritative_account"]["new_primary_postings"]==0; assert r["verdict"]["super_alpha"]=="NOT_ESTABLISHED"; print(r["verdict"])'
