name: P0-276 immutable native nested replay
on:
  push:
    branches: ['research/p0-immutable-native276']
    paths: ['.github/workflows/p0-immutable-native276.yml']
permissions:
  contents: read
jobs:
  descriptor-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            research/p0_immutable_native276
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ced6c1cb004887dcdafaea59a2976020be649f8e
          path: owner276
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Verify pinned owner and development source
        run: |
          set -euo pipefail
          test "$(git hash-object research/p0_immutable_native276/probe.py)" = 7f5bba0bb634397534ebbdca667580f2331137b7
          test "$(git hash-object research/p0_immutable_native276/PROTOCOL.md)" = 8df92357a7ca01252741f9bd9491613a1a340145
          test "$(git hash-object owner276/connected_enterprise/upgrades.py)" = 9866d004c412fc05c9f6292cf898307f177359df
          test "$(git hash-object owner276/connected_enterprise/finance.py)" = c01e5cd97fb32b3e5fcd5cea190424d8f4f5d5ec
          test "$(git hash-object owner276/connected_enterprise/transition_evidence.py)" = 2397091ef8e1960ad13950693d5b3cd04e2ff7c5
          test "$(git hash-object owner276/tests/test_connected_operating_upgrade.py)" = fc4917ae2ef6ff90ac0c8df9606dbfdd181d428b
          test -z "$(find owner276 -name '*.pyc' -print -quit)"
          python -B -c 'import ast,pathlib; ast.parse(pathlib.Path("research/p0_immutable_native276/probe.py").read_text())'
          mv owner276 "$RUNNER_TEMP/owner276"
      - name: Install previously pinned public wheels
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/p0276-pins.txt" <<'EOF'
          cryptography==50.0.2 --hash=sha256:9dab55f57c74c3cad24c323bacbbd04be4705ba6eb0d92e920b1fc4837ed5079
          cffi==2.1.1 --hash=sha256:c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf
          pycparser==3.11 --hash=sha256:51d5a8ba2be0bbe440b99d2112604c95bbbc3c2748a64260186c541e1729cd80
          EOF
          python -m pip download --only-binary=:all: --require-hashes --no-deps -r "$RUNNER_TEMP/p0276-pins.txt" -d "$RUNNER_TEMP/p0276-wheels"
          python -m pip install --no-index --no-deps --no-compile --require-hashes --find-links "$RUNNER_TEMP/p0276-wheels" -r "$RUNNER_TEMP/p0276-pins.txt"
          python -m pip install --no-index --no-deps --no-compile --require-hashes --find-links "$RUNNER_TEMP/p0276-wheels" -r "$RUNNER_TEMP/p0276-pins.txt" --target "$RUNNER_TEMP/p0276-deps"
      - name: Execute one registered immutable native comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/p0276-private" "$RUNNER_TEMP/p0276-control" "$RUNNER_TEMP/p0276-fixture"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p0276-private" TMPDIR="$RUNNER_TEMP/p0276-fixture" PYTHONDONTWRITEBYTECODE=1 \
            P0276_FIXTURE="$RUNNER_TEMP/p0276-fixture" P0276_STAGE="$RUNNER_TEMP/p0276-stage" \
            P0276_CONTROL="$RUNNER_TEMP/p0276-control" P0276_WHEELS="$RUNNER_TEMP/p0276-deps" \
            python -B research/p0_immutable_native276/probe.py "$RUNNER_TEMP/owner276" "$RUNNER_TEMP/P0_276.json" \
            > "$RUNNER_TEMP/p0276-private/probe.log" 2>&1
      - name: Retain only compact public receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-276-immutable-native-replay
          path: ${{ runner.temp }}/P0_276.json
          if-no-files-found: warn
          retention-days: 7
