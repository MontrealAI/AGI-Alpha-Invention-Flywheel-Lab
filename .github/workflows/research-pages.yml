name: AGI ALPHA website
on:
  pull_request:
    paths:
      - 'docs/research/**'
      - 'experiments/frontier-conclave/**'
      - 'scripts/build_research_site.py'
      - 'tests/test_research_site.py'
      - 'tests/test_alpha_site.cjs'
      - 'tests/test_surf_reader.cjs'
      - '.github/workflows/research-pages.yml'
      - 'products/alpha-genesis-harness/**'
      - 'events/alpha-genesis-live/**'
      - 'research/goal_genesis_omega/**'
      - 'tests/test_goal_genesis_omega.py'
      - '.github/workflows/alpha-genesis-harness.yml'
  push:
    branches: [main, research/goal-genesis-omega-open-constant-001]
    paths:
      - 'docs/research/**'
      - 'experiments/frontier-conclave/**'
      - 'scripts/build_research_site.py'
      - 'tests/test_research_site.py'
      - 'tests/test_alpha_site.cjs'
      - 'tests/test_surf_reader.cjs'
      - '.github/workflows/research-pages.yml'
      - 'products/alpha-genesis-harness/**'
      - 'events/alpha-genesis-live/**'
      - 'research/goal_genesis_omega/**'
      - 'tests/test_goal_genesis_omega.py'
      - '.github/workflows/alpha-genesis-harness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/research
            experiments/frontier-conclave
            scripts/build_research_site.py
            tests/test_research_site.py
            research/goal_genesis_omega
            tests/test_goal_genesis_omega.py
            tests/test_alpha_site.cjs
            tests/test_surf_reader.cjs
            events/alpha-genesis-live
            products/alpha-genesis-harness/app
            products/alpha-genesis-harness/scripts/publish_preview.py
            products/alpha-genesis-harness/tests/engine.test.cjs
            products/alpha-genesis-harness/tests/acceptance.test.cjs
            products/alpha-genesis-harness/examples/customer-mission.json
          sparse-checkout-cone-mode: false
      - name: Qualify prepared Conclave experiment
        working-directory: experiments/frontier-conclave
        run: |
          python3 RUN_WORKSHOP.py check
          python3 -m unittest test_experiment -v
      - name: Verify ALPHA GENESIS LIVE agent, construction and evidence
        run: |
          node --test events/alpha-genesis-live/engine/tests/*.test.mjs events/alpha-genesis-live/lab/test/*.test.mjs events/alpha-genesis-live/06_QA/stage_engine.test.mjs
          node events/alpha-genesis-live/00_STAGE/run_show.mjs --mode preview --focus confidence --out "$RUNNER_TEMP/alpha-genesis-live-preview"
          node events/alpha-genesis-live/engine/verify_receipt.mjs "$RUNNER_TEMP/alpha-genesis-live-preview/agent-receipt.json"
      - name: GOAL GENESIS - qualify mathematical certification controls
        run: |
          python3 -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
          python3 -m unittest discover -s tests -p 'test_goal_genesis_omega.py' -v
      - name: GOAL GENESIS - attempt actual 2026 open mathematical frontier
        timeout-minutes: 30
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python3 -m research.goal_genesis_omega.c1d_search \
            --max-cells 2400 --iterations 750 \
            --output "$RUNNER_TEMP/goal-genesis-candidate.json"
          python3 -m research.goal_genesis_omega.c1d_verify \
            --candidate "$RUNNER_TEMP/goal-genesis-candidate.json" \
            --output "$RUNNER_TEMP/goal-genesis-verdict.json"
          python3 - "$RUNNER_TEMP/goal-genesis-verdict.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          print("FRONTIER_CLAIM",result["status"])
          print("EXACT_CANDIDATE",result["candidate_decimal_16"])
          print("REPORTED_INCUMBENT",result["incumbent_decimal_16"])
          print("Only a strictly improved exact certificate can justify a candidate frontier claim.")
          PY
      - name: Retain exact open-problem result for adversarial review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: goal-genesis-open-math-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/goal-genesis-candidate.json
            ${{ runner.temp }}/goal-genesis-verdict.json
          retention-days: 30
          if-no-files-found: error
      - name: Validate original PDFs, links and publication boundary
        run: python3 -m unittest discover -s tests -p 'test_research_site.py' -v
      - name: Check interactive research calculations and decisions
        run: node --test tests/test_alpha_site.cjs tests/test_surf_reader.cjs
      - name: Reproduce OUT-ACCELERATE exact worked example
        run: |
          python3 docs/research/out-accelerate/acceleration_witness.py --output-dir "$RUNNER_TEMP/out-accelerate-replay"
          cmp docs/research/out-accelerate/results/results.json "$RUNNER_TEMP/out-accelerate-replay/results.json"
          cmp docs/research/out-accelerate/results/summary.csv "$RUNNER_TEMP/out-accelerate-replay/summary.csv"
      - name: Build only the public website allowlist
        run: python3 scripts/build_research_site.py --output "$RUNNER_TEMP/research-site"
      - name: Qualify and add the standalone HARNESS preview
        run: |
          node --test products/alpha-genesis-harness/tests/*.test.cjs
          python3 products/alpha-genesis-harness/scripts/publish_preview.py --output "$RUNNER_TEMP/research-site/harness" --source-revision "$(git rev-parse HEAD)"
      - name: Upload the allowlisted Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/research-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the public website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
