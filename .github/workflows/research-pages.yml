name: AGI ALPHA website
on:
  pull_request:
    paths:
      - 'docs/research/**'
      - 'experiments/frontier-conclave/**'
      - 'scripts/build_research_site.py'
      - 'tests/test_research_site.py'
      - 'tests/test_alpha_site.cjs'
      - 'tests/test_surf_reader.cjs'
      - '.github/workflows/research-pages.yml'
      - 'products/alpha-genesis-harness/**'
      - 'events/alpha-genesis-live/**'
      - 'products/contract_value_omega/**'
      - 'tests/test_contract_value_omega.py'
      - '.github/workflows/alpha-genesis-harness.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/**'
      - 'experiments/frontier-conclave/**'
      - 'scripts/build_research_site.py'
      - 'tests/test_research_site.py'
      - 'tests/test_alpha_site.cjs'
      - 'tests/test_surf_reader.cjs'
      - '.github/workflows/research-pages.yml'
      - 'products/alpha-genesis-harness/**'
      - 'events/alpha-genesis-live/**'
      - 'products/contract_value_omega/**'
      - 'tests/test_contract_value_omega.py'
      - '.github/workflows/alpha-genesis-harness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/research
            experiments/frontier-conclave
            scripts/build_research_site.py
            tests/test_research_site.py
            products/contract_value_omega
            tests/test_contract_value_omega.py
            tests/test_alpha_site.cjs
            tests/test_surf_reader.cjs
            events/alpha-genesis-live
            products/alpha-genesis-harness/app
            products/alpha-genesis-harness/scripts/publish_preview.py
            products/alpha-genesis-harness/tests/engine.test.cjs
            products/alpha-genesis-harness/tests/acceptance.test.cjs
            products/alpha-genesis-harness/examples/customer-mission.json
          sparse-checkout-cone-mode: false
      - name: Qualify prepared Conclave experiment
        working-directory: experiments/frontier-conclave
        run: |
          python3 RUN_WORKSHOP.py check
          python3 -m unittest test_experiment -v
      - name: Verify ALPHA GENESIS LIVE agent, construction and evidence
        run: |
          node --test events/alpha-genesis-live/engine/tests/*.test.mjs events/alpha-genesis-live/lab/test/*.test.mjs events/alpha-genesis-live/06_QA/stage_engine.test.mjs
          node events/alpha-genesis-live/00_STAGE/run_show.mjs --mode preview --focus confidence --out "$RUNNER_TEMP/alpha-genesis-live-preview"
          node events/alpha-genesis-live/engine/verify_receipt.mjs "$RUNNER_TEMP/alpha-genesis-live-preview/agent-receipt.json"
      - name: Qualify private-company CONTRACT VALUE Omega financial review
        run: |
          python3 -m unittest discover -s tests -p 'test_contract_value_omega.py' -v
          python3 -m products.contract_value_omega.run \
            --input products/contract_value_omega/demo \
            --output "$RUNNER_TEMP/contract-value-demo-review"
          python3 -m products.contract_value_omega.verify \
            --input products/contract_value_omega/demo \
            --report "$RUNNER_TEMP/contract-value-demo-review"
      - name: Package standalone CONTRACT VALUE Omega buyer edition
        run: |
          python3 - "$RUNNER_TEMP/contract-value-omega.zip" <<'PY'
          from pathlib import Path
          import subprocess,sys,zipfile
          destination=Path(sys.argv[1]);root=Path("products/contract_value_omega")
          source=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          with zipfile.ZipFile(destination,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for file in sorted(root.rglob("*")):
                  if not file.is_file() or "__pycache__" in file.parts or file.suffix==".pyc":
                      continue
                  info=zipfile.ZipInfo(file.as_posix(),date_time=(2026,11,16,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  archive.writestr(info,file.read_bytes())
              info=zipfile.ZipInfo("SOURCE-REVISION.txt",date_time=(2026,11,16,0,0,0))
              info.compress_type=zipfile.ZIP_DEFLATED
              archive.writestr(info,source+"\\n")
          print("Standalone private-enterprise ZIP",destination,"bytes",destination.stat().st_size)
          PY
          mkdir "$RUNNER_TEMP/contract-value-extracted"
          unzip -q "$RUNNER_TEMP/contract-value-omega.zip" -d "$RUNNER_TEMP/contract-value-extracted"
          (
            cd "$RUNNER_TEMP/contract-value-extracted"
            python3 -m products.contract_value_omega.run --input products/contract_value_omega/demo --output "$RUNNER_TEMP/contract-value-extracted-replay"
            python3 -m products.contract_value_omega.verify --input products/contract_value_omega/demo --report "$RUNNER_TEMP/contract-value-extracted-replay"
          )
      - name: Upload buyer installation and synthetic verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-value-omega-buyer-edition-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/contract-value-omega.zip
            ${{ runner.temp }}/contract-value-demo-review/
          if-no-files-found: error
          retention-days: 30
      - name: Validate original PDFs, links and publication boundary
        run: python3 -m unittest discover -s tests -p 'test_research_site.py' -v
      - name: Check interactive research calculations and decisions
        run: node --test tests/test_alpha_site.cjs tests/test_surf_reader.cjs
      - name: Reproduce OUT-ACCELERATE exact worked example
        run: |
          python3 docs/research/out-accelerate/acceleration_witness.py --output-dir "$RUNNER_TEMP/out-accelerate-replay"
          cmp docs/research/out-accelerate/results/results.json "$RUNNER_TEMP/out-accelerate-replay/results.json"
          cmp docs/research/out-accelerate/results/summary.csv "$RUNNER_TEMP/out-accelerate-replay/summary.csv"
      - name: Build only the public website allowlist
        run: python3 scripts/build_research_site.py --output "$RUNNER_TEMP/research-site"
      - name: Qualify and add the standalone HARNESS preview
        run: |
          node --test products/alpha-genesis-harness/tests/*.test.cjs
          python3 products/alpha-genesis-harness/scripts/publish_preview.py --output "$RUNNER_TEMP/research-site/harness" --source-revision "$(git rev-parse HEAD)"
      - name: Upload the allowlisted Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/research-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the public website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
