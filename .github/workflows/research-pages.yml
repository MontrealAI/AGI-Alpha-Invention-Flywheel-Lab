name: AGI ALPHA website
on:
  pull_request:
    paths:
      - 'docs/research/**'
      - 'scripts/build_research_site.py'
      - 'tests/test_research_site.py'
      - 'tests/test_alpha_site.cjs'
      - 'tests/test_surf_reader.cjs'
      - '.github/workflows/research-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/**'
      - 'scripts/build_research_site.py'
      - 'tests/test_research_site.py'
      - 'tests/test_alpha_site.cjs'
      - 'tests/test_surf_reader.cjs'
      - '.github/workflows/research-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/research
            scripts/build_research_site.py
            tests/test_research_site.py
            tests/test_alpha_site.cjs
            tests/test_surf_reader.cjs
          sparse-checkout-cone-mode: false
      - name: Validate original PDFs, links and publication boundary
        run: python3 -m unittest discover -s tests -p 'test_research_site.py' -v
      - name: Check interactive research calculations and decisions
        run: node --test tests/test_alpha_site.cjs tests/test_surf_reader.cjs
      - name: Reproduce OUT-ACCELERATE exact worked example
        run: |
          python3 docs/research/out-accelerate/acceleration_witness.py --output-dir "$RUNNER_TEMP/out-accelerate-replay"
          cmp docs/research/out-accelerate/results/results.json "$RUNNER_TEMP/out-accelerate-replay/results.json"
          cmp docs/research/out-accelerate/results/summary.csv "$RUNNER_TEMP/out-accelerate-replay/summary.csv"
      - name: Build only the public website allowlist
        run: python3 scripts/build_research_site.py --output "$RUNNER_TEMP/research-site"
      - name: Upload the allowlisted Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/research-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the public website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
