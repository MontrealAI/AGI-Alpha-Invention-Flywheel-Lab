name: AGI ALPHA website
on:
  pull_request:
    paths:
      - 'docs/research/**'
      - 'experiments/frontier-conclave/**'
      - 'scripts/build_research_site.py'
      - 'scripts/frontier_public_watch.py'
      - 'scripts/frontier_atlas.py'
      - 'scripts/frontier_member_value.py'
      - 'scripts/frontier_member_first.py'
      - 'scripts/qualify_frontier_member.py'
      - 'products/frontier-member-tools/**'
      - 'tests/test_member_value.py'
      - 'tests/test_member_tools.mjs'
      - 'scripts/replay_frontier_alpha1_availability.py'
      - 'publication/frontier-alpha-1-availability.json'
      - 'publication/frontier-public-holds.json'
      - 'publication/frontier-foundry/**'
      - 'publication/inventor/**'
      - 'tests/test_frontier_public_watch.py'
      - 'tests/test_frontier_atlas.py'
      - 'tests/live_frontier_browser.cjs'
      - 'tests/test_research_site.py'
      - 'tests/test_alpha_site.cjs'
      - 'tests/test_surf_reader.cjs'
      - '.github/workflows/research-pages.yml'
      - 'products/alpha-genesis-harness/**'
      - 'events/alpha-genesis-live/**'
      - '.github/workflows/alpha-genesis-harness.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/**'
      - 'experiments/frontier-conclave/**'
      - 'scripts/build_research_site.py'
      - 'scripts/frontier_public_watch.py'
      - 'scripts/frontier_atlas.py'
      - 'scripts/frontier_member_value.py'
      - 'scripts/frontier_member_first.py'
      - 'scripts/qualify_frontier_member.py'
      - 'products/frontier-member-tools/**'
      - 'tests/test_member_value.py'
      - 'tests/test_member_tools.mjs'
      - 'scripts/replay_frontier_alpha1_availability.py'
      - 'publication/frontier-alpha-1-availability.json'
      - 'publication/frontier-public-holds.json'
      - 'publication/frontier-foundry/**'
      - 'publication/inventor/**'
      - 'tests/test_frontier_public_watch.py'
      - 'tests/test_frontier_atlas.py'
      - 'tests/live_frontier_browser.cjs'
      - 'tests/test_research_site.py'
      - 'tests/test_alpha_site.cjs'
      - 'tests/test_surf_reader.cjs'
      - '.github/workflows/research-pages.yml'
      - 'products/alpha-genesis-harness/**'
      - 'events/alpha-genesis-live/**'
      - '.github/workflows/alpha-genesis-harness.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: research-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      publish: ${{ steps.frontier_watch.outputs.changed }}
      ledger: ${{ steps.frontier_watch.outputs.ledger }}
      artifact: github-pages-${{ github.run_attempt }}
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/research
            experiments/frontier-conclave
            scripts/build_research_site.py
            scripts/frontier_public_watch.py
            scripts/frontier_atlas.py
            scripts/frontier_member_value.py
            scripts/frontier_member_first.py
            scripts/qualify_frontier_member.py
            products/frontier-member-tools
            tests/test_member_value.py
            tests/test_member_tools.mjs
            tests/live_frontier_browser.cjs
            scripts/replay_frontier_alpha1_availability.py
            publication/frontier-alpha-1-availability.json
            publication/frontier-public-holds.json
            publication/frontier-foundry/reference-model-trial.json
            publication/frontier-foundry/successor-study
            publication/frontier-foundry/successor-followup
            publication/inventor
            tests/test_frontier_public_watch.py
            tests/test_frontier_atlas.py
            tests/test_research_site.py
            tests/test_alpha_site.cjs
            tests/test_surf_reader.cjs
            events/alpha-genesis-live
            products/alpha-genesis-harness/app
            products/alpha-genesis-harness/scripts/publish_preview.py
            products/alpha-genesis-harness/tests/engine.test.cjs
            products/alpha-genesis-harness/tests/acceptance.test.cjs
            products/alpha-genesis-harness/examples/customer-mission.json
          sparse-checkout-cone-mode: false
      - name: Build only the public website allowlist
        run: python3 scripts/build_research_site.py --output "$RUNNER_TEMP/research-site"
      - name: Test watch publication, replay, rejection and recovery
        run: |
          python3 -m unittest discover -s tests -p 'test_frontier_public_watch.py' -v
          python3 -m unittest discover -s tests -p 'test_frontier_atlas.py' -v
      - name: Replay the ALPHA-1 availability correction
        if: github.event_name != 'schedule'
        run: |
          git fetch --no-tags --depth=1 origin 5cced81256c965797988cd682fb5f910fe72c981
          python3 scripts/replay_frontier_alpha1_availability.py --check
      - name: Replay approved public Git history and stage the bilingual Atlas
        id: frontier_watch
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if git fetch --no-tags --filter=blob:none --shallow-since=2026-11-22T00:00:00Z origin \
                "$GITHUB_SHA" refs/heads/frontier-watch-public:refs/remotes/origin/frontier-watch-public; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep "$((2 * attempt))"
          done
          git fetch --no-tags --depth=1 --filter=blob:none origin \
            522542e525e96556285560e65e4443c85cc7b709 6a635b77012fb45b4d96c404a33fa04327c19674
          python3 scripts/frontier_atlas.py stage "$RUNNER_TEMP/research-site" \
            "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Qualify public member briefs, receipts and exact portable packages
        if: github.event_name != 'schedule' || steps.frontier_watch.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_member_value.py' -v
          node --test tests/test_member_tools.mjs
          python3 scripts/qualify_frontier_member.py "$RUNNER_TEMP/research-site/frontier-omega-alpha"
          python3 docs/research/frontier-omega-alpha/decision-editions/verify.py all --directory \
            "$RUNNER_TEMP/research-site/frontier-omega-alpha/decision-editions"
      - name: Qualify both member entrances on the candidate artifact
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/frontier-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.62.1
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/research-site" > "$RUNNER_TEMP/frontier-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --silent --fail --retry 4 --retry-connrefused http://127.0.0.1:8765/frontier-omega-alpha/ --output /dev/null
          FRONTIER_BROWSER_URL=http://127.0.0.1:8765/frontier-omega-alpha/ \
            FRONTIER_SCREENSHOTS="$RUNNER_TEMP/frontier-staged-screenshots" \
            NODE_PATH="$RUNNER_TEMP/frontier-browser/node_modules" node tests/live_frontier_browser.cjs | tee "$RUNNER_TEMP/frontier-staged-browser.json"
      - name: Retain staged member qualification evidence
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-staged-browser-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frontier-staged-browser.json
            ${{ runner.temp }}/frontier-staged-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Qualify prepared Conclave experiment
        if: github.event_name != 'schedule' || steps.frontier_watch.outputs.changed == 'true'
        working-directory: experiments/frontier-conclave
        run: |
          python3 RUN_WORKSHOP.py check
          python3 -m unittest test_experiment -v
      - name: Verify ALPHA GENESIS LIVE agent, construction and evidence
        if: github.event_name != 'schedule' || steps.frontier_watch.outputs.changed == 'true'
        run: |
          node --test events/alpha-genesis-live/engine/tests/*.test.mjs events/alpha-genesis-live/lab/test/*.test.mjs events/alpha-genesis-live/06_QA/stage_engine.test.mjs
          node events/alpha-genesis-live/00_STAGE/run_show.mjs --mode preview --focus confidence --out "$RUNNER_TEMP/alpha-genesis-live-preview"
          node events/alpha-genesis-live/engine/verify_receipt.mjs "$RUNNER_TEMP/alpha-genesis-live-preview/agent-receipt.json"
      - name: Validate original PDFs, links and publication boundary
        if: github.event_name != 'schedule' || steps.frontier_watch.outputs.changed == 'true'
        run: python3 -m unittest discover -s tests -p 'test_research_site.py' -v
      - name: Check interactive research calculations and decisions
        if: github.event_name != 'schedule' || steps.frontier_watch.outputs.changed == 'true'
        run: node --test tests/test_alpha_site.cjs tests/test_surf_reader.cjs
      - name: Reproduce OUT-ACCELERATE exact worked example
        if: github.event_name != 'schedule' || steps.frontier_watch.outputs.changed == 'true'
        run: |
          python3 docs/research/out-accelerate/acceleration_witness.py --output-dir "$RUNNER_TEMP/out-accelerate-replay"
          cmp docs/research/out-accelerate/results/results.json "$RUNNER_TEMP/out-accelerate-replay/results.json"
          cmp docs/research/out-accelerate/results/summary.csv "$RUNNER_TEMP/out-accelerate-replay/summary.csv"
      - name: Qualify and add the standalone HARNESS preview
        if: github.event_name != 'schedule' || steps.frontier_watch.outputs.changed == 'true'
        run: |
          node --test products/alpha-genesis-harness/tests/*.test.cjs
          python3 products/alpha-genesis-harness/scripts/publish_preview.py --output "$RUNNER_TEMP/research-site/harness" --source-revision "$(git rev-parse HEAD)"
      - name: Upload the allowlisted Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.frontier_watch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the public website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
  verify-live:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/frontier_atlas.py
            scripts/frontier_member_value.py
            scripts/frontier_member_first.py
            scripts/qualify_frontier_member.py
            scripts/frontier_public_watch.py
            scripts/build_research_site.py
            docs/research/frontier-omega-alpha/decision-editions/verify.py
            docs/research/frontier-omega-alpha/decision-editions/index.json
            tests/live_frontier_browser.cjs
          sparse-checkout-cone-mode: false
      - name: Verify the actual public English and French pages and ledger bytes
        env:
          EXPECTED_LEDGER: ${{ needs.build.outputs.ledger }}
          PUBLISHED: ${{ needs.deploy.result }}
        run: |
          args=()
          if test "$PUBLISHED" = 'success'; then
            args+=(--source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID")
          fi
          python3 scripts/frontier_atlas.py verify "$EXPECTED_LEDGER" "${args[@]}" > "$RUNNER_TEMP/frontier-live.json"
          cat "$RUNNER_TEMP/frontier-live.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise live desktop, mobile and transaction-free member paths
        if: needs.deploy.result == 'success'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/frontier-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.62.1
          if test "$GITHUB_EVENT_NAME" = 'push'; then
            export FRONTIER_SCREENSHOTS="$RUNNER_TEMP/frontier-screenshots"
          fi
          NODE_PATH="$RUNNER_TEMP/frontier-browser/node_modules" node tests/live_frontier_browser.cjs | tee "$RUNNER_TEMP/frontier-browser.json"
          cat "$RUNNER_TEMP/frontier-browser.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Save verified production screenshots
        if: github.event_name == 'push' && needs.deploy.result == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-production-browser-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frontier-browser.json
            ${{ runner.temp }}/frontier-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Download and independently execute the actual production packages
        if: needs.deploy.result == 'success'
        shell: bash
        run: |
          packages="$RUNNER_TEMP/frontier-distributed"
          mkdir -p "$packages"
          origin="https://montrealai.github.io/AGI-Alpha-Invention-Flywheel-Lab/frontier-omega-alpha"
          for artifact in atlas-release.json member-value.json endpoint-evidence-screen-1.0.0.zip noaa-archive-point-1.0.0.zip frontier-foundry-1.0.0.zip frontier-foundry-1.1.0.zip frontier-inventor-1.0.0.zip; do
            curl --fail --silent --show-error --retry 2 --max-time 20 --max-filesize 20000000 "$origin/$artifact" --output "$packages/$artifact"
          done
          python3 scripts/qualify_frontier_member.py "$packages" | tee "$RUNNER_TEMP/frontier-distributed.json"
          cat "$RUNNER_TEMP/frontier-distributed.json" >> "$GITHUB_STEP_SUMMARY"
          editions="$packages/decision-editions"
          mkdir "$editions"
          for asset in index.json 45278828750.tar.zst 45287921702.tar.zst; do
            curl --fail --silent --show-error --retry 2 --max-time 20 --max-filesize 500000 \
              "$origin/decision-editions/$asset" --output "$editions/$asset"
          done
          cmp docs/research/frontier-omega-alpha/decision-editions/index.json "$editions/index.json"
          python3 docs/research/frontier-omega-alpha/decision-editions/verify.py all --directory "$editions" \
            | tee -a "$GITHUB_STEP_SUMMARY"
