name: Enterprise078 public source and evidence replay
on:
  pull_request:
    paths:
      - 'enterprise078/**'
      - 'commercial/ledger.py'
      - 'connected_enterprise/finance.py'
      - '.github/workflows/enterprise078.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind wrapper and frozen scientific bytes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from commercial.ledger import digest
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['EXPECTED_HEAD']
          frozen=json.loads(pathlib.Path('enterprise078/FROZEN.json').read_text())
          assert digest(frozen['files'])==frozen['sha256']
          for name,expected in frozen['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          receipt={'candidate':head,'scientific_freeze':'825cabc0edf2e6bf677a5b80ade274ae8dee38bb','frozen_digest':frozen['sha256'],'workflow_ref':os.environ['WORKFLOW_REF'],'workflow_sha':os.environ['WORKFLOW_SHA'],'files':len(frozen['files'])}
          pathlib.Path(os.environ['RUNNER_TEMP'],'enterprise078-binding.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Existing runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-commercial010.txt
      - name: Focused acceptance and unchanged native finance regressions
        run: |
          python -m unittest enterprise078.test_enterprise078 tests.test_connected_finance tests.test_connected_p0_source_guard.JoinPreflightTests -v
      - name: Downloaded public evidence only, no private account authority
        run: |
          python -m enterprise078.replay --output "$RUNNER_TEMP/enterprise078-public" > "$RUNNER_TEMP/enterprise078-replay.json"
          python enterprise078/review.py "$RUNNER_TEMP/enterprise078-public/original" --challenges > "$RUNNER_TEMP/enterprise078-challenges.json"
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise078-public-verification
          path: |
            ${{ runner.temp }}/enterprise078-binding.json
            ${{ runner.temp }}/enterprise078-replay.json
            ${{ runner.temp }}/enterprise078-challenges.json
