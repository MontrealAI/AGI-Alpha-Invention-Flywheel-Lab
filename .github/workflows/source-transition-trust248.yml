name: P0-248 historical owner v2-CAS operating evidence wire reference
on:
  pull_request:
    paths:
      - 'research/source_transition_trust246/owner_wire248.py'
      - 'research/source_transition_trust246/test_owner_wire248.py'
      - 'research/source_transition_trust246/WIRE248_PROTOCOL.md'
      - '.github/workflows/source-transition-trust248.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0248-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  exact-owner-wire-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Exact-head checkout with no persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.12 standard-library runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fixed nine-case synthetically-owned compatibility suite
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cd research/source_transition_trust246
          python3 -B -m unittest -v test_owner_wire248.py
      - name: Exact-source synthetic-only receipt
        run: |
          mkdir -p "$RUNNER_TEMP/p0248"
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('research/source_transition_trust246')
          files=['WIRE248_PROTOCOL.md','owner_wire248.py','test_owner_wire248.py']
          receipt={
            'schema':'agi-alpha/p0-248-owner-wire-compatibility/v1',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'files_sha256':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in files},
            'fixed_tests_exit_zero':True,
            'fixed_test_count':9,
            'synthetic_nonempty_operating_externalized':True,
            'prior_247_source_modified':False,
            'historical_owner_40_source_modified':False,
            'original_HMAC_or_lease_qualified':False,
            'actual_account_or_signer_exercised':False,
            'native_migration_or_release_qualified':False,
            'economic_or_real_commerce_qualified':False,
            'actual_host_model_cost_usd':None
          }
          dest=Path(os.environ['RUNNER_TEMP'])/'p0248'/'RECEIPT.json'
          dest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload compact exact-head receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0248-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0248/RECEIPT.json
          if-no-files-found: error
          retention-days: 7
