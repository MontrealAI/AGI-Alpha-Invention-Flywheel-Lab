name: Market Genesis 045 — conditional coalition and verified production
on:
  pull_request:
    paths:
      - 'commercial/possibility_exchange.py'
      - 'commercial/possibility_audit.py'
      - 'commercial/service.py'
      - 'commercial/service_verifier.py'
      - 'scripts/run_possibility_exchange045.py'
      - 'tests/test_possibility_exchange045.py'
      - 'connected_enterprise/runner.py'
      - 'campaign/possibility-exchange-045/**'
      - '.github/workflows/market-genesis045.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-verified-market:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned canonical commercial dependencies
        run: python3 -m pip install -r requirements-commercial010.txt
      - name: Test exact finite opportunity choice and actual independent service semantics
        run: python3 -m unittest discover -s tests -p test_possibility_exchange045.py -v
      - name: Reproduce from registered frozen native-source closure
        run: |
          python3 -m connected_enterprise register --config campaign/overnight-022/OPERATOR_INPUT.json --output "$RUNNER_TEMP/market045-frozen"
          cd "$RUNNER_TEMP/market045-frozen/source"
          python3 -m scripts.run_possibility_exchange045 build --input campaign/possibility-exchange-045/INPUT.json --output "$RUNNER_TEMP/market045-positive"
          python3 -m scripts.run_possibility_exchange045 verify --output "$RUNNER_TEMP/market045-positive"
          python3 -m scripts.run_possibility_exchange045 build --input campaign/possibility-exchange-045/ADVERSE.json --output "$RUNNER_TEMP/market045-adverse"
          python3 -m scripts.run_possibility_exchange045 verify --output "$RUNNER_TEMP/market045-adverse"
          python3 - "$RUNNER_TEMP/market045-positive/PROPOSAL.json" "$RUNNER_TEMP/market045-adverse/PROPOSAL.json" <<'PY'
          import json,sys
          good,bad=map(lambda p:json.load(open(p)),sys.argv[1:])
          assert good['status']=='CONDITIONALLY_FEASIBLE_NEW_BUSINESS'
          assert good['chosen']['conditional_provider_gain_cents']==1040000
          assert len(good['produced_checked_outcomes'])==3
          assert good['actual_customer_collections_cents']==0 and good['actual_profit_cents'] is None
          assert bad['status']=='NO_BID_OR_RETAIN_CASH' and bad['chosen'] is None
          print('Scoped constructive deal and adverse abstention are both reproducible. Not commerce.')
          PY
      - name: Keep only compact public-synthetic proposal receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-genesis045-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/market045-positive/PROPOSAL.json
            ${{ runner.temp }}/market045-positive/AUDIT.json
            ${{ runner.temp }}/market045-positive/MANIFEST.json
            ${{ runner.temp }}/market045-adverse/PROPOSAL.json
            ${{ runner.temp }}/market045-adverse/AUDIT.json
          if-no-files-found: warn
          retention-days: 7
