name: P200 source-pinned prospective A2A 1.0 version-reference
on:
  push:
    branches: [review/a2a-version-reference200-20261120]
    paths:
      - 'campaign/a2a-version200/**'
      - '.github/workflows/a2a-version200.yml'
  pull_request:
    paths:
      - 'campaign/a2a-version200/**'
      - '.github/workflows/a2a-version200.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-positive-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout immutable original PR498 adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: dec5cb10ce2ac3eb1ccb0de383a21ab8d063a360
          path: source-pr498
      - name: Checkout immutable original PR484 gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: b333a5f4ac9495b9c8259170597239a1792bf1ac
          path: source-pr484
      - name: Verify exact sources and execute frozen thirteen HTTP controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a2a200"
          test "$(git -C source-pr498 rev-parse HEAD)" = dec5cb10ce2ac3eb1ccb0de383a21ab8d063a360
          test "$(git -C source-pr498 hash-object campaign/a2a-interop198/a2a_adapter.py)" = 9cd62b61fb84732511350a5aaa5820594b19f7d1
          test "$(git -C source-pr484 rev-parse HEAD)" = b333a5f4ac9495b9c8259170597239a1792bf1ac
          test "$(git -C source-pr484 hash-object products/frontier_machine_asset_001/gate.py)" = 115cf8531df65a66dcc679e2d35cb03394cea11a
          test "$(git hash-object campaign/a2a-version200/PREREGISTRATION.md)" = 06419d55a783bca441acde79d15bc3161388188e
          export A2A200_GATE="$GITHUB_WORKSPACE/source-pr484/products/frontier_machine_asset_001/gate.py"
          export PYTHONPATH="$GITHUB_WORKSPACE/source-pr498/campaign/a2a-interop198:$GITHUB_WORKSPACE/campaign/a2a-version200"
          python3 --version | tee "$RUNNER_TEMP/a2a200/PYTHON.txt"
          sha256sum "$A2A200_GATE" source-pr498/campaign/a2a-interop198/a2a_adapter.py campaign/a2a-version200/{PREREGISTRATION.md,version_reference.py,test_version_reference.py} > "$RUNNER_TEMP/a2a200/SOURCES.sha256"
          /usr/bin/time -v -o "$RUNNER_TEMP/a2a200/RESOURCE.txt" python3 -m unittest discover -v -s campaign/a2a-version200 -p test_version_reference.py 2>&1 | tee "$RUNNER_TEMP/a2a200/TESTS.txt"
          grep -q 'Ran 13 tests' "$RUNNER_TEMP/a2a200/TESTS.txt"
          grep -q '^OK$' "$RUNNER_TEMP/a2a200/TESTS.txt"
          sha256sum "$RUNNER_TEMP/a2a200/"{TESTS.txt,RESOURCE.txt,PYTHON.txt} > "$RUNNER_TEMP/a2a200/PROOFS.sha256"
      - name: Preserve positive and failed proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a200-source-pinned-positive-reference
          path: ${{ runner.temp }}/a2a200/
          if-no-files-found: warn
          retention-days: 30
