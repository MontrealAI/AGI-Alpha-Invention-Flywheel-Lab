name: Governance linked-portable158 exact-source clean-download qualification
on:
  pull_request:
    paths:
      - '.github/workflows/governance-linked-portable158.yml'
      - 'scripts/package_governance_linked158.py'
      - 'tests/test_governance_linked_portable158.py'
      - 'campaign/governance-linked-portable158/**'
      - 'products/governance_impact140/**'
      - 'tests/test_governance_impact140.py'
      - 'tests/test_governance_native_risk152.py'
      - 'tests/test_governance_native_reassessment153.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/governance-linked-portable158.yml'
      - 'scripts/package_governance_linked158.py'
      - 'tests/test_governance_linked_portable158.py'
      - 'campaign/governance-linked-portable158/**'
      - 'products/governance_impact140/**'
permissions:
  contents: read
concurrency:
  group: governance-linked-portable158-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      archive_sha: ${{ steps.build.outputs.archive_sha }}
      manifest_sha: ${{ steps.build.outputs.manifest_sha }}
    steps:
      - name: Record job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source and unchanged original regressions
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for target in test_governance_impact140.py test_governance_native_risk152.py test_governance_native_reassessment153.py test_governance_linked_portable158.py; do
            python -B -m unittest discover -s tests -p "$target" -v
          done
          python -O -B -m unittest discover -s tests -p 'test_governance_native_reassessment153.py' -v
      - name: Deterministic bundle and independent receipt anchors
        id: build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/governance-linked158"
          python -B scripts/package_governance_linked158.py build --root . \
            --archive "$RUNNER_TEMP/governance-linked158/source.zip" \
            --receipt "$RUNNER_TEMP/governance-linked158/RECEIPT.json" \
            --source-commit "$SOURCE_SHA"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads((Path(os.environ['RUNNER_TEMP'])/'governance-linked158/RECEIPT.json').read_text())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              out.write('archive_sha='+v['archive_sha256']+'\n')
              out.write('manifest_sha='+v['manifest_sha256']+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-linked158-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/governance-linked158/
          if-no-files-found: error
  downloaded-operation:
    needs: [exact-source]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ARCHIVE_SHA: ${{ needs.exact-source.outputs.archive_sha }}
      MANIFEST_SHA: ${{ needs.exact-source.outputs.manifest_sha }}
    steps:
      - name: Record job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: governance-linked158-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/governance-linked158-received
      - name: Independently enforce source/manifest/commit anchors from previous job
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -B scripts/package_governance_linked158.py verify \
            --archive "$RUNNER_TEMP/governance-linked158-received/source.zip" \
            --expected-archive "$ARCHIVE_SHA" \
            --expected-manifest "$MANIFEST_SHA" \
            --expected-commit "$SOURCE_SHA" \
            --extract "$RUNNER_TEMP/governance-linked158-clean"
      - name: Clean original tests and actual first-party reassessment CLI on extracted bytes
        shell: bash
        run: |
          cd "$RUNNER_TEMP/governance-linked158-clean"
          for target in test_governance_impact140.py test_governance_native_risk152.py test_governance_native_reassessment153.py; do
            python -B -m unittest discover -s tests -p "$target" -v
          done
          python -O -B -m unittest discover -s tests -p 'test_governance_native_reassessment153.py' -v
          python -B - <<'PY'
          import json,runpy
          from pathlib import Path
          sample=runpy.run_path('tests/test_governance_native_reassessment153.py')['sample']
          Path('synthetic-reassessment.json').write_text(json.dumps(sample(),sort_keys=True))
          PY
          python -B -m products.governance_impact140.native_reassessment153 \
            --input synthetic-reassessment.json --output actual-first-party-report.json
          python -B - <<'PY'
          import json
          from pathlib import Path
          from products.governance_impact140 import engine
          from products.governance_impact140 import native_reassessment153 as linked
          result=json.loads(Path('actual-first-party-report.json').read_text())
          case=json.loads(Path('synthetic-reassessment.json').read_text())
          row=result['current_reassessments'][0]
          assert row['native_signal']['signal']=='ADVERSE_SYNTHETIC_THRESHOLD'
          assert row['old_native_signal']['signal']=='WITHIN_UNVERIFIED_SYNTHETIC_THRESHOLD'
          assert row['governance_status_unchanged']=='unable_to_determine'
          assert result['current_findings_without_native_risk_policy']
          assert result['authorization']==linked.AUTHORIZATION
          assert linked.verify_receipt(result,
            anchored_receipt_sha256=result['receipt_sha256'],
            anchored_governance_sha256=engine.assess(case['governance'])['receipt_sha256'])
          print('CLEAN_EXTRACTED_140_152_153_CLI_ACCEPTED_SYNTHETIC_ONLY')
          PY
      - name: Claim boundaries
        run: |
          echo "LINKED_PORTABLE158=EXACT_SOURCE_CLEAN_DOWNLOADED_ENGINEERING"
          echo "FINANCE=UNMODIFIED_NO_AUTHORITY"
          echo "COMMERCE=NO_BID_NO_DEPLOY_NO_REAL_BUYER_NO_TRL_CLAIM"
