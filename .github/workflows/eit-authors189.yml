name: EIT189 authors' original mesh and covariance semantic gate
on:
  push:
    branches: [experiment/eit189-original-author-estimator-20261119]
    paths:
      - 'campaign/eit-original-authors189/**'
      - 'research/eit_author_inverse189/**'
      - 'tests/test_eit_author_inverse189.py'
      - '.github/workflows/eit-authors189.yml'
  pull_request:
    paths:
      - 'campaign/eit-original-authors189/**'
      - 'research/eit_author_inverse189/**'
      - 'tests/test_eit_author_inverse189.py'
      - '.github/workflows/eit-authors189.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-offline-refusals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical requirements
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Exact executing source and seven frozen offline tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 OPENBLAS_NUM_THREADS=1 python -B -m unittest -v tests.test_eit_author_inverse189
  inspect-pinned-original-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only fixed public dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Verify exact source and one registered original-source read
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 OPENBLAS_NUM_THREADS=1 python -B -m unittest -v tests.test_eit_author_inverse189
          /usr/bin/time -f 'wall_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' -o "$RUNNER_TEMP/EIT189_RESOURCES.txt" env OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python -B -m research.eit_author_inverse189.inspect --out "$RUNNER_TEMP/EIT189_SOURCE_WITNESS.json"
      - name: Print source-targeted original estimator expressions for independent translation review
        if: success()
        shell: bash
        run: |
          python -B - <<'PY_WITNESS'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'EIT189_SOURCE_WITNESS.json'
          witness = json.loads(path.read_text())
          print('ORIGINAL_AUTHOR_LINE_SEMANTICS_SOURCE_BOUND')
          for row in witness['code_bearing_lines']:
              n = row['line']
              if 18 <= n <= 20 or 35 <= n <= 59:
                  print(f"original_line_{n}: {row['source']}")
          print('ORIGINAL_MESH_CANDIDATES', json.dumps(witness['all_mesh_candidates'], sort_keys=True))
          print('FULL_ORIGINAL_INVERSE_EXECUTED', witness['full_author_inverse_reconstructed'])
          PY_WITNESS
      - name: Keep only registered small original-source witness and process receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit189-original-author-source-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EIT189_SOURCE_WITNESS.json
            ${{ runner.temp }}/EIT189_RESOURCES.txt
          if-no-files-found: warn
          retention-days: 14
