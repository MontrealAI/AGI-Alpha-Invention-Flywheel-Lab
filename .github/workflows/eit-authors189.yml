name: EIT189 original authors' full covariance inverse, source-pinned
on:
  push:
    branches: [experiment/eit189-original-author-estimator-20261119]
    paths:
      - 'campaign/eit-original-authors189/**'
      - 'research/eit_author_inverse189/**'
      - 'tests/test_eit_author_inverse189.py'
      - 'tests/test_eit_author_inverse189_full.py'
      - '.github/workflows/eit-authors189.yml'
  pull_request:
    paths:
      - 'campaign/eit-original-authors189/**'
      - 'research/eit_author_inverse189/**'
      - 'tests/test_eit_author_inverse189.py'
      - 'tests/test_eit_author_inverse189_full.py'
      - '.github/workflows/eit-authors189.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-offline-refusals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only pinned numerical dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Exact-head source/mesh/refusal plus Bayesian inverse and leakage tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 OPENBLAS_NUM_THREADS=1 python -B -m unittest -v tests.test_eit_author_inverse189 tests.test_eit_author_inverse189_full

  original-covariance-16-column-proof:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original pinned numerical dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Offline source and direct-fold nonleakage controls
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 OPENBLAS_NUM_THREADS=1 python -B -m unittest -v tests.test_eit_author_inverse189 tests.test_eit_author_inverse189_full
      - name: One original SHA-pinned physical source, full original author prior, all frozen folds
        run: |
          /usr/bin/time -f 'wall_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' -o "$RUNNER_TEMP/EIT189_FULL_RESOURCES.txt" env OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python -B -m research.eit_author_inverse189.reconstruct --out "$RUNNER_TEMP/EIT189_FULL_ORIGINAL_COVARIANCE.json"
      - name: Compact original-source bound receipt and resource telemetry only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit189-original-covariance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EIT189_FULL_ORIGINAL_COVARIANCE.json
            ${{ runner.temp }}/EIT189_FULL_RESOURCES.txt
          if-no-files-found: warn
          retention-days: 14
