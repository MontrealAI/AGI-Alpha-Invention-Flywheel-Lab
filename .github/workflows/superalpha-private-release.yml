name: Super Alpha private release
on:
  pull_request:
    paths:
      - 'experiments/superalpha_private_release/**'
      - '.github/workflows/superalpha-private-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reproducible dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r experiments/superalpha_private_release/requirements.txt
      - name: Verify exact source, privacy frontier and original account
        run: |
          git rev-parse HEAD
          python -m unittest experiments.superalpha_private_release.test_experiment -v
          python -m experiments.superalpha_private_release.experiment --output "$RUNNER_TEMP/private-release.json"
          python -m experiments.superalpha_private_release.finance --replay experiments/superalpha_private_release/evidence
          python -m unittest tests.test_fresh_native_capital.NativeCapitalTests.test_positive_profit_does_not_spend_committed_cash_and_stale_proof_fails -v
      - name: Compact scientific receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/private-release.json
          if-no-files-found: error
