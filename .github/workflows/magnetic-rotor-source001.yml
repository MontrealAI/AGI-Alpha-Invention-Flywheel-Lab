name: Magnetic rotor public physical source gate 001
on:
  pull_request:
    paths:
      - 'research/magnetic_rotor001/**'
      - 'tests/test_magnetic_rotor001.py'
      - '.github/workflows/magnetic-rotor-source001.yml'
  push:
    branches:
      - research/magnetic-rotor-noncontact-20261108
permissions:
  contents: read
jobs:
  physical-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout literal executing source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen pre-code protocol and literal source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor ea3cbf4739e55249f20afc2d9b1af49a5eab9745 HEAD
          test "$(git show ea3cbf4739e55249f20afc2d9b1af49a5eab9745:research/magnetic_rotor001/PREREGISTRATION.md | sha256sum | cut -d ' ' -f1)" = "$(sha256sum research/magnetic_rotor001/PREREGISTRATION.md | cut -d ' ' -f1)"
          git status --porcelain
          sha256sum research/magnetic_rotor001/gate.py tests/test_magnetic_rotor001.py research/magnetic_rotor001/PREREGISTRATION.md
      - name: Set up standard Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise all adversarial gates in normal and optimized mode
        run: |
          python -m unittest tests.test_magnetic_rotor001 -v
          python -O -m unittest tests.test_magnetic_rotor001 -v
      - name: Attempt the single preregistered pinned public download
        shell: bash
        run: |
          set -euo pipefail
          python -m research.magnetic_rotor001.gate --output "$RUNNER_TEMP/magnetic-source001"
          python - "${RUNNER_TEMP}/magnetic-source001/SOURCE_GATE_RESULT.json" <<'PY'
          import json, pathlib, sys
          r=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if r["status"] != "SOURCE_ACCESS_GATE_PASS_PHYSICAL_UTILITY_HOLD":
              raise SystemExit("SOURCE_NOT_VERIFIED")
          if r["physical_hold_slide_accepted"] or r["native_financial_account_opened"] or r["deployment"] != "NO_DEPLOY":
              raise SystemExit("UNAUTHORIZED_SCOPE_CLAIM")
          print(json.dumps({"gate":r["status"],"measured_source_sha256":r["source_sha256_measured"],"files":r["file_count"],"rights":r["rights_for_commercial_use"]},sort_keys=True))
          PY
      - name: Preserve allowlisted key-free source gate result, including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: magnetic-rotor-source001-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magnetic-source001/SOURCE_GATE_RESULT.json
          if-no-files-found: warn
