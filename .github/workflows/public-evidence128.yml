name: Public evidence128 official awards preflight
on:
  push:
    paths:
      - 'campaign/public-evidence128/**'
      - 'scripts/scan_public_awards128.py'
      - 'tests/test_public_awards128.py'
      - '.github/workflows/public-evidence128.yml'
  pull_request:
    paths:
      - 'campaign/public-evidence128/**'
      - 'scripts/scan_public_awards128.py'
      - 'tests/test_public_awards128.py'
      - '.github/workflows/public-evidence128.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-awards:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Capture actual job start time
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Synthetic parser, privacy and source-integrity regressions
        run: python3 -m unittest discover -s tests -p 'test_public_awards128.py' -v
      - name: Download precisely one original federal FY2026-27 award dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-evidence128"
          # A plain user agent is required by the publisher's HTTP gateway.
          # No dataset fallback or retry; preserve any failure as a failed run.
          if ! curl --fail --location --silent --show-error --retry 0 \
            --max-time 180 --user-agent 'AGIAlphaEvidence128/1.0' \
            'https://canadabuys.canada.ca/opendata/pub/2026-2027-awardNotice-avisAttribution.csv' \
            --output "$RUNNER_TEMP/public-evidence128/publisher.csv"; then
            printf '{"accepted":false,"stage":"SOURCE_DOWNLOAD","decision":"NO_BID_NO_DEPLOY","source_available":null}\n' \
              > "$RUNNER_TEMP/public-evidence128/FAILURE.json"
            exit 1
          fi
      - name: Parse all source rows and bind the exact downloaded source bytes
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 scripts/scan_public_awards128.py \
            --input "$RUNNER_TEMP/public-evidence128/publisher.csv" \
            --output "$RUNNER_TEMP/public-evidence128/RESULT.json"; then
            printf '{"accepted":false,"stage":"SOURCE_PARSE_OR_SCHEMA","decision":"NO_BID_NO_DEPLOY"}\n' \
              > "$RUNNER_TEMP/public-evidence128/FAILURE.json"
            exit 1
          fi
      - name: Publish only compact public proof, never raw CSV or contact fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-evidence128-compact-receipt
          path: |
            ${{ runner.temp }}/public-evidence128/RESULT.json
            ${{ runner.temp }}/public-evidence128/FAILURE.json
          if-no-files-found: warn
          retention-days: 30
