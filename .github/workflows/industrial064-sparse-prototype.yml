name: Industrial064 offline sparse-free production (no account)
on:
  pull_request:
    paths:
      - 'industrial062/construct.py'
      - 'industrial064/construct.py'
      - 'tests/test_industrial062_sparse_elision.py'
      - 'scripts/probe_industrial064_sparse_constructor.py'
      - 'campaign/industrial-funded-064/OFFLINE_SPARSE_PROBE.json'
      - '.github/workflows/industrial064-sparse-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-public-input-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned existing industrial dependencies
        run: python -m pip install --only-binary=:all: -r requirements-engineering061.txt
      - name: Test exact small plans and original failure diagnostics
        run: |
          python -m unittest tests.test_industrial062_sparse_elision -v
          python -m unittest tests.test_industrial064_producer_diagnostics -v
      - name: Materialize pinned public-only input; never touch an account
        run: |
          python industrial062/fetch_inputs.py
          python scripts/materialize_industrial064.py
      - name: One preregistered offline full-size construction and client acceptance
        run: |
          python scripts/probe_industrial064_sparse_constructor.py --output "$RUNNER_TEMP/industrial064-sparse-free"
      - name: Preserve compact key-free result even when construction fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: industrial064-sparse-free-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/industrial064-sparse-free/RESULT.json
          if-no-files-found: warn
