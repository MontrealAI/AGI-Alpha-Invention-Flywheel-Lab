name: GENESIS source-to-surface construction
on:
  pull_request:
    paths:
      - 'research/genesis_surface/**'
      - 'campaign/genesis-surface/**'
      - 'tests/test_genesis_surface*.py'
      - '.github/workflows/genesis-surface.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      archive_sha256: ${{ steps.distribution.outputs.archive_sha256 }}
    steps:
      - name: Record platform start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare allowlisted public source snapshot (not qualification)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path.cwd()
          names=sorted([str(p) for p in pathlib.Path('research/genesis_surface').glob('*.py')]+[str(p) for p in pathlib.Path('campaign/genesis-surface').iterdir() if p.is_file()]+[str(p) for p in pathlib.Path('tests').glob('test_genesis_surface*.py')]+['.github/workflows/genesis-surface.yml'])
          if (root/'research/__init__.py').is_file(): names.append('research/__init__.py')
          identity={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'scope':'PUBLIC_DEVELOPMENT_SOURCE_ONLY_NOT_A_QUALIFIED_RELEASE','files':{}}
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'genesis-source.zip'
          with zipfile.ZipFile(destination,'w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):
                  path=root/name
                  if path.is_symlink() or any(p.is_symlink() for p in path.parents):raise ValueError('symlink source')
                  data=path.read_bytes()
                  identity['files'][name]=hashlib.sha256(data).hexdigest()
                  z.writestr(name,data)
              z.writestr('SOURCE_IDENTITY.json',json.dumps(identity,indent=2,sort_keys=True))
          PY
      - name: Retain small public source snapshot for independent testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-surface-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/genesis-source.zip
          if-no-files-found: error
          retention-days: 7
      - run: python -m pip install -r campaign/genesis-surface/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_genesis_surface*.py' -v
      - run: python -O -m unittest discover -s tests -p 'test_genesis_surface*.py' -v
      - name: Construct and independently recheck both declared development goals
        run: |
          python -m research.genesis_surface build --out "$RUNNER_TEMP/genesis-surface"
          python -m research.genesis_surface audit --out "$RUNNER_TEMP/genesis-surface"
          python -m research.genesis_surface build --request campaign/genesis-surface/SUCCESSOR_REQUEST.json --out "$RUNNER_TEMP/genesis-surface-reverse"
          python -m research.genesis_surface audit --out "$RUNNER_TEMP/genesis-surface-reverse"
          python -m research.genesis_surface mesh --design "$RUNNER_TEMP/genesis-surface" --out "$RUNNER_TEMP/genesis-surface-mesh" --step-mm 0.2
      - name: Retain source-matched digital outputs only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-surface-digital-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/genesis-surface
            ${{ runner.temp }}/genesis-surface-reverse
            ${{ runner.temp }}/genesis-surface-mesh
          if-no-files-found: error
          retention-days: 7
      - name: Package usable source and evidence and verify a fresh extraction
        id: distribution
        shell: bash
        run: |
          python -B -m research.genesis_surface.distribution build --out "$RUNNER_TEMP/genesis-distribution" --commit "$(git rev-parse HEAD)"
          echo "archive_sha256=$(sha256sum "$RUNNER_TEMP/genesis-distribution/ALPHA_GENESIS_SURFACE.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload the exact usable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-surface-usable-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/genesis-distribution/ALPHA_GENESIS_SURFACE.zip
            ${{ runner.temp }}/genesis-distribution/DISTRIBUTION_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
  downloaded-candidate:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: genesis-surface-usable-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/downloaded
      - name: Bind actual downloaded bytes to the prior job output and extract
        env:
          EXPECTED_ARCHIVE: ${{ needs.qualify.outputs.archive_sha256 }}
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib,os,pathlib,zipfile
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=base/'downloaded/ALPHA_GENESIS_SURFACE.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=os.environ['EXPECTED_ARCHIVE']:raise ValueError('downloaded archive changed')
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or not item.filename.startswith('ALPHA_GENESIS_SURFACE/'):raise ValueError('unsafe archive path')
              z.extractall(base/'extracted')
          PYCODE
      - name: Operate only the downloaded package (no checkout or PYTHONPATH)
        working-directory: ${{ runner.temp }}/extracted/ALPHA_GENESIS_SURFACE
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          unset PYTHONPATH
          python -m pip install -r campaign/genesis-surface/requirements.txt
          python -B -m unittest discover -s tests -p 'test_genesis_surface*.py' -v
          python -B -m research.genesis_surface.distribution verify --out .
