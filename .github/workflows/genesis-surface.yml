name: GENESIS source-to-surface construction
on:
  pull_request:
    paths:
      - 'research/genesis_surface/**'
      - 'campaign/genesis-surface/**'
      - 'tests/test_genesis_surface.py'
      - '.github/workflows/genesis-surface.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r campaign/genesis-surface/requirements.txt
      - run: python -m unittest discover -s tests -p test_genesis_surface.py -v
      - run: python -O -m unittest discover -s tests -p test_genesis_surface.py -v
      - name: Construct and independently recheck both declared development goals
        run: |
          python -m research.genesis_surface build --out "$RUNNER_TEMP/genesis-surface"
          python -m research.genesis_surface audit --out "$RUNNER_TEMP/genesis-surface"
          python -m research.genesis_surface build --request campaign/genesis-surface/SUCCESSOR_REQUEST.json --out "$RUNNER_TEMP/genesis-surface-reverse"
          python -m research.genesis_surface audit --out "$RUNNER_TEMP/genesis-surface-reverse"
          python -m research.genesis_surface mesh --design "$RUNNER_TEMP/genesis-surface" --out "$RUNNER_TEMP/genesis-surface-mesh" --step-mm 0.2
