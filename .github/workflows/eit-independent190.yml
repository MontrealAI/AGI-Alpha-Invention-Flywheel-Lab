name: EIT190 independent chest physical source gate
on:
  push:
    branches: [experiment/eit190-independent-chest-truth-20261119]
    paths:
      - 'campaign/eit-independent-190/**'
      - 'research/eit_independent190/**'
      - 'tests/test_eit_independent190.py'
      - '.github/workflows/eit-independent190.yml'
  pull_request:
    paths:
      - 'campaign/eit-independent-190/**'
      - 'research/eit_independent190/**'
      - 'tests/test_eit_independent190.py'
      - '.github/workflows/eit-independent190.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-offline-refusals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only pinned source-inspection dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Exact-head source, refusal and manifest tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 OPENBLAS_NUM_THREADS=1 python -B -m unittest -v tests.test_eit_independent190

  independent-chest-one-source-proof:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original pinned numerical dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Offline integrity, source and no-network controls
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 OPENBLAS_NUM_THREADS=1 python -B -m unittest -v tests.test_eit_independent190
      - name: One fixed independent chest archive, original source hashes, no property scores
        run: |
          /usr/bin/time -f 'wall_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' -o "$RUNNER_TEMP/EIT190_CHEST_RESOURCES.txt" env OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python -B -m research.eit_independent190.inspect --out "$RUNNER_TEMP/EIT190_CHEST_SOURCE.json"
      - name: Compact independent chest archive receipt and resources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit190-chest-source-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EIT190_CHEST_SOURCE.json
            ${{ runner.temp }}/EIT190_CHEST_RESOURCES.txt
          if-no-files-found: warn
          retention-days: 14
