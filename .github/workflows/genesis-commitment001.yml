name: GENESIS capacity-backed simulated operating turn
on:
  pull_request:
    paths:
      - 'campaign/genesis_commitment001/**'
      - 'commercial/**'
      - 'connected_enterprise/**'
      - 'adaptive_enterprise/**'
      - 'vendor/**'
      - 'portfolio25/pricing.py'
      - 'experiments/commerce006.py'
      - 'requirements-commercial010.txt'
      - 'tests/fixtures/genesis_commitment001_failures/**'
      - 'tests/test_connected_commitment_release.py'
      - 'tests/test_connected_commitment_independent.py'
      - 'tests/test_connected_commitment_public_receipts.py'
      - 'tests/test_connected_commitment_startup.py'
      - '.github/workflows/genesis-commitment001.yml'
  push:
    branches: [main]
    paths:
      - 'campaign/genesis_commitment001/**'
      - 'commercial/**'
      - 'connected_enterprise/**'
      - 'adaptive_enterprise/**'
      - 'vendor/**'
      - 'portfolio25/pricing.py'
      - 'experiments/commerce006.py'
      - 'requirements-commercial010.txt'
      - 'tests/fixtures/genesis_commitment001_failures/**'
      - 'tests/test_connected_commitment_release.py'
      - 'tests/test_connected_commitment_independent.py'
      - 'tests/test_connected_commitment_public_receipts.py'
      - 'tests/test_connected_commitment_startup.py'
      - '.github/workflows/genesis-commitment001.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genesis-commitment001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  operating-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Source-matched delivery and native adversarial tests
        run: |
          python -m unittest campaign.genesis_commitment001.test_delivery campaign.genesis_commitment001.test_native -v
          PYTHONOPTIMIZE=1 python -O -m unittest campaign.genesis_commitment001.test_delivery campaign.genesis_commitment001.test_native -v
          test -f tests/test_connected_commitment_independent.py
          test -f tests/test_connected_commitment_public_receipts.py
          test -f tests/test_connected_commitment_startup.py
          python -m unittest discover -s tests -p 'test_connected_commitment_*.py' -v
          PYTHONOPTIMIZE=1 python -O -m unittest discover -s tests -p 'test_connected_commitment_*.py' -v
      - name: Reproduce preserved original defects on disposable fresh accounts
        run: python tests/fixtures/genesis_commitment001_failures/reproduce.py --source "$PWD"
      - name: Execute every registered case and both complete conventional routes
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          protocol=json.loads(Path('campaign/genesis_commitment001/PROTOCOL.json').read_text())
          root=Path(os.environ['RUNNER_TEMP'])/'commitment001'
          for scenario in protocol['scenarios']:
              for arm in protocol['arms']:
                  output=root/(scenario+'-'+arm)
                  prefix=[sys.executable,'-m','campaign.genesis_commitment001.runner']
                  subprocess.run(prefix+['run','--output',str(output),'--scenario',scenario,'--arm',arm],check=True)
                  subprocess.run(prefix+['audit','--output',str(output)],check=True)
                  subprocess.run(prefix+['resume','--output',str(output),'--scenario',scenario,'--arm',arm],check=True)
                  subprocess.run(prefix+['package','--output',str(output),'--archive',str(root/(scenario+'-'+arm+'.zip'))],check=True)
          PY
      - name: Export and audit the public package without recovery authority
        run: |
          python -m zipfile -e "$RUNNER_TEMP/commitment001/favorable_envelope-retained.zip" "$RUNNER_TEMP/commitment001-public"
          cd "$RUNNER_TEMP/commitment001-public/source"
          python -m campaign.genesis_commitment001.runner audit --output "$RUNNER_TEMP/commitment001-public"
      - name: Retain only compact summaries and key-free evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-commitment001-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/commitment001/*/REPORT.json
            ${{ runner.temp }}/commitment001/*/AUDIT.json
            ${{ runner.temp }}/commitment001/*.zip
          if-no-files-found: error
