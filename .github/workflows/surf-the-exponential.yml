name: SURF THE EXPONENTIAL publication

on:
  push:
    branches: [main]
    paths:
      - 'docs/surf-the-exponential/**'
      - 'docs/research/surf-the-exponential*'
      - '.github/workflows/surf-the-exponential.yml'
  pull_request:
    paths:
      - 'docs/surf-the-exponential/**'
      - 'docs/research/surf-the-exponential*'
      - '.github/workflows/surf-the-exponential.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surf-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            docs/surf-the-exponential
            docs/research/surf-the-exponential.pdf
          sparse-checkout-cone-mode: false
      - name: Install standard publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Verify bound edition and executable evidence
        run: |
          python3 docs/surf-the-exponential/package.py --verify
          python3 docs/surf-the-exponential/check_study.py
          python3 docs/surf-the-exponential/check_construct_case.py
          python3 -m unittest discover -s docs/surf-the-exponential -p 'test_*.py' -v
      - name: Compile source and package reviewed canonical edition
        run: |
          python3 docs/surf-the-exponential/build.py --output "$RUNNER_TEMP/surf-rebuilt.pdf"
          python3 docs/surf-the-exponential/package.py --output-dir "$RUNNER_TEMP/surf-publication"
      - name: Verify and execute the extracted source package
        run: |
          mkdir "$RUNNER_TEMP/surf-extracted"
          unzip -q "$RUNNER_TEMP/surf-publication/SURF_THE_EXPONENTIAL_SOURCE.zip" -d "$RUNNER_TEMP/surf-extracted"
          python3 "$RUNNER_TEMP/surf-extracted/package.py" --verify
          python3 "$RUNNER_TEMP/surf-extracted/check_study.py"
          python3 "$RUNNER_TEMP/surf-extracted/check_construct_case.py"
          python3 -m unittest discover -s "$RUNNER_TEMP/surf-extracted" -p 'test_*.py' -v
          python3 "$RUNNER_TEMP/surf-extracted/build.py" --output "$RUNNER_TEMP/surf-extracted-rebuilt.pdf"
          cmp "$RUNNER_TEMP/surf-rebuilt.pdf" "$RUNNER_TEMP/surf-extracted-rebuilt.pdf"
          cd "$RUNNER_TEMP/surf-publication"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surf-publication-${{ github.sha }}
          path: ${{ runner.temp }}/surf-publication/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: surf-publication-${{ github.sha }}
          path: ${{ runner.temp }}/surf-publication
      - name: Publish or verify immutable research edition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=surf-the-exponential-v1.1.0
          assets="$RUNNER_TEMP/surf-publication"
          (cd "$assets" && sha256sum --check SHA256SUMS)
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/surf-existing.json" 2> "$RUNNER_TEMP/surf-existing.err"; then
            echo 'Existing edition: verifying assets without replacement.'
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/surf-existing.err" || { cat "$RUNNER_TEMP/surf-existing.err"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2> "$RUNNER_TEMP/surf-tag.err"; then
              [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA" ] || exit 1
            else
              grep -q 'HTTP 404' "$RUNNER_TEMP/surf-tag.err" || { cat "$RUNNER_TEMP/surf-tag.err"; exit 1; }
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
            fi
            cat > "$RUNNER_TEMP/surf-release-notes.md" <<'NOTES'
          # SURF THE EXPONENTIAL — The Missing Move

          **Find what the answer missed. Build what the world is missing.**

          Research edition 1.1.0 by Vincent Boucher · MONTREAL.AI / QUEBEC.AI.

          A research synthesis of Transformational Intelligence, ALPHA GENESIS FLYWHEEL Ω, and Invent the Economy: turn evidence-grounded criticism into missing capabilities, viable productive arrangements, and better discovery on fresh work.

          Read the accessible [browser edition](https://montrealai.github.io/AGI-Alpha-Invention-Flywheel-Lab/surf-the-exponential.html), download the PDF, or rebuild the complete editable LaTeX and executable evidence from the source archive.

          Edition 1.1 adds an executable construction and changed-task successor: 36 initial and 54 successor checks, minimal representations of three and six labels, and independent enumeration of all 21,147 partitions. Conventional constructions tie. A full-refund counterexample shows why 50 units fund the successful deposit path but 90 are needed to protect the complete promised arrangement.

          The source includes separate checkers, focused mutation tests, and the original 2,304-point review audit with adverse cases and conventional controls that tie or win. These are authored finite models, not observed frontier-model superiority or realized commerce. The stronger empirical programme remains prospective.

          The [original edition 1.0.0](https://github.com/MontrealAI/AGI-Alpha-Invention-Flywheel-Lab/releases/tag/surf-the-exponential-v1.0.0) remains available with its original artifacts.

          `PUBLICATION.json` binds the reviewed PDF to its source inputs. `SHA256SUMS` verifies the release assets. The archive is self-contained; its README explains reproduction and the scope of byte reproducibility across TeX environments.
          NOTES
            gh release create "$tag" "$assets/SURF_THE_EXPONENTIAL.pdf" "$assets/SURF_THE_EXPONENTIAL_SOURCE.zip" "$assets/PUBLICATION.json" "$assets/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title 'SURF THE EXPONENTIAL — The Missing Move' --notes-file "$RUNNER_TEMP/surf-release-notes.md"
          fi
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          [ "$tag_commit" = "$GITHUB_SHA" ] || { echo 'Edition tag differs from this publication commit; use its original run or an explicitly new edition.'; exit 1; }
          mkdir "$RUNNER_TEMP/surf-downloaded"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/surf-downloaded"
          for f in SURF_THE_EXPONENTIAL.pdf SURF_THE_EXPONENTIAL_SOURCE.zip PUBLICATION.json SHA256SUMS; do
            cmp "$assets/$f" "$RUNNER_TEMP/surf-downloaded/$f"
          done
          (cd "$RUNNER_TEMP/surf-downloaded" && sha256sum --check SHA256SUMS)
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .draft)" = true ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .draft)" = false ] || { echo 'Edition has not been published.'; exit 1; }
      - name: Verify operation from downloaded release
        run: |
          mkdir "$RUNNER_TEMP/surf-release-extracted"
          unzip -q "$RUNNER_TEMP/surf-downloaded/SURF_THE_EXPONENTIAL_SOURCE.zip" -d "$RUNNER_TEMP/surf-release-extracted"
          python3 "$RUNNER_TEMP/surf-release-extracted/package.py" --verify
          python3 "$RUNNER_TEMP/surf-release-extracted/check_study.py"
          python3 "$RUNNER_TEMP/surf-release-extracted/check_construct_case.py"
          python3 -m unittest discover -s "$RUNNER_TEMP/surf-release-extracted" -p 'test_*.py' -v
