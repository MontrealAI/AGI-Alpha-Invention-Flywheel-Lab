name: Inspect two pinned public failure artifacts
on:
  pull_request:
    paths:
      - 'diagnostics/artifact-inspection-20261110/**'
      - '.github/workflows/inspect-pinned-artifacts-20261110.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: inspect-pinned-artifacts-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'MontrealAI/AGI-Alpha-Invention-Flywheel-Lab' && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check transport, archive and output boundaries without network
        run: python -B diagnostics/artifact-inspection-20261110/inspect_pinned.py --self-test
      - name: Verify and inspect only two pinned existing artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B diagnostics/artifact-inspection-20261110/inspect_pinned.py
