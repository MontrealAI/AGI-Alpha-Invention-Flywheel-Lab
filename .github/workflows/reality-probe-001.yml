name: Reality Probe 001 - independently reproduced model finding

on:
  pull_request:
    paths:
      - 'research/singularity_direction001/**'
      - 'research/pglib_opf_case14_ieee.m'
      - 'research/pglib_opf_case30_ieee.m'
      - 'tests/test_singularity_direction001.py'
      - '.github/workflows/reality-probe-001.yml'
  push:
    branches: [main]
    paths:
      - 'research/singularity_direction001/**'
      - 'research/pglib_opf_case14_ieee.m'
      - 'research/pglib_opf_case30_ieee.m'
      - 'tests/test_singularity_direction001.py'
      - '.github/workflows/reality-probe-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            research/__init__.py
            research/singularity_direction001
            research/pglib_opf_case14_ieee.m
            research/pglib_opf_case30_ieee.m
            tests/__init__.py
            tests/test_singularity_direction001.py
          sparse-checkout-cone-mode: false
      - name: Install bounded numerical dependency
        run: python3 -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Execute counterfactual and adversarial tests
        run: python3 -m unittest discover -s tests -p 'test_singularity_direction001.py' -v
      - name: Generate exact source-bound proof and independently verify
        run: |
          python3 -m research.singularity_direction001.experiment --output "$RUNNER_TEMP/reality-probe-001.json"
          python3 -m research.singularity_direction001.verify --evidence "$RUNNER_TEMP/reality-probe-001.json" | tee "$RUNNER_TEMP/proof-verdict.json"
      - name: Preserve public machine-readable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-probe-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/reality-probe-001.json
            ${{ runner.temp }}/proof-verdict.json
          if-no-files-found: error
          retention-days: 30
