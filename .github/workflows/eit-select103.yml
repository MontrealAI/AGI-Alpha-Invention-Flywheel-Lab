name: EIT 103 source-pinned select-only bound

on:
  pull_request:
    paths:
      - 'research/eit_select103/**'
      - 'tests/test_eit_select103.py'
      - '.github/workflows/eit-select103.yml'
  workflow_dispatch:

jobs:
  pinned-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform start
        run: echo "AGI_JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Adversarial arithmetic tests
        run: python3 -m unittest discover -s tests -p 'test_eit_select103.py' -v
      - name: Optimized-mode tests
        run: python3 -O -m unittest discover -s tests -p 'test_eit_select103.py' -v
      - name: Verify source-bound negative result
        run: |
          python3 research/eit_select103/analysis.py > "$RUNNER_TEMP/eit103-result.json"
          python3 - "$RUNNER_TEMP/eit103-result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert (r['binary_decisions'],r['unanimously_wrong'],r['select_only_oracle_upper_bound_correct'])==(168,20,148)
          assert r['correct_by_fixed_arm']=={'full76':147,'direct40':146,'impute40':146}
          assert r['financial_native_actions']==0 and r['complete_cost_profit_usd'] is None
          print('SOURCE_BOUND_NO_BID_NO_DEPLOY',r['decision'])
          PY
