name: FRONTIER first capability and distinct successor
on:
  pull_request:
    paths:
      - 'experiments/frontier_first_proof_20261121/**'
      - '.github/workflows/frontier-first-proof.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/frontier_first_proof_20261121/**'
      - '.github/workflows/frontier-first-proof.yml'
permissions:
  contents: read
concurrency:
  group: frontier-first-proof-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: experiments/frontier_first_proof_20261121
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce exact outcomes and independent source audit
        working-directory: experiments/frontier_first_proof_20261121
        run: |
          python -B -m unittest discover -s tests -v
          python -B fetch_sources.py --data-dir "$RUNNER_TEMP/frontier-data"
          python -B portfolio.py --csv "$RUNNER_TEMP/frontier-data/amidation.csv" --output "$RUNNER_TEMP/frontier-results/first.json"
          python -B successor.py --data-dir "$RUNNER_TEMP/frontier-data" --output "$RUNNER_TEMP/frontier-results/successor.json"
          python -B audit.py --data-dir "$RUNNER_TEMP/frontier-data" --first "$RUNNER_TEMP/frontier-results/first.json" --successor "$RUNNER_TEMP/frontier-results/successor.json" --output "$RUNNER_TEMP/frontier-results/audit.json"
          python -B independent/check_mutations.py --source-root "$RUNNER_TEMP/frontier-data" --evidence-root evidence --output "$RUNNER_TEMP/frontier-results/mutations.json"
      - name: Reproduce strong independent complete alternatives
        working-directory: experiments/frontier_first_proof_20261121
        run: |
          python -m pip install -r requirements-comparison.txt
          python -B independent/baselines.py --stage first --source-root "$RUNNER_TEMP/frontier-data" --output "$RUNNER_TEMP/frontier-results/conventional-first.json" --repeats 1
          python -B independent/baselines.py --stage successor --source-root "$RUNNER_TEMP/frontier-data" --output "$RUNNER_TEMP/frontier-results/conventional-successor.json" --repeats 1
          python -B transfer_check.py --successor "$RUNNER_TEMP/frontier-results/successor.json" --baseline "$RUNNER_TEMP/frontier-results/conventional-successor.json" --output "$RUNNER_TEMP/frontier-results/transfer.json" --repeats 1
