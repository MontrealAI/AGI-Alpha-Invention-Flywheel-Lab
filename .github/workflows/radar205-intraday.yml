name: RADAR205 fixed intraday provenance qualification
on:
  pull_request:
    paths:
      - 'research/frontier-omega-opportunity-radar/**'
      - '.github/workflows/radar205-intraday.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run original and fixed RADAR205 regression cases
        working-directory: research/frontier-omega-opportunity-radar
        run: python -m unittest discover -s tests -p 'test_frontier_radar*.py' -v
