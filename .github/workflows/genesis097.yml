name: GENESIS 097 numerical instrument
on:
  pull_request:
    paths:
      - 'research/genesis097/**'
      - 'campaign/genesis097/**'
      - '.github/workflows/genesis097.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Test and reproduce frozen numerical experiment
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest research.genesis097.test_instrument research.genesis097.test_direct -v
          python -m research.genesis097.experiment --output /tmp/genesis097-result.json
