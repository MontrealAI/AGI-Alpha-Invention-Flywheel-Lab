name: "🌌♾️ AGI ALPHA Flywheel Harness — Capital025 missing-cell repair"
on:
  pull_request:
    paths:
      - '.github/workflows/capital025-repair.yml'
      - 'campaign/capital-025-repair/README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capital025-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  reproduce_missing:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        capital: [low]
        seed: [2610311644]
        policy: [joint]
        liability: [prospective]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1413ed30ce670b80e57d4839193d42ea92da37ff
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Execute fixed horizon and native operating audit
        run: python scripts/run_capital025.py --stage long --capital '${{ matrix.capital }}' --seed '${{ matrix.seed }}' --policy '${{ matrix.policy }}' --liability '${{ matrix.liability }}' --output "$RUNNER_TEMP/capital025"
      - name: Retain compact success or failure receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital025-repair-low-2610311644-joint-prospective
          path: ${{ runner.temp }}/capital025/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
