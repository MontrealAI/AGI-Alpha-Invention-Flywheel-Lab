name: live-energy093 offline evidence
on:
  pull_request:
    paths:
      - 'campaign/live-energy093/**'
      - '.github/workflows/live-energy093.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -m unittest discover -s campaign/live-energy093 -p 'test*.py' -v
      - run: python campaign/live-energy093/audit.py --forecast campaign/live-energy093/evidence/forecast.json --inputs campaign/live-energy093/evidence/fit_inputs.json
