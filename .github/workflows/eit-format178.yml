name: EIT178 separately frozen first-pair public MAT header diagnostic
on:
  pull_request:
    paths:
      - 'campaign/eit-format178/**'
      - 'research/eit_chest_format178.py'
      - 'tests/test_eit_chest_format178.py'
      - '.github/workflows/eit-format178.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eit178-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  selected-member-header-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test frozen format-only and security guards offline
        run: |
          python -B -m unittest -v tests.test_eit_chest_format178
      - name: Diagnose exactly one original first selected pair header, no alternate file
        run: |
          python -B -m research.eit_chest_format178 --output "$RUNNER_TEMP/EIT178_HEADER_RECEIPT.json"
      - name: Retain compact success or actual failure record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit178-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/EIT178_HEADER_RECEIPT.json
          if-no-files-found: warn
