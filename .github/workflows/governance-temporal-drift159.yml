name: Governance temporal-risk159 first-party distinct-observation qualification
on:
  pull_request:
    paths:
      - '.github/workflows/governance-temporal-drift159.yml'
      - 'products/governance_impact140/**'
      - 'tests/test_governance_temporal_drift159.py'
      - 'campaign/governance-temporal-drift159/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/governance-temporal-drift159.yml'
      - 'products/governance_impact140/**'
      - 'tests/test_governance_temporal_drift159.py'
permissions:
  contents: read
concurrency:
  group: governance-temporal-drift159-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      source_manifest_sha: ${{ steps.anchor.outputs.source_manifest_sha }}
      expected_report_sha: ${{ steps.anchor.outputs.expected_report_sha }}
    steps:
      - name: Record job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact head, frozen and unchanged original regressions
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for name in test_governance_impact140.py test_governance_native_risk152.py test_governance_native_reassessment153.py test_governance_linked_portable158.py test_governance_temporal_drift159.py; do
            python -B -m unittest discover -s tests -p "$name" -v
          done
          python -O -B -m unittest discover -s tests -p 'test_governance_temporal_drift159.py' -v
      - name: Freeze exact key-free downloaded closure and independent result anchor
        id: anchor
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/drift159/tree/products/governance_impact140" "$RUNNER_TEMP/drift159/tree/tests"
          cp products/governance_impact140/__init__.py products/governance_impact140/native_risk152.py products/governance_impact140/native_drift159.py "$RUNNER_TEMP/drift159/tree/products/governance_impact140/"
          cp tests/test_governance_temporal_drift159.py "$RUNNER_TEMP/drift159/tree/tests/"
          python -B - <<'PY'
          import hashlib,json,os,runpy
          from pathlib import Path
          from products.governance_impact140 import native_drift159
          root=Path(os.environ['RUNNER_TEMP'])/'drift159/tree'
          names=['products/governance_impact140/__init__.py','products/governance_impact140/native_risk152.py','products/governance_impact140/native_drift159.py','tests/test_governance_temporal_drift159.py']
          files={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in names}
          manifest={'source_sha':os.environ['SOURCE_SHA'],'files':files,'scope':'KEY_FREE_SYNTHETIC_RESEARCH_ONLY'}
          raw=(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n').encode()
          (root/'SOURCE.json').write_bytes(raw)
          example=runpy.run_path('tests/test_governance_temporal_drift159.py')['sample']()
          report=native_drift159.evaluate(example)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              out.write('source_manifest_sha='+hashlib.sha256(raw).hexdigest()+'\n')
              out.write('expected_report_sha='+report['receipt_sha256']+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-drift159-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/drift159/tree/
          if-no-files-found: error
  downloaded-operation:
    needs: [exact-source]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MANIFEST_SHA: ${{ needs.exact-source.outputs.source_manifest_sha }}
      REPORT_SHA: ${{ needs.exact-source.outputs.expected_report_sha }}
    steps:
      - name: Record job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: governance-drift159-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/governance-drift159-clean
      - name: Verify all source bytes against separately anchored previous-job receipt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/governance-drift159-clean"
          python -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path('.'); raw=(base/'SOURCE.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['MANIFEST_SHA']
          m=json.loads(raw); assert m['source_sha']==os.environ['SOURCE_SHA']
          actual={p.as_posix() for p in base.rglob('*') if p.is_file()}
          assert actual==set(m['files'])|{'SOURCE.json'}
          for name,expected in m['files'].items():
              assert hashlib.sha256((base/name).read_bytes()).hexdigest()==expected
          print('EXACT_TRANSPORTED_KEY_FREE_SOURCE_ACCEPTED')
          PY
          python -B -m unittest discover -s tests -p test_governance_temporal_drift159.py -v
          python -B - <<'PY'
          import json,runpy
          from pathlib import Path
          example=runpy.run_path('tests/test_governance_temporal_drift159.py')['sample']()
          Path('case.json').write_text(json.dumps(example,sort_keys=True),encoding='utf-8')
          PY
          python -B -m products.governance_impact140.native_drift159 --input case.json --output actual.json
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          from products.governance_impact140 import native_drift159 as native
          r=json.loads(Path('actual.json').read_text())
          assert r['receipt_sha256']==os.environ['REPORT_SHA']
          assert next(x for x in r['metric_comparisons'] if x['metric']=='accuracy')['classification']=='NEW_ADVERSE_SYNTHETIC_SIGNAL'
          assert native.verify_receipt(r,expected_receipt=os.environ['REPORT_SHA'],
             expected_prior_raw=r['prior_raw_sha256'],expected_current_raw=r['current_raw_sha256'])
          assert r['requires_authorized_review']
          assert r['actual_buyer_acceptance'] is None
          print('CLEAN_ACTUAL_159_CLI_REPLAY_PASS_SYNTHETIC_ONLY')
          PY
      - name: No commercial or financial authority
        run: |
          echo "FINANCE=UNCHANGED_NO_ACCOUNT_OR_SIGNER"
          echo "CONCLUSION=FIRST_PARTY_SYNTHETIC_MONITORING_ONLY_NO_TRL_NO_BUYERS"
          echo "DEPLOYMENT=NO_BID_NO_DEPLOY"
