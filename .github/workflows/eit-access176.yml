name: EIT176 single-header fixed public-source access diagnostic
on:
  pull_request:
    paths:
      - 'campaign/eit-source-access176/**'
      - 'research/eit_source_access176.py'
      - 'tests/test_eit_source_access176.py'
      - '.github/workflows/eit-access176.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eit-access176-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  single-source-access:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run nine bounded offline refusal and single-request controls
        run: |
          python3 -B -m unittest -v tests.test_eit_source_access176
      - name: One fixed public GET with alternative Accept only (do not retry)
        run: |
          python3 -B -m research.eit_source_access176 --output "$RUNNER_TEMP/EIT176_RECEIPT.json"
      - name: Preserve compact success or original failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit176-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/EIT176_RECEIPT.json
          if-no-files-found: warn
