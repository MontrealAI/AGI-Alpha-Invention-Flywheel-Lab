name: Native strategy adverse-market qualification 236
on:
  push:
    branches:
      - experiment/native-strategy-adverse236-20261122
    paths:
      - "campaign/native-strategy-adverse236/**"
      - "tools/native_strategy_adverse236.py"
      - "tests/test_native_strategy_adverse236.py"
      - ".github/workflows/native-strategy-adverse236.yml"
  pull_request:
    paths:
      - "campaign/native-strategy-adverse236/**"
      - "tools/native_strategy_adverse236.py"
      - "tests/test_native_strategy_adverse236.py"
      - ".github/workflows/native-strategy-adverse236.yml"
permissions:
  contents: read
concurrency:
  group: native-strategy-adverse236-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  native-adversary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start before any checkout
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install declared existing native dependencies
        run: python -m pip install -r requirements-commercial010.txt
      - name: Preregistered protocol, safety and native design tests
        run: python -m unittest -v tests.test_native_strategy_adverse236 tests.test_connected_design_flywheel041
      - name: Execute all five frozen native market cohorts once; re-audit all native accounts
        shell: bash
        run: |
          python -m tools.native_strategy_adverse236 \
            --protocol campaign/native-strategy-adverse236/PROTOCOL.json \
            --output "$RUNNER_TEMP/native-adverse236"
      - name: Print only public comparison decision (no account files)
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-adverse236/publish/SUMMARY.json'
          result=json.loads(path.read_text())
          assert result['status']=='ALL_REGISTERED_AUTHORED_SCENARIOS_EXECUTED_AND_NATIVE_AUDITED'
          assert len(result['observations'])==5
          assert result['decision']=='NO_DEPLOY'
          assert result['actual_external_collections_usd']==0
          assert result['whole_campaign_host_model_dollars'] is None
          print('REGISTERED CASES', [r['case'] for r in result['observations']])
          print('STRICT ROBUST CHALLENGER',result['strict_robust_challenger_qualified'])
          print('MODELED NATIVE DELTAS MICROUSD',
                [(r['case'],r['matched_profit_delta_microUSD']) for r in result['observations']])
          print('REAL COMMERCE',result['actual_external_collections_usd'])
          PY
      - name: Retain public exact-head receipts or partial failure without secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-strategy-adverse236-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-adverse236/publish/
          if-no-files-found: warn
          retention-days: 7
