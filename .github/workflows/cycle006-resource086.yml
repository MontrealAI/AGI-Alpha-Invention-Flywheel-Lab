name: Prospective cycle006 scoped journal observer 086
on:
  pull_request:
    paths:
      - verification/cycle006_scoped_resource086.py
      - tests/test_cycle006_scoped_resource086.py
      - .github/workflows/cycle006-resource086.yml
permissions:
  contents: read
jobs:
  observer086:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record hosted platform start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Deterministic adversarial observer tests only
        run: python -m unittest -v tests.test_cycle006_scoped_resource086
