name: Current commerce compatibility and frozen commercial 010 qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  COMMERCIAL010_FREEZE_SHA256: 117ea809b09cb7bc8597bdcfb472e0df63a15d987dfedbc6844ef482d6c01ed5
jobs:
  current-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-commercial010.txt
      - name: Install pinned current native-exchange dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Qualify the exact current wrappers and their native compatibility
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python -m unittest discover -s tests -p '*010*.py' -v
          python -m unittest discover -s tests -p '*011*.py' -v
          python -m unittest discover -s portfolio25 -p 'test_*.py' -v
          python -m unittest discover -s benchmarks -p 'test_*.py' -v
  qualify:
    name: Immutable released 010 source, inputs, package and clean replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 710203eb128f1d03842a84822ee05517c1791080
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 710203eb128f1d03842a84822ee05517c1791080
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-commercial010.txt
      - name: Install pinned native-exchange dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Qualify historical scoped assertions and original frozen input identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/commercial010-assets"
          python -m unittest discover -s tests -p '*010*.py' -v
          python -m unittest discover -s tests -p '*011*.py' -v
          python -m unittest discover -s portfolio25 -p 'test_*.py' -v
          python -m unittest discover -s benchmarks -p 'test_*.py' -v
          python run_commercial010.py --freeze-sha256 "$COMMERCIAL010_FREEZE_SHA256" --check-inputs --output "$RUNNER_TEMP/commercial010-assets/INPUT_CHECK.json"
          python scripts/check_commercial010_paper.py --root . --output "$RUNNER_TEMP/commercial010-assets/PAPER_CHECK.json"
      - name: Build the actual source package and verify clean extraction
        run: |
          python scripts/package_commercial010.py --root . --source "$SOURCE_COMMIT" --output "$RUNNER_TEMP/commercial010-assets/AGI_ALPHA_Commercial010_source_evidence.zip" > "$RUNNER_TEMP/commercial010-assets/PACKAGE_RECEIPT.json"
          python - <<'PY'
          import importlib.util, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = root/'commercial010-assets/AGI_ALPHA_Commercial010_source_evidence.zip'
          spec = importlib.util.spec_from_file_location('commercial010_package', 'scripts/package_commercial010.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          manifest = module.verify(archive)
          if manifest['source_commit'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('Package source does not match qualified checkout.')
          destination = root/'commercial010-clean'
          if destination.exists() or destination.is_symlink():
              raise SystemExit('Preserve previous extraction; clean destination exists.')
          if any((p/'.git').exists() for p in [destination, *destination.parents]):
              raise SystemExit('Clean extraction must have no Git ancestry.')
          destination.mkdir()
          with zipfile.ZipFile(archive) as source:
              source.extractall(destination)
          for name, meta in manifest['entries'].items():
              import hashlib
              if hashlib.sha256((destination/name).read_bytes()).hexdigest() != meta['sha256']:
                  raise SystemExit('Extracted package member changed: '+name)
          PY
      - name: Execute bounded positive and zero-demand engineering replays without Git
        working-directory: ${{ runner.temp }}/commercial010-clean
        run: |
          python -m unittest discover -s tests -p '*010*.py' -v
          python -m unittest discover -s tests -p '*011*.py' -v
          python -m unittest discover -s portfolio25 -p 'test_*.py' -v
          python -m unittest discover -s benchmarks -p 'test_*.py' -v
          python run_commercial010.py --freeze-sha256 "$COMMERCIAL010_FREEZE_SHA256" --check-inputs --output "$RUNNER_TEMP/commercial010-assets/CLEAN_INPUT_CHECK.json"
          python scripts/check_commercial010_paper.py --root . --output "$RUNNER_TEMP/commercial010-assets/CLEAN_PAPER_CHECK.json"
          python run_commercial010.py --freeze-sha256 "$COMMERCIAL010_FREEZE_SHA256" --smoke --smoke-world qualified_differentiation --output "$RUNNER_TEMP/commercial010-assets/smoke-positive" --resource-ledger "$RUNNER_TEMP/commercial010-assets/smoke-positive-resources.json"
          python run_commercial010.py --freeze-sha256 "$COMMERCIAL010_FREEZE_SHA256" --smoke --smoke-world zero_demand --output "$RUNNER_TEMP/commercial010-assets/smoke-zero-demand" --resource-ledger "$RUNNER_TEMP/commercial010-assets/smoke-zero-demand-resources.json"
          python - <<'PY'
          import json, os, pathlib
          from commercial.ledger import audit
          root = pathlib.Path.cwd()
          assets = pathlib.Path(os.environ['RUNNER_TEMP'])/'commercial010-assets'
          freeze = json.loads((root/'campaign/commercial-010/SOURCE_FREEZE.json').read_bytes())
          manifest = json.loads((root/freeze['manifest']).read_bytes())
          checked = {}
          for name, should_sell in [('smoke-positive', True), ('smoke-zero-demand', False)]:
              receipt = json.loads((assets/name/'RECEIPT.json').read_bytes())
              result = json.loads((assets/name/'artifacts/RESULT.json').read_bytes())
              if receipt['state'] != 'complete' or result['scope'] != 'SIMULATED':
                  raise SystemExit('Incomplete or incorrectly scoped engineering replay.')
              if result['actual_collections'] != 0 or result['actual_profit'] is not None:
                  raise SystemExit('A simulated replay must not become observed commerce.')
              if result['seed'] != 1 or bool(result['paid_jobs']) != should_sell:
                  raise SystemExit('Exposed seed or positive/zero-demand control changed.')
              if not should_sell and result['conditional_simulated_go']:
                  raise SystemExit('Zero-demand control cannot qualify a commercial flywheel.')
              audit(result['ledger'], root=root, manifest=manifest,
                    expected_actions_sha256=result['ledger']['actions_sha256'])
              checked[name] = {'world': result['world'], 'seed': result['seed'],
                  'paid_jobs': result['paid_jobs'], 'conditional_simulated_go': result['conditional_simulated_go'],
                  'native_ledger_replayed': True, 'supervisor_state': receipt['state']}
          report = {'source_commit': os.environ['SOURCE_COMMIT'], 'scope': 'SIMULATED',
              'mode': 'EXPOSED_SEED_1_ENGINEERING_REPLAY', 'git_ancestry_absent': True,
              'fresh_confirmation': False, 'full_297_world_campaign_rerun': False, 'replays': checked}
          with (assets/'CLEAN_REPLAY_QUALIFICATION.json').open('x') as stream:
              json.dump(report, stream, indent=2); stream.write('\n')
          PY
      - name: Assemble readable editions, receipts and checksums
        run: |
          cp docs/commercial010/paper.pdf docs/commercial010/paper.tex docs/commercial010/REPORT.md docs/commercial010/index.html docs/commercial010/SOURCE_MANIFEST.json docs/commercial010/PDF_QA.json "$RUNNER_TEMP/commercial010-assets/"
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          assets = pathlib.Path(os.environ['RUNNER_TEMP'])/'commercial010-assets'
          with zipfile.ZipFile(assets/'CLEAN_REPLAY_RECEIPTS.zip', 'x', compression=zipfile.ZIP_DEFLATED) as archive:
              for name in ['smoke-positive', 'smoke-zero-demand']:
                  for path in sorted((assets/name).rglob('*')):
                      if path.is_file(): archive.write(path, path.relative_to(assets))
              for name in ['smoke-positive-resources.json', 'smoke-zero-demand-resources.json']:
                  archive.write(assets/name, name)
          with (assets/'SHA256SUMS.txt').open('x') as stream:
              for path in sorted(assets.iterdir()):
                  if path.is_file() and path.name != 'SHA256SUMS.txt' and path.suffix != '.lock':
                      stream.write(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          PY
      - name: Retain actual package and replay receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commercial010-source-evidence
          path: ${{ runner.temp }}/commercial010-assets
          if-no-files-found: warn
  publish:
    needs: [current-compatibility, qualify]
    # This immutable historical edition is already bound to this exact source.
    # New main sources retain its qualification job and use their own publisher.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha == '710203eb128f1d03842a84822ee05517c1791080'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: commercial010-source-evidence
          path: ${{ runner.temp }}/commercial010-release-assets
      - name: Require all existing workflows from this exact main push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, time
          repo, sha = os.environ['GH_REPO'], os.environ['GITHUB_SHA']
          required = ['campaign.yml', 'consequential007.yml', 'consequential009.yml']
          accepted = {}
          for attempt in range(60):
              accepted = {}
              for workflow in required:
                  endpoint = f'repos/{repo}/actions/workflows/{workflow}/runs?head_sha={sha}&event=push&branch=main&per_page=100'
                  data = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
                  matches = [r for r in data['workflow_runs'] if r['head_sha'] == sha
                      and r['event'] == 'push' and r['head_branch'] == 'main'
                      and r['path'] == '.github/workflows/'+workflow]
                  if not matches: continue
                  current = max(matches, key=lambda r: (r['run_number'], r.get('run_attempt', 1), r['id']))
                  if current['status'] == 'completed':
                      if current['conclusion'] != 'success':
                          raise SystemExit('Exact-main workflow failed; publication refused: '+workflow)
                      accepted[workflow] = {k: current[k] for k in ['id', 'head_sha', 'head_branch', 'event', 'path', 'conclusion', 'html_url']}
              if len(accepted) == len(required): break
              time.sleep(10)
          else:
              raise SystemExit('Exact-main workflows did not qualify within the bounded publication allowance.')
          report = {'source_commit': sha, 'required_event': 'push', 'required_branch': 'main',
              'own_qualification_run': int(os.environ['GITHUB_RUN_ID']), 'inherited_workflows': accepted}
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'commercial010-release-assets/RELEASE_GATE.json'
          with output.open('x') as stream: json.dump(report, stream, indent=2); stream.write('\n')
          PY
      - name: Verify distributed bytes and publish a new immutable experimental edition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, subprocess
          repo, sha = os.environ['GH_REPO'], os.environ['GITHUB_SHA']
          assets = pathlib.Path(os.environ['RUNNER_TEMP'])/'commercial010-release-assets'
          for row in (assets/'SHA256SUMS.txt').read_text().splitlines():
              expected, name = row.split('  ', 1)
              if pathlib.Path(name).name != name or hashlib.sha256((assets/name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Downloaded qualified artifact differs from its checksum: '+name)
          spec = importlib.util.spec_from_file_location('commercial010_package', 'scripts/package_commercial010.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          manifest = module.verify(assets/'AGI_ALPHA_Commercial010_source_evidence.zip')
          if manifest['source_commit'] != sha:
              raise SystemExit('Downloaded package is not the exact qualified main source.')
          def optional(endpoint):
              result = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
              if result.returncode:
                  if 'HTTP 404' in result.stderr: return None
                  raise SystemExit('Unable to verify existing release state; publication refused.')
              return json.loads(result.stdout)
          tag = 'commercial-flywheel-20261030-r1'
          ref = optional(f'repos/{repo}/git/ref/tags/{tag}')
          existing = optional(f'repos/{repo}/releases/tags/{tag}')
          if ref is not None and (ref['object']['type'] != 'commit' or ref['object']['sha'] != sha):
              raise SystemExit('Existing tag identifies different source; publication refused.')
          if existing is not None:
              if ref is None: raise SystemExit('Existing release has no verified source tag.')
              required_assets = {'AGI_ALPHA_Commercial010_source_evidence.zip', 'paper.pdf', 'paper.tex',
                  'REPORT.md', 'index.html', 'SOURCE_MANIFEST.json', 'PDF_QA.json', 'SHA256SUMS.txt',
                  'RELEASE_SHA256SUMS.txt', 'RELEASE_GATE.json', 'CLEAN_REPLAY_RECEIPTS.zip',
                  'CLEAN_REPLAY_QUALIFICATION.json'}
              if not required_assets <= {a['name'] for a in existing['assets']}:
                  raise SystemExit('Existing release is incomplete; retain its assets and refuse a false publication pass.')
              print('Matching immutable release already exists; assets retained unchanged.')
              raise SystemExit(0)
          if ref is None:
              subprocess.run(['gh', 'api', f'repos/{repo}/git/refs', '--method', 'POST',
                  '-f', f'ref=refs/tags/{tag}', '-f', f'sha={sha}'], check=True)
          ref = optional(f'repos/{repo}/git/ref/tags/{tag}')
          if ref is None or ref['object']['type'] != 'commit' or ref['object']['sha'] != sha:
              raise SystemExit('Tag changed before publication; refused.')
          with (assets/'RELEASE_SHA256SUMS.txt').open('x') as stream:
              for path in sorted(assets.iterdir()):
                  if path.is_file() and path.name != 'RELEASE_SHA256SUMS.txt' and path.suffix != '.lock':
                      stream.write(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          files = sorted(str(p) for p in assets.iterdir() if p.is_file() and p.suffix != '.lock')
          subprocess.run(['gh', 'release', 'create', tag, *files, '--verify-tag', '--target', sha,
              '--prerelease', '--title', 'AGI ALPHA: autonomous commercial 010 conditional simulated results',
              '--notes-file', 'campaign/commercial-010/RELEASE_NOTES.md'], check=True)
          PY
      - name: Download and authenticate the actual released source archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download commercial-flywheel-20261030-r1 --pattern AGI_ALPHA_Commercial010_source_evidence.zip --dir "$RUNNER_TEMP/commercial010-published-download"
          python - <<'PY'
          import hashlib, importlib.util, json, os, pathlib
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          received = temporary/'commercial010-published-download/AGI_ALPHA_Commercial010_source_evidence.zip'
          qualified = temporary/'commercial010-release-assets/AGI_ALPHA_Commercial010_source_evidence.zip'
          digest = hashlib.sha256(received.read_bytes()).hexdigest()
          if digest != hashlib.sha256(qualified.read_bytes()).hexdigest():
              raise SystemExit('Actual released archive differs from qualified bytes; release retained for diagnosis.')
          spec = importlib.util.spec_from_file_location('commercial010_package', 'scripts/package_commercial010.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          manifest = module.verify(received)
          if manifest['source_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Actual released source identity differs from main push.')
          report = {'source_commit': manifest['source_commit'], 'archive_sha256': digest,
              'actual_release_download': True, 'qualified_bytes_identical': True,
              'scope': 'Published artifact identity; the identical bytes already passed clean standalone replay.'}
          output = temporary/'commercial010-release-assets/PUBLISHED_ARCHIVE_CHECK.json'
          with output.open('x') as stream: json.dump(report, stream, indent=2); stream.write('\n')
          PY
      - name: Preserve source-matched publication gate and downloaded receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commercial010-release-qualification
          path: ${{ runner.temp }}/commercial010-release-assets
          if-no-files-found: warn
