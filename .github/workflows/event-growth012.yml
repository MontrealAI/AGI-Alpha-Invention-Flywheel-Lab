name: Event growth 012 qualification
on:
  pull_request:
    paths:
      - 'enterprise/*012.py'
      - 'commercial/single_writer.py'
      - 'commercial/tape_lease.py'
      - 'verification/growth012.py'
      - 'tests/*growth012*'
      - 'tests/test_tape_writer_lease.py'
      - 'tests/test_commercial010_owned_exchange.py'
      - 'run_growth012.py'
      - '.github/workflows/event-growth012.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-growth012-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-event-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r requirements-commercial010.txt
      - run: python3 -m unittest discover -s tests -p 'test_growth012*.py' -v
      - run: python3 -m unittest discover -s tests -p test_tape_writer_lease.py -v
      - run: python3 -m unittest discover -s tests -p test_commercial010_owned_exchange.py -v
      - name: Clean no-Git engineering execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/growth012-clean
          git archive HEAD | tar -x -C /tmp/growth012-clean
          cd /tmp/growth012-clean
          test ! -e .git
          python3 run_growth012.py --output /tmp/growth012-engineering --smoke
