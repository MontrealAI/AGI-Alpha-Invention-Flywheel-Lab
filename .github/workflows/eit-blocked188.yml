name: EIT188 pinned sixteen-column held-out prediction versus nuisance
on:
  push:
    branches: [experiment/eit188-blocked-predictive-generalization-20261119]
    paths:
      - 'campaign/eit-blocked-prediction188/**'
      - 'research/eit_blocked_prediction188/**'
      - 'tests/test_eit_blocked_prediction188.py'
      - '.github/workflows/eit-blocked188.yml'
  pull_request:
    paths:
      - 'campaign/eit-blocked-prediction188/**'
      - 'research/eit_blocked_prediction188/**'
      - 'tests/test_eit_blocked_prediction188.py'
      - '.github/workflows/eit-blocked188.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-offline-analytic-and-refusal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed public wheels
        run: python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Execute frozen eight offline tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_eit_blocked_prediction188
  pinned-original-source-sixteen-fold-execution:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed public wheels
        run: python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Freeze actual head; evaluate all arms once on original data
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_eit_blocked_prediction188
          /usr/bin/time -f 'wall_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' -o "$RUNNER_TEMP/EIT188_RESOURCES.txt" env OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python -B -m research.eit_blocked_prediction188.compare --out "$RUNNER_TEMP/EIT188_ALL_FOLDS.json"
      - name: Retain only compact result and resource receipt, no source archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit188-registered-blocked-prediction-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EIT188_ALL_FOLDS.json
            ${{ runner.temp }}/EIT188_RESOURCES.txt
          if-no-files-found: warn
          retention-days: 14
