name: Proof-led partner outcome 043
on:
  pull_request:
    paths:
      - 'commercial/portable_offer.py'
      - 'commercial/partner_offer.py'
      - 'commercial/service.py'
      - 'commercial/service_verifier.py'
      - 'tests/test_portable_offer.py'
      - 'tests/test_partner_offer043.py'
      - 'examples/portable_offer/**'
      - '.github/workflows/proof-led-partner043.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-proof-partner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-bound portable proof and bilateral incentives
        run: |
          python3 -m unittest discover -s tests -p test_portable_offer.py -v
          python3 -m unittest discover -s tests -p test_partner_offer043.py -v
