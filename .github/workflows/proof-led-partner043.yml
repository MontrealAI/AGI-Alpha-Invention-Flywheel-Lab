name: Proof-led partner outcome 043
on:
  pull_request:
    paths:
      - 'commercial/portable_offer.py'
      - 'commercial/partner_offer.py'
      - 'commercial/service.py'
      - 'commercial/service_verifier.py'
      - 'tests/test_portable_offer.py'
      - 'tests/test_partner_offer043.py'
      - 'examples/portable_offer/**'
      - '.github/workflows/proof-led-partner043.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-proof-partner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact commercial dependencies
        run: python3 -m pip install -r requirements-commercial010.txt
      - name: Source-bound portable proof and bilateral incentives
        run: |
          python3 -m unittest discover -s tests -p test_portable_offer.py -v
          python3 -m unittest discover -s tests -p test_partner_offer043.py -v
      - name: Reproduce product from canonical frozen enterprise source
        run: |
          python3 -m connected_enterprise register \
            --config campaign/overnight-022/OPERATOR_INPUT.json \
            --output "$RUNNER_TEMP/proof043-frozen"
          cd "$RUNNER_TEMP/proof043-frozen/source"
          python3 -m commercial.portable_offer build \
            --input examples/portable_offer/sample_order.json \
            --output "$RUNNER_TEMP/proof043-buyer" --price-cents 59900
          python3 -m commercial.partner_offer build \
            --proof-dir "$RUNNER_TEMP/proof043-buyer" \
            --output "$RUNNER_TEMP/proof043-partner" \
            --distributor-cost 12000 --distributor-min-gain 5000 \
            --provider-complete-cost 10000 --provider-min-gain 15000 \
            --activation-cost 1000 --provider-loss-cost 6500 \
            --protected-cash 30000 --opening-cash 100000
          PIN=$(python3 -c 'import hashlib, pathlib,sys;print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' \
            "$RUNNER_TEMP/proof043-partner/PARTNER_OFFER.json")
          python3 -m commercial.partner_offer verify \
            --proof-dir "$RUNNER_TEMP/proof043-buyer" \
            --package "$RUNNER_TEMP/proof043-partner" \
            --expected-sha256 "$PIN"
      - name: Publish compact public synthetic outcome and terms
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-partner043-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/proof043-buyer/ORDER.json
            ${{ runner.temp }}/proof043-buyer/OFFER.json
            ${{ runner.temp }}/proof043-buyer/VERDICT.json
            ${{ runner.temp }}/proof043-buyer/MANIFEST.json
            ${{ runner.temp }}/proof043-buyer/DELIVERY/reconciliation.json
            ${{ runner.temp }}/proof043-buyer/DELIVERY/exceptions.csv
            ${{ runner.temp }}/proof043-partner/PARTNER_OFFER.json
          if-no-files-found: warn
          retention-days: 7
