name: P0-196 source-manifest negative witness
on:
  push:
    branches:
      - review/p0-manifest-source-boundary196-20261120
    paths:
      - campaign/p0-source-manifest196/**
      - .github/workflows/p0-source-manifest196.yml
  pull_request:
    paths:
      - campaign/p0-source-manifest196/**
      - .github/workflows/p0-source-manifest196.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-negative-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start platform execution clock
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout exact public research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned, public, unmerged historical owner Git object (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ced6c1cb004887dcdafaea59a2976020be649f8e
          git cat-file -t ced6c1cb004887dcdafaea59a2976020be649f8e | grep -Fx commit
      - name: Fixed offline adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s campaign/p0-source-manifest196 -p "test_manifest_witness.py"
      - name: Produce pinned negative/control receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0-196"
          /usr/bin/time -v -o "$RUNNER_TEMP/p0-196/RESOURCE.txt" \
            python3 campaign/p0-source-manifest196/manifest_witness.py \
            --output "$RUNNER_TEMP/p0-196/RESULT.json"
          python3 - "$RUNNER_TEMP/p0-196/RESULT.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["all_frozen_negative_checks_met"]
          assert r["verdict"] == "SYNTHETIC_MANIFEST_UNDERBINDING_WITNESS_ONLY"
          assert not r["native_account_opened"]
          assert r["actual_profit_usd"] is None
          print("SOURCE_ONLY_NEGATIVE_WITNESS_ACCEPTED")
          PY
          sha256sum "$RUNNER_TEMP/p0-196/RESULT.json" "$RUNNER_TEMP/p0-196/RESOURCE.txt" \
            > "$RUNNER_TEMP/p0-196/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/p0-196/SHA256SUMS.txt"
      - name: Publish compact source-only evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-manifest196-negative-evidence
          path: ${{ runner.temp }}/p0-196/
          if-no-files-found: warn
          retention-days: 30
