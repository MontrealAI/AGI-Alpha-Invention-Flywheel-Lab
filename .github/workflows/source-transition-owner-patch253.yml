name: P0-253 owner-pinned historical signer repair proposal
on:
  pull_request:
    paths:
      - 'research/source_transition_trust246/PATCH253_PROTOCOL.md'
      - 'research/source_transition_trust246/owner_patch253.py'
      - 'research/source_transition_trust246/test_owner_patch253.py'
      - '.github/workflows/source-transition-owner-patch253.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0253-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  source-matched-owner-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout exact PR head without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve exact historical owner sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --fail --location --silent --show-error --max-time 60 --retry 0 \
            'https://raw.githubusercontent.com/MontrealAI/AGI-Alpha-Invention-Flywheel-Lab/ced6c1cb004887dcdafaea59a2976020be649f8e/connected_enterprise/upgrades.py' \
            -o "$RUNNER_TEMP/p0253-upgrades.py"
          curl --fail --location --silent --show-error --max-time 60 --retry 0 \
            'https://raw.githubusercontent.com/MontrealAI/AGI-Alpha-Invention-Flywheel-Lab/ced6c1cb004887dcdafaea59a2976020be649f8e/connected_enterprise/transition_evidence.py' \
            -o "$RUNNER_TEMP/p0253-codec.py"
      - name: Run nine frozen key-free regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0253-home"
          cd research/source_transition_trust246
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p0253-home" \
            PINNED_OWNER_UPGRADES="$RUNNER_TEMP/p0253-upgrades.py" \
            PINNED_OWNER_SOURCE="$RUNNER_TEMP/p0253-codec.py" \
            PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v test_owner_patch253.py
      - name: Write bounded nonsecret exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0253-receipt"
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root=Path('research/source_transition_trust246')
          sys.path.insert(0,str(root))
          from owner_patch253 import patch_historical_owner, git_blob_id, OWNER_UPGRADES_BLOB
          original=(Path(os.environ['RUNNER_TEMP'])/'p0253-upgrades.py').read_bytes()
          codec=(Path(os.environ['RUNNER_TEMP'])/'p0253-codec.py').read_bytes()
          assert git_blob_id(original)==OWNER_UPGRADES_BLOB
          assert git_blob_id(codec)=='2397091ef8e1960ad13950693d5b3cd04e2ff7c5'
          candidate=patch_historical_owner(original)
          files=['PATCH253_PROTOCOL.md','owner_patch253.py','test_owner_patch253.py']
          receipt={
            'schema':'agi-alpha/p0-253-owner-pinned-source-proposal/v1',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'protocol_commit':'78082214f7c2c49128df9ef61b34058aa07b3964',
            'historical_upgrades_git_blob':OWNER_UPGRADES_BLOB,
            'historical_codec_git_blob':'2397091ef8e1960ad13950693d5b3cd04e2ff7c5',
            'candidate_patch_sha256':hashlib.sha256(candidate).hexdigest(),
            'research_sha256':{f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files},
            'registered_tests':9,'registered_tests_exit_zero':True,
            'original_financial_source_or_account_modified':False,
            'keys_accessed':False,'successor_code_executed':False,
            'owner_patch_applied':False,'actual_legacy_migration_qualified':False,
            'protected_release_or_paid_commerce_qualified':False,
            'whole_episode_billing_usd':None
          }
          (Path(os.environ['RUNNER_TEMP'])/'p0253-receipt'/'RESULT.json').write_text(
            json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload receipt (no private state or keys)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0253-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0253-receipt/RESULT.json
          if-no-files-found: error
          retention-days: 7
