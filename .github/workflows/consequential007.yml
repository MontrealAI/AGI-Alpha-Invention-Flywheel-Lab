name: Consequential campaign 007 reproduction
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reproduce:
    if: github.head_ref != 'verify/adaptive012-public-package'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cycle007.txt
      - run: python -m pip install -r requirements-cycle007.txt
      - name: Reproduce the exact exposed campaign, including free chemical tools
        run: |
          freeze_sha256=$(sha256sum campaign/cycle-007/REPRODUCTION_FREEZE.json | cut -d ' ' -f 1)
          python run_cycle007.py --expected-freeze-sha256 "$freeze_sha256" --output "$RUNNER_TEMP/cycle007-reproduction" --with-compatibility --chemistry-tools-dir "$RUNNER_TEMP/chemical-tools" --download-tools
          python scripts/check_cycle007_paper.py --output "$RUNNER_TEMP/cycle007-paper-check.json"
      - name: Preserve incomplete and completed reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consequential007-reproduction
          path: |
            ${{ runner.temp }}/cycle007-reproduction
            ${{ runner.temp }}/cycle007-paper-check.json
            !${{ runner.temp }}/cycle007-reproduction/compatibility-envs/**
          if-no-files-found: error
  publish:
    needs: [reproduce]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve existing editions and require the unchanged qualification workflow
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=consequential-search-20261030-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'existing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Tag exists without release; refuse reuse.' >&2
            exit 1
          fi
          echo 'existing=false' >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os, subprocess, time
          sha, repo = os.environ['GITHUB_SHA'], os.environ['GH_REPO']
          for attempt in range(60):
              runs = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/campaign.yml/runs?head_sha={sha}&event=push'], text=True))['workflow_runs']
              exact = [r for r in runs if r['head_sha'] == sha and r['event'] == 'push']
              if exact:
                  latest = max(exact, key=lambda r:r['id'])
                  if latest['status'] == 'completed':
                      if latest['conclusion'] != 'success':
                          raise SystemExit('Existing qualification did not pass; publication refused.')
                      break
              time.sleep(10)
          else:
              raise SystemExit('Exact-main existing qualification did not finish within release allowance.')
          PY
      - if: steps.release.outputs.existing == 'false'
        run: python -m pip install -r requirements-cycle007.txt
      - name: Build and reproduce ordinary and validated clean extractions
        if: steps.release.outputs.existing == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/cycle007-assets"
          archive="$RUNNER_TEMP/cycle007-assets/AGI_ALPHA_Consequential_007_source_evidence.zip"
          python -m flywheel.archive_v2 build . "$archive"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          python verification/cycle007_archive_check.py --archive "$archive" --expected-sha256 "$digest" --output "$RUNNER_TEMP/cycle007-archive-check" --chemistry-tools-dir "$RUNNER_TEMP/chemical-tools" --download-tools
          cp docs/research/cycle-007.md docs/research/cycle-007.tex docs/research/cycle-007.pdf docs/research/cycle-007.html docs/research/cycle-007.inputs.json docs/research/cycle-007.build.json docs/research/PDF_QA_007.json "$RUNNER_TEMP/cycle007-assets/"
          cp "$RUNNER_TEMP/cycle007-archive-check/REPORT.json" "$RUNNER_TEMP/cycle007-assets/ARCHIVE_QUALIFICATION.json"
          python - <<'PY'
          import os, pathlib, zipfile
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          evidence = base/'cycle007-archive-check'
          with zipfile.ZipFile(base/'cycle007-assets/CLEAN_EXTRACTION_EVIDENCE.zip', 'x', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(evidence.rglob('*')):
                  relative = path.relative_to(evidence)
                  if path.is_file() and not set(relative.parts) & {'validated-source','ordinary-extraction','compatibility-envs','__pycache__'}:
                      archive.write(path, 'cycle007-archive-check/'+relative.as_posix())
          PY
          (cd "$RUNNER_TEMP/cycle007-assets" && sha256sum * > SHA256SUMS.txt)
      - name: Publish a new experimental checkpoint without replacing historical evidence
        if: steps.release.outputs.existing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create consequential-search-20261030-r1 "$RUNNER_TEMP/cycle007-assets/"* --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA consequential search: no enabling invention qualified' --notes-file campaign/cycle-007/RELEASE_NOTES.md
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consequential007-release-qualification
          path: |
            ${{ runner.temp }}/cycle007-assets
            ${{ runner.temp }}/cycle007-archive-check
            !${{ runner.temp }}/cycle007-archive-check/validated-source/**
            !${{ runner.temp }}/cycle007-archive-check/ordinary-extraction/**
            !${{ runner.temp }}/cycle007-archive-check/**/compatibility-envs/**
          if-no-files-found: warn
