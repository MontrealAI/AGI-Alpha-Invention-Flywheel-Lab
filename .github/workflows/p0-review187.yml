name: P0-187 frozen acceptance-race falsification (review only)
on:
  pull_request:
    paths:
      - 'campaign/p0-review187/**'
      - 'tests/test_transition_cache187.py'
      - '.github/workflows/p0-review187.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-review187-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cached-acceptance-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report executor start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze-source verification, original controls, one new falsifier
        run: |
          git rev-parse HEAD
          sha256sum campaign/p0-review187/PROTOCOL.md tests/test_transition_cache187.py
          python -B -m unittest -v tests.test_transition_store184 tests.test_transition_cache186 tests.test_transition_cache187
