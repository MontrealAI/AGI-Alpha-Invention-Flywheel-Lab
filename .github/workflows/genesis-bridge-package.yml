name: Genesis bridge standalone package qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      archive_sha: ${{ steps.build.outputs.archive_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_sha: ${{ steps.build.outputs.source_sha }}
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Guard tests and exact source package
        id: build
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python -B -m unittest discover -s tests -p 'test_genesis_bridge_*.py' -v
          python -B scripts/release_genesis_bridge.py build --source "$PWD" --out "$RUNNER_TEMP/bridge-assets" --source-commit "$EXPECTED_SOURCE"
          archive_sha=$(sha256sum "$RUNNER_TEMP/bridge-assets/genesis-bridge-source.zip" | cut -d' ' -f1)
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$EXPECTED_SOURCE" >> "$GITHUB_OUTPUT"
          python -B scripts/release_genesis_bridge.py qualify --archive "$RUNNER_TEMP/bridge-assets/genesis-bridge-source.zip" --out "$RUNNER_TEMP/bridge-package-qualification" --source-commit "$EXPECTED_SOURCE" --expected-sha "$archive_sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: genesis-bridge-package-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bridge-assets
          if-no-files-found: error
  downloaded-package:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/downloaded-bridge-package
          merge-multiple: true
      - name: Execute only the actual downloaded package
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          ARCHIVE_SHA: ${{ needs.package.outputs.archive_sha }}
        run: python -B scripts/release_genesis_bridge.py qualify --archive "$RUNNER_TEMP/downloaded-bridge-package/genesis-bridge-source.zip" --out "$RUNNER_TEMP/downloaded-bridge-qualification" --source-commit "$SOURCE_SHA" --expected-sha "$ARCHIVE_SHA"
      - name: Retain compact downloaded-package receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-bridge-downloaded-package-${{ needs.package.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded-bridge-qualification/QUALIFICATION.json
          if-no-files-found: error
