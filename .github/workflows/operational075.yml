name: Operational075 immutable original-client replay
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-client-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source and broker boundary checks
        run: |
          python -m operational075.run check-source
          python -m unittest discover -s tests -p 'test_operational075_broker.py' -v
      - name: Fetch exact public task and offline client bytes
        run: python -m operational075.source fetch --output "$RUNNER_TEMP/operational075-source"
      - name: Replay every original locked submission without policy retuning
        run: |
          cp -R operational075/evidence "$RUNNER_TEMP/operational075-evidence"
          python -m operational075.run audit --source "$RUNNER_TEMP/operational075-source" --output "$RUNNER_TEMP/operational075-evidence"
