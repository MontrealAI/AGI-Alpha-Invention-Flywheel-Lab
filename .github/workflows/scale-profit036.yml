name: AGI ALPHA — 100k to billion trailing-year profit conditional scale qualification
on:
  pull_request:
    paths:
      - 'enterprise/scale.py'
      - 'connected_enterprise/scale_profit036.py'
      - 'scripts/run_scale_profit036.py'
      - 'tests/test_scale_profit036.py'
      - 'campaign/scale-profit-036/**'
      - '.github/workflows/scale-profit036.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scale-profit036-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-source-native-and-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install already pinned native finance dependencies
        run: python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Original aggregate invariants and 60-month profit semantics
        run: |
          python -m unittest discover -s tests -p 'test_connected_scale.py' -v
          python -m unittest discover -s tests -p 'test_scale_profit036.py' -v
      - name: Source-bound exact native financial execution and independent audit, then all frozen scenario projections
        run: python scripts/run_scale_profit036.py --output "$RUNNER_TEMP/agi-alpha-scale-profit036"
      - name: Reject claims not supported by native execution or registered negative cases
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'agi-alpha-scale-profit036'/'public'
          p=json.loads((root/'RESULT.json').read_text());a=p['source_anchored_native'];s=p['summary']
          assert p['economic_success']=='NOT_ESTABLISHED_CONDITIONAL_PROJECTIONS_ONLY'
          assert p['native_annual_profit']=='NOT_ESTABLISHED' and a['native_profit_target_attained'] is False
          assert p['opening_cash_cents']==10_000_000 and p['additional_capital_injected_cents']==0
          assert a['actual_customers']==0 and a['actual_collections_cents']==0
          assert len(a['worlds'])==2 and all(w['scope']=='EXECUTED_14_DAY_NATIVE_SIMULATION' for w in a['worlds'])
          assert all(v['worlds']==4 for v in s.values()) and len(s)==5
          assert s['partner_distribution']['first_attainment_months']==[52,53,52,53]
          assert s['partner_disrupted']['horizon_completed']==0 and s['partner_disrupted']['conditional_profit_target_crossings']==0
          assert s['partner_no_referrals']['conditional_profit_target_crossings']==0
          assert sum(p.name.endswith('.json') for p in root.iterdir())==4
          assert (root/'RESULT.json').stat().st_size < 2_000_000
          PY
      - name: Upload only compact public evidence, never native account keys/history
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scale-profit036-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/agi-alpha-scale-profit036/public/RESULT.json
            ${{ runner.temp }}/agi-alpha-scale-profit036/public/SUMMARY.json
            ${{ runner.temp }}/agi-alpha-scale-profit036/public/ANCHOR.json
            ${{ runner.temp }}/agi-alpha-scale-profit036/public/RUN_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
