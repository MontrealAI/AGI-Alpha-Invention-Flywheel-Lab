name: WORKLOAD Omega shadow evaluator
on:
  pull_request:
    paths:
      - 'commercial/workload_omega/**'
      - 'tests/test_workload_omega.py'
      - '.github/workflows/workload-omega.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Execute adversarial offline controls
        run: python3 -m unittest discover -s tests -p 'test_workload_omega.py' -v
      - name: Reproduce synthetic shadow receipt
        run: |
          python3 -m commercial.workload_omega.engine commercial/workload_omega/sample.json --output "$RUNNER_TEMP/workload-omega-result.json"
          python3 - "$RUNNER_TEMP/workload-omega-result.json" <<'PY'
          import json, sys
          x = json.load(open(sys.argv[1], encoding='utf-8'))
          assert x['decision'] == 'ENGINEERING_ONLY'
          assert x['economics']['status'] == 'MODEL_ONLY_POSITIVE'
          assert x['actual_settled_revenue_microusd'] == 0
          assert x['first_dollar_proven'] is False
          assert x['live_deployment_authorized'] is False
          assert x['second_distinct_asset_proven'] is False
          print('Synthetic-only receipt passed; no revenue or deployment claims')
          PY
