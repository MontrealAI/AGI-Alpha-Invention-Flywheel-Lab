name: Native funded CSV adapter 028
on:
  pull_request:
    paths:
      - 'connected_enterprise/funded_csv_adapter028.py'
      - 'connected_enterprise/native_csv_manifest028.py'
      - 'connected_enterprise/runner.py'
      - 'mechanism_harness/**'
      - 'scripts/run_funded_csv028.py'
      - 'tests/test_funded_csv028.py'
      - '.github/workflows/funded-csv028.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-native-manifest-service:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Exact source dependency and native funding regressions
        run: |
          python -m unittest discover -s tests -p 'test_mechanism_harness_026.py' -v
          python -m unittest discover -s tests -p 'test_mechanism_harness_027.py' -v
          python -m unittest discover -s tests -p 'test_common_cost026.py' -v
          python -m unittest discover -s tests -p 'test_funded_csv028.py' -v
      - name: Actual matched native-manifest service executions
        run: |
          python scripts/run_funded_csv028.py --output "$RUNNER_TEMP/funded-csv028.json"
          python - "$RUNNER_TEMP/funded-csv028.json" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);assert p.stat().st_size<2000000
          r=json.loads(p.read_text());assert len(r['rows'])==12 and sum(x['accepted'] for x in r['rows'])==8
          assert r['canonical_engine_adoption'] is False and r['actual_profit'] is None
          for job in {x['job_id'] for x in r['rows']}:
              g=[x for x in r['rows'] if x['job_id']==job]
              assert len({(x['accepted'],x['artifact_sha256']) for x in g})==1
              for x in g:
                  assert x['native_audit_accepted']
                  assert x['native_cost_microUSD']==x['proposal_microUSD']+x['production_microUSD']+x['verification_microUSD']
                  assert x['native_manifest_qualification']['accepted'] if x['accepted'] else x['independent_refusal']['verified']
          print('Matched outputs, native charges and exact manifest/refusal checks passed; no enterprise profit claim')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: funded-csv028-compact-public-summary
          path: ${{ runner.temp }}/funded-csv028.json
          if-no-files-found: error
          retention-days: 7
