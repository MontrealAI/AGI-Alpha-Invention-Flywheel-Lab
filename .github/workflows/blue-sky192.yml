name: Blue Sky 192 within-world target scientific regression
on:
  pull_request:
    paths:
      - 'campaign/blue-sky-192/**'
      - 'tests/test_blue_sky192.py'
      - 'research/blue_sky191/transfer_identifiability.py'
      - '.github/workflows/blue-sky192.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blue-sky192-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  target-semantics-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record actual job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen-protocol and original exposed-source identities
        shell: bash
        run: |
          git rev-parse HEAD
          test "$(git hash-object campaign/blue-sky-192/PROTOCOL.md)" = "$(git rev-parse cfcdbdfabed7a1b1cc514b629b9259f3f11af8a2:campaign/blue-sky-192/PROTOCOL.md)"
          sha256sum research/blue_sky064/public_calibration.json campaign/blue-sky-064/friction-probe/MIXED_REGISTRATION.json
          test "$(sha256sum research/blue_sky064/public_calibration.json | cut -d' ' -f1)" = "7aedc8e4c3e7181e381055d3815378b3f5bfe7b5b9386fd5748803d495ab1ced"
          test "$(sha256sum campaign/blue-sky-064/friction-probe/MIXED_REGISTRATION.json | cut -d' ' -f1)" = "6eece869fb53ed7d6977a88b01ce0ba78af6a5d6931aea9df99c51b4c6f348fa"
      - name: Unchanged 191 and new 192 adversarial scientific tests
        run: python3 -B -m unittest -v tests.test_blue_sky191 tests.test_blue_sky192
      - name: Create compact source-pinned research result only after tests pass
        run: |
          python3 -B -m research.blue_sky191.transfer_identifiability --output "$RUNNER_TEMP/BLUE_SKY192_RESULT.json"
          python3 -B - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'BLUE_SKY192_RESULT.json'
          result=json.loads(p.read_text())
          assert result['synthetic_indistinguishable_worlds']['within_world_target']['world1']['improvement']=='1/12'
          assert result['physical_instrument_qualified'] is False and result['real_buyers_or_revenue'] is False
          print(json.dumps({'scope':'synthetic_only','decision':result['decision'],'within_world':result['synthetic_indistinguishable_worlds']['within_world_target']},sort_keys=True))
          PY
      - name: Preserve compact result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blue-sky192-research-${{ github.run_id }}
          path: ${{ runner.temp }}/BLUE_SKY192_RESULT.json
          if-no-files-found: warn
          retention-days: 7
