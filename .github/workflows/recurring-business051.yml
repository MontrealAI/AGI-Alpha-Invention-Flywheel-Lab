name: Native recurring business 051 annual comparison
on:
  pull_request:
    paths:
      - 'connected_enterprise/buyer_income.py'
      - 'connected_enterprise/public_budget_gate051.py'
      - 'connected_enterprise/recurring_business051.py'
      - 'tests/test_connected_recurring_income051.py'
      - '.github/workflows/recurring-business051.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recurring051-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  recurring:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [central_year, strong_rival]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Independent budget, acceptance, finance and registration regressions
        run: python -m unittest tests.test_connected_recurring_income051 tests.test_connected_billion036 tests.test_connected_finance -v
      - name: Execute both fixed policies without changing economics for success
        shell: bash
        run: |
          set -euo pipefail
          for arm in ordinary public_budget_screen; do
            python -m connected_enterprise.recurring_business051 run --case '${{ matrix.case }}' --arm "$arm" --output "$RUNNER_TEMP/recurring051-$arm" --max-events 2500
          done
      - name: Independently rederive both native histories and the policy comparison
        shell: bash
        run: |
          set -euo pipefail
          for arm in ordinary public_budget_screen; do
            python -m connected_enterprise.recurring_business051 verify --output "$RUNNER_TEMP/recurring051-$arm"
          done
          python -m connected_enterprise.recurring_business051 compare --control "$RUNNER_TEMP/recurring051-ordinary" --candidate "$RUNNER_TEMP/recurring051-public_budget_screen" --report "$RUNNER_TEMP/recurring051-COMPARISON.json"
      - name: Keep only sanitized public operating summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recurring051-public-${{ matrix.case }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/recurring051-COMPARISON.json
            ${{ runner.temp }}/recurring051-ordinary/public/SUMMARY.json
            ${{ runner.temp }}/recurring051-public_budget_screen/public/SUMMARY.json
          if-no-files-found: warn
          retention-days: 7
