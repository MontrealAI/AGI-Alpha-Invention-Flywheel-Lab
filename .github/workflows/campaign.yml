name: Bounded campaign qualification
on:
  pull_request:
  push:
    branches: [main, campaign/grid-screen-cycle-1]
permissions:
  contents: read
jobs:
  qualify:
    if: github.head_ref != 'verify/adaptive012-public-package'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install -r requirements-cycle004.txt -r requirements-perturb006.txt
      - name: Source-matched tests and actual connected replay
        run: |
          python -m unittest discover -s benchmarks -p 'test_*.py' -v
          python -m unittest discover -s portfolio25 -p 'test_*.py' -v
          python -m unittest discover -s tests -v
          python -m unittest discover -s verification -v
          python -m flywheel.legacy --root . --output "$RUNNER_TEMP/frozen-cycle-001"
          python "$RUNNER_TEMP/frozen-cycle-001/reproduce.py" --output "$RUNNER_TEMP/campaign-replay"
          python "$RUNNER_TEMP/frozen-cycle-001/verification/probe_runner_identity.py" --root "$RUNNER_TEMP/frozen-cycle-001" --output "$RUNNER_TEMP/identity-probe"
          python "$RUNNER_TEMP/frozen-cycle-001/verification/probe_added_source.py" --root "$RUNNER_TEMP/frozen-cycle-001" --output "$RUNNER_TEMP/added-source-probe"
          python "$RUNNER_TEMP/frozen-cycle-001/verification/probe_worker_bounds.py" --root "$RUNNER_TEMP/frozen-cycle-001" --output "$RUNNER_TEMP/bounds-probe"
          python "$RUNNER_TEMP/frozen-cycle-001/verification/check_edition.py"
          python -m flywheel.archive_v2 cycle004 . "$RUNNER_TEMP/frozen-cycle-004"
          python - "$RUNNER_TEMP/frozen-cycle-004" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {
              'cycle004_probe_runner.py': '19a9f28299cae405e6ca4e313fed5558972f187ef2e892d2af8806a22b0aee07',
              'cycle004_completion.py': 'c70d977f7c85b8e0876347f5d95c5d93e767ae5bef764ffbe1aa24db0c538a65',
              'cycle004_active_interrupt.py': '9fa998e8385a9019eadbf83f079cf06174f04ea8f8aad3d08c5a6101dd2e4c4a',
              'cycle004_fresh.py': '04d12029bf805a09469b51958cab02e039c65cad8692508fa62ff18ff90508b4',
          }
          for name, digest in expected.items():
              source = pathlib.Path('verification') / name
              raw = source.read_bytes()
              if source.is_symlink() or hashlib.sha256(raw).hexdigest() != digest:
                  raise ValueError('HISTORICAL_VERIFIER_IDENTITY_MISMATCH ' + name)
              with (root / 'verification' / name).open('xb') as stream:
                  stream.write(raw)
          PY
          python "$RUNNER_TEMP/frozen-cycle-004/run_cycle.py" --output "$RUNNER_TEMP/connected-cycle-004"
          python "$RUNNER_TEMP/frozen-cycle-004/verification/cycle004_probe_runner.py" --runner "$RUNNER_TEMP/frozen-cycle-004/run_cycle.py" --output "$RUNNER_TEMP/cycle004-initialization"
          python "$RUNNER_TEMP/frozen-cycle-004/verification/cycle004_completion.py" --root "$RUNNER_TEMP/frozen-cycle-004" --output "$RUNNER_TEMP/cycle004-completion"
          python verification/cycle006_active_interrupt.py --root "$RUNNER_TEMP/frozen-cycle-004" --output "$RUNNER_TEMP/cycle006-active-interruption-kernel-v3"
          python verification/cycle006_interruption_race.py --root "$RUNNER_TEMP/frozen-cycle-004" --original-verifier "$RUNNER_TEMP/frozen-cycle-004/verification/cycle004_active_interrupt.py" --output "$RUNNER_TEMP/cycle006-original-verifier-scheduling-regression"
          python "$RUNNER_TEMP/frozen-cycle-004/verification/cycle004_fresh.py" --output "$RUNNER_TEMP/cycle004-exposed-regression"
          (cd "$RUNNER_TEMP/frozen-cycle-004" && python -m flywheel.metabolic_probe --output "$RUNNER_TEMP/cycle004-metabolic-replay")
          python -m flywheel.baseline005 --root . --output "$RUNNER_TEMP/frozen-cycle-005"
          python "$RUNNER_TEMP/frozen-cycle-005/run_completion.py" --output "$RUNNER_TEMP/mechanism-completion-005"
          python "$RUNNER_TEMP/frozen-cycle-005/verification/cycle005_wholepath.py" --root "$RUNNER_TEMP/frozen-cycle-005" --output "$RUNNER_TEMP/cycle005-wholepath"
          python "$RUNNER_TEMP/frozen-cycle-005/verification/cycle005_p1_regression.py" --root "$RUNNER_TEMP/frozen-cycle-005" --output "$RUNNER_TEMP/cycle005-p1-regression"
          python -m flywheel.reproduction006 --root . --output "$RUNNER_TEMP/frozen-cycle-006"
          python "$RUNNER_TEMP/frozen-cycle-006/run_cycle006.py" --output "$RUNNER_TEMP/consequential-cycle-006"
          python scripts/check_cycle006_paper.py --output "$RUNNER_TEMP/cycle006-paper-identity.json"
      - name: Retain executed qualification evidence including incomplete runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected-qualification-evidence
          path: |
            ${{ runner.temp }}/campaign-replay
            ${{ runner.temp }}/identity-probe
            ${{ runner.temp }}/added-source-probe
            ${{ runner.temp }}/bounds-probe
            ${{ runner.temp }}/connected-cycle-004
            ${{ runner.temp }}/cycle004-*
            ${{ runner.temp }}/cycle006-*
            ${{ runner.temp }}/mechanism-completion-005
            ${{ runner.temp }}/cycle005-*
            ${{ runner.temp }}/consequential-cycle-006
          if-no-files-found: warn
  phase-code-qualification:
    if: github.head_ref != 'verify/adaptive012-public-package'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: inventions/phase_codes/requirements.txt
      - run: python -m pip install -r inventions/phase_codes/requirements.txt
      - name: Reconstruct and independently reproduce the ideal component
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python inventions/phase_codes/reproduce.py --output "$RUNNER_TEMP/phase-code-replay"
      - name: Retain replay evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-code-replay
          path: ${{ runner.temp }}/phase-code-replay
          if-no-files-found: error
  publish-connected-checkpoint:
    needs: [qualify, phase-code-qualification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish immutable experimental checkpoint after qualification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=connected-pilot-20261029-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing connected checkpoint retained unchanged.'
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Tag exists without release; refuse reuse.' >&2
            exit 1
          fi
          mkdir -p checkpoint-assets
          git archive --format=zip --prefix=AGI_ALPHA_Connected_Pilot/ HEAD > checkpoint-assets/AGI_ALPHA_Connected_Pilot_source_evidence.zip
          sha256sum checkpoint-assets/* > checkpoint-assets/SHA256SUMS.txt
          gh release create "$tag" checkpoint-assets/* --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA connected pilot: conventional control wins' --notes-file campaign/cycle-004/RELEASE_NOTES.md
  publish-mechanism-completion:
    needs: [qualify, phase-code-qualification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Preserve the historical mechanism release before obsolete source checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=mechanism-completion-20261029-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing mechanism-completion source and assets retained unchanged.'
            exit 0
          fi
          echo 'Historical mechanism release is absent; refuse to recreate its tag from a different source.' >&2
          exit 1
  publish-perturbation-construction:
    needs: [qualify, phase-code-qualification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check whether this uniquely versioned release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=perturbation-construction-20261029-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo 'Existing cycle-006 release retained unchanged.'
          elif git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Cycle-006 tag exists without release; refuse reuse.' >&2
            exit 1
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.existing.outputs.published == 'false'
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.existing.outputs.published == 'false'
        run: python -m pip install -r requirements-cycle004.txt -r requirements-perturb006.txt
      - name: Validate committed paper bindings and optionally compile its TeX separately
        if: steps.existing.outputs.published == 'false'
        run: |
          python scripts/check_cycle006_paper.py --output "$RUNNER_TEMP/cycle006-paper-identity.json"
          if command -v pdflatex >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/cycle006-tex-check"
            cp docs/research/cycle-006.tex "$RUNNER_TEMP/cycle006-tex-check/"
            (cd "$RUNNER_TEMP/cycle006-tex-check" && timeout 60 pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error cycle-006.tex && timeout 60 pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error cycle-006.tex)
            echo 'CI compiled TeX separately; the hash-bound visually inspected supplied PDF is retained.'
          else
            echo 'No pdflatex in this runner: CI verifies the supplied compiled-PDF identity and visual-QA binding; it does not claim recompilation.'
          fi
      - name: Build source artifact and qualify validated and ordinary clean extractions
        if: steps.existing.outputs.published == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/cycle006-assets"
          archive="$RUNNER_TEMP/cycle006-assets/AGI_ALPHA_Perturbation_Construction_006_source_evidence.zip"
          python -m flywheel.archive_v2 build . "$archive"
          archive_sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)
          python verification/cycle006_archive_check.py --archive "$archive" --expected-sha256 "$archive_sha256" --output "$RUNNER_TEMP/cycle006-archive-qualification"
          python -m flywheel.baseline005 --root . --output "$RUNNER_TEMP/cycle006-old005-source"
          python "$RUNNER_TEMP/cycle006-old005-source/run_completion.py" --output "$RUNNER_TEMP/cycle006-old005-replay"
          python "$RUNNER_TEMP/cycle006-old005-source/verification/cycle005_wholepath.py" --root "$RUNNER_TEMP/cycle006-old005-source" --output "$RUNNER_TEMP/cycle006-old005-wholepath"
          python "$RUNNER_TEMP/cycle006-old005-source/verification/cycle005_p1_regression.py" --root "$RUNNER_TEMP/cycle006-old005-source" --output "$RUNNER_TEMP/cycle006-old005-p1"
          cp docs/research/cycle-006.tex docs/research/cycle-006.pdf docs/research/cycle-006.html docs/research/cycle-006.md docs/research/cycle-006.inputs.json docs/research/cycle-006.build.json docs/research/PDF_QA_006.json "$RUNNER_TEMP/cycle006-assets/"
          cp "$RUNNER_TEMP/cycle006-archive-qualification/REPORT.json" "$RUNNER_TEMP/cycle006-assets/ARCHIVE_QUALIFICATION.json"
          python -m zipfile -c "$RUNNER_TEMP/cycle006-assets/CLEAN_ARCHIVE_RUNTIME_EVIDENCE.zip" "$RUNNER_TEMP/cycle006-archive-qualification"
          python scripts/reassemble_evidence006.py --index evidence/cycle-006/reproduction-raw-packages-001/artifacts/connected-reproduction-001-parts/INDEX.json --output "$RUNNER_TEMP/cycle006-assets/connected-reproduction-001-complete-raw.zip" --expected-sha256 cb9e8608a89318f29bc309e3f0dea024793e56dcefdedeb16e87a4fb69bd4054
          python scripts/reassemble_evidence006.py --index evidence/cycle-006/reproduction-raw-packages-001/artifacts/connected-reproduction-002-parts/INDEX.json --output "$RUNNER_TEMP/cycle006-assets/connected-reproduction-002-complete-raw.zip" --expected-sha256 2d4d4f6fb08a930a380828bd8dce6edb5175f103babc6f42b640fef7ba5bfe7d
          (cd "$RUNNER_TEMP/cycle006-assets" && sha256sum * > SHA256SUMS.txt)
      - name: Publish a new hash-identified experimental edition without rewriting old assets
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create perturbation-construction-20261029-r1 "$RUNNER_TEMP/cycle006-assets/"* --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA: bounded perturbation construction and verified retained adaptations' --notes-file campaign/cycle-006/RELEASE_NOTES.md
      - name: Retain new-edition qualification evidence including failures
        if: always() && steps.existing.outputs.published == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perturbation-construction-release-evidence
          path: |
            ${{ runner.temp }}/cycle006-assets
            ${{ runner.temp }}/cycle006-archive-qualification
            ${{ runner.temp }}/cycle006-old005-replay
            ${{ runner.temp }}/cycle006-old005-wholepath
            ${{ runner.temp }}/cycle006-old005-p1
            ${{ runner.temp }}/cycle006-*-paper.json
            ${{ runner.temp }}/cycle006-paper-identity.json
            ${{ runner.temp }}/cycle006-tex-check
          if-no-files-found: warn
  publish-research-edition:
    needs: [qualify, phase-code-qualification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish this experimental edition once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=study-first-campaign-20261029-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing edition retained unchanged.'
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Tag already exists without release; refuse reuse.' >&2
            exit 1
          fi
          mkdir -p release-assets
          git archive --format=zip --prefix=AGI_ALPHA_Cycle_001/ HEAD > release-assets/AGI_ALPHA_Cycle_001_source_evidence.zip
          cp docs/research/cycle-001.pdf release-assets/
          cp docs/research/cycle-001.tex release-assets/
          cp docs/research/cycle-001.html release-assets/
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA first campaign - experimental evidence edition 001' --notes-file campaign/cycle-001/RELEASE_NOTES.md
