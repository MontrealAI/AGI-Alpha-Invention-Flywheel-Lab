name: Bounded campaign qualification
on:
  pull_request:
  push:
    branches: [main, campaign/grid-screen-cycle-1]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          if test -f requirements-cycle004.txt; then
            python -m pip install -r requirements-cycle004.txt
          else
            python -m pip install -r requirements.txt
          fi
      - name: Source-matched tests and actual connected replay
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s verification -v
          python -m flywheel.legacy --root . --output "$RUNNER_TEMP/frozen-cycle-001"
          python "$RUNNER_TEMP/frozen-cycle-001/reproduce.py" --output "$RUNNER_TEMP/campaign-replay"
          python "$RUNNER_TEMP/frozen-cycle-001/verification/probe_runner_identity.py" --root "$RUNNER_TEMP/frozen-cycle-001" --output "$RUNNER_TEMP/identity-probe"
          python "$RUNNER_TEMP/frozen-cycle-001/verification/probe_added_source.py" --root "$RUNNER_TEMP/frozen-cycle-001" --output "$RUNNER_TEMP/added-source-probe"
          python "$RUNNER_TEMP/frozen-cycle-001/verification/probe_worker_bounds.py" --root "$RUNNER_TEMP/frozen-cycle-001" --output "$RUNNER_TEMP/bounds-probe"
          python "$RUNNER_TEMP/frozen-cycle-001/verification/check_edition.py"
          python -m flywheel.archive_v2 cycle004 . "$RUNNER_TEMP/frozen-cycle-004"
          python - "$RUNNER_TEMP/frozen-cycle-004" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {
              'cycle004_probe_runner.py': '19a9f28299cae405e6ca4e313fed5558972f187ef2e892d2af8806a22b0aee07',
              'cycle004_completion.py': 'c70d977f7c85b8e0876347f5d95c5d93e767ae5bef764ffbe1aa24db0c538a65',
              'cycle004_active_interrupt.py': '9fa998e8385a9019eadbf83f079cf06174f04ea8f8aad3d08c5a6101dd2e4c4a',
              'cycle004_fresh.py': '04d12029bf805a09469b51958cab02e039c65cad8692508fa62ff18ff90508b4',
          }
          for name, digest in expected.items():
              source = pathlib.Path('verification') / name
              raw = source.read_bytes()
              if source.is_symlink() or hashlib.sha256(raw).hexdigest() != digest:
                  raise ValueError('HISTORICAL_VERIFIER_IDENTITY_MISMATCH ' + name)
              with (root / 'verification' / name).open('xb') as stream:
                  stream.write(raw)
          PY
          python "$RUNNER_TEMP/frozen-cycle-004/run_cycle.py" --output "$RUNNER_TEMP/connected-cycle-004"
          python "$RUNNER_TEMP/frozen-cycle-004/verification/cycle004_probe_runner.py" --runner "$RUNNER_TEMP/frozen-cycle-004/run_cycle.py" --output "$RUNNER_TEMP/cycle004-initialization"
          python "$RUNNER_TEMP/frozen-cycle-004/verification/cycle004_completion.py" --root "$RUNNER_TEMP/frozen-cycle-004" --output "$RUNNER_TEMP/cycle004-completion"
          python "$RUNNER_TEMP/frozen-cycle-004/verification/cycle004_active_interrupt.py" --root "$RUNNER_TEMP/frozen-cycle-004" --output "$RUNNER_TEMP/cycle004-active-interruption"
          python "$RUNNER_TEMP/frozen-cycle-004/verification/cycle004_fresh.py" --output "$RUNNER_TEMP/cycle004-exposed-regression"
          (cd "$RUNNER_TEMP/frozen-cycle-004" && python -m flywheel.metabolic_probe --output "$RUNNER_TEMP/cycle004-metabolic-replay")
          python run_completion.py --output "$RUNNER_TEMP/mechanism-completion-005"
          python verification/cycle005_wholepath.py --root . --output "$RUNNER_TEMP/cycle005-wholepath"
          python verification/cycle005_p1_regression.py --root . --output "$RUNNER_TEMP/cycle005-p1-regression"
  phase-code-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: inventions/phase_codes/requirements.txt
      - run: python -m pip install -r inventions/phase_codes/requirements.txt
      - name: Reconstruct and independently reproduce the ideal component
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python inventions/phase_codes/reproduce.py --output "$RUNNER_TEMP/phase-code-replay"
      - name: Retain replay evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-code-replay
          path: ${{ runner.temp }}/phase-code-replay
          if-no-files-found: error
  publish-connected-checkpoint:
    needs: [qualify, phase-code-qualification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish immutable experimental checkpoint after qualification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=connected-pilot-20261029-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing connected checkpoint retained unchanged.'
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Tag exists without release; refuse reuse.' >&2
            exit 1
          fi
          mkdir -p checkpoint-assets
          git archive --format=zip --prefix=AGI_ALPHA_Connected_Pilot/ HEAD > checkpoint-assets/AGI_ALPHA_Connected_Pilot_source_evidence.zip
          sha256sum checkpoint-assets/* > checkpoint-assets/SHA256SUMS.txt
          gh release create "$tag" checkpoint-assets/* --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA connected pilot: conventional control wins' --notes-file campaign/cycle-004/RELEASE_NOTES.md
  publish-mechanism-completion:
    needs: [qualify, phase-code-qualification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-cycle004.txt -r inventions/phase_codes/requirements.txt
      - name: Build self-contained source and verify its clean extraction before upload
        run: |
          mkdir -p "$RUNNER_TEMP/mechanism-assets"
          python -m flywheel.archive_v2 build . "$RUNNER_TEMP/mechanism-assets/AGI_ALPHA_Mechanism_Completion_005_source_evidence.zip"
          python -m flywheel.archive_v2 extract "$RUNNER_TEMP/mechanism-assets/AGI_ALPHA_Mechanism_Completion_005_source_evidence.zip" "$RUNNER_TEMP/clean-mechanism-source"
          cd "$RUNNER_TEMP/clean-mechanism-source"
          test ! -e .git
          test ! -e "$RUNNER_TEMP/.git"
          python -m unittest discover -s tests -v
          python -m unittest discover -s verification -v
          python -m flywheel.legacy --root . --output "$RUNNER_TEMP/clean-frozen-cycle-001"
          python "$RUNNER_TEMP/clean-frozen-cycle-001/reproduce.py" --output "$RUNNER_TEMP/clean-cycle-001-replay"
          python "$RUNNER_TEMP/clean-frozen-cycle-001/verification/check_edition.py"
          python -m flywheel.archive_v2 cycle004 . "$RUNNER_TEMP/clean-frozen-cycle-004"
          python "$RUNNER_TEMP/clean-frozen-cycle-004/run_cycle.py" --output "$RUNNER_TEMP/clean-cycle-004-replay"
          python run_completion.py --output "$RUNNER_TEMP/clean-mechanism-completion-005"
          python verification/cycle005_wholepath.py --root . --output "$RUNNER_TEMP/clean-cycle005-wholepath"
          python verification/cycle005_p1_regression.py --root . --output "$RUNNER_TEMP/clean-cycle005-p1-regression"
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python inventions/phase_codes/reproduce.py --output "$RUNNER_TEMP/clean-phase-code-replay"
          python verification/cycle005_archive_check.py --archive "$RUNNER_TEMP/mechanism-assets/AGI_ALPHA_Mechanism_Completion_005_source_evidence.zip" --output "$RUNNER_TEMP/clean-archive-independent-verification"
          cp "$RUNNER_TEMP/clean-archive-independent-verification/REPORT.json" "$RUNNER_TEMP/mechanism-assets/ARCHIVE_QUALIFICATION.json"
          (cd "$RUNNER_TEMP/mechanism-assets" && sha256sum AGI_ALPHA_Mechanism_Completion_005_source_evidence.zip ARCHIVE_QUALIFICATION.json > SHA256SUMS.txt)
      - name: Publish a new experimental version without changing old tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=mechanism-completion-20261029-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing mechanism-completion version retained unchanged.'
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Tag exists without release; refuse reuse.' >&2
            exit 1
          fi
          gh release create "$tag" "$RUNNER_TEMP/mechanism-assets/"* --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA mechanism completion: executable transfer and acquired retention' --notes-file campaign/cycle-005/RELEASE_NOTES.md
  publish-research-edition:
    needs: [qualify, phase-code-qualification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish this experimental edition once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=study-first-campaign-20261029-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing edition retained unchanged.'
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Tag already exists without release; refuse reuse.' >&2
            exit 1
          fi
          mkdir -p release-assets
          git archive --format=zip --prefix=AGI_ALPHA_Cycle_001/ HEAD > release-assets/AGI_ALPHA_Cycle_001_source_evidence.zip
          cp docs/research/cycle-001.pdf release-assets/
          cp docs/research/cycle-001.tex release-assets/
          cp docs/research/cycle-001.html release-assets/
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA first campaign - experimental evidence edition 001' --notes-file campaign/cycle-001/RELEASE_NOTES.md
