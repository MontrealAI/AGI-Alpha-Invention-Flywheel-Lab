name: Next-series source-bound model qualification
on:
  pull_request:
    paths:
      - 'experiments/next_series_20261102_365c3d6c/**'
      - '.github/workflows/next-series-365c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-models:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Reproduce separately registered model controls
        env:
          SERIES: experiments/next_series_20261102_365c3d6c
        run: |
          python "$SERIES/n1/challenge.py" --output "$RUNNER_TEMP/n1-constructor.json"
          python "$SERIES/verification/verify_n1.py" --output "$RUNNER_TEMP/n1-independent.json"
          python "$SERIES/n3/run.py" --output "$RUNNER_TEMP/n3-constructor.json"
          python "$SERIES/verification/verify_n3.py" --output "$RUNNER_TEMP/n3-independent.json"
      - name: Preserve compact attempt-specific evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-series-365c-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n1-constructor.json
            ${{ runner.temp }}/n1-independent.json
            ${{ runner.temp }}/n3-constructor.json
            ${{ runner.temp }}/n3-independent.json
          if-no-files-found: warn
