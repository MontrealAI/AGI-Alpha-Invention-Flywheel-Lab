name: Omega cart-aware economy qualification
on:
  pull_request:
    paths:
      - 'mechanism_harness/**'
      - 'tests/test_omega*.py'
      - 'campaign/omega-economy-v4/**'
      - '.github/workflows/omega-economy-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-economy-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing pinned dependencies
        run: python -m pip install -r requirements-omega-mechanisms-v3.txt
      - name: Exact source and regression qualification
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/OMEGA_V4_SOURCE.txt"
          python -m unittest discover -s tests -p 'test_omega*.py' -v 2>&1 | tee "$RUNNER_TEMP/omega-v4-tests.log"
          python -m unittest mechanism_harness.test_game_maker -v
          python -m unittest tests.test_connected_platform_runtime064 -v
      - name: Reproduce registered composed-market comparison
        run: |
          python -m mechanism_harness.cart_campaign --output "$RUNNER_TEMP/omega-v4-campaign.json"
          python -m mechanism_harness.cart_campaign --audit --output "$RUNNER_TEMP/omega-v4-campaign.json" > "$RUNNER_TEMP/omega-v4-campaign-audit.json"
      - name: Cooperative construction and independent acceptance
        run: |
          python -m mechanism_harness.cooperative_construction --output "$RUNNER_TEMP/omega-v4-cooperative.json"
          python -m mechanism_harness.cooperative_construction --audit --output "$RUNNER_TEMP/omega-v4-cooperative.json" > "$RUNNER_TEMP/omega-v4-cooperative-audit.json"
      - name: Native matched accounts and refusal counterexamples
        shell: bash
        run: |
          set -euo pipefail
          for arm in generated standard full_control; do
            python -m mechanism_harness.cart_native run --arm "$arm" --output "$RUNNER_TEMP/cart-$arm"
            python -m mechanism_harness.cart_native audit --output "$RUNNER_TEMP/cart-$arm" > "$RUNNER_TEMP/omega-v4-$arm-audit.json"
          done
          sha256sum "$RUNNER_TEMP/cart-generated/NATIVE_EXPORT.json" > "$RUNNER_TEMP/cart-before.sha256"
          python -m mechanism_harness.cart_native resume --output "$RUNNER_TEMP/cart-generated"
          sha256sum -c "$RUNNER_TEMP/cart-before.sha256"
          for stress in copycat no_demand failed_acceptance; do
            python -m mechanism_harness.cart_native run --stress "$stress" --output "$RUNNER_TEMP/cart-$stress"
            python -m mechanism_harness.cart_native audit --output "$RUNNER_TEMP/cart-$stress" > "$RUNNER_TEMP/omega-v4-$stress-audit.json"
          done
      - name: Preserve explicit public allowlist only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-economy-v4-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/OMEGA_V4_SOURCE.txt
            ${{ runner.temp }}/omega-v4-tests.log
            ${{ runner.temp }}/omega-v4-campaign.json
            ${{ runner.temp }}/omega-v4-cooperative.json
            ${{ runner.temp }}/omega-v4-*-audit.json
          if-no-files-found: warn
