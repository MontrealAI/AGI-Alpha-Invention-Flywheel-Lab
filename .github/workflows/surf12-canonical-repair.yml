name: SURF 1.2 canonical source repair
on:
  push:
    branches: ['paper/surf-missing-move-1-2']
    paths: ['.github/workflows/surf12-canonical-repair.yml']
permissions:
  contents: read
jobs:
  repair-reviewed-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EDITION: docs/surf-the-exponential/editions/1.2.0
    steps:
      - name: Register actual platform start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve exact already-qualified publication artifact
        run: |
          gh run download 42139523277 --repo "$GITHUB_REPOSITORY" --name surf12-publication-12a9e607b0acccbeccf6e8f3128accaeb567f680 --dir "$RUNNER_TEMP/qualified12"
          (cd "$RUNNER_TEMP/qualified12" && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'qualified12'
          root=pathlib.Path(os.environ['EDITION'])
          expected='062ce8c083e68754e20d935f0e7952fc2a08a6f888bd3ee5faf46882700f94fe'
          data=(src/'SURF_THE_EXPONENTIAL.pdf').read_bytes()
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('Qualified PDF changed')
          if (src/'PUBLICATION.json').read_bytes()!=(root/'PUBLICATION.json').read_bytes():
              raise SystemExit('Source/PDF binding differs')
          dest=root/'canonical/SURF_THE_EXPONENTIAL.pdf'
          if dest.exists():raise SystemExit('Refusing to overwrite existing canonical bytes')
          dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          workflow=pathlib.Path('.github/workflows/surf-missing-move-12.yml')
          text=workflow.read_text()
          old='            git add -- "$EDITION"\n'
          if text.count(old)!=1:raise SystemExit('Unexpected prospective staging rule')
          text=text.replace(old,old+'            git add -f -- "$EDITION/canonical/SURF_THE_EXPONENTIAL.pdf"\n')
          old2="          source=a['source_commit']\n"
          extra="          for suffix,expected in [('PUBLICATION.json',a['asset_sha256']['PUBLICATION.json']),('canonical/SURF_THE_EXPONENTIAL.pdf',a['asset_sha256']['SURF_THE_EXPONENTIAL.pdf'])]:\n              data=subprocess.check_output(['git','show',source+':'+os.environ['EDITION']+'/'+suffix])\n              if hashlib.sha256(data).hexdigest()!=expected:\n                  raise SystemExit('Approved canonical source mismatch: '+suffix)\n"
          if text.count(old2)!=1:raise SystemExit('Unexpected release identity check')
          workflow.write_text(text.replace(old2,old2+extra))
          PY
          python3 "$EDITION/package.py" --verify
      - name: Commit only the repair and verify an actual source-archive extraction
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/paper/surf-missing-move-1-2
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/paper/surf-missing-move-1-2" --jq .object.sha)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$EDITION/canonical/SURF_THE_EXPONENTIAL.pdf"
          git add -- .github/workflows/surf-missing-move-12.yml
          git rm -- .github/workflows/surf12-canonical-repair.yml
          python3 - <<'PY'
          import os,subprocess
          want={os.environ['EDITION']+'/canonical/SURF_THE_EXPONENTIAL.pdf','.github/workflows/surf-missing-move-12.yml','.github/workflows/surf12-canonical-repair.yml'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual!=want:raise SystemExit('Unrelated staged changes')
          PY
          git commit -m 'Track the exact qualified SURF 1.2 PDF and check canonical Git bytes before release'
          mkdir "$RUNNER_TEMP/source12"
          git archive HEAD "$EDITION" | tar -x -C "$RUNNER_TEMP/source12"
          cd "$RUNNER_TEMP/source12/$EDITION"
          python3 package.py --verify
          python3 check_construct_case.py
          python3 check_study.py
          python3 check_decision_case.py
          python3 -m unittest -v test_construct_case test_study test_decision_case
          python3 -O -m unittest -v test_construct_case test_study test_decision_case
          cd "$GITHUB_WORKSPACE"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/paper/surf-missing-move-1-2
          echo "Qualified source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
