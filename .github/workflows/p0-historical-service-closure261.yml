name: P0-261 historical adaptive service closure
on:
  push:
    branches: ['research/p0-historical-service-closure261-20261124']
    paths: ['.github/workflows/p0-historical-service-closure261.yml']
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ced6c1cb004887dcdafaea59a2976020be649f8e
          path: owner-src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Stage exact P0-258 wheel bytes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/p0-261-pins.txt" <<'EOF'
          cryptography==50.0.2 --hash=sha256:9dab55f57c74c3cad24c323bacbbd04be4705ba6eb0d92e920b1fc4837ed5079
          cffi==2.1.1 --hash=sha256:c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf
          pycparser==3.11 --hash=sha256:51d5a8ba2be0bbe440b99d2112604c95bbbc3c2748a64260186c541e1729cd80
          EOF
          python -m pip download --only-binary=:all: --require-hashes --no-deps -r "$RUNNER_TEMP/p0-261-pins.txt" -d "$RUNNER_TEMP/p0-261-wheels"
          python -m pip install --no-index --no-deps --no-compile --require-hashes --find-links "$RUNNER_TEMP/p0-261-wheels" -r "$RUNNER_TEMP/p0-261-pins.txt" --target "$RUNNER_TEMP/p0-261-deps"
      - name: Execute registered canonical loader cases once
        run: python -I -S -B research/p0_historical_service_closure261/probe.py owner-src "$RUNNER_TEMP/p0-261-deps" "$RUNNER_TEMP/P0_261.json"
      - name: Retain compact nonsecret outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-261-service-closure
          path: ${{ runner.temp }}/P0_261.json
          if-no-files-found: warn
          retention-days: 7
