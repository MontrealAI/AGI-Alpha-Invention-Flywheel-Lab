name: P0-258 exact released wheel closure fixture
on:
  push:
    branches: ['research/p0-release-wheel-closure258-20261124']
    paths: ['.github/workflows/p0-release-wheel258.yml']
permissions:
  contents: read
jobs:
  wheel-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Execute frozen public wheel fixture once
        run: python -B research/p0_release_wheel258/probe.py "$RUNNER_TEMP/P0_258.json"
      - name: Retain compact nonsecret outcome including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-258-wheel-closure
          path: ${{ runner.temp }}/P0_258.json
          if-no-files-found: warn
