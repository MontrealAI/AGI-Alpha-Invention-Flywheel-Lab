name: GENESIS Frontier 001 - Pinned Proof Verification
on:
  push:
    branches:
      - research/genesis-frontier-proof-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-research-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build verifier and run accepted and rejected examples
        shell: bash
        run: |
          set -euo pipefail
          echo "User $(id -un), compiler: $(g++ --version | head -1)"
          bash research/frontier-20261104/probe_flashprove.sh "$RUNNER_TEMP/genesis-frontier-001-evidence"
      - name: Independently check exact sampling mathematics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s research/frontier-20261104 -p 'test_audit_sampling.py' -v \
            2>&1 | tee "$RUNNER_TEMP/genesis-audit-math-tests.log"
          mkdir -p "$RUNNER_TEMP/genesis-frontier-001-evidence"
          cp "$RUNNER_TEMP/genesis-audit-math-tests.log" "$RUNNER_TEMP/genesis-frontier-001-evidence/audit-math-tests.log"
          python3 research/frontier-20261104/audit_sampling.py \
            --out "$RUNNER_TEMP/genesis-frontier-001-evidence/audit_sampling.json"
      - name: Publish source-bound synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-frontier-001-synthetic-verification
          path: ${{ runner.temp }}/genesis-frontier-001-evidence/
          if-no-files-found: warn
          retention-days: 30
