name: Super Alpha083 codec falsification
on:
  pull_request:
    paths:
      - 'experiments/superalpha083/**'
      - '.github/workflows/superalpha083.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-audit-and-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependency
        run: python -m pip install numpy==2.3.5
      - name: Audit committed original and supplementary evidence
        working-directory: experiments/superalpha083
        run: |
          python -B independent_review.py --supplement --output "$RUNNER_TEMP/INDEPENDENT_REVIEW.json"
          python -B -m unittest -v test_independent_review.py
      - name: Reproduce in a distinct temporary copy
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cp -R experiments/superalpha083 "$RUNNER_TEMP/codec083"
          cd "$RUNNER_TEMP/codec083"
          python -B run.py
          python -B supplement.py
          python -B independent_review.py --supplement
