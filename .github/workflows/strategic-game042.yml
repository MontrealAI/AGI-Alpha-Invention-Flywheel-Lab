name: AGI ALPHA — finite strategic game and native earned-funded comparison
on:
  pull_request:
    paths:
      - 'connected_enterprise/strategic_game042.py'
      - 'connected_enterprise/opportunity_search040.py'
      - 'connected_enterprise/engine.py'
      - 'tests/test_connected_strategic_game042.py'
      - 'campaign/strategic-game-042/**'
      - 'scripts/run_strategic_game042.py'
      - '.github/workflows/strategic-game042.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strategic-game042-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  arithmetic-and-auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Exact finite follower-response, regret, liquidity and receipt falsifiers
        run: |
          python -m unittest discover -s tests -p 'test_connected_strategic_game042.py' -v
          python -m unittest discover -s tests -p 'test_opportunity_search040.py' -v
      - name: Validate registered source and four fixed accounts
        run: |
          python - <<'PY'
          import json
          from connected_enterprise.registration import validate
          p='campaign/strategic-game-042/REGISTRATION.json'
          a=json.load(open(p));assert validate(a)==a
          assert a['seeds']==[341014] and set(a['configs'])=={'central','game'}
          assert a['configs']['central']['opening']==100000000000==a['configs']['game']['opening']
          assert a['configs']['central']['horizon_days']==28==a['configs']['game']['horizon_days']
          PY
  full-native-exposed-comparison:
    needs: arithmetic-and-auditor
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Same-source register, operate, independent audit and four-world comparisons
        run: python scripts/run_strategic_game042.py --output "$RUNNER_TEMP/game042"
      - name: Refuse annual, real-money or broad optimality claims in the evidence
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'game042/public/SUMMARY.json'
          d=json.loads(p.read_text());assert d['native_full_audit_accepted'] is True
          assert d['starting_capital_per_independent_world_microUSD']==100000000000
          assert d['actual_customers']==0 and d['actual_collected_microUSD']==0
          assert d['actual_profit_microUSD'] is None and d['inventor_policy_advantage']=='NOT_ESTABLISHED'
          assert len(d['worlds'])==4
          assert d['worlds']['game_growth']['finite_game_decisions']==28
          PY
      - name: Preserve only compact public comparison or incomplete receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game042-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/game042/public/SUMMARY.json
            ${{ runner.temp }}/game042/public/INCOMPLETE.json
          retention-days: 7
          if-no-files-found: warn
