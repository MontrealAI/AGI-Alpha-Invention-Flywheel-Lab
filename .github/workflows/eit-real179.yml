name: EIT179 separately registered true-data chest MAT repeat
on:
  pull_request:
    paths:
      - 'campaign/eit-real179/**'
      - 'research/eit_real179.py'
      - 'tests/test_eit_real179.py'
      - '.github/workflows/eit-real179.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eit179-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-pinned-real-mat:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only fixed binary NumPy/h5py scientific wheels
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1
      - name: Run twelve fixed real-namespace and refusal controls
        run: |
          python -B -m unittest -v tests.test_eit_real179
      - name: Exactly one publisher-pinned AgarChest real Data/ MAT pair, no retries
        run: |
          python -B -m research.eit_real179 --output "$RUNNER_TEMP/EIT179_REAL_MAT_RECEIPT.json"
      - name: Preserve original pass or failure record (compact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit179-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/EIT179_REAL_MAT_RECEIPT.json
          if-no-files-found: warn
