name: Constructive challenge companion publication
on:
  pull_request:
    paths:
      - 'docs/surf-constructive-challenge/**'
      - '.github/workflows/surf-constructive-challenge.yml'
  push:
    branches: [main]
    paths:
      - 'docs/surf-constructive-challenge/**'
      - '.github/workflows/surf-constructive-challenge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surf-constructive-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify published identities and the self-contained local reader
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,shutil,os
          from html.parser import HTMLParser
          r=pathlib.Path('docs/surf-constructive-challenge')
          p=json.loads((r/'PUBLICATION.json').read_text())
          info=p['source_and_evidence']
          if p['edition']!='surf-constructive-challenge-1.0.0' or p['pages']!=23:raise SystemExit('Edition mismatch')
          for suffix,key in (('pdf','pdf_sha256'),('tex','tex_sha256')):
              if hashlib.sha256((r/f'SURF_THE_EXPONENTIAL.{suffix}').read_bytes()).hexdigest()!=info[key]:raise SystemExit('Published identity mismatch')
          if hashlib.sha256((r/'evidence/exact-results.json').read_bytes()).hexdigest()!=info['result_sha256']:raise SystemExit('Result mismatch')
          if info['actual_customer_receipts']!=0 or info['separate_llm_reviewer'] is not False:raise SystemExit('Unsupported claim')
          html=(r/'reader.html').read_text()
          if 'PAPER_PAGES' in html or 'PAPER_SHA' in html or '23 pages' not in html or info['pdf_sha256'] not in html:raise SystemExit('Unresolved reader fields')
          class CheckLinks(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  for key,value in attrs:
                      if key not in ('href','src','data') or not value or value.startswith(('https://','http://','#')):continue
                      target=value.split('#')[0]
                      if not (r/target).is_file():raise ValueError('Broken local reader link: '+target)
          CheckLinks().feed(html)
          shutil.copyfile(r/'SURF_THE_EXPONENTIAL.pdf',pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical.pdf')
          PY
      - name: Install the standard public manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-extra-links texlive-science texlive-plain-generic tex-gyre lmodern poppler-utils
      - name: Reproduce all exact results, normal and optimized tests, and manuscript
        run: |
          python3 docs/surf-constructive-challenge/build.py
          pdftotext -layout "$RUNNER_TEMP/canonical.pdf" "$RUNNER_TEMP/canonical.txt"
          pdftotext -layout docs/surf-constructive-challenge/SURF_THE_EXPONENTIAL.pdf "$RUNNER_TEMP/rebuilt.txt"
          cmp "$RUNNER_TEMP/canonical.txt" "$RUNNER_TEMP/rebuilt.txt"
      - name: Check existing research publications and allowlisted website
        run: |
          python3 -B -m unittest discover -s tests -p 'test_research_site.py' -v
          node --test tests/test_alpha_site.cjs
          python3 scripts/build_research_site.py --output "$RUNNER_TEMP/unchanged-research-site"
      - name: Retain rebuilt research artifacts without replacing a canonical release
        run: python3 docs/surf-constructive-challenge/package.py --output "$RUNNER_TEMP/constructive-companion"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surf-constructive-challenge-qualified
          path: ${{ runner.temp }}/constructive-companion/
          retention-days: 7
