name: Measurement compiler reproduction
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/measurement_compiler/**'
      - 'campaign/measurement-compiler-001/**'
      - '.github/workflows/measurement-compiler.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r campaign/measurement-compiler-001/requirements.txt
      - name: Run boundary tests in both modes
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest research.measurement_compiler.test_core research.measurement_compiler.test_calibrated
          python -O -m unittest research.measurement_compiler.test_core research.measurement_compiler.test_calibrated
      - name: Fetch pinned public measurements
        run: python campaign/measurement-compiler-001/fetch_data.py --output /tmp/ktc-data
      - name: Reproduce the registered research result
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m research.measurement_compiler.calibrated_run develop --data /tmp/ktc-data --output /tmp/ktc-development
          python -m research.measurement_compiler.calibrated_run confirm --data /tmp/ktc-data --freeze /tmp/ktc-development/development.json --output /tmp/ktc-confirmation
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/ktc-confirmation/confirmation.json').read_text())
          expected={'verdict':'REJECT','count':48,'targets':21,'within_5_percent':20}
          for key,value in expected.items():
              if result[key]!=value: raise SystemExit(f'Reproduction mismatch: {key}')
          if abs(result['worst_relative_rms']-0.06059927967902498)>1e-8:
              raise SystemExit('Numerical reproduction mismatch')
          print('Recorded REJECT result reproduced; this is not enterprise acceptance.')
          PY
