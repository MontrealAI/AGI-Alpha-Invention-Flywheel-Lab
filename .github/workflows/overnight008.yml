name: Overnight 008 source-matched construction
on:
  pull_request:
  push:
    branches: [main, campaign/overnight-civilization-008-20261030]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-overnight008.txt
      - run: python -m pip install -r requirements-overnight008.txt
      - name: Confined construction, independent acceptance and actual retained fresh use
        run: |
          python -m unittest verification.test_observability008 -v
          python -m experiments.observability008 construct --output "$RUNNER_TEMP/overnight008-construction"
          python verification/accept_linear_plan008.py --root . --task research/observability008/elowitz/model_constraints.json --delivery "$RUNNER_TEMP/overnight008-construction/DELIVERY.json" --output "$RUNNER_TEMP/overnight008-review"
          python - "$RUNNER_TEMP/overnight008-review/ACCEPTANCE.json" <<'PY'
          import json, sys
          if json.load(open(sys.argv[1]))['accepted'] is not True:
              raise SystemExit('Independent scoped acceptance failed')
          PY
          python -m experiments.observability008 retain-use --previous "$RUNNER_TEMP/overnight008-construction" --acceptance evidence/overnight-008/observability-accepted-r2/ACCEPTANCE.json --fresh research/observability008/crauste/model_constraints.json --output "$RUNNER_TEMP/overnight008-retained"
      - name: Actual public-model numerical reproduction and generalized different-model analysis
        run: |
          python research/observability008/elowitz/gauge_probe.py --output "$RUNNER_TEMP/overnight008-elowitz"
          python research/observability008/compile_petab.py --source research/observability008/crauste/source --output "$RUNNER_TEMP/overnight008-crauste"
          python research/observability008/compile_petab_forcing.py --source research/observability008/boehm/source --output "$RUNNER_TEMP/overnight008-boehm"
          python scripts/replay_literal_check008.py --output "$RUNNER_TEMP/overnight008-literal-check"
      - name: Preserve actual source-matched receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: overnight008-source-matched-reproduction
          path: ${{ runner.temp }}/overnight008-*
          if-no-files-found: error
