name: "🌌♾️ AGI ALPHA Flywheel Harness — Capacity complements"
on:
  pull_request:
    paths:
      - 'scripts/run_capacity038.py'
      - 'scripts/run_commoncost026.py'
      - 'scripts/run_strategic024.py'
      - 'scripts/summarize_capacity038.py'
      - 'campaign/capacity-038/**'
      - '.github/workflows/capacity038.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capacity038-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      frozen: ${{ steps.guard.outputs.frozen }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: guard
        run: |
          python - <<'PY'
          import ast, json, os
          from pathlib import Path
          tree=ast.parse(Path('scripts/run_capacity038.py').read_text())
          protocol=next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='PROTOCOL' for t in n.targets))
          assert protocol==json.loads(Path('campaign/capacity-038/PROTOCOL.json').read_text())
          frozen=protocol['status']=='FROZEN'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('frozen='+str(frozen).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Capacity038 protocol: '+protocol['status']+'. Draft never launches economic worlds.\n')
          PY
  prerequisites:
    needs: protocol
    if: needs.protocol.outputs.frozen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Existing exposed engineering and native correctness prerequisites
        run: |
          python -m unittest discover -s tests -p 'test_capacity_menu037.py' -v
          python -m unittest discover -s tests -p 'test_capacity_menu_operating.py' -v
          python -m unittest discover -s tests -p 'test_complete_offer_allocation.py' -v
          python -m unittest discover -s tests -p 'test_connected_capacity_contract.py' -v
          python -m unittest discover -s tests -p 'test_connected_finance.py' -v
          python -m unittest discover -s tests -p 'test_adaptive_allocation.py' -v
  worlds:
    name: Matched 42-day / ${{ matrix.pair.case }} / ${{ matrix.pair.seed }} / ${{ matrix.arm }}
    needs: [protocol, prerequisites]
    if: needs.protocol.outputs.frozen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arm: [incumbent, quantity]
        pair:
          - {case: positive, seed: 2610312311}
          - {case: positive, seed: 2610312312}
          - {case: costly_capacity, seed: 2610312311}
          - {case: self_service_no_retention, seed: 2610312312}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Fixed native operation and independent operating audit
        run: python scripts/run_capacity038.py --stage scale --case '${{ matrix.pair.case }}' --seed '${{ matrix.pair.seed }}' --arm '${{ matrix.arm }}' --output "$RUNNER_TEMP/capacity038"
      - name: Browser-readable outcome
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'capacity038/public/SUMMARY.json'
          r=json.loads(p.read_text()) if p.exists() else {'status':'NO_RECEIPT'}
          keys=('status','case','seed','arm','paid_jobs','summary','conditional_simulated_commercial_success','investments','error')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Conditional native simulation\n```json\n'+json.dumps({k:r.get(k) for k in keys},indent=2)+'\n```\nForecasts are not income; no annualized/actual-commerce claim. Unknown host/model billing.\n')
          PY
      - name: Compact public receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacity038-${{ matrix.pair.case }}-${{ matrix.pair.seed }}-${{ matrix.arm }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/capacity038/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
  compare:
    if: always() && needs.protocol.outputs.frozen == 'true'
    needs: [protocol, worlds]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: capacity038-*
          path: ${{ runner.temp }}/capacity038-receipts
      - run: python scripts/summarize_capacity038.py --input "$RUNNER_TEMP/capacity038-receipts" --output "$RUNNER_TEMP/capacity038-comparison"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacity038-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/capacity038-comparison/COMPARISON.json
          if-no-files-found: warn
          retention-days: 30
