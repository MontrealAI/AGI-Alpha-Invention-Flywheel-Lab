name: Omega legacy live-completion review 087
on:
  pull_request:
    paths:
      - tests/test_omega_legacy_live_reconcile087.py
      - .github/workflows/omega-legacy-live087.yml
      - mechanism_harness/mechanism_native.py
      - mechanism_harness/inventor.py
      - mechanism_harness/economical_native.py
      - mechanism_harness/inventor_native.py
permissions:
  contents: read
jobs:
  review087:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record hosted platform start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-pinned mechanism dependencies
        run: python -m pip install -r requirements-omega-mechanisms-v3.txt
      - name: Adversarial native completion and authority checks
        run: python -m unittest -v tests.test_omega_legacy_live_reconcile087
