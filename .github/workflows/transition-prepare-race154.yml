name: Transition154 independent conflicting-writer review
on:
  pull_request:
    paths:
      - 'tests/test_transition_prepare_race154.py'
      - 'docs/transition-prepare-race154/**'
      - '.github/workflows/transition-prepare-race154.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Owner source controls (no signing keys)
        run: python -B -m unittest -v tests.test_transition_authorization_reuse
      - name: Fixed preregistered conflicting-writer adversarial case
        run: python -B -m unittest -v tests.test_transition_prepare_race154
