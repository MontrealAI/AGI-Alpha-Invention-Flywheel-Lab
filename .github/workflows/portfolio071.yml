name: Five-route scientific and native economic portfolio
on:
  pull_request:
    paths:
      - 'portfolio071/**'
      - 'experiments/portfolio_20261102/**'
      - 'tests/test_portfolio071*.py'
      - 'commercial/ledger.py'
      - 'connected_enterprise/finance.py'
      - 'requirements-portfolio071.txt'
      - 'scripts/*portfolio071*.py'
      - '.github/workflows/portfolio071.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio071/**'
      - 'experiments/portfolio_20261102/**'
      - 'tests/test_portfolio071*.py'
      - 'commercial/ledger.py'
      - 'connected_enterprise/finance.py'
      - 'requirements-portfolio071.txt'
      - 'scripts/*portfolio071*.py'
      - '.github/workflows/portfolio071.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio071-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-portfolio-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record hosted job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical and existing native dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-portfolio071.txt
      - name: Participation, source binding, native accounting and tampering regressions
        run: python -m unittest discover -s tests -p 'test_portfolio071*.py' -v
      - name: Reproduce independent scientific routes
        run: python -m portfolio071.reproduce --output "$RUNNER_TEMP/portfolio071" --download-sensor --skip-economics
      - name: Execute all registered independent native accounts
        run: python -m scripts.replay_portfolio071_parallel --reproduction-output "$RUNNER_TEMP/portfolio071"
      - name: Independently reconcile every exported native account
        run: python -m portfolio071.verify_economics --root "$RUNNER_TEMP/portfolio071/native-source" --campaign "$RUNNER_TEMP/portfolio071/economics" --output "$RUNNER_TEMP/portfolio071/INDEPENDENT_ECONOMIC_AUDIT.json"
      - name: Publish compact public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio071-public-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portfolio071/SUMMARY.json
            ${{ runner.temp }}/portfolio071/INDEPENDENT_ECONOMIC_AUDIT.json
            ${{ runner.temp }}/portfolio071/ORCHESTRATION.json
            ${{ runner.temp }}/portfolio071/r1/*.json
            ${{ runner.temp }}/portfolio071/r3/*.json
            ${{ runner.temp }}/portfolio071/r5/*.json
            ${{ runner.temp }}/portfolio071/r2/verification/RESULTS.json
            ${{ runner.temp }}/portfolio071/r2/trained/TRAINING.json
            ${{ runner.temp }}/portfolio071/native-manifest.json
            ${{ runner.temp }}/portfolio071/native-source
            ${{ runner.temp }}/portfolio071/economics/campaign.json
            ${{ runner.temp }}/portfolio071/economics/arm-*/manifest.json
            ${{ runner.temp }}/portfolio071/economics/arm-*/trajectory.json
            ${{ runner.temp }}/portfolio071/economics/arm-*/native-at-horizon.json
            ${{ runner.temp }}/portfolio071/economics/arm-*/native-after-drain.json
          if-no-files-found: warn
