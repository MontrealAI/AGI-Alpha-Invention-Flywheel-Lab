name: P0-186 independent historical CAS cache remediation review
on:
  pull_request:
    paths:
      - 'campaign/p0-review186/**'
      - 'connected_enterprise/upgrades.py'
      - 'tests/test_transition_store184.py'
      - 'tests/test_transition_cache186.py'
      - '.github/workflows/p0-review186.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-review186-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  historical-cas-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fixed historical REDs and prospective closure controls
        run: python -B -m unittest -v tests.test_transition_store184 tests.test_transition_cache186
