name: Independent PR486 outbound payout invariant witness
on:
  push:
    branches:
      - review/omega-payout-invariant-20261119
    paths:
      - "campaign/omega-payout-review-20261119/**"
      - "products/frontier_mechanism_foundry/test/OutboundSettlementWitness.t.sol"
      - ".github/workflows/omega-outbound-review.yml"
  pull_request:
    paths:
      - "campaign/omega-payout-review-20261119/**"
      - "products/frontier_mechanism_foundry/test/OutboundSettlementWitness.t.sol"
      - ".github/workflows/omega-outbound-review.yml"

permissions:
  contents: read

jobs:
  independent-negative-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform execution clock
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse changed original PR486 contract
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object products/frontier_mechanism_foundry/contracts/FrontierProofExchange.sol)"
          test "$actual" = "ef6fc9f03a3fc284df7e63d3ad1b20de1bfd2f83"
          echo "ORIGINAL_CONTRACT_GIT_BLOB=$actual"
          git rev-parse HEAD
      - name: Install isolated Foundry compiler and test runner
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Three-mode native Solidity diagnostic (green means negative behavior seen)
        shell: bash
        run: |
          set -euo pipefail
          cd products/frontier_mechanism_foundry
          forge --version
          /usr/bin/time -v forge test --match-contract OutboundSettlementWitness -vv 2>&1 | tee "$RUNNER_TEMP/outbound-escrow-witness.log"
          echo "NOTE: passing negative-case witnesses demonstrate noncompliant ERC20 exposure, NOT safe settlement"
      - name: Publish only bounded public test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outbound-review-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/outbound-escrow-witness.log
          if-no-files-found: warn
          retention-days: 7
