name: IGNITION adaptive construction observations

on:
  pull_request:
    paths:
      - 'products/frontier-omega-ignition/trials/**'
      - 'products/frontier-omega-ignition/ignition/**'
      - '.github/workflows/frontier-ignition-adaptive-trials.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ignition-adaptive-trials-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  observe:
    name: Observe · ${{ matrix.cell }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        cell: [migration-direct, migration-adaptive, integrity-adaptive, integrity-direct, repair-direct, repair-adaptive, integrity-default, migration-research, integrity-research, frozen-integrity, frozen-migration]
    steps:
      - name: Record runner window
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Receive exact experiment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          path: review
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /products/frontier-omega-ignition/
            /products/alpha-genesis-harness/bridge/
            /products/alpha-genesis-harness/scripts/qualify_hosted_local.py
            /products/alpha-genesis-harness/scripts/package_release.py
      - name: Receive immutable product for historical reproduction
        if: startsWith(matrix.cell, 'frozen-')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 89f2196d552810bc56696a7f380ae66c55f8763a
          path: frozen
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /products/frontier-omega-ignition/
            /products/alpha-genesis-harness/bridge/
            /products/alpha-genesis-harness/scripts/qualify_hosted_local.py
            /products/alpha-genesis-harness/scripts/package_release.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce both source-bound public assisted constructions
        if: matrix.cell == 'integrity-default'
        working-directory: review/products/frontier-omega-ignition
        run: |
          for fixture in migration integrity; do
            python -B trials/assisted.py reproduce "trials/assisted-receipts/$fixture.json" "$RUNNER_TEMP/assisted-$fixture.json"
          done
      - name: Collect registered scientific verdict
        env:
          TRIAL_CELL: ${{ matrix.cell }}
        working-directory: review
        run: |
          export IGNITION_TRIAL_PRODUCT="$GITHUB_WORKSPACE/review"
          if [[ "$TRIAL_CELL" == frozen-* ]]; then
            export IGNITION_TRIAL_PRODUCT="$GITHUB_WORKSPACE/frozen"
          fi
          python -B products/frontier-omega-ignition/trials/run.py --cell "$TRIAL_CELL" \
            --work "$RUNNER_TEMP/ignition-private" --output "$RUNNER_TEMP/ignition-public"
      - name: Preserve observed outcome and accepted recipient where available
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ignition-adaptive-${{ matrix.cell }}-${{ env.EXPECTED_SOURCE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ignition-public/
          if-no-files-found: error
      - name: Display mission verdict separately from observation completeness
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ["RUNNER_TEMP"])/"ignition-public"/"receipt.json").read_text())
          summary = f"**{r['cell']}** · observation **{r['observation']}** · mission **{r['mission_verdict']}**\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(summary)
          PY
