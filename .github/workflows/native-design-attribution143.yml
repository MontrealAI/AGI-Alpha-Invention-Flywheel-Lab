name: Native design041 source-bound adverse attribution review143
on:
  pull_request:
    paths:
      - "research/native_design_attribution143.py"
      - "campaign/native-design-attribution143/**"
      - ".github/workflows/native-design-attribution143.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-design-attribution143-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  pinned-shared-loss-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout the exact review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: review
      - name: Checkout the exact original PR77 source, never change it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cd5281b0ae7b484572bfb35ccb7e51ef5b3be4b3
          persist-credentials: false
          path: original
      - name: Install existing published native requirements
        working-directory: original
        run: python -m pip install -r requirements-commercial010.txt
      - name: Pinned-source and review protocol checks
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          src=pathlib.Path("original")
          head=subprocess.check_output(["git", "-C", str(src), "rev-parse", "HEAD"], text=True).strip()
          assert head=="cd5281b0ae7b484572bfb35ccb7e51ef5b3be4b3", "PINNED_OWNER_SOURCE_CHANGED"
          path=src/"connected_enterprise/design_flywheel.py"
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest=="1ad746e317283fab6e8aca6247da81ec6d1ddd467843839574949598c1b07dc1", "OWNER_FILE_BYTES_CHANGED"
          record={"schema":"agi-alpha/native-design-attribution143/source/v1",
             "original_pr77_commit":head,"original_module_sha256":digest,
             "review_source":subprocess.check_output(["git","-C","review","rev-parse","HEAD"],text=True).strip(),
             "original_account_access":False,"original_source_mutation":False,
             "protocol":"campaign/native-design-attribution143/PROTOCOL.md",
             "expected_scope":"synthetic shared-plan falsification, no live money or native account"}
          pathlib.Path(os.environ["RUNNER_TEMP"],"ATTRIBUTION143_SOURCE.json").write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          PY
      - name: Execute all frozen synthetic positive and adverse cases
        shell: bash
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/ATTRIBUTION143_RESOURCE.txt" \
            env PYTHONPATH="$PWD/original" python review/research/native_design_attribution143.py \
              > "$RUNNER_TEMP/ATTRIBUTION143_OUTCOME.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"],"ATTRIBUTION143_OUTCOME.json")
          d=json.loads(p.read_text())
          assert d["status"]=="ADVERSE_COUNTEREXAMPLE_REPRODUCED"
          assert d["original_pinned_witness_collected_margin_net_microUSD"]==26
          assert d["shared_plan_full_cost_net_microUSD"]==-64
          assert d["invalid_case_rejections"]==8
          print("EXPECTED_ADVERSE_COUNTEREXAMPLE_REPRODUCED_NOT_ECONOMIC_SUCCESS")
          PY
      - name: Preserve key-free source, outcome and resource receipts (including failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-attribution143-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ATTRIBUTION143_SOURCE.json
            ${{ runner.temp }}/ATTRIBUTION143_OUTCOME.json
            ${{ runner.temp }}/ATTRIBUTION143_RESOURCE.txt
          if-no-files-found: warn
