name: IGNITION pre-existing multi-broker stock interface independent control
on:
  pull_request:
    paths:
      - 'products/frontier-omega-ignition/evolution_trials/NUCLEUSWATCH_COMPETENT_INCUMBENT_FROZEN.md'
      - 'products/frontier-omega-ignition/evolution_trials/incumbent_stock_probe.py'
      - 'tests/test_ignition_incumbent_interface_v1.py'
      - '.github/workflows/ignition-incumbent-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-incumbent-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and verify 2026-10-25 public PyPI incumbent wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nucleuswatch-wheel"
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/nucleuswatch-wheel" 'nucleuswatch==1.2.0'
          wheel="$RUNNER_TEMP/nucleuswatch-wheel/nucleuswatch-1.2.0-py3-none-any.whl"
          test -f "$wheel"
          echo "7c578e37ec958008424d02cef843d856f773c87ce4158186e19c836900403ed0  $wheel" | sha256sum --check --status
          python -m pip install "$wheel"
      - name: Exercise finite preregistered stock-output information and positive controls
        run: python -B -m unittest -v tests.test_ignition_incumbent_interface_v1
      - name: Generate version- and wheel-bound zero-network interface receipt
        shell: bash
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/nucleuswatch-wheel/nucleuswatch-1.2.0-py3-none-any.whl"
          python -B products/frontier-omega-ignition/evolution_trials/incumbent_stock_probe.py --verified-wheel "$wheel" --output "$RUNNER_TEMP/INCUMBENT_STOCK_RESULT.json"
          cat "$RUNNER_TEMP/INCUMBENT_STOCK_RESULT.json"
          sha256sum "$RUNNER_TEMP/INCUMBENT_STOCK_RESULT.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ignition-incumbent-stock-interface
          path: ${{ runner.temp }}/INCUMBENT_STOCK_RESULT.json
          retention-days: 30
          if-no-files-found: error
