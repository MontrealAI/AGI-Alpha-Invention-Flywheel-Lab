name: 'AGI ALPHA: native funded complementary outcome cycle 046'
on:
  pull_request:
    paths:
      - 'experiments/arrangement_cycle046.py'
      - 'tests/test_arrangement_cycle046.py'
      - 'docs/harness/ARRANGEMENT_CYCLE046.md'
      - '.github/workflows/arrangement-cycle046.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arrangement046-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  native-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements-commercial010.txt'
      - name: Fixed comparison, conservative lineage and retention regressions
        run: python -m unittest discover -s tests -p 'test_arrangement_cycle046.py' -v
      - name: Six fixed native businesses with accepted work and protected finance
        run: python -m experiments.arrangement_cycle046 run --output "$RUNNER_TEMP/arrangement046"
      - name: Reconstruct source-bound native evidence in a separate process
        run: |
          cd "$RUNNER_TEMP/arrangement046/source"
          python -m experiments.arrangement_cycle046 verify --output "$RUNNER_TEMP/arrangement046" > "$RUNNER_TEMP/arrangement046/public/VERIFY.json"
      - name: Refuse missing outcomes or fabricated actual commerce
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'arrangement046/public'
          r = json.loads((p/'RESULT.json').read_text())
          v = json.loads((p/'VERIFY.json').read_text())
          m = json.loads((p/'MECHANISM.json').read_text())
          assert r['complete'] is True and len(r['worlds']) == 6
          assert v['accepted'] is True and v['worlds'] == 6
          assert r['opening_per_world_microUSD'] == 100_000_000_000
          assert r['external_funding_microUSD'] == 0 and r['actual_customers'] == 0
          assert r['actual_profit_microUSD'] is None
          assert m['current_proof'] is None and m['authority'] == []
          assert m['execution_authority'] is False
          assert all(x['audit_accepted'] is True for x in r['worlds'].values())
          # Correctness, not mandatory economic victory, determines this CI gate.
          PY
      - name: Publish compact complete outcomes only, never native private authority
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arrangement046-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/arrangement046/public/RESULT.json
            ${{ runner.temp }}/arrangement046/public/MECHANISM.json
            ${{ runner.temp }}/arrangement046/public/VERIFY.json
          if-no-files-found: error
          retention-days: 7
