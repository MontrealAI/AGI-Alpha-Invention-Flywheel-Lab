name: EIT192 independent typed AppleDouble metadata preflight
on:
  pull_request:
    paths:
      - 'tools/eit_zip_metadata192.py'
      - 'tests/test_eit_zip_metadata192.py'
      - 'campaign/eit-sidecar-192/**'
      - '.github/workflows/eit-sidecar192.yml'
  push:
    branches:
      - research/eit192-appledouble-classifier-20261119
permissions:
  contents: read
jobs:
  typed-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test exact-head preregistered offline rejection cases
        run: python3 -m unittest discover -s tests -p 'test_eit_zip_metadata192.py' -v
