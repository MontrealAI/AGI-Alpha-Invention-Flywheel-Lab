name: Transition165 owner-source stale cached-prepare review
on:
  pull_request:
    paths:
      - 'docs/transition-stale-prepared165/**'
      - 'tests/test_transition_stale_prepared165.py'
      - '.github/workflows/transition-stale-prepared165.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stale-cached-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record actual hosted execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unchanged original authorization-reuse controls
        run: python -B -m unittest -v tests.test_transition_authorization_reuse
      - name: One preregistered synthetic stale-cached-prepare contract
        run: python -B -m unittest -v tests.test_transition_stale_prepared165
