name: Transition155 sequential pending-upgrade authority review
on:
  pull_request:
    paths:
      - 'tests/test_transition_prepare_serial155.py'
      - 'docs/transition-prepare-race154/SERIAL_REPLAY155.md'
      - '.github/workflows/transition-prepare-serial155.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sequential-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Mark actual GitHub-hosted job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing authorization-reuse controls (no keys)
        run: python -B -m unittest -v tests.test_transition_authorization_reuse
      - name: Preregistered sequential pending-source authority case
        run: python -B -m unittest -v tests.test_transition_prepare_serial155
