name: Governance impact140 exact-source offline qualification
on:
  pull_request:
    paths:
      - 'products/governance_impact140/**'
      - 'tests/test_governance_impact140.py'
      - '.github/workflows/governance-impact140.yml'
      - 'campaign/public-demand140/**'
  push:
    branches: [main]
    paths:
      - 'products/governance_impact140/**'
      - 'tests/test_governance_impact140.py'
      - '.github/workflows/governance-impact140.yml'
      - 'campaign/public-demand140/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-impact140-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record actual hosted execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute frozen negative cases and externally anchored integrity regression
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'process_cpu_user_s=%U process_cpu_system_s=%S wall_s=%e peak_rss_kb=%M' -o "$RUNNER_TEMP/governance140-resources.txt" \
            python -B -m unittest tests.test_governance_impact140 -v 2>&1 | tee "$RUNNER_TEMP/governance140-tests.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/governance140-source-commit.txt"
          git hash-object products/governance_impact140/engine.py tests/test_governance_impact140.py > "$RUNNER_TEMP/governance140-file-blobs.txt"
      - name: Retain key-free source and resource receipts even on test failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance140-exact-head-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/governance140-tests.txt
            ${{ runner.temp }}/governance140-resources.txt
            ${{ runner.temp }}/governance140-source-commit.txt
            ${{ runner.temp }}/governance140-file-blobs.txt
          if-no-files-found: warn
