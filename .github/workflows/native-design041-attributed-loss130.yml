name: Native design041 attributable-loss review130
on:
  pull_request:
    paths:
      - "connected_enterprise/design_flywheel.py"
      - "tests/test_design041_attributed_loss130.py"
      - "docs/design-flywheel041/ATTRIBUTED_LOSS_REVIEW130.md"
      - ".github/workflows/native-design041-attributed-loss130.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-design041-loss130-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-bound-loss-review:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record initial actual runner time
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned native requirements
        run: python -m pip install -r requirements-commercial010.txt
      - name: Original source-041 control and frozen adversarial loss cases
        run: |
          python -m unittest -v tests.test_connected_design_flywheel041
          python -m unittest -v tests.test_design041_attributed_loss130
