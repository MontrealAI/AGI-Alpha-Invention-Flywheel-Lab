name: EIT181 frozen cross-stem ordinary-calibration transfer falsifier
on:
  pull_request:
    paths:
      - 'campaign/eit-transfer181/**'
      - 'research/eit_transfer181.py'
      - 'tests/test_eit_transfer181.py'
      - '.github/workflows/eit-transfer181.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eit-transfer181-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frozen-first-two-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed binary numerical/HDF5 dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1
      - name: Fifteen frozen no-cherrypick and source-integrity controls
        run: python -B -m unittest -v tests.test_eit_transfer181
      - name: One source GET, exactly first two eligible physical stems
        run: python -B -m research.eit_transfer181 --output "$RUNNER_TEMP/EIT181_RECEIPT.json"
      - name: Preserve result or original failure without retry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit181-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/EIT181_RECEIPT.json
          if-no-files-found: warn
