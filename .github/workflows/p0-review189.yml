name: P0-189 self-contained historical proof transport and frozen unsafe controls
on:
  pull_request:
    paths:
      - 'campaign/p0-review189/**'
      - 'connected_enterprise/history_snapshot188.py'
      - 'tests/test_history_snapshot189.py'
      - '.github/workflows/p0-review189.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-review189-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-self-contained-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source identity and fixed proof-transport tests
        run: |
          git rev-parse HEAD
          sha256sum campaign/p0-review189/PROTOCOL.md connected_enterprise/history_snapshot188.py tests/test_history_snapshot189.py
          python -B -m unittest -v tests.test_history_snapshot188 tests.test_history_snapshot189
  original-unsafe-path-unchanged:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Do not suppress the existing P0-187 red
        run: python -B -m unittest -v tests.test_transition_store184 tests.test_transition_cache186 tests.test_transition_cache187
