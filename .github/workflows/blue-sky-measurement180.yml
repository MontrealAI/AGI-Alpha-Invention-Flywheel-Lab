name: Blue Sky 180 unverified two-load intake qualification
on:
  pull_request:
    paths:
      - "research/blue_sky064/MEASUREMENT180_PROTOCOL.md"
      - "research/blue_sky064/measurement180.py"
      - "tests/test_blue_sky_measurement180.py"
      - ".github/workflows/blue-sky-measurement180.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run preregistered synthetic negative and positive tests
        run: python -B -m unittest -v tests.test_blue_sky_measurement180
      - name: Produce synthetic-only conditional report
        shell: bash
        run: |
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          from tests.test_blue_sky_measurement180 import synthetic
          p=Path(os.environ["RUNNER_TEMP"])/"SYNTHETIC_INPUT.json"
          p.write_text(json.dumps(synthetic(),sort_keys=True,allow_nan=False)+"\n")
          PY
          python -B -m research.blue_sky064.measurement180 \
            --input "$RUNNER_TEMP/SYNTHETIC_INPUT.json" \
            --output "$RUNNER_TEMP/MEASUREMENT180_RESULT.json"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"MEASUREMENT180_RESULT.json").read_text())
          assert d["decision"] == "HOLD_NO_DEPLOY_UNVERIFIED_INPUT"
          assert not d["physical_measurement_verified"]
          assert d["conditional_mathematical_assessment"]["conditional_math_verdict"] == "CONDITIONALLY_CERTIFIED"
          PY
      - name: Archive exact bounded public source
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          tar -czf "$RUNNER_TEMP/MEASUREMENT180_SOURCE.tar.gz" \
            research/blue_sky064/observation178.py \
            research/blue_sky064/measurement180.py \
            research/blue_sky064/MEASUREMENT180_PROTOCOL.md \
            campaign/blue-sky-064/friction-probe/MIXED_REGISTRATION.json \
            tests/test_blue_sky_measurement180.py
          (cd "$RUNNER_TEMP"; sha256sum MEASUREMENT180_SOURCE.tar.gz > MEASUREMENT180_SOURCE.sha256)
      - name: Preserve small source and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blue-sky-measurement180-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/MEASUREMENT180_SOURCE.tar.gz
            ${{ runner.temp }}/MEASUREMENT180_SOURCE.sha256
            ${{ runner.temp }}/SYNTHETIC_INPUT.json
            ${{ runner.temp }}/MEASUREMENT180_RESULT.json
          if-no-files-found: warn
  independent-clean-source:
    needs: source-bound
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blue-sky-measurement180-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/public-slice
      - name: SHA-verify and extract self-contained source
        shell: bash
        run: |
          cd "$RUNNER_TEMP/public-slice"
          sha256sum -c MEASUREMENT180_SOURCE.sha256
          mkdir source
          tar -xzf MEASUREMENT180_SOURCE.tar.gz -C source
          test ! -e source/.git
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent synthetic validation and reproducibility
        working-directory: ${{ runner.temp }}/public-slice/source
        shell: bash
        run: |
          python -B -m unittest discover -s tests -p 'test_blue_sky_measurement180.py' -v
          python -B -m research.blue_sky064.measurement180 \
            --input "$RUNNER_TEMP/public-slice/SYNTHETIC_INPUT.json" \
            --output "$RUNNER_TEMP/REPLAY180.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          source=json.loads((root/"public-slice/MEASUREMENT180_RESULT.json").read_text())
          replay=json.loads((root/"REPLAY180.json").read_text())
          assert source == replay, "INDEPENDENT_CONDITIONAL_REPORT_MISMATCH"
          assert source["decision"] == "HOLD_NO_DEPLOY_UNVERIFIED_INPUT"
          assert source["physical_measurement_verified"] is False
          print("INDEPENDENT_UNVERIFIED_INTAKE_REPLAY_PASS")
          PY
