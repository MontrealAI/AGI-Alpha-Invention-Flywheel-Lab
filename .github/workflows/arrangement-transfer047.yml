name: 'AGI ALPHA: retained arrangement and native scale comparison 047'
on:
  pull_request:
    paths:
      - 'experiments/arrangement_transfer047.py'
      - 'experiments/arrangement_cycle046.py'
      - 'tests/test_arrangement_transfer047.py'
      - 'campaign/arrangement-transfer-047/**'
      - 'docs/harness/ARRANGEMENT_TRANSFER047.md'
      - '.github/workflows/arrangement-transfer047.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arrangement-transfer047-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  native-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Qualification and empty-authority regressions
        run: |
          python -m unittest discover -s tests -p 'test_arrangement_cycle046.py' -v
          python -m unittest discover -s tests -p 'test_arrangement_transfer047.py' -v
      - name: Execute nine fixed native worlds without changing seeds
        run: python -m experiments.arrangement_transfer047 run --output "$RUNNER_TEMP/arrangement047"
      - name: Independently rederive native outcomes and adoption decision
        run: |
          cd "$RUNNER_TEMP/arrangement047/source"
          python -m experiments.arrangement_transfer047 verify --output "$RUNNER_TEMP/arrangement047" > "$RUNNER_TEMP/arrangement047/public/VERIFY.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: arrangement047-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/arrangement047/public/RESULT.json
            ${{ runner.temp }}/arrangement047/public/ADOPTION.json
            ${{ runner.temp }}/arrangement047/public/VERIFY.json
          if-no-files-found: error
          retention-days: 7
