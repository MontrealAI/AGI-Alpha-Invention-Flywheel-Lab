name: Outlearning interoperation source and economic qualification
on:
  pull_request:
    paths:
      - 'experiments/outlearning_20261102_906c4f4d/**'
      - 'commercial/ledger.py'
      - 'connected_enterprise/finance.py'
      - 'connected_enterprise/runner.py'
      - '.github/workflows/outlearning-906c4f4d.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing pinned CPU runtime
        run: python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r requirements-cycle004.txt
      - name: Independent outcome and native-boundary checks
        run: python -m unittest discover -s experiments/outlearning_20261102_906c4f4d -t . -p 'test_*.py' -v
      - name: Reproduce frozen comparison
        run: |
          FREEZE=$(python -c "from commercial.ledger import digest,strict_json;from pathlib import Path;print(digest(strict_json(Path('experiments/outlearning_20261102_906c4f4d/FREEZE.json').read_bytes())))")
          python -m experiments.outlearning_20261102_906c4f4d.study run --output "$RUNNER_TEMP/outlearning" --expected-freeze "$FREEZE" --label reproduction
          python -m experiments.outlearning_20261102_906c4f4d.independent_replay --output "$RUNNER_TEMP/outlearning" --expected-freeze "$FREEZE" --receipt "$RUNNER_TEMP/outlearning/INDEPENDENT_REPLAY.json"
      - name: Retain compact public qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outlearning-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/outlearning/SCIENCE.json
            ${{ runner.temp }}/outlearning/ECONOMICS.json
            ${{ runner.temp }}/outlearning/EXECUTION.json
            ${{ runner.temp }}/outlearning/FAILURE.json
            ${{ runner.temp }}/outlearning/INDEPENDENT_REPLAY.json
          if-no-files-found: error
