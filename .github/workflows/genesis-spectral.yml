name: GENESIS raw spectral possibility test
on:
  pull_request:
    paths:
      - 'research/genesis_spectral/**'
      - '.github/workflows/genesis-spectral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/genesis_spectral/requirements.txt
      - run: python -B -m unittest discover -s research/genesis_spectral -p 'test_*.py' -v
      - run: python -O -B -m unittest discover -s research/genesis_spectral -p 'test_*.py' -v
      - name: Execute the frozen raw-data comparison
        run: python -B research/genesis_spectral/study.py --out "$RUNNER_TEMP/spectral-result"
      - name: Prepare public source and compact evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/spectral-export/source"
          cp research/genesis_spectral/*.py research/genesis_spectral/*.json research/genesis_spectral/*.md research/genesis_spectral/requirements.txt "$RUNNER_TEMP/spectral-export/source/"
          git rev-parse HEAD > "$RUNNER_TEMP/spectral-export/COMMIT.txt"
          if [ -d "$RUNNER_TEMP/spectral-result" ]; then
            cp "$RUNNER_TEMP/spectral-result/"*.json "$RUNNER_TEMP/spectral-export/" || true
            cp "$RUNNER_TEMP/spectral-result/"*.csv "$RUNNER_TEMP/spectral-export/" || true
            cp "$RUNNER_TEMP/spectral-result/"*.html "$RUNNER_TEMP/spectral-export/" || true
          fi
      - name: Retain compact research evidence (failure remains failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-spectral-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spectral-export/
          if-no-files-found: error
          retention-days: 7
