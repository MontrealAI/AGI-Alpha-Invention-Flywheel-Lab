name: Omega 201 independent committed-crash review
on:
  pull_request:
    paths:
      - 'tests/test_omega_crash_recovery_review.py'
      - '.github/workflows/omega-crash-review.yml'
      - 'mechanism_harness/inventor_native.py'
      - 'mechanism_harness/inventor_cost_audit.py'
      - 'connected_enterprise/finance.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-committed-crash-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  committed-interruptions:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing project dependencies
        run: python -m pip install -r requirements-commercial010.txt
      - name: Test committed crash and exact original-account reopen
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m unittest discover -s tests -p test_omega_crash_recovery_review.py -v
