name: EIT191 public procurement admissibility (no bids or revenue)
on:
  push:
    branches: [research/eit191-procurement-admissibility-20261119]
    paths:
      - 'campaign/eit-commercial191/**'
      - 'research/eit_commercial191/**'
      - 'tests/test_eit_commercial191.py'
      - '.github/workflows/eit-commercial191.yml'
  pull_request:
    paths:
      - 'campaign/eit-commercial191/**'
      - 'research/eit_commercial191/**'
      - 'tests/test_eit_commercial191.py'
      - '.github/workflows/eit-commercial191.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-adverse-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact head and run 10 adverse tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_eit_commercial191
  finite-evidence-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute finite no-bid gate against frozen exposed notices
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          /usr/bin/time -f 'wall_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' -o "$RUNNER_TEMP/EIT191_RESOURCES.txt" python -B -m research.eit_commercial191.gate --out "$RUNNER_TEMP/EIT191_DECISION.json"
          python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'EIT191_DECISION.json').read_text()); assert r['selected']=='no_deploy_no_bid' and not r['three_billion_target_achieved'] and len(r['comparisons'])==4"
      - name: Preserve exact-head decision, hashes and measured resources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit191-admissibility-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EIT191_DECISION.json
            ${{ runner.temp }}/EIT191_RESOURCES.txt
          if-no-files-found: warn
          retention-days: 14
