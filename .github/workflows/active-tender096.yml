name: ActiveTender096 fixed official public tender-stage observation
on:
  pull_request:
    paths:
      - 'research/active_tender096.py'
      - 'tests/test_active_tender096.py'
      - 'campaign/omega-active-tender096/**'
      - '.github/workflows/active-tender096.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  active-tender096:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Record platform execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run 14 frozen adversarial scenarios and retain original 095 controls
        run: |
          python -m unittest discover -s tests -p 'test_active_tender096.py' -v
          python -m unittest discover -s tests -p 'test_public_notice095.py' -v
      - name: Execute exactly one fixed public OCDS search and five-or-fewer record GETs
        run: |
          python -m research.active_tender096 --out "$RUNNER_TEMP/active-tender096.json"
          python - "$RUNNER_TEMP/active-tender096.json" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["decision"]=="RESEARCH_ONLY_NO_BID" and x["genuine_buyer_commitments"]==0
          assert len(x["records"]) <= 5 and x["all_registered_source_retrievals_succeeded"]
          assert all(r["decision"]=="RESEARCH_ONLY_NO_BID" and not r["authorized_bid_or_purchase"] for r in x["records"])
          print({"selected":len(x["records"]),"unverified_future_deadlines":x.get("public_future_deadline_unverified_fit_count"),"no_bid":True})
          PY
      - name: Preserve compact outcome including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: active-tender096-source-bound-result-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/active-tender096.json
          if-no-files-found: warn
