name: AWARD-DEMAND213 public federal award-history experiment

on:
  pull_request:
    paths:
      - ".github/workflows/award-demand213.yml"
      - "campaign/award-demand213/**"
      - "tools/award_demand213.py"
      - "tests/test_award_demand213.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-once:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform-window start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout exact observed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run fixed offline unit and adversarial cases
        run: python3 -B -m unittest -v tests.test_award_demand213
      - name: ONE official CanadaBuys award-source GET with immutable receipt
        shell: bash
        run: |
          set +e
          python3 -B tools/award_demand213.py fetch --out "$RUNNER_TEMP/award-demand213" > "$RUNNER_TEMP/RECEIPT_STDOUT.json" 2> "$RUNNER_TEMP/ERROR.txt"
          rc=$?
          echo "Observation exit: $rc (no retry)"
          if [ "$rc" -eq 0 ]; then
            python3 -B tools/award_demand213.py verify --out "$RUNNER_TEMP/award-demand213" > "$RUNNER_TEMP/VERIFIED.json"
          else
            cat "$RUNNER_TEMP/ERROR.txt"
            exit "$rc"
          fi
      - name: Preserve bounded source and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: award-demand213-source-bound-observation
          path: |
            ${{ runner.temp }}/award-demand213/SOURCE.csv
            ${{ runner.temp }}/award-demand213/RECEIPT.json
            ${{ runner.temp }}/RECEIPT_STDOUT.json
            ${{ runner.temp }}/VERIFIED.json
            ${{ runner.temp }}/ERROR.txt
          if-no-files-found: warn
          retention-days: 7
