name: Adaptive 012 operating and account qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: adaptive012-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  adaptive-current:
    if: github.head_ref != 'verify/adaptive012-public-package'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-commercial010.txt
      - name: Current adaptive behavior, ownership, inference and obligations
        run: python3 -m unittest discover -s tests -p 'test_adaptive*.py' -v
      - name: Imported allocation and ownership actual discovery
        run: |
          python3 -m unittest discover -s tests -p 'test_transformational_portfolio.py' -v
          python3 -m unittest discover -s tests -p 'test_tape_writer_lease.py' -v
          python3 -m unittest discover -s tests -p 'test_commercial010_owned_exchange.py' -v
      - name: Current default end-to-end operating edition
        run: |
          python3 -m adaptive_enterprise run --output "$RUNNER_TEMP/adaptive012-current"
          python3 -m adaptive_enterprise audit --financial-only --output "$RUNNER_TEMP/adaptive012-current"
      - name: Clean no-Git route and independent owned financial audit
        run: |
          mkdir "$RUNNER_TEMP/adaptive012-no-git"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/adaptive012-no-git"
          cd "$RUNNER_TEMP/adaptive012-no-git"
          python3 -m adaptive_enterprise run --smoke --output "$RUNNER_TEMP/adaptive012-clean"
          python3 -m adaptive_enterprise audit --output "$RUNNER_TEMP/adaptive012-clean"
      - name: Preserve public key-free evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive012-${{ github.sha }}
          path: |
            ${{ runner.temp }}/adaptive012-current
            ${{ runner.temp }}/adaptive012-clean
            !${{ runner.temp }}/**/*.adaptive-simulation-key
          if-no-files-found: warn
