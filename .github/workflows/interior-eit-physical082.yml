name: Interior EIT 082 physical observation and independent replay
on:
  pull_request:
    paths:
      - 'experiments/interior_eit082/**'
      - '.github/workflows/interior-eit-physical082.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interior-eit082-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  preregistered-physical-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install finite scientific dependencies, no model API
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Source/protocol and adversarial engineering regressions
        run: python -m unittest discover -s experiments/interior_eit082 -p 'test_run.py' -v
      - name: Acquire the registered 406 KB public physical KIT4 measurement archive
        shell: bash
        run: |
          curl -fLsS --connect-timeout 20 --max-time 120 'https://zenodo.org/records/1203914/files/data_mat_files.zip?download=1' -o "$RUNNER_TEMP/eit082-source.zip"
          echo 'ad9f03325cafc9aae8c0149927de8e06  '"$RUNNER_TEMP/eit082-source.zip" | md5sum --check -
      - name: One frozen physical test and replay from identical public bytes
        shell: bash
        run: |
          python experiments/interior_eit082/run.py run --archive "$RUNNER_TEMP/eit082-source.zip" --output "$RUNNER_TEMP/EIT082_RESULT.json"
          python experiments/interior_eit082/run.py audit --archive "$RUNNER_TEMP/eit082-source.zip" --receipt "$RUNNER_TEMP/EIT082_RESULT.json"
      - name: Preserve compact key-free successful scientific receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interior-eit082-physical-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/EIT082_RESULT.json
          if-no-files-found: error
