name: Omega native single-cohort three-arm ablation
on:
  push:
    branches:
      - research/omega-one-tranche-causal-ablation-20261107
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check immutable source and unchanged finance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show d6677522e8872dc47bd678f56e53b368171a6fcf:campaign/omega-trial-once-20261107/PROTOCOL.md > "$RUNNER_TEMP/preregistered.md"
          cmp "$RUNNER_TEMP/preregistered.md" campaign/omega-trial-once-20261107/PROTOCOL.md
          test -z "$(git diff --name-only 2d1b3a2c1dab8235f2c7bef40bf9a36da1d62d7d HEAD -- adaptive_enterprise commercial connected_enterprise)"
      - name: Install pinned dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-omega-mechanisms-v3.txt'
      - name: Execute source-bound adversarial and existing policy tests
        run: python -B -m unittest tests.test_omega_trial_once_20261107 tests.test_omega_reach_policy tests.test_omega_reach_verify tests.test_omega_reach_native -v
      - name: Preflight repository-root report module import
        run: python -B -c 'import scripts.omega_trial_once_matrix'
      - name: Operate audit and resume all fixed native accounts
        run: |
          set -euo pipefail
          umask 077
          for scenario in central weak copycat no_demand failed_activation; do
            case_root="$RUNNER_TEMP/ablation-$scenario"
            mkdir -p "$case_root"
            for arm in organic trial_once pilot; do
              /usr/bin/time -v python -B -m mechanism_harness.reach_native run "$case_root/$arm" --arm "$arm" --scenario "$scenario"
              python -B -m mechanism_harness.reach_native audit "$case_root/$arm"
              python -B -m mechanism_harness.reach_native resume "$case_root/$arm"
            done
            python -B -m scripts.omega_trial_once_matrix --private-root "$case_root" --scenario "$scenario" --source-commit "$GITHUB_SHA" --public-output "$RUNNER_TEMP/public-$scenario.json"
          done
      - name: Upload key-free results only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-trial-once-public
          path: ${{ runner.temp }}/public-*.json
          if-no-files-found: error
