name: Omega native one-tranche policy ablation 20261107
on:
  push:
    branches: [research/omega-one-tranche-causal-ablation-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preregistration-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require immutable preregistration and no financial source overlap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d6677522e8872dc47bd678f56e53b368171a6fcf HEAD
          git show d6677522e8872dc47bd678f56e53b368171a6fcf:campaign/omega-trial-once-20261107/PROTOCOL.md > "$RUNNER_TEMP/FROZEN.md"
          cmp "$RUNNER_TEMP/FROZEN.md" campaign/omega-trial-once-20261107/PROTOCOL.md
          test -z "$(git diff --name-only 2d1b3a2c1dab8235f2c7bef40bf9a36da1d62d7d HEAD -- adaptive_enterprise commercial connected_enterprise)"
          sha256sum campaign/omega-trial-once-20261107/PROTOCOL.md mechanism_harness/reach_policy.py mechanism_harness/reach_native.py mechanism_harness/reach_verify.py tests/test_omega_trial_once_20261107.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned existing dependencies
        run: python -m pip install --only-binary=:all: -r requirements-omega-mechanisms-v3.txt
      - name: Existing and new independent source-bound tests
        run: |
          /usr/bin/time -v python -B -m unittest tests.test_omega_trial_once_20261107 tests.test_omega_reach_policy tests.test_omega_reach_verify tests.test_omega_reach_native -v

  paired-native-businesses:
    needs: [preregistration-and-regressions]
    strategy:
      fail-fast: false
      matrix:
        scenario: [central, weak, copycat, no_demand, failed_activation]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MATRIX_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned existing dependencies
        run: python -m pip install --only-binary=:all: -r requirements-omega-mechanisms-v3.txt
      - name: Operate three separate matched native accounts, independently audit and resume
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          output_root="$RUNNER_TEMP/trial-once-$MATRIX_SCENARIO"
          mkdir -p "$output_root"
          for arm in organic trial_once pilot; do
            /usr/bin/time -v python -B -m mechanism_harness.reach_native run "$output_root/$arm" --arm "$arm" --scenario "$MATRIX_SCENARIO"
            /usr/bin/time -v python -B -m mechanism_harness.reach_native audit "$output_root/$arm"
            /usr/bin/time -v python -B -m mechanism_harness.reach_native resume "$output_root/$arm"
          done
          export PUBLIC_EVIDENCE="$RUNNER_TEMP/public-ablation-$MATRIX_SCENARIO.json"
          export PRIVATE_ROOT="$output_root"
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['PRIVATE_ROOT'])
          arms=('organic','trial_once','pilot')
          reports={a:json.loads((root/a/'REPORT.json').read_text()) for a in arms}
          decisions={a:json.loads((root/a/'PLAN.json').read_text())['decisions'] for a in arms}
          orders={a:json.loads((root/a/'ORDERS.json').read_text()) for a in arms}
          for a in arms:
              assert reports[a]['arm']==a
              assert reports[a]['scenario']==os.environ['MATRIX_SCENARIO']
              assert len(decisions[a])==2
          assert decisions['trial_once'][0]['policy']['action']==decisions['pilot'][0]['policy']['action']
          assert decisions['trial_once'][1]['policy']['action']=='SKIP'
          assert decisions['trial_once'][1]['policy']['reason']=='REGISTERED_ONE_TRANCHE'
          assert all(d['policy']['action']=='SKIP' for d in decisions['organic'])
          assert [o for o in orders['trial_once'] if o['day']<118]==[o for o in orders['pilot'] if o['day']<118]
          def select(a):
              s=reports[a]['native_summary']
              return {'modeled_aftertax_profit_microUSD':s['profit'],
                      'collections_microUSD':s['collections'],'revenue_microUSD':s['revenue'],
                      'expenses_microUSD':s['expenses'],'cash_microUSD':s['cash'],
                      'available_microUSD':s['available'],'earned_available_microUSD':s['unrestrictedEarned'],
                      'tail_reserve_microUSD':s['tailReserve'],'payables_microUSD':s['payables'],
                      'settled_baskets':reports[a]['settled'],'paid_invoices_microUSD':reports[a]['invoice_microUSD'],
                      'contacts':reports[a]['contacts'],
                      'first_action':decisions[a][0]['policy']['action'],
                      'renewal_action':decisions[a][1]['policy']['action']}
          results={a:select(a) for a in arms}
          pairs={}
          for a,c in (('trial_once','organic'),('pilot','trial_once'),('pilot','organic')):
              pairs[a+'_minus_'+c]={'profit_microUSD':results[a]['modeled_aftertax_profit_microUSD']-results[c]['modeled_aftertax_profit_microUSD'],
                                   'settled_baskets':results[a]['settled_baskets']-results[c]['settled_baskets'],
                                   'available_microUSD':results[a]['available_microUSD']-results[c]['available_microUSD']}
          doc={'schema':'agi-alpha/omega-trial-once-keyfree-matched-ablation/v1',
               'source_commit':os.environ['GITHUB_SHA'],
               'scenario':os.environ['MATRIX_SCENARIO'],
               'seed_scope':'EXPOSED_ENGINEERING_REPRODUCTION_NOT_NEW_DEMAND',
               'native_accounts_executed':3,'matched':True,'three_arms':results,'paired_differences':pairs,
               'status':'EXECUTED_AUDITED_RESUMED','real_paid_customers':0,
               'US3B_target_established':False,'model_host_billing_USD':None}
          Path(os.environ['PUBLIC_EVIDENCE']).write_text(json.dumps(doc,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'scenario':doc['scenario'],'paired_differences':pairs,'no_real_commerce':True},sort_keys=True))
          PY
      - name: Upload key-free allowlisted comparison only, never private accounts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-trial-once-public-${{ matrix.scenario }}-${{ github.sha }}
          path: ${{ runner.temp }}/public-ablation-${{ matrix.scenario }}.json
          if-no-files-found: error
