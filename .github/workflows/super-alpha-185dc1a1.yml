name: Super Alpha confidential-production decisive replay
on:
  pull_request:
    paths:
      - 'experiments/super_alpha_20261103_185dc1a1/**'
      - '.github/workflows/super-alpha-185dc1a1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registered-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test independent outcomes, disclosure and native continuity
        run: python -m unittest -v experiments.super_alpha_20261103_185dc1a1.test_mechanism experiments.super_alpha_20261103_185dc1a1.test_finance
      - name: Reproduce every registered case on the exact PR source
        env:
          EXECUTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m experiments.super_alpha_20261103_185dc1a1.run --output "$RUNNER_TEMP/super-alpha-evidence" --source-commit "$EXECUTED_SHA"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = json.loads(Path('experiments/super_alpha_20261103_185dc1a1/evidence/SUMMARY.json').read_text())
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'super-alpha-evidence/RESULTS.json').read_text())
          assert expected['source_hashes'] == actual['source']['source_hashes'], 'EXECUTABLE_SOURCE_MISMATCH'
          semantic = {key: value for key, value in actual.items() if key not in {'source', 'telemetry', 'ordinary_reuse_cache'}}
          digest = hashlib.sha256(json.dumps(semantic, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()).hexdigest()
          assert digest == expected['semantic_results_sha256'], 'COMPLETE_REGISTERED_RESULT_MISMATCH'
          print(json.dumps({'independent_reproduction': 'accepted', 'semantic_sha256': digest, 'cases': actual['complete_cases_independently_checked']}))
          PY
      - name: Independently replay the original key-free native research history
        run: |
          python -m experiments.super_alpha_20261103_185dc1a1.finance audit-public --root "$GITHUB_WORKSPACE" --evidence experiments/super_alpha_20261103_185dc1a1/evidence/FINANCE_PUBLIC.json
