name: Enterprise 011 current qualification

on:
  pull_request:
  push:
    branches:
      - campaign/autonomous-enterprise-011
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enterprise-current:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native protected exchange dependency
        run: python3 -m pip install -r requirements-commercial010.txt
      - name: Current enterprise behavioral suites
        run: python3 -m unittest discover -s tests -p 'test_enterprise*.py' -v
      - name: Imported hardened portfolio 25 suites
        run: python3 -m unittest discover -s portfolio25 -p 'test_*.py' -v
      - name: Imported open-ended portfolio suites
        run: python3 -m unittest discover -s portfolio_scale -p 'test_*.py' -v
      - name: Lossless public package transport
        run: python3 -m unittest discover -s tests -p 'test_package_transport011.py' -v
      - name: Current documented command
        run: python3 -m enterprise run --output /tmp/enterprise011-ci
      - name: Clean no-Git archive replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/enterprise011-clean-source
          git archive HEAD | tar -x -C /tmp/enterprise011-clean-source
          cd /tmp/enterprise011-clean-source
          test ! -e .git
          python3 -m enterprise run --output /tmp/enterprise011-ci-archive
      - name: Preserve current run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise011-current-${{ github.sha }}
          path: |
            /tmp/enterprise011-ci
            /tmp/enterprise011-ci-archive
          if-no-files-found: warn

  publish-approved-enterprise:
    needs: enterprise-current
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-commercial010.txt
      - name: Verify the committed source-bound package and exact current implementation
        run: |
          python3 scripts/reassemble_enterprise011.py --manifest artifacts/enterprise011-parts/INDEX.json --output artifacts/AGI_ALPHA_Enterprise_011_source_evidence.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path.cwd()
          binding=json.loads((root/'artifacts/ENTERPRISE011_PACKAGE.json').read_text())
          archive=root/binding['path']
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==binding['sha256']
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              frozen=json.loads(z.read('FROZEN.json'))
              for path,expected in frozen['source']['files'].items():
                  assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,path
          PY
      - name: Publish the approved immutable successor once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=autonomous-enterprise-011-20261030-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing enterprise-011 release preserved; no assets overwritten.'
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Tag exists without a release; refuse to reuse it.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/enterprise011-release"
          cp artifacts/AGI_ALPHA_Enterprise_011_source_evidence.zip artifacts/ENTERPRISE011_PACKAGE.json "$RUNNER_TEMP/enterprise011-release/"
          cp docs/research/enterprise-011/enterprise-011.pdf docs/research/enterprise-011/enterprise-011.tex docs/research/enterprise-011/enterprise-011.html docs/research/enterprise-011/enterprise-011.md docs/research/enterprise-011/enterprise-011.inputs.json docs/research/enterprise-011/PDF_QA.json "$RUNNER_TEMP/enterprise011-release/"
          cp evidence/enterprise011/QUALIFICATION.json "$RUNNER_TEMP/enterprise011-release/"
          python3 - "$RUNNER_TEMP/enterprise011-release" <<'PY'
          import hashlib,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.is_file()))
          PY
          gh release create "$tag" "$RUNNER_TEMP/enterprise011-release/"* --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA: conditional simulated commercial flywheel 011' --notes-file campaign/enterprise-011/RELEASE_NOTES.md
