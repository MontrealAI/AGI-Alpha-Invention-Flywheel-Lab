name: Historical enterprise 011 frozen package replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-011:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-commercial010.txt
      - name: Reassemble the unchanged qualified historical source and evidence
        run: |
          python3 scripts/reassemble_enterprise011.py --manifest artifacts/enterprise011-parts/INDEX.json --output "$RUNNER_TEMP/enterprise011.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/enterprise011.zip" "$RUNNER_TEMP/frozen011"
          cd "$RUNNER_TEMP/frozen011/source"
          python3 -m enterprise audit --output "$RUNNER_TEMP/frozen011"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical-enterprise011-${{ github.sha }}
          path: ${{ runner.temp }}/frozen011
          if-no-files-found: warn
