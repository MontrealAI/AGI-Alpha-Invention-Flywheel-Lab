        run: python scripts/release_connected014.py compact-failure --assets "$RUNNER_TEMP/actual-release-download" --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/downloaded-release-operation"
      - name: Retain only compact failure lesson
