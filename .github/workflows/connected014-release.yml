      - name: Operate the five-route computational service from the actual downloaded release
        id: released_portfolio
        working-directory: ${{ runner.temp }}/downloaded-release-operation/source
        run: |
          python -m unittest tests.test_public_portfolio_20261102 -v
          python -m unittest experiments.public_portfolio_20261102.verification.test_dispatch_case experiments.public_portfolio_20261102.verification.test_finalize_run -v
          python experiments/public_portfolio_20261102/verification/r2_guard_tests_002.py --output "$RUNNER_TEMP/released-portfolio-guards.json"
          python experiments/public_portfolio_20261102/verification/verify_artifacts.py --output "$RUNNER_TEMP/released-portfolio-artifacts.json"
      - name: Stage exact historical R2 recovery source without changing candidate source
        run: |
          mkdir "$RUNNER_TEMP/historical-portfolio-source"
          git archive 8144ece4906b994a6957694e5469c67ab4d0ceb6 | tar -x -C "$RUNNER_TEMP/historical-portfolio-source"
          cd "$RUNNER_TEMP/historical-portfolio-source"
          python - <<'PYH'
          import json, os
          from pathlib import Path
          from connected_enterprise.finance import source_identity
          from experiments.public_portfolio_20261102 import recovery_run, service
          root = Path.cwd()
          products = json.loads((root / service.PREFIX / 'PRODUCTS.json').read_text())
          if isinstance(products, dict):
              products = products['products']
          manifest = service.prepare_manifest(root, products, 'historical-source-preflight')
          identity = source_identity(root, manifest)
          expected = 'bb74d40f7a84ca155189f908c091db32b27093e203e0d63696f327a9a2492901'
          if identity['sha256'] != expected or recovery_run.EXPECTED_NATIVE_SOURCE != expected:
              raise ValueError('EXACT_HISTORICAL_R2_NATIVE_SOURCE_REQUIRED')
          import hashlib
          candidate = Path(os.environ['RUNNER_TEMP']) / 'downloaded-release-operation/source'
          helpers = (
              'experiments/public_portfolio_20261102/recovery_run.py',
              'experiments/public_portfolio_20261102/recovery_fast.py',
              'experiments/public_portfolio_20261102/verification/test_recovery.py',
              'experiments/public_portfolio_20261102/verification/test_recovery_fast.py',
              'experiments/public_portfolio_20261102/verification/r2_recheck_retained.py',
              'experiments/public_portfolio_20261102/verification/r2_recheck_recovered_retained.py',
              'experiments/public_portfolio_20261102/verification/r2_additional_recovery_replay.py',
              'experiments/public_portfolio_20261102/verification/r2_recovery_actual_audit.py',
              'experiments/public_portfolio_20261102/verification/r2_stream_audit.py',
              'experiments/public_portfolio_20261102/verification/verify_finance.py',
              'experiments/public_portfolio_20261102/verification/verify_science.py',
          )
          helper_hashes = {}
          for relative in helpers:
              shipped, frozen = candidate / relative, root / relative
              if shipped.is_symlink() or not shipped.is_file() or shipped.read_bytes() != frozen.read_bytes():
                  raise ValueError('FROZEN_HISTORICAL_HELPER_CHANGED:' + relative)
              helper_hashes[relative] = hashlib.sha256(shipped.read_bytes()).hexdigest()
          receipt = {'source_commit': '8144ece4906b994a6957694e5469c67ab4d0ceb6',
                     'native_source_sha256': expected,
                     'shipped_historical_helper_hashes': helper_hashes,
                     'scope': 'Frozen historical recovery and retained-account controls only; separate from candidate and downloaded-release operation.'}
          (Path(os.environ['RUNNER_TEMP']) / 'historical-portfolio-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYH
      - name: Qualify historical recovery against its unchanged source identity
        working-directory: ${{ runner.temp }}/historical-portfolio-source
        run: |
