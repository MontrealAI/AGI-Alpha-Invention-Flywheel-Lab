name: Connected 014 immutable release and downloaded operation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connected014-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      qualified_artifact_id: ${{ steps.release_assets.outputs.artifact-id }}
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r requirements-cycle004.txt numpy==2.3.5 scipy==1.17.0
      - name: Release integrity and source-bound finance/lifecycle regressions
        run: python -m unittest discover -s tests -p 'test_connected*.py' -v
      - name: GENESIS native and release-boundary regressions
        run: python -m unittest discover -s tests -p 'test_genesis*.py' -v
      - name: Operate exact clean package, resume and independently audit public copy
        run: python scripts/qualify_connected014.py --smoke --output "$RUNNER_TEMP/connected014-qualified"
      - name: Isolate prepublication native design source without modifying canonical extracted release
        run: |
          python -B - <<'PY_NATIVE_SOURCE'
          import json, os
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.release_connected014 import archive_manifest, checked_members
          temp = Path(os.environ['RUNNER_TEMP'])
          archive = temp / 'connected014-qualified/connected014-source.zip'
          destination = temp / 'native-design041-prepublication-source'
          if destination.exists() or destination.is_symlink():
              raise FileExistsError('FRESH_ISOLATED_NATIVE_SOURCE_REQUIRED')
          manifest = archive_manifest(archive)
          with ZipFile(archive) as z:
              checked_members(z)
              z.extractall(destination)
          expected = set(manifest['files']) | {'SOURCE_MANIFEST.json'}
          actual = {p.relative_to(destination).as_posix() for p in destination.rglob('*') if p.is_file()}
          if actual != expected or json.loads((destination / 'SOURCE_MANIFEST.json').read_text()) != manifest:
              raise ValueError('ISOLATED_SOURCE_SNAPSHOT_MISMATCH')
          if any((p / '.git').exists() for p in (destination, *destination.parents)):
              raise ValueError('ISOLATED_SOURCE_MUST_NOT_HAVE_GIT')
          print(json.dumps({'scope':'isolated_source_for_synthetic_service_fixture_generation',
                            'phase':'prepublication', 'files':len(manifest['files']),
                            'source_sha256':manifest['executing_source']['sha256']},sort_keys=True))
          PY_NATIVE_SOURCE
      - name: Qualify native design041 from the exact clean prepublication archive
        working-directory: ${{ runner.temp }}/native-design041-prepublication-source
        run: |
          python -B -m unittest -v tests.test_connected_design_flywheel041
          python -B -m connected_enterprise.design_flywheel demo --output "$RUNNER_TEMP/native-design041-prepublication"
          python -B -m connected_enterprise.design_flywheel verify --output "$RUNNER_TEMP/native-design041-prepublication"
      - name: Verify exact extracted-source membership after native-design
        working-directory: ${{ runner.temp }}/connected014-qualified/extracted-source
        run: |
          python -B - <<'PY_EXACT'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          manifest = json.loads((root / "SOURCE_MANIFEST.json").read_text())
          expected = set(manifest["files"]) | {"SOURCE_MANIFEST.json"}
          actual = {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}
          def safe_name(name):
              if any(token in name.lower() for token in ("key", "secret", "private", "credential", "sqlite", "account")):
                  return "REDACTED_SHA256:" + hashlib.sha256(name.encode()).hexdigest()[:16]
              return name
          unexpected = sorted(actual - expected)
          missing = sorted(expected - actual)
          print(json.dumps({"stage":"native-design", "unexpected_count":len(unexpected),
                            "unexpected":list(map(safe_name,unexpected[:40])),
                            "missing_count":len(missing),
                            "missing":list(map(safe_name,missing[:40]))},sort_keys=True))
          if unexpected or missing:
              raise SystemExit("EXACT_EXTRACTED_SOURCE_REQUIRED_AFTER_NATIVE_DESIGN")
          PY_EXACT
      - name: Verify bundled developer regressions from exact clean source (closure 123)
        working-directory: ${{ runner.temp }}/connected014-qualified/extracted-source
        run: |
          python -B -m unittest \
            tests.test_connected_p0_source_guard \
            tests.test_connected_lifecycle \
            tests.test_connected_recovery_preflight \
            tests.test_connected_release -v
      - name: Qualify V4 from the exact clean source archive
        run: |
          python "$RUNNER_TEMP/connected014-qualified/extracted-source/scripts/qualify_omega_release.py" --source "$RUNNER_TEMP/connected014-qualified/extracted-source" --archive "$RUNNER_TEMP/connected014-qualified/connected014-source.zip" --output "$RUNNER_TEMP/omega-v4-qualified" --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          cp "$RUNNER_TEMP/omega-v4-qualified/QUALIFICATION.json" "$RUNNER_TEMP/connected014-qualified/OMEGA_V4_QUALIFICATION.json"
      - name: Verify exact extracted-source membership after omega-v4
        working-directory: ${{ runner.temp }}/connected014-qualified/extracted-source
        run: |
          python -B - <<'PY_EXACT'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          manifest = json.loads((root / "SOURCE_MANIFEST.json").read_text())
          expected = set(manifest["files"]) | {"SOURCE_MANIFEST.json"}
          actual = {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}
          def safe_name(name):
              if any(token in name.lower() for token in ("key", "secret", "private", "credential", "sqlite", "account")):
                  return "REDACTED_SHA256:" + hashlib.sha256(name.encode()).hexdigest()[:16]
              return name
          unexpected = sorted(actual - expected)
          missing = sorted(expected - actual)
          print(json.dumps({"stage":"omega-v4", "unexpected_count":len(unexpected),
                            "unexpected":list(map(safe_name,unexpected[:40])),
                            "missing_count":len(missing),
                            "missing":list(map(safe_name,missing[:40]))},sort_keys=True))
          if unexpected or missing:
              raise SystemExit("EXACT_EXTRACTED_SOURCE_REQUIRED_AFTER_OMEGA_V4")
          PY_EXACT
      - name: Qualify GENESIS from the exact clean source archive
        run: |
          python "$RUNNER_TEMP/connected014-qualified/extracted-source/scripts/qualify_genesis_release.py" --source "$RUNNER_TEMP/connected014-qualified/extracted-source" --archive "$RUNNER_TEMP/connected014-qualified/connected014-source.zip" --output "$RUNNER_TEMP/genesis-qualified" --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          cp "$RUNNER_TEMP/genesis-qualified/QUALIFICATION.json" "$RUNNER_TEMP/connected014-qualified/GENESIS_QUALIFICATION.json"
      - name: Qualify the capacity-backed turn from the clean source archive
        working-directory: ${{ runner.temp }}/connected014-qualified/extracted-source
        run: |
          python -m unittest campaign.genesis_commitment001.test_delivery campaign.genesis_commitment001.test_native -v
          python -m campaign.genesis_commitment001.runner run --output "$RUNNER_TEMP/commitment-release-qualified" --scenario central --arm retained
          python -m campaign.genesis_commitment001.runner audit --output "$RUNNER_TEMP/commitment-release-qualified"
          python -m campaign.genesis_commitment001.runner run --output "$RUNNER_TEMP/commitment-positive-qualified" --scenario favorable_envelope --arm retained
          python -m campaign.genesis_commitment001.runner audit --output "$RUNNER_TEMP/commitment-positive-qualified"
          python -m campaign.genesis_commitment001.runner package --output "$RUNNER_TEMP/commitment-positive-qualified" --archive "$RUNNER_TEMP/commitment-release-qualified-public.zip"
      - name: Qualify public quote admission from the exact clean source archive
        working-directory: ${{ runner.temp }}/connected014-qualified/extracted-source
        run: |
          python -B -m unittest tests.test_commitment_quote_policy tests.test_connected_quote_release -v
          python -B scripts/qualify_commitment_quote.py run --output "$RUNNER_TEMP/quote-release-qualified"
          python -B scripts/qualify_commitment_quote.py audit --output "$RUNNER_TEMP/quote-release-qualified"
      - name: Bind immutable release assets to exact qualified source and inspected research edition
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: python scripts/release_connected014.py prepare --qualification "$RUNNER_TEMP/connected014-qualified" --assets "$RUNNER_TEMP/connected014-release-assets" --source-commit "$GITHUB_SHA" --papers docs/completion015
      - name: Preserve exact release asset set
        id: release_assets
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-release-assets-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/connected014-release-assets
          if-no-files-found: error
      - name: Preserve qualification and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-release-engineering-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/connected014-qualified/QUALIFICATION.json
            ${{ runner.temp }}/omega-v4-qualified/QUALIFICATION.json
            ${{ runner.temp }}/genesis-qualified/QUALIFICATION.json
            ${{ runner.temp }}/commitment-release-qualified/REPORT.json
            ${{ runner.temp }}/commitment-release-qualified/AUDIT.json
            ${{ runner.temp }}/commitment-positive-qualified/REPORT.json
            ${{ runner.temp }}/commitment-positive-qualified/AUDIT.json
            ${{ runner.temp }}/quote-release-qualified/RESULT.json
            ${{ runner.temp }}/quote-release-qualified/AUDIT.json
            ${{ runner.temp }}/connected014-qualified/*.stdout
            ${{ runner.temp }}/connected014-qualified/*.stderr
          if-no-files-found: warn
  publish-and-gate:
    needs: [release-qualification]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate qualified artifact reference
        env:
          QUALIFIED_ARTIFACT_ID: ${{ needs.release-qualification.outputs.qualified_artifact_id }}
        run: |
          [[ "$QUALIFIED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'A qualified immutable artifact ID is required.' >&2; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.release-qualification.outputs.qualified_artifact_id }}
          path: ${{ runner.temp }}/received-qualification
          merge-multiple: true
      - name: Require same-main checks and publish immutable source-bound release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release_connected014.py publish --assets "$RUNNER_TEMP/received-qualification" --source-commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
      - name: Preserve source-bound publication gate and assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-publication-gate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/received-qualification
          if-no-files-found: warn
  operate-published-release:
    needs: [publish-and-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # GitHub-hosted job ceiling; finite commands, not an experimental budget.
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Download the actual released bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release_connected014.py download --source-commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --assets "$RUNNER_TEMP/actual-release-download" --receipt "$RUNNER_TEMP/RELEASE_DOWNLOAD.json"
      - name: Run, resume and audit the actual downloaded implementation and evidence
        id: operation
        run: |
          python scripts/release_connected014.py operate-download --assets "$RUNNER_TEMP/actual-release-download" --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/downloaded-release-operation" --actual-release-download
      - name: Isolate published native design source without modifying canonical extracted release
        run: |
          python -B - <<'PY_NATIVE_SOURCE'
          import json, os
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.release_connected014 import archive_manifest, checked_members
          temp = Path(os.environ['RUNNER_TEMP'])
          archive = temp / 'actual-release-download/connected014-source.zip'
          destination = temp / 'native-design041-released-source'
          if destination.exists() or destination.is_symlink():
              raise FileExistsError('FRESH_ISOLATED_NATIVE_SOURCE_REQUIRED')
          manifest = archive_manifest(archive)
          with ZipFile(archive) as z:
              checked_members(z)
              z.extractall(destination)
          expected = set(manifest['files']) | {'SOURCE_MANIFEST.json'}
          actual = {p.relative_to(destination).as_posix() for p in destination.rglob('*') if p.is_file()}
          if actual != expected or json.loads((destination / 'SOURCE_MANIFEST.json').read_text()) != manifest:
              raise ValueError('ISOLATED_SOURCE_SNAPSHOT_MISMATCH')
          if any((p / '.git').exists() for p in (destination, *destination.parents)):
              raise ValueError('ISOLATED_SOURCE_MUST_NOT_HAVE_GIT')
          print(json.dumps({'scope':'isolated_source_for_synthetic_service_fixture_generation',
                            'phase':'published', 'files':len(manifest['files']),
                            'source_sha256':manifest['executing_source']['sha256']},sort_keys=True))
          PY_NATIVE_SOURCE
      - name: Independently exercise native design041 on actual downloaded published bytes
        id: released_native_design
        working-directory: ${{ runner.temp }}/native-design041-released-source
        run: |
          /usr/bin/time -f 'RELEASED_DESIGN_REGRESSIONS cpu_user=%U cpu_system=%S wall=%e' python -B -m unittest -v tests.test_connected_design_flywheel041
          /usr/bin/time -f 'RELEASED_DESIGN_DEMO cpu_user=%U cpu_system=%S wall=%e' python -B -m connected_enterprise.design_flywheel demo --output "$RUNNER_TEMP/native-design041-actual-public"
          /usr/bin/time -f 'RELEASED_DESIGN_VERIFY cpu_user=%U cpu_system=%S wall=%e' python -B -m connected_enterprise.design_flywheel verify --output "$RUNNER_TEMP/native-design041-actual-public"
      - name: Seal immutable source-bound key-free released native design receipt
        id: native_seal
        run: |
          python scripts/qualify_native_design_public_release.py seal \
            --assets "$RUNNER_TEMP/actual-release-download" \
            --source-commit "$GITHUB_SHA" \
            --source "$RUNNER_TEMP/downloaded-release-operation/source" \
            --public "$RUNNER_TEMP/native-design041-actual-public/PUBLIC.json" \
            --download-receipt "$RUNNER_TEMP/RELEASE_DOWNLOAD.json" \
            --receipt "$RUNNER_TEMP/NATIVE_DESIGN041_RELEASE_RECEIPT.json" \
            --public-copy "$RUNNER_TEMP/NATIVE_DESIGN041_PUBLIC.json"
      - name: Retain only key-free actual released native feature evidence
        if: always() && steps.operation.outcome == 'success' && steps.released_native_design.outcome == 'success' && steps.native_seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-design041-released-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/NATIVE_DESIGN041_RELEASE_RECEIPT.json
            ${{ runner.temp }}/NATIVE_DESIGN041_PUBLIC.json
            ${{ runner.temp }}/RELEASE_DOWNLOAD.json
          if-no-files-found: error
      - name: Operate public quote admission from the actual downloaded source
        id: released_public_quote
        working-directory: ${{ runner.temp }}/downloaded-release-operation/source
        run: |
          python -B scripts/qualify_commitment_quote.py run --output "$RUNNER_TEMP/released-public-quote"
          python -B scripts/qualify_commitment_quote.py audit --output "$RUNNER_TEMP/released-public-quote"
      - name: Retain only key-free released public quote evidence
        if: always() && steps.released_public_quote.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-quote-released-operation-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/released-public-quote/RESULT.json
            ${{ runner.temp }}/released-public-quote/AUDIT.json
            ${{ runner.temp }}/released-public-quote/fixed/PUBLIC.json.gz
            ${{ runner.temp }}/released-public-quote/ordinary/PUBLIC.json.gz
            ${{ runner.temp }}/released-public-quote/constructor/PUBLIC.json.gz
          if-no-files-found: error
      - name: Qualify wheel utility from the actual downloaded source
        id: released_wheel
        run: |
          source_sha=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/downloaded-release-operation/DOWNLOADED_RELEASE_RUN.json"))["source_sha256"])')
          python "$RUNNER_TEMP/downloaded-release-operation/source/scripts/qualify_released_wheel035.py" --expected-source "$source_sha" --output "$RUNNER_TEMP/RELEASED_WHEEL.json"
      - name: Retain compact released wheel qualification
        if: always() && steps.operation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-wheel-utility-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/RELEASED_WHEEL.json
          if-no-files-found: error
      - name: Install the released flexibility experiment's pinned numerical runtime
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Operate V4 from the actual downloaded release source
        id: released_omega_v4
        working-directory: ${{ runner.temp }}/downloaded-release-operation/source
        run: |
          python scripts/qualify_omega_release.py --source "$PWD" --archive "$RUNNER_TEMP/actual-release-download/connected014-source.zip" --output "$RUNNER_TEMP/released-omega-v4" --source-commit "$GITHUB_SHA" --download-receipt "$RUNNER_TEMP/RELEASE_DOWNLOAD.json"
      - name: Operate and audit GENESIS from the actual downloaded release source
        id: released_genesis
        working-directory: ${{ runner.temp }}/downloaded-release-operation/source
        run: |
          python scripts/qualify_genesis_release.py --source "$PWD" --archive "$RUNNER_TEMP/actual-release-download/connected014-source.zip" --output "$RUNNER_TEMP/released-genesis" --source-commit "$GITHUB_SHA" --download-receipt "$RUNNER_TEMP/RELEASE_DOWNLOAD.json"
      - name: Retain only key-free released GENESIS evidence
        if: always() && steps.released_genesis.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis002-released-operation-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/released-genesis/QUALIFICATION.json
            ${{ runner.temp }}/released-genesis/public
          if-no-files-found: error
      - name: Attach compact V4 receipt to existing downloaded-operation evidence
        if: always() && steps.released_omega_v4.outcome != 'skipped'
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          path=root/'downloaded-release-operation/DOWNLOADED_RELEASE_RUN.json'
          v4=root/'released-omega-v4/QUALIFICATION.json'
          if v4.is_file():
              old=json.loads(path.read_text()); receipt=json.loads(v4.read_text())
              if receipt.get('source_commit')!=old['source_commit'] or receipt.get('source_sha256',old['source_sha256'])!=old['source_sha256']:
                  raise ValueError('V4_DOWNLOADED_RECEIPT_SOURCE_CHANGED')
              old['omega_v4_engineering_qualification']=receipt
              temporary=path.with_suffix('.tmp')
              temporary.write_text(json.dumps(old,sort_keys=True,indent=2)+'\n')
              temporary.replace(path)
          PYCODE
      - name: Reproduce Blue Sky probes from actual downloaded release source
        id: released_blue_sky
        working-directory: ${{ runner.temp }}/downloaded-release-operation/source
        run: python -m research.blue_sky064 --output "$RUNNER_TEMP/released-blue-sky064"
      - name: Retain the released Blue Sky probe receipt
        if: always() && steps.released_blue_sky.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blue-sky064-released-operation-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/released-blue-sky064/RESULT.json
          if-no-files-found: error
      - name: Operate and independently audit flexibility from actual downloaded release source
        id: released_flexibility
        working-directory: ${{ runner.temp }}/downloaded-release-operation/source
        run: |
          python -m connected_enterprise.transformational063 run --root "$PWD" --output "$RUNNER_TEMP/released-transformational063"
          python -m connected_enterprise.transformational063 audit --root "$PWD" --output "$RUNNER_TEMP/released-transformational063"
      - name: Operate the capacity-backed turn from actual downloaded release bytes
        working-directory: ${{ runner.temp }}/downloaded-release-operation/source
        run: |
          python -m campaign.genesis_commitment001.runner run --output "$RUNNER_TEMP/released-commitment001" --scenario central --arm retained
          python -m campaign.genesis_commitment001.runner audit --output "$RUNNER_TEMP/released-commitment001"
          python -m campaign.genesis_commitment001.runner resume --output "$RUNNER_TEMP/released-commitment001" --scenario central --arm retained
          python -m campaign.genesis_commitment001.runner run --output "$RUNNER_TEMP/released-commitment001-positive" --scenario favorable_envelope --arm retained
          python -m campaign.genesis_commitment001.runner audit --output "$RUNNER_TEMP/released-commitment001-positive"
          python -m campaign.genesis_commitment001.runner resume --output "$RUNNER_TEMP/released-commitment001-positive" --scenario favorable_envelope --arm retained
          python -m campaign.genesis_commitment001.runner package --output "$RUNNER_TEMP/released-commitment001" --archive "$RUNNER_TEMP/released-commitment001-public.zip"
          python -m campaign.genesis_commitment001.runner package --output "$RUNNER_TEMP/released-commitment001-positive" --archive "$RUNNER_TEMP/released-commitment001-positive-public.zip"
          python -m zipfile -e "$RUNNER_TEMP/released-commitment001-positive-public.zip" "$RUNNER_TEMP/released-commitment001-positive-public"
          cd "$RUNNER_TEMP/released-commitment001-positive-public/source"
          python -m campaign.genesis_commitment001.runner audit --output "$RUNNER_TEMP/released-commitment001-positive-public"
      - name: Retain key-free downloaded commitment receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commitment001-released-operation-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/released-commitment001/REPORT.json
