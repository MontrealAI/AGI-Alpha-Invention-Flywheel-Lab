          python experiments/public_portfolio_20261102/verification/r2_additional_recovery_replay.py --public-root "$RUNNER_TEMP/downloaded-release-operation/source/experiments/public_portfolio_20261102/evidence/economics-r2/public" --output "$RUNNER_TEMP/released-portfolio-recovered-two.json"
      - name: Retain released portfolio computational qualification
