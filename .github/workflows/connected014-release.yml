name: Connected 014 immutable release and downloaded operation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connected014-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  release-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Release integrity and source-bound finance/lifecycle regressions
        run: python -m unittest discover -s tests -p 'test_connected*.py' -v
      - name: Operate exact clean package, resume and independently audit public copy
        run: python scripts/qualify_connected014.py --smoke --output "$RUNNER_TEMP/connected014-qualified" --timeout-seconds 900
      - name: Bind immutable release assets to exact qualified source and inspected research edition
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: python scripts/release_connected014.py prepare --qualification "$RUNNER_TEMP/connected014-qualified" --assets "$RUNNER_TEMP/connected014-release-assets" --source-commit "$GITHUB_SHA" --papers docs/completion015
      - name: Preserve exact release asset set
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/connected014-release-assets
          if-no-files-found: error
      - name: Preserve qualification and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-release-engineering-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/connected014-qualified/QUALIFICATION.json
            ${{ runner.temp }}/connected014-qualified/*.stdout
            ${{ runner.temp }}/connected014-qualified/*.stderr
          if-no-files-found: warn
  publish-and-gate:
    needs: [release-qualification]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: connected014-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/received-qualification
      - name: Require same-main checks and publish immutable source-bound release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release_connected014.py publish --assets "$RUNNER_TEMP/received-qualification" --source-commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --timeout-seconds 2400
      - name: Preserve source-bound publication gate and assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-publication-gate-${{ github.sha }}
          path: ${{ runner.temp }}/received-qualification
          if-no-files-found: warn
  operate-published-release:
    needs: [publish-and-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Download the actual released bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release_connected014.py download --source-commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --assets "$RUNNER_TEMP/actual-release-download" --receipt "$RUNNER_TEMP/RELEASE_DOWNLOAD.json"
      - name: Run, resume and audit the actual downloaded implementation and evidence
        run: python scripts/release_connected014.py operate-download --assets "$RUNNER_TEMP/actual-release-download" --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/downloaded-release-operation" --timeout-seconds 900 --actual-release-download
      - name: Preserve publication gate and actual downloaded operating receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-published-operation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RELEASE_DOWNLOAD.json
            ${{ runner.temp }}/downloaded-release-operation/DOWNLOADED_RELEASE_RUN.json
            ${{ runner.temp }}/downloaded-release-operation/downloaded-operation-keyfree.zip
            ${{ runner.temp }}/downloaded-release-operation/*.stdout
            ${{ runner.temp }}/downloaded-release-operation/*.stderr
          if-no-files-found: warn
