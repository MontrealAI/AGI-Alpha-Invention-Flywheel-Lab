name: One-shot review452 source-matched offline exhibition regeneration
on:
  push:
    branches:
      - review/ignition-eligible-reference-stream-20261118
    paths:
      - .github/workflows/review452-build-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform window
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: review/ignition-eligible-reference-stream-20261118
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate pinned public artifact and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/ignition-eligible-reference-stream-20261118"
          test "$(git rev-parse HEAD^)" = "9d9bc71184bc56a0758be259b235f3e03ed26906"
          test -z "$(git status --porcelain)"
          python -m pip install --only-binary=:all: 'numpy==2.2.6' 'scipy==1.17.0' 'astropy==7.2.0' 'pyerfa==2.0.1.5' 'fastavro==1.12.1' 'astropy-iers-data==0.2026.11.16.0.37.44'
          folder="$(mktemp -d)"
          python -B products/frontier-omega-ignition/showcase/field_exhibition/build.py --output "$folder/FRONTIER_FIELD.html" --recipient "$folder/FRONTIER_INSTRUMENT.zip"
          printf '%s  %s\n' '86308632c38b0a817b64464628aedb91678a82a1fb67df54bb41d7860171d31d' "$folder/FRONTIER_FIELD.html" | sha256sum -c -
          printf '%s  %s\n' 'df50df32ac8d1ff95296da9fff6be74e01320d8799cfa40d08497082ab828770' "$folder/FRONTIER_INSTRUMENT.zip" | sha256sum -c -
          cp "$folder/FRONTIER_FIELD.html" docs/frontier-omega-ignition/continuation/FRONTIER_FIELD.html
          rm .github/workflows/review452-build-once.yml
          git add -- docs/frontier-omega-ignition/continuation/FRONTIER_FIELD.html .github/workflows/review452-build-once.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize corrected stream verifier with exact portable bilingual exhibition'
          git push origin HEAD:refs/heads/review/ignition-eligible-reference-stream-20261118
