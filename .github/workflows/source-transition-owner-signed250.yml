name: P0-250 source-matched synthetic owner HMAC boundary
on:
  pull_request:
    paths:
      - 'research/source_transition_trust246/SIGNED250_PROTOCOL.md'
      - 'research/source_transition_trust246/owner_signed_boundary250.py'
      - 'research/source_transition_trust246/test_owner_signed_boundary250.py'
      - 'research/source_transition_trust246/owner_wire248.py'
      - '.github/workflows/source-transition-owner-signed250.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0250-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-owner-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Exact-head credential-free checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Standard Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Obtain immutable old owner codec with no authenticated access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --fail --location --silent --show-error --max-time 60 --retry 0 \
            'https://raw.githubusercontent.com/MontrealAI/AGI-Alpha-Invention-Flywheel-Lab/ced6c1cb004887dcdafaea59a2976020be649f8e/connected_enterprise/transition_evidence.py' \
            -o "$RUNNER_TEMP/p0250-old-owner.py"
      - name: Execute registered synthetic HMAC and adversarial tests in scrubbed environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0250-home"
          cd research/source_transition_trust246
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p0250-home" \
            PINNED_OWNER_SOURCE="$RUNNER_TEMP/p0250-old-owner.py" \
            PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v test_owner_signed_boundary250.py
      - name: Bind source and test result without retaining keys or account data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0250-receipt"
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('research/source_transition_trust246')
          paths=['SIGNED250_PROTOCOL.md','owner_signed_boundary250.py',
                 'test_owner_signed_boundary250.py','owner_wire248.py']
          raw=(Path(os.environ['RUNNER_TEMP'])/'p0250-old-owner.py').read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert blob=='2397091ef8e1960ad13950693d5b3cd04e2ff7c5'
          receipt={
            'schema':'agi-alpha/p0-250-synthetic-owner-hmac/v1',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'frozen_protocol_commit':'9aca9a4e67bdfd884934a0d791e57437a2494489',
            'historical_owner_source_commit':'ced6c1cb004887dcdafaea59a2976020be649f8e',
            'historical_owner_codec_git_blob':blob,
            'source_file_sha256':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths},
            'registered_tests':10,'registered_tests_exit_zero':True,
            'test_keys':'ephemeral random in-memory only, never published',
            'real_keys_or_accounts_accessed':False,
            'pinned_historical_owner_resolver_authenticated_synthetic_ticket':True,
            'no_target_code_reference':True,
            'historical_pr40_key_bearing_signer_repaired':False,
            'actual_native_queue_migration_qualified':False,
            'active_native_finance_checkpoint_known':False,
            'approved_merge_or_published_release':False,
            'actual_commerce_or_trailing365_profit_qualified':False,
            'actual_host_model_billing_usd':None}
          (Path(os.environ['RUNNER_TEMP'])/'p0250-receipt'/'RESULT.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload compact nonsecret exact-head evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0250-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0250-receipt/RESULT.json
          if-no-files-found: error
          retention-days: 7
