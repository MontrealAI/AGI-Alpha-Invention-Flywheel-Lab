name: EIT187 source-pinned ordinary inverse, both row-order hypotheses
on:
  push:
    branches: [experiment/eit187-ordinary-inverse-map-20261119]
    paths:
      - 'campaign/eit-ordinary-inverse187/**'
      - 'research/eit_ordinary_inverse187/**'
      - 'tests/test_eit_ordinary_inverse187.py'
      - '.github/workflows/eit-ordinary187.yml'
  pull_request:
    paths:
      - 'campaign/eit-ordinary-inverse187/**'
      - 'research/eit_ordinary_inverse187/**'
      - 'tests/test_eit_ordinary_inverse187.py'
      - '.github/workflows/eit-ordinary187.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preregistered-offline-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual job start marker
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install public fixed numerical dependencies only
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Execute original frozen offline tests with exact-head confirmation
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 OPENBLAS_NUM_THREADS=1 python -B -m unittest -v tests.test_eit_ordinary_inverse187

  original-source-six-controls:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual job start marker
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install same fixed numerical dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: One original-source read, both vector orders and all three gamma values
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 OPENBLAS_NUM_THREADS=1 python -B -m unittest -v tests.test_eit_ordinary_inverse187
          /usr/bin/time -f 'wall_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' -o "$RUNNER_TEMP/EIT187_RESOURCES.txt" env OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 python -B -m research.eit_ordinary_inverse187.compare --out "$RUNNER_TEMP/EIT187_ORDINARY_INVERSE.json"
      - name: Preserve exact result and resource receipt, never the source archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit187-six-frozen-ordinary-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EIT187_ORDINARY_INVERSE.json
            ${{ runner.temp }}/EIT187_RESOURCES.txt
          if-no-files-found: warn
          retention-days: 14
