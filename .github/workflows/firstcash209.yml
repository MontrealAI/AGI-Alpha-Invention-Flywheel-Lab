name: FIRSTCASH209 reproducible bilingual decision-kit research (no payment)
on:
  pull_request:
    paths:
      - 'tools/firstcash209_decision_kit.py'
      - 'tests/test_firstcash209_decision_kit.py'
      - 'campaign/unseen-first-cash-209/**'
      - '.github/workflows/firstcash209.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-and-print:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen offline positive and adversarial tests
        run: python -B -m unittest -v tests.test_firstcash209_decision_kit
      - name: Construct and independently replay one public self-case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firstcash209"
          python -B tools/firstcash209_decision_kit.py build --case campaign/unseen-first-cash-209/PUBLIC_SELF_CASE.json --output "$RUNNER_TEMP/firstcash209/bundle"
          python -B tools/firstcash209_decision_kit.py verify --output "$RUNNER_TEMP/firstcash209/bundle"
          sha256sum tools/firstcash209_decision_kit.py campaign/unseen-first-cash-209/PUBLIC_SELF_CASE.json > "$RUNNER_TEMP/firstcash209/SOURCE_SHA256SUMS.txt"
      - name: Install free PDF page-verification library
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pypdf==5.9.0
      - name: Print real ten-page A4 PDF and audit page identity
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --no-pdf-header-footer \
            --print-to-pdf="$RUNNER_TEMP/firstcash209/FIRSTCASH209-PUBLIC-SELF-CASE.pdf" \
            "file://$RUNNER_TEMP/firstcash209/bundle/DECISION.html" \
            > "$RUNNER_TEMP/firstcash209/chrome.stdout" 2> "$RUNNER_TEMP/firstcash209/chrome.stderr"
          python -B - "$RUNNER_TEMP/firstcash209/FIRSTCASH209-PUBLIC-SELF-CASE.pdf" <<'PY_VERIFY'
          from pypdf import PdfReader
          import sys
          pdf = PdfReader(sys.argv[1])
          if len(pdf.pages) != 10:
              raise SystemExit(f"PRINTED_PAGE_COUNT_MISMATCH: {len(pdf.pages)}")
          for i, page in enumerate(pdf.pages, 1):
              text = page.extract_text() or ""
              if not text.strip() or "FRONTIER" not in text:
                  raise SystemExit(f"PAGE_{i}_EMPTY_OR_UNIDENTIFIED")
              box = page.mediabox
              w, h = float(box.width), float(box.height)
              if not (590 <= w <= 600 and 836 <= h <= 845):
                  raise SystemExit(f"NOT_A4_PAGE_{i}: {w:.2f}x{h:.2f}")
          print("FIRSTCASH209_REAL_PDF_10_A4_PAGES_VERIFIED")
          PY_VERIFY
          sha256sum "$RUNNER_TEMP/firstcash209/FIRSTCASH209-PUBLIC-SELF-CASE.pdf" "$RUNNER_TEMP/firstcash209/bundle/"* > "$RUNNER_TEMP/firstcash209/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firstcash209-public-self-case-no-client
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/firstcash209/FIRSTCASH209-PUBLIC-SELF-CASE.pdf
            ${{ runner.temp }}/firstcash209/SOURCE_SHA256SUMS.txt
            ${{ runner.temp }}/firstcash209/OUTPUT_SHA256SUMS.txt
            ${{ runner.temp }}/firstcash209/bundle/CASE.json
            ${{ runner.temp }}/firstcash209/bundle/DECISION.json
            ${{ runner.temp }}/firstcash209/bundle/DECISION.html
            ${{ runner.temp }}/firstcash209/bundle/MANIFEST.json
          retention-days: 30
