name: Accessibility Gate148 independent source-first regression
on:
  pull_request:
    paths:
      - 'research/accessible_output148/**'
      - 'tests/test_accessible_output148.py'
      - '.github/workflows/accessible-output148.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: accessibility148-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  exact-head-bounded-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual hosted job start for platform-window accounting
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Exact source checkout with credentials disabled
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact executing source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f research/accessible_output148/PROTOCOL.md
          test -f research/accessible_output148/gate.py
          test -f tests/test_accessible_output148.py
      - name: Python 3.12 no paid API
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run all frozen and adversarial checks
        shell: bash
        run: python -B -m unittest -v tests.test_accessible_output148
      - name: Compile independently source-bound baseline and candidate, resume read-only audits
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/accessible148"
          python -B -m research.accessible_output148.gate compile \
            --record research/accessible_output148/fixtures/baseline.json \
            --output "$RUNNER_TEMP/accessible148/base"
          python -B -m research.accessible_output148.gate compile \
            --record research/accessible_output148/fixtures/candidate.json \
            --output "$RUNNER_TEMP/accessible148/candidate"
          python -B -m research.accessible_output148.gate audit --output "$RUNNER_TEMP/accessible148/base"
          python -B -m research.accessible_output148.gate audit --output "$RUNNER_TEMP/accessible148/candidate"
          python -B -m research.accessible_output148.gate compare \
            --baseline "$RUNNER_TEMP/accessible148/base" \
            --candidate "$RUNNER_TEMP/accessible148/candidate" \
            > "$RUNNER_TEMP/accessible148/RESULT.json"
      - name: Verify claim tier and produce key-free public receipt
        shell: bash
        env:
          EXECUTING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -B - <<'PY'
          import json, os, hashlib, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'accessible148'
          result=json.loads((root/'RESULT.json').read_text())
          assert result['verdict']=='PASS_STRUCTURAL_ONLY'
          assert result['requires_semantic_and_assistive_technology_review'] is True
          assert result['commercial_verdict']=='NOT_ESTABLISHED'
          literal_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert literal_head == os.environ['EXECUTING_SHA'], 'RECEIPT_MUST_BIND_EXACT_CHECKOUT'
          public={"schema":"accessible-output148/hosted-qualification/v1",
                  "source_commit":literal_head,
                  "claim":"synthetic_offline_structural_engineering_only",
                  "result":result,
                  "source_file_sha256":hashlib.sha256(Path('research/accessible_output148/gate.py').read_bytes()).hexdigest(),
                  "test_file_sha256":hashlib.sha256(Path('tests/test_accessible_output148.py').read_bytes()).hexdigest(),
                  "rfi_is_not_procurement":True,
                  "actual_buyers":None,"actual_profit":None,
                  "full_wcag_conformance":None,"screen_reader_testing":None}
          (root/'PUBLIC.json').write_text(json.dumps(public,sort_keys=True,indent=2)+'\n')
          PY
      - name: Publish only bounded, key-free public research evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility148-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/accessible148/PUBLIC.json
          if-no-files-found: error
          retention-days: 7
