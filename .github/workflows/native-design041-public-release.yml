name: Native design041 released-byte qualification
on:
  pull_request:
    paths:
      - '.github/workflows/native-design041-public-release.yml'
      - 'scripts/qualify_native_design_public_release.py'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - run: python -B -m unittest tests.test_connected_design_flywheel041
