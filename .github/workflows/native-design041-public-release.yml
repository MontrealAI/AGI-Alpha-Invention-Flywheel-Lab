name: Native design041 verified public release bytes
on:
  pull_request:
    paths:
      - .github/workflows/native-design041-public-release.yml
      - campaign/native-design-release146/**
      - connected_enterprise/design_flywheel.py
      - tests/test_connected_design_flywheel041.py
  workflow_run:
    workflows: [Connected 014 immutable release and downloaded operation]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-design041-released-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  native-design-source-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared CPU-only native runtime
        run: python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Require exact design code and tests in the canonical source inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          from connected_enterprise.runner import source_paths
          files=set(source_paths(Path.cwd()))
          required={'connected_enterprise/design_flywheel.py','tests/test_connected_design_flywheel041.py'}
          assert required <= files, 'NATIVE_DESIGN041_NOT_IN_CANONICAL_RELEASE_CLOSURE'
          print('CANONICAL_DESIGN_SOURCE_PRESENT',sorted(required))
          PY
      - name: Run original source-matched regressions and native independent audit
        run: |
          python -B -m unittest -v tests.test_connected_design_flywheel041
          python -B -m connected_enterprise.design_flywheel demo --output "$RUNNER_TEMP/native-design-preflight"
          python -B -m connected_enterprise.design_flywheel verify --output "$RUNNER_TEMP/native-design-preflight"
      - name: Preserve only the prepublication synthetic public report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-design041-source-preflight-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/native-design-preflight/PUBLIC.json
          if-no-files-found: warn

  independent-published-native-design:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DESIGN_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing declared CPU dependencies for immutable release audit
        run: python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r requirements-cycle004.txt numpy==2.3.5 scipy==1.17.0
      - name: Download actual immutable public release assets for exact successful main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/release_connected014.py download --source-commit "$DESIGN_SOURCE_COMMIT" --repository "$GITHUB_REPOSITORY" --assets "$RUNNER_TEMP/design041-downloaded-assets" --receipt "$RUNNER_TEMP/DESIGN041_RELEASE_DOWNLOAD.json"
      - name: Verify exact public assets and safely extract released execution closure
        run: |
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          from scripts.release_connected014 import checked_members, verify_assets
          root=Path(os.environ['RUNNER_TEMP'])
          assets=root/'design041-downloaded-assets'
          expected=os.environ['DESIGN_SOURCE_COMMIT']
          release=verify_assets(assets,expected)
          dest=root/'native-design041-released-source'
          if dest.exists():
              raise FileExistsError('FRESH_RELEASE_SOURCE_DIRECTORY_REQUIRED')
          dest.mkdir()
          with zipfile.ZipFile(assets/'connected014-source.zip') as archive:
              checked_members(archive)
              source=json.loads(archive.read('SOURCE_MANIFEST.json'))
              assert source['executing_source']['sha256']==release['source_sha256'], 'RELEASED_EXECUTING_SOURCE_CHANGED'
              required={'connected_enterprise/design_flywheel.py','tests/test_connected_design_flywheel041.py'}
              assert required <= set(source['files']), 'RELEASED_NATIVE_DESIGN_CLOSURE_MISSING'
              archive.extractall(dest)
          assert (dest/'SOURCE_MANIFEST.json').is_file()
          print('EXACT_PUBLIC_RELEASE_NATIVE_DESIGN_CLOSURE',expected,release['source_sha256'])
          PY
      - name: Execute original adversarial regressions only from downloaded release bytes
        working-directory: ${{ runner.temp }}/native-design041-released-source
        run: |
          /usr/bin/time -f 'RELEASED_NATIVE_REGRESSIONS resource_wall_seconds=%e cpu_user_seconds=%U cpu_system_seconds=%S' python -B -m unittest -v tests.test_connected_design_flywheel041
      - name: Run and independently audit exposed native design on the exact released bytes
        working-directory: ${{ runner.temp }}/native-design041-released-source
        run: |
          /usr/bin/time -f 'RELEASED_NATIVE_DEMO resource_wall_seconds=%e cpu_user_seconds=%U cpu_system_seconds=%S' python -B -m connected_enterprise.design_flywheel demo --output "$RUNNER_TEMP/native-design041-released-operation"
          /usr/bin/time -f 'RELEASED_NATIVE_VERIFY resource_wall_seconds=%e cpu_user_seconds=%U cpu_system_seconds=%S' python -B -m connected_enterprise.design_flywheel verify --output "$RUNNER_TEMP/native-design041-released-operation"
      - name: Reconcile source-bound output with immutable downloaded release and seal key-free receipt
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          assets=root/'design041-downloaded-assets'
          source=root/'native-design041-released-source'
          public_path=root/'native-design041-released-operation/PUBLIC.json'
          public=json.loads(public_path.read_text())
          release=json.loads((assets/'RELEASE_MANIFEST.json').read_text())
          manifest=json.loads((source/'SOURCE_MANIFEST.json').read_text())
          expected=os.environ['DESIGN_SOURCE_COMMIT']
          assert release['source_commit']==expected, 'RELEASE_COMMIT_MISMATCH'
          assert release['source_sha256']==manifest['executing_source']['sha256']==public['source_sha256'], 'RELEASE_NATIVE_IDENTITY_MISMATCH'
          assert public['confirmed_positive_funded_successor_opportunity'] is True, 'NO_POSITIVE_FUNDED_CONNECTED_COMPONENT'
          assert public['comparative_advantage_on_one_fresh_seed'] is True, 'NO_POSITIVE_MATCHED_EXPOSED_SEED'
          assert public['heldout_recommendation']['challenger_accepted'] is True, 'INDEPENDENT_HOLDOUT_VETO'
          receipt={
              'schema':'agi-alpha/native-design041-actual-public-release-proof/v1',
              'source_commit':expected,
              'source_sha256':release['source_sha256'],
              'release_source_archive_sha256':hashlib.sha256((assets/'connected014-source.zip').read_bytes()).hexdigest(),
              'native_public_sha256':hashlib.sha256(public_path.read_bytes()).hexdigest(),
              'release_downloaded_actual_public_assets':True,
              'executed_bytes':'checked_and_extracted_exact_public_source_archive',
              'native_adversarial_regressions':'completed_success',
              'original_exposed_development_seed':341014,
              'original_exposed_confirmation_seed':341015,
              'independent_native_audit':'completed_success',
              'matched_profit_delta_microUSD':public['matched_confirmation_profit_delta_microUSD'],
              'connected_funded_successor':public['confirmed_positive_funded_successor_opportunity'],
              'causal_new_invention_established':False,
              'actual_paid_commerce':False,
              'annual_profit_established':False,
              'actual_provider_and_host_billing':'UNKNOWN',
              'original_signed_account_migration':'NOT_EXERCISED',
              'scope':'SOURCE_MATCHED_RELEASED_BYTE_ENGINEERING_REPRODUCTION_ONLY'}
          (root/'DESIGN041_RELEASED_RECEIPT.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          (root/'DESIGN041_RELEASED_PUBLIC.json').write_bytes(public_path.read_bytes())
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve exclusively key-free immutable released-source and native audit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-design041-public-release-${{ github.event.workflow_run.head_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/DESIGN041_RELEASED_RECEIPT.json
            ${{ runner.temp }}/DESIGN041_RELEASED_PUBLIC.json
            ${{ runner.temp }}/DESIGN041_RELEASE_DOWNLOAD.json
          if-no-files-found: warn
