name: Native design041 released-byte qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-design041-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  native-source-preflight:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared native CPU runtime
        run: python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Check canonical source inventory and run existing native checks
        run: |
          python - <<'PY'
          from pathlib import Path
          from connected_enterprise.runner import source_paths
          names=set(source_paths(Path.cwd()))
          required={'connected_enterprise/design_flywheel.py','tests/test_connected_design_flywheel041.py'}
          assert required <= names, 'NATIVE_DESIGN_SOURCE_CLOSURE_MISSING'
          PY
          python -B -m unittest -v tests.test_connected_design_flywheel041
          python -B -m connected_enterprise.design_flywheel demo --output "$RUNNER_TEMP/native-design-source-preflight"
          python -B -m connected_enterprise.design_flywheel verify --output "$RUNNER_TEMP/native-design-source-preflight"
      - name: Preserve only key-free prepublication result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-design041-preflight-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/native-design-source-preflight/PUBLIC.json
          if-no-files-found: warn

  published-native-design:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DESIGN_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing release and native CPU dependencies
        run: python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r requirements-cycle004.txt numpy==2.3.5 scipy==1.17.0
      - name: Download the actual source-bound public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release_connected014.py download --source-commit "$DESIGN_SOURCE_COMMIT" --repository "$GITHUB_REPOSITORY" --assets "$RUNNER_TEMP/native-design-public-assets" --receipt "$RUNNER_TEMP/NATIVE_DESIGN_RELEASE_DOWNLOAD.json"
      - name: Authenticate release manifest and safely extract exact source
        run: python scripts/qualify_native_design_public_release.py extract --assets "$RUNNER_TEMP/native-design-public-assets" --source-commit "$DESIGN_SOURCE_COMMIT" --source "$RUNNER_TEMP/native-design-released-source"
      - name: Run 21 adversarial tests on actual released source
        working-directory: ${{ runner.temp }}/native-design-released-source
        run: /usr/bin/time -f 'RELEASED_TEST_CPU_USER=%U CPU_SYSTEM=%S WALL=%e' python -B -m unittest -v tests.test_connected_design_flywheel041
      - name: Reproduce exposed native successor and independently re-audit released bytes
        working-directory: ${{ runner.temp }}/native-design-released-source
        run: |
          /usr/bin/time -f 'RELEASED_DEMO_CPU_USER=%U CPU_SYSTEM=%S WALL=%e' python -B -m connected_enterprise.design_flywheel demo --output "$RUNNER_TEMP/native-design-released-operation"
          /usr/bin/time -f 'RELEASED_AUDIT_CPU_USER=%U CPU_SYSTEM=%S WALL=%e' python -B -m connected_enterprise.design_flywheel verify --output "$RUNNER_TEMP/native-design-released-operation"
      - name: Verify source-bound economics gate and seal strictly key-free receipt
        run: |
          python scripts/qualify_native_design_public_release.py seal --assets "$RUNNER_TEMP/native-design-public-assets" --source-commit "$DESIGN_SOURCE_COMMIT" --source "$RUNNER_TEMP/native-design-released-source" --public "$RUNNER_TEMP/native-design-released-operation/PUBLIC.json" --receipt "$RUNNER_TEMP/NATIVE_DESIGN_RELEASE_RECEIPT.json" --public-copy "$RUNNER_TEMP/NATIVE_DESIGN_RELEASED_PUBLIC.json"
      - name: Retain only immutable public release proof without private accounts or keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-design041-released-${{ github.event.workflow_run.head_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/NATIVE_DESIGN_RELEASE_RECEIPT.json
            ${{ runner.temp }}/NATIVE_DESIGN_RELEASED_PUBLIC.json
            ${{ runner.temp }}/NATIVE_DESIGN_RELEASE_DOWNLOAD.json
          if-no-files-found: warn
