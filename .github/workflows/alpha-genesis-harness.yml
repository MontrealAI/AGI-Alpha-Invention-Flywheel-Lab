name: ALPHA GENESIS HARNESS candidate qualification
on:
  pull_request:
    paths:
      - 'products/alpha-genesis-harness/**'
      - '.github/workflows/alpha-genesis-harness.yml'
  push:
    branches: [main]
    paths:
      - 'products/alpha-genesis-harness/**'
      - '.github/workflows/alpha-genesis-harness.yml'
permissions:
  contents: read
concurrency:
  group: alpha-genesis-harness-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false  # Preserve in-flight registered model trials and their failure evidence.
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_sha: ${{ steps.build.outputs.source_sha }}
      archive_sha: ${{ steps.build.outputs.archive_sha }}
      archive_name: ${{ steps.build.outputs.archive_name }}
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute product and independent adversarial tests
        working-directory: products/alpha-genesis-harness
        run: |
          python -m pip install -r requirements-chatgpt.txt
          node --test tests/*.test.cjs
          python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Execute locked DOM customer and connected-model regressions
        env:
          NODE_PATH: ${{ runner.temp }}/harness-dom/node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/harness-dom"
          cp products/alpha-genesis-harness/tests/dom/package*.json "$RUNNER_TEMP/harness-dom/"
          npm ci --prefix "$RUNNER_TEMP/harness-dom" --ignore-scripts --no-audit --no-fund
          node products/alpha-genesis-harness/evidence/UI_REPLAY.cjs
          node products/alpha-genesis-harness/evidence/UI_PARALLEL_REPLAY.cjs
          node products/alpha-genesis-harness/evidence/UI_CONNECTED_ACCEPTANCE.cjs
          node products/alpha-genesis-harness/evidence/UI_AGENTIC_REPLAY.cjs
          node products/alpha-genesis-harness/evidence/UI_HTTP_WORKFLOW_REPLAY.cjs
          node products/alpha-genesis-harness/evidence/UI_GENESIS_NEXT_REPLAY.cjs
      - name: Record official Codex sandbox operation without model authentication
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/harness-codex" "$RUNNER_TEMP/harness-assets"
          cp products/alpha-genesis-harness/tests/codex/package*.json "$RUNNER_TEMP/harness-codex/"
          npm ci --prefix "$RUNNER_TEMP/harness-codex" --ignore-scripts --no-audit --no-fund
          set +e
          python products/alpha-genesis-harness/scripts/probe_codex_sandbox.py --executable "$RUNNER_TEMP/harness-codex/node_modules/.bin/codex" --work-root "$GITHUB_WORKSPACE/harness-sandbox-probe" > "$RUNNER_TEMP/harness-assets/CODEX-HOST-VERIFICATION.json"
          probe_status=$?
          set -e
          test "$probe_status" -eq 0 || test "$probe_status" -eq 2
          PROBE_STATUS="$probe_status" python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'harness-assets/CODEX-HOST-VERIFICATION.json'
          receipt = json.loads(path.read_text())
          assert (int(os.environ['PROBE_STATUS']), receipt['status']) in ((0, 'PASS'), (2, 'BLOCKED'))
          assert receipt['inference_calls'] == 0 and receipt['real_credentials_used'] is False
          receipt['source_revision'] = os.environ['SOURCE_SHA']
          receipt['binding_scope'] = 'Credential-free probe of the committed source checkout; archive digest added only after source-bound packaging.'
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
          # Exit 2 is recorded BLOCKED, never authenticated or sandbox-qualified PASS.
      - name: Exercise native foundry evaluator without model credentials
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python products/alpha-genesis-harness/scripts/probe_upgrade_foundry.py --executable "$RUNNER_TEMP/harness-codex/node_modules/.bin/codex" --output "$RUNNER_TEMP/harness-assets/UPGRADE-FOUNDRY-HOST-VERIFICATION.json"
          probe_status=$?
          set -e
          test "$probe_status" -eq 0 || test "$probe_status" -eq 2
          PROBE_STATUS="$probe_status" python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'harness-assets/UPGRADE-FOUNDRY-HOST-VERIFICATION.json'
          receipt = json.loads(path.read_text())
          assert (int(os.environ['PROBE_STATUS']), receipt['status']) in ((0, 'PASS'), (2, 'BLOCKED'))
          assert receipt['live_model_construction'] == 'NOT_TESTED' and receipt['generated_code_executed'] is False
          receipt['source_revision'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Observe authorized official public source without model credentials
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python products/alpha-genesis-harness/scripts/probe_frontier_monitor.py --output "$RUNNER_TEMP/harness-assets/FRONTIER-MONITOR-VERIFICATION.json"
          probe_status=$?
          set -e
          test "$probe_status" -eq 0 || test "$probe_status" -eq 2
          PROBE_STATUS="$probe_status" python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'harness-assets/FRONTIER-MONITOR-VERIFICATION.json'
          receipt = json.loads(path.read_text())
          assert (int(os.environ['PROBE_STATUS']), receipt['status']) in ((0, 'PASS'), (2, 'BLOCKED'))
          assert receipt['inference_calls'] == 0 and receipt['real_credentials_used'] is False and receipt['paid_requests_enabled'] is False
          receipt['source_revision'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Render and exercise the customer interface in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/harness-visual/node_modules
          HARNESS_SCREENSHOT_DIR: ${{ runner.temp }}/harness-assets
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/harness-visual"
          cp products/alpha-genesis-harness/tests/visual/package*.json "$RUNNER_TEMP/harness-visual/"
          npm ci --prefix "$RUNNER_TEMP/harness-visual" --ignore-scripts --no-audit --no-fund
          node products/alpha-genesis-harness/evidence/UI_BROWSER_REPLAY.cjs
      - name: Preserve canonical mechanism and platform contracts
        run: |
          python -B -m unittest discover -s tests -p 'test_mechanism_harness_0*.py' -v
          python -B -m unittest discover -s tests -p 'test_connected_platform_runtime064.py' -v
      - name: Build exact committed archive and operate extracted bytes
        id: build
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python -B products/alpha-genesis-harness/scripts/package_release.py build --output "$RUNNER_TEMP/harness-assets" --source-revision "$EXPECTED_SOURCE" > "$RUNNER_TEMP/harness-build.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP'])/'harness-build.json').read_text())
          assert receipt['source_matches_commit'] is True
          probe_path = Path(os.environ['RUNNER_TEMP']) / 'harness-assets/CODEX-HOST-VERIFICATION.json'
          probe = json.loads(probe_path.read_text())
          assert probe['source_revision'] == os.environ['EXPECTED_SOURCE']
          probe['archive_sha256'] = receipt['archive_sha256']
          probe_path.write_text(json.dumps(probe, indent=2) + '\n')
          for name in ['UPGRADE-FOUNDRY-HOST-VERIFICATION.json', 'FRONTIER-MONITOR-VERIFICATION.json']:
              path = Path(os.environ['RUNNER_TEMP']) / 'harness-assets' / name
              evidence = json.loads(path.read_text())
              assert evidence['source_revision'] == os.environ['EXPECTED_SOURCE']
              evidence['archive_sha256'] = receipt['archive_sha256']
              path.write_text(json.dumps(evidence, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('source_sha='+os.environ['EXPECTED_SOURCE']+'\n')
              out.write('archive_sha='+receipt['archive_sha256']+'\n')
              out.write('archive_name='+Path(receipt['archive']).name+'\n')
          PY
          archive=$(find "$RUNNER_TEMP/harness-assets" -name '*.zip' -type f)
          archive_sha=$(sha256sum "$archive" | cut -d' ' -f1)
          python -B products/alpha-genesis-harness/scripts/qualify_archive.py "$archive" --expected-sha256 "$archive_sha" --expected-source-revision "$EXPECTED_SOURCE" --output "$RUNNER_TEMP/harness-operation" --dom-modules "$RUNNER_TEMP/harness-dom/node_modules"
      - name: Preserve immutable candidate package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-assets
          if-no-files-found: error
      - name: Preserve operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-operation-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harness-build.json
            ${{ runner.temp }}/harness-operation
            ${{ runner.temp }}/harness-assets/BROWSER-VERIFICATION.json
            ${{ runner.temp }}/harness-assets/CODEX-HOST-VERIFICATION.json
            ${{ runner.temp }}/harness-assets/UPGRADE-FOUNDRY-HOST-VERIFICATION.json
            ${{ runner.temp }}/harness-assets/FRONTIER-MONITOR-VERIFICATION.json
            ${{ runner.temp }}/harness-assets/HARNESS-*.png
          if-no-files-found: warn
  local-model-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute preregistered local-model construction and successor trials
        run: |
          python -B products/alpha-genesis-harness/scripts/qualify_hosted_local.py --work "$RUNNER_TEMP/harness-local-work" --publish "$RUNNER_TEMP/harness-local-public"
      - name: Preserve only allowlisted model evidence and accepted portable artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-local-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-local-public
          if-no-files-found: error
  platform-first-use:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/harness-platform-received
          merge-multiple: true
      - name: Install exact browser test dependency
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/harness-platform-browser
          NODE_PATH: ${{ runner.temp }}/harness-platform-visual/node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/harness-platform-visual"
          cp products/alpha-genesis-harness/tests/visual/package*.json "$RUNNER_TEMP/harness-platform-visual/"
          npm ci --prefix "$RUNNER_TEMP/harness-platform-visual" --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/harness-platform-visual/node_modules/playwright-core/cli.js" install chromium
          python - <<'PY'
          import os, subprocess
          browser = subprocess.check_output(['node', '-e', "process.stdout.write(require('playwright-core').chromium.executablePath())"], text=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('HARNESS_NATIVE_BROWSER=' + browser + '\n')
          PY
      - name: Verify and exercise the same extracted archive on this OS
        env:
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          python products/alpha-genesis-harness/scripts/qualify_platform.py "$RUNNER_TEMP/harness-platform-received/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --expected-source-revision "$SOURCE_SHA" --visual-modules "$RUNNER_TEMP/harness-platform-visual/node_modules" --browser-executable "$HARNESS_NATIVE_BROWSER" --output "$RUNNER_TEMP/harness-platform-operation"
      - name: Record native Codex isolation on this OS without authentication
        if: ${{ always() && !cancelled() }}
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/harness-platform-codex"
          cp products/alpha-genesis-harness/tests/codex/package*.json "$RUNNER_TEMP/harness-platform-codex/"
          npm ci --prefix "$RUNNER_TEMP/harness-platform-codex" --ignore-scripts --no-audit --no-fund
          python - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          modules = root / 'harness-platform-codex/node_modules/@openai'
          if os.name == 'nt':
              architecture = {'amd64':'x64','x86_64':'x64','arm64':'arm64','aarch64':'arm64'}.get(platform.machine().lower())
              assert architecture, 'Unrecognized Windows architecture'
              package = modules / ('codex-win32-' + architecture)
              candidates = [p for p in package.rglob('codex.exe') if p.is_file() and not p.is_symlink()]
              if len(candidates) != 1:
                  raise RuntimeError('Expected exactly one installed official native Windows Codex executable')
              executable = candidates[0]
          else:
              # The official npm launcher resolves the installed platform layout;
              # do not assume a vendor subdirectory spelling on macOS.
              executable = root / 'harness-platform-codex/node_modules/.bin/codex'
              assert executable.is_file(), 'Official installed Codex launcher is missing'
          result = subprocess.run([sys.executable, 'products/alpha-genesis-harness/scripts/probe_codex_sandbox.py', '--executable', str(executable), '--work-root', str(Path.cwd() / 'harness-sandbox-probe')], capture_output=True, text=True, encoding='utf-8')
          output = root / 'harness-platform-operation'
          output.mkdir(parents=True, exist_ok=True)
          (output / (platform.system() + '-CODEX-HOST-VERIFICATION.stdout.txt')).write_text(result.stdout, encoding='utf-8')
          (output / (platform.system() + '-CODEX-HOST-VERIFICATION.stderr.txt')).write_text(result.stderr, encoding='utf-8')
          assert result.returncode in (0, 2), result.stderr
          receipt = json.loads(result.stdout)
          assert (result.returncode, receipt['status']) in ((0, 'PASS'), (2, 'BLOCKED'))
          assert receipt['inference_calls'] == 0 and receipt['real_credentials_used'] is False
          receipt.update(source_revision=os.environ['SOURCE_SHA'], archive_sha256=os.environ['ARCHIVE_SHA'], host=platform.platform())
          (output / (platform.system() + '-CODEX-HOST-VERIFICATION.json')).write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps({'host': platform.system(), 'status': receipt['status'], 'code': receipt.get('code')}))
          if platform.system() == 'Darwin':
              path = output / 'Darwin-UPGRADE-FOUNDRY-HOST-VERIFICATION.json'
              foundry = subprocess.run([sys.executable, 'products/alpha-genesis-harness/scripts/probe_upgrade_foundry.py', '--executable', str(executable), '--output', str(path)], capture_output=True, text=True, encoding='utf-8')
              (output / 'Darwin-UPGRADE-FOUNDRY-HOST-VERIFICATION.stdout.txt').write_text(foundry.stdout, encoding='utf-8')
              (output / 'Darwin-UPGRADE-FOUNDRY-HOST-VERIFICATION.stderr.txt').write_text(foundry.stderr, encoding='utf-8')
              assert foundry.returncode in (0, 2), foundry.stderr
              value = json.loads(path.read_text(encoding='utf-8'))
              assert (foundry.returncode, value['status']) in ((0, 'PASS'), (2, 'BLOCKED'))
              assert value['live_model_construction'] == 'NOT_TESTED' and value['generated_code_executed'] is False
              value.update(source_revision=os.environ['SOURCE_SHA'], archive_sha256=os.environ['ARCHIVE_SHA'], host=platform.platform())
              path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
              print(json.dumps({'host':'Darwin', 'foundry_status':value['status'], 'live_model_construction':'NOT_TESTED'}))

          PY
      - name: Preserve platform evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-platform-${{ matrix.os }}-${{ needs.qualify.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-platform-operation
          if-no-files-found: warn
  release-candidate:
    needs: [qualify, platform-first-use, local-model-qualification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/harness-received
          merge-multiple: true
      - name: Prepare pinned optional identity and extracted UI verification dependencies
        run: |
          python -m pip install -r products/alpha-genesis-harness/requirements-chatgpt.txt
          mkdir -p "$RUNNER_TEMP/harness-dom"
          cp products/alpha-genesis-harness/tests/dom/package*.json "$RUNNER_TEMP/harness-dom/"
          npm ci --prefix "$RUNNER_TEMP/harness-dom" --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/harness-owner-visual-deps"
          cp products/alpha-genesis-harness/tests/visual/package*.json "$RUNNER_TEMP/harness-owner-visual-deps/"
          npm ci --prefix "$RUNNER_TEMP/harness-owner-visual-deps" --ignore-scripts --no-audit --no-fund
      - name: Receive source-matched macOS and Windows operation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: alpha-genesis-harness-platform-*-${{ needs.qualify.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-received
          merge-multiple: true
      - name: Receive exact-source local inference evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: alpha-genesis-harness-local-${{ needs.qualify.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-local-public
      - name: Verify exact immutable artifact before publication
        env:
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          python -B products/alpha-genesis-harness/scripts/package_release.py verify "$RUNNER_TEMP/harness-received/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --expected-source-revision "$SOURCE_SHA" --compare-source-revision "$SOURCE_SHA"
          python -B products/alpha-genesis-harness/scripts/qualify_archive.py "$RUNNER_TEMP/harness-received/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --expected-source-revision "$SOURCE_SHA" --output "$RUNNER_TEMP/harness-received-operation" --dom-modules "$RUNNER_TEMP/harness-dom/node_modules"
      - name: Package the allowlisted local-model evidence
        id: model_archive
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['RUNNER_TEMP'])
          public = root / 'harness-local-public'
          record = json.loads((public / 'HOSTED-LOCAL-QUALIFICATION.json').read_text())
          source = os.environ['SOURCE_SHA']
          tree = subprocess.check_output(['git', 'rev-parse', source + ':products/alpha-genesis-harness'], text=True).strip()
          assert record['source_revision'] == source and record['source_product_tree'] == tree and record['source_unchanged'] is True
          assert record['release_qualification'] == 'PASS'
          # Optional quote failures remain in status/qualifications; GENESIS is the mandatory primary experiment.
          expected = record['published_sha256']
          files = {p.relative_to(public).as_posix(): p for p in public.rglob('*') if p.is_file()}
          assert set(files) == set(expected) | {'HOSTED-LOCAL-QUALIFICATION.json'}
          for name, path in files.items():
              relative = PurePosixPath(name)
              assert not path.is_symlink() and not relative.is_absolute() and '..' not in relative.parts and '\\' not in name
              if name in expected:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[name]
          archive = root / 'harness-received' / ('LOCAL-MODEL-EVIDENCE_' + source[:12] + '.zip')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as out:
              for name, path in sorted(files.items()):
                  info = zipfile.ZipInfo(name, date_time=(2026, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  out.writestr(info, path.read_bytes())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix('.zip.sha256').write_text(digest + '  ' + archive.name + '\n')
          shutil.copyfile(public / 'HOSTED-LOCAL-QUALIFICATION.json', archive.parent / 'HOSTED-LOCAL-QUALIFICATION.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('name=' + archive.name + '\nsha256=' + digest + '\n')
          PY
      - name: Publish source-specific prerelease without replacing prior releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          tag="alpha-genesis-harness-v0.3.0-rc-${SOURCE_SHA:0:12}"
          gh release create "$tag" "$RUNNER_TEMP/harness-received/"* --target "$SOURCE_SHA" --prerelease --latest=false --title "ALPHA GENESIS HARNESS 0.3.0 — release candidate" --notes-file products/alpha-genesis-harness/docs/RELEASE-NOTES.md
      - name: Download the published archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
        run: |
          tag="alpha-genesis-harness-v0.3.0-rc-${SOURCE_SHA:0:12}"
          gh release download "$tag" --dir "$RUNNER_TEMP/harness-published"
      - name: Verify downloaded local-model evidence
        env:
          MODEL_ARCHIVE_NAME: ${{ steps.model_archive.outputs.name }}
          MODEL_ARCHIVE_SHA: ${{ steps.model_archive.outputs.sha256 }}
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          data = (root / 'harness-published' / os.environ['MODEL_ARCHIVE_NAME']).read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['MODEL_ARCHIVE_SHA']
          # Reconciliation and owner assembly independently validate the contained manifest and every member.
          PY
      - name: Operate the published archive without publication credentials
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
        run: |
          python -B products/alpha-genesis-harness/scripts/qualify_archive.py "$RUNNER_TEMP/harness-published/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --expected-source-revision "$SOURCE_SHA" --output "$RUNNER_TEMP/harness-published-operation" --dom-modules "$RUNNER_TEMP/harness-dom/node_modules"
      - name: Reconcile actual evidence and assemble the bilingual owner handoff
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
          MODEL_ARCHIVE_NAME: ${{ steps.model_archive.outputs.name }}
          NODE_PATH: ${{ runner.temp }}/harness-owner-visual-deps/node_modules
        run: |
          product_tree=$(git rev-parse "$SOURCE_SHA:products/alpha-genesis-harness")
          tag="alpha-genesis-harness-v0.3.0-rc-${SOURCE_SHA:0:12}"
          python -B products/alpha-genesis-harness/scripts/reconcile_release_evidence.py --archive "$RUNNER_TEMP/harness-published/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --source-sha "$SOURCE_SHA" --source-product-tree "$product_tree" --operation-receipt "$RUNNER_TEMP/harness-published-operation/QUALIFICATION.json" --asset-dir "$RUNNER_TEMP/harness-published" --live-receipt "$RUNNER_TEMP/harness-published/HOSTED-LOCAL-QUALIFICATION.json" --model-evidence-archive "$RUNNER_TEMP/harness-published/$MODEL_ARCHIVE_NAME" --output "$RUNNER_TEMP/harness-final-evidence"
          python -B products/alpha-genesis-harness/scripts/owner_handoff.py --source-sha "$SOURCE_SHA" --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" --asset-dir "$RUNNER_TEMP/harness-published" --expected-sha256 "$ARCHIVE_SHA" --operation-receipt "$RUNNER_TEMP/harness-published-operation/QUALIFICATION.json" --matrix "$RUNNER_TEMP/harness-final-evidence/QUALIFICATION-MATRIX.json" --model-evidence-archive "$RUNNER_TEMP/harness-published/$MODEL_ARCHIVE_NAME" --output "$RUNNER_TEMP/harness-owner" > "$RUNNER_TEMP/harness-owner-build.json"
          owner_dir=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"harness-owner-build.json").read_text())["owner_directory"])')
          node products/alpha-genesis-harness/scripts/verify_owner_handoff.cjs "$owner_dir" "$RUNNER_TEMP/harness-owner-visual" "$SOURCE_SHA"
      - name: Publish the verified owner download and final qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          tag="alpha-genesis-harness-v0.3.0-rc-${SOURCE_SHA:0:12}"
          gh release upload "$tag" "$RUNNER_TEMP/harness-owner/"*.zip "$RUNNER_TEMP/harness-owner/"*.sha256 "$RUNNER_TEMP/harness-owner/"*.receipt.json "$RUNNER_TEMP/harness-final-evidence/"*.json "$RUNNER_TEMP/harness-final-evidence/"*.md "$RUNNER_TEMP/harness-owner-visual/"*
      - name: Preserve released-byte operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-release-operation-${{ needs.qualify.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harness-received-operation
            ${{ runner.temp }}/harness-published-operation
            ${{ runner.temp }}/harness-final-evidence
            ${{ runner.temp }}/harness-owner-build.json
            ${{ runner.temp }}/harness-owner-visual
          if-no-files-found: warn
