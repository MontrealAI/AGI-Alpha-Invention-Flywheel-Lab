name: ALPHA GENESIS HARNESS candidate qualification
on:
  pull_request:
    paths:
      - 'products/alpha-genesis-harness/**'
      - '.github/workflows/alpha-genesis-harness.yml'
  push:
    branches: [main]
    paths:
      - 'products/alpha-genesis-harness/**'
      - '.github/workflows/alpha-genesis-harness.yml'
permissions:
  contents: read
concurrency:
  group: alpha-genesis-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_sha: ${{ steps.build.outputs.source_sha }}
      archive_sha: ${{ steps.build.outputs.archive_sha }}
      archive_name: ${{ steps.build.outputs.archive_name }}
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute product and independent adversarial tests
        working-directory: products/alpha-genesis-harness
        run: |
          python -m pip install -r requirements-chatgpt.txt
          node --test tests/*.test.cjs
          python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Execute locked DOM customer and connected-model regressions
        env:
          NODE_PATH: ${{ runner.temp }}/harness-dom/node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/harness-dom"
          cp products/alpha-genesis-harness/tests/dom/package*.json "$RUNNER_TEMP/harness-dom/"
          npm ci --prefix "$RUNNER_TEMP/harness-dom" --ignore-scripts --no-audit --no-fund
          node products/alpha-genesis-harness/evidence/UI_REPLAY.cjs
          node products/alpha-genesis-harness/evidence/UI_PARALLEL_REPLAY.cjs
          node products/alpha-genesis-harness/evidence/UI_CONNECTED_ACCEPTANCE.cjs
          node products/alpha-genesis-harness/evidence/UI_AGENTIC_REPLAY.cjs
          node products/alpha-genesis-harness/evidence/UI_HTTP_WORKFLOW_REPLAY.cjs
          node products/alpha-genesis-harness/evidence/UI_GENESIS_NEXT_REPLAY.cjs
      - name: Record official Codex sandbox operation without model authentication
        run: |
          mkdir -p "$RUNNER_TEMP/harness-codex" "$RUNNER_TEMP/harness-assets"
          cp products/alpha-genesis-harness/tests/codex/package*.json "$RUNNER_TEMP/harness-codex/"
          npm ci --prefix "$RUNNER_TEMP/harness-codex" --ignore-scripts --no-audit --no-fund
          set +e
          python products/alpha-genesis-harness/scripts/probe_codex_sandbox.py --executable "$RUNNER_TEMP/harness-codex/node_modules/.bin/codex" --work-root "$GITHUB_WORKSPACE/harness-sandbox-probe" > "$RUNNER_TEMP/harness-assets/CODEX-HOST-VERIFICATION.json"
          probe_status=$?
          set -e
          test "$probe_status" -eq 0 || test "$probe_status" -eq 2
          cat "$RUNNER_TEMP/harness-assets/CODEX-HOST-VERIFICATION.json"
          # Exit 2 is recorded BLOCKED, never authenticated or sandbox-qualified PASS.
      - name: Exercise native foundry evaluator without model credentials
        run: |
          set +e
          python products/alpha-genesis-harness/scripts/probe_upgrade_foundry.py --executable "$RUNNER_TEMP/harness-codex/node_modules/.bin/codex" --output "$RUNNER_TEMP/harness-assets/UPGRADE-FOUNDRY-HOST-VERIFICATION.json"
          probe_status=$?
          set -e
          test "$probe_status" -eq 0 || test "$probe_status" -eq 2
          # A credential-free interpreter probe cannot qualify model construction.
      - name: Observe authorized official public source without model credentials
        run: |
          set +e
          python products/alpha-genesis-harness/scripts/probe_frontier_monitor.py --output "$RUNNER_TEMP/harness-assets/FRONTIER-MONITOR-VERIFICATION.json"
          probe_status=$?
          set -e
          test "$probe_status" -eq 0 || test "$probe_status" -eq 2
          # Retrieval and reported replay do not establish reproduced capability.
      - name: Render and exercise the customer interface in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/harness-visual/node_modules
          HARNESS_SCREENSHOT_DIR: ${{ runner.temp }}/harness-assets
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/harness-visual"
          cp products/alpha-genesis-harness/tests/visual/package*.json "$RUNNER_TEMP/harness-visual/"
          npm ci --prefix "$RUNNER_TEMP/harness-visual" --ignore-scripts --no-audit --no-fund
          node products/alpha-genesis-harness/evidence/UI_BROWSER_REPLAY.cjs
      - name: Preserve canonical mechanism and platform contracts
        run: |
          python -B -m unittest discover -s tests -p 'test_mechanism_harness_0*.py' -v
          python -B -m unittest discover -s tests -p 'test_connected_platform_runtime064.py' -v
      - name: Build exact committed archive and operate extracted bytes
        id: build
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python -B products/alpha-genesis-harness/scripts/package_release.py build --output "$RUNNER_TEMP/harness-assets" --source-revision "$EXPECTED_SOURCE" > "$RUNNER_TEMP/harness-build.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP'])/'harness-build.json').read_text())
          assert receipt['source_matches_commit'] is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('source_sha='+os.environ['EXPECTED_SOURCE']+'\n')
              out.write('archive_sha='+receipt['archive_sha256']+'\n')
              out.write('archive_name='+Path(receipt['archive']).name+'\n')
          PY
          archive=$(find "$RUNNER_TEMP/harness-assets" -name '*.zip' -type f)
          archive_sha=$(sha256sum "$archive" | cut -d' ' -f1)
          python -B products/alpha-genesis-harness/scripts/qualify_archive.py "$archive" --expected-sha256 "$archive_sha" --expected-source-revision "$EXPECTED_SOURCE" --output "$RUNNER_TEMP/harness-operation" --dom-modules "$RUNNER_TEMP/harness-dom/node_modules"
      - name: Preserve immutable candidate package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-assets
          if-no-files-found: error
      - name: Preserve operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-operation-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harness-build.json
            ${{ runner.temp }}/harness-operation
          if-no-files-found: warn
  native-platforms:
    # The owner's cross-platform release mandate covers standard public-repository
    # runners only; no larger/custom/private paid runner or billing change.
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Record platform job execution start
        run: |
          echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/harness-browser" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/harness-received
          merge-multiple: true
      - name: Prepare pinned browser verification dependency
        working-directory: products/alpha-genesis-harness/tests/visual
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright-core/cli.js install chromium
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          browser = subprocess.check_output(['node', '-e', "process.stdout.write(require('playwright-core').chromium.executablePath())"], text=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('HARNESS_NATIVE_BROWSER=' + browser + '\n')
              output.write('HARNESS_VISUAL_MODULES=' + str(Path('node_modules').resolve()) + '\n')
          PY
      - name: Operate exact archive through native source launcher and Chromium
        env:
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          python -B products/alpha-genesis-harness/scripts/qualify_platform.py "$RUNNER_TEMP/harness-received/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --expected-source-revision "$SOURCE_SHA" --output "$RUNNER_TEMP/harness-native-operation" --visual-modules "$HARNESS_VISUAL_MODULES" --browser-executable "$HARNESS_NATIVE_BROWSER"
      - name: Preserve native platform scope and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-native-${{ matrix.os }}-${{ needs.qualify.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-native-operation
          if-no-files-found: warn
  release-candidate:
    needs: [qualify, native-platforms]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.qualify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/harness-received
          merge-multiple: true
      - name: Download source-specific native platform evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: alpha-genesis-harness-native-*-${{ needs.qualify.outputs.source_sha }}-attempt-*
          path: ${{ runner.temp }}/harness-native-evidence
          merge-multiple: false
      - name: Verify and bundle native receipts, screenshots and downloads
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          source, archive = os.environ['SOURCE_SHA'], os.environ['ARCHIVE_SHA']
          included = {}
          origins = []
          for runner, host, browser_platform in [('windows-latest', 'Windows', 'win32'), ('macos-latest', 'Darwin', 'darwin')]:
              pattern = re.compile('alpha-genesis-harness-native-' + runner + '-' + source + '-attempt-([0-9]+)')
              available = [(int(match.group(1)), item) for item in (root / 'harness-native-evidence').iterdir() if (match := pattern.fullmatch(item.name)) and item.is_dir()]
              assert available, 'Missing native platform artifact for ' + runner
              attempt, directory = max(available)
              assert attempt <= int(os.environ['GITHUB_RUN_ATTEMPT'])
              origins.append({'runner': runner, 'artifact_name': directory.name, 'producer_attempt': attempt})
              receipt = json.loads((directory / 'PLATFORM-QUALIFICATION.json').read_text())
              browser = json.loads((directory / 'browser/BROWSER-VERIFICATION.json').read_text())
              assert receipt['status'] == 'PASS' and receipt['source_revision'] == source and receipt['archive_sha256'] == archive
              assert receipt['host']['system'] == host and receipt['checks']['browser'] == browser
              assert browser['status'] == 'PASS' and browser['source_revision'] == source and browser['platform'] == browser_platform
              assert browser['server_mode'] == 'external-native-launcher' and browser['screenshots'] and browser['exports']
              selected = ['PLATFORM-QUALIFICATION.json', 'browser/BROWSER-VERIFICATION.json']
              for name in browser['screenshots']:
                  assert Path(name).name == name and name.endswith('.png')
                  data = (directory / 'browser' / name).read_bytes()
                  assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data) > 8
                  selected.append('browser/' + name)
              for exported in browser['exports']:
                  name = exported['file']
                  assert Path(name).name == name
                  data = (directory / 'browser' / name).read_bytes()
                  assert data and len(data) == exported['bytes'] and hashlib.sha256(data).hexdigest() == exported['sha256']
                  selected.append('browser/' + name)
              for name in selected:
                  included[runner + '/' + name] = (directory / name).read_bytes()
          included['NATIVE-EVIDENCE-PROVENANCE.json'] = (json.dumps({'source_revision': source, 'archive_sha256': archive, 'producer_artifacts': origins}, indent=2) + '\n').encode()
          output = root / 'harness-received' / ('HARNESS_NATIVE_EVIDENCE_' + source[:12] + '.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as bundle:
              for name, data in sorted(included.items()):
                  bundle.writestr(zipfile.ZipInfo(name, (1980, 1, 1, 0, 0, 0)), data)
          output.with_suffix('.zip.sha256').write_text(hashlib.sha256(output.read_bytes()).hexdigest() + '  ' + output.name + '\n')
          PYCODE
      - name: Prepare pinned optional identity and extracted UI verification dependencies
        run: |
          python -m pip install -r products/alpha-genesis-harness/requirements-chatgpt.txt
          mkdir -p "$RUNNER_TEMP/harness-dom"
          cp products/alpha-genesis-harness/tests/dom/package*.json "$RUNNER_TEMP/harness-dom/"
          npm ci --prefix "$RUNNER_TEMP/harness-dom" --ignore-scripts --no-audit --no-fund
      - name: Verify exact immutable artifact before publication
        env:
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          python -B products/alpha-genesis-harness/scripts/package_release.py verify "$RUNNER_TEMP/harness-received/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --expected-source-revision "$SOURCE_SHA" --compare-source-revision "$SOURCE_SHA"
          python -B products/alpha-genesis-harness/scripts/qualify_archive.py "$RUNNER_TEMP/harness-received/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --expected-source-revision "$SOURCE_SHA" --output "$RUNNER_TEMP/harness-received-operation" --dom-modules "$RUNNER_TEMP/harness-dom/node_modules"
      - name: Reconcile immutable archive and live qualification receipts
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, shutil, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          assets, product = root / 'harness-received', Path('products/alpha-genesis-harness')
          source, archive = os.environ['SOURCE_SHA'], os.environ['ARCHIVE_SHA']
          report = json.loads((product / 'evidence/QUALIFICATION-MATRIX.json').read_text())
          rows = {row['id']: row for row in report['criteria']}
          inputs = []
          def evidence(name):
              path = assets / name
              raw = path.read_bytes()
              inputs.append({'file': name, 'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)})
              return json.loads(raw)
          operation_dir = root / 'harness-received-operation'
          shutil.copyfile(operation_dir / 'QUALIFICATION.json', assets / 'EXACT-ARCHIVE-QUALIFICATION.json')
          operation = evidence('EXACT-ARCHIVE-QUALIFICATION.json')
          assert operation['verdict'] == 'PASSED IN SCOPE' and operation['archive_sha256'] == archive and operation['source_revision'] == source
          assert operation['operations'] and all(item['returncode'] == 0 for item in operation['operations'])
          assert operation['dom_qualification'].startswith('PASS:')
          for name in operation['omega_qualification']['evidence_files']:
              assert Path(name).name == name
              shutil.copyfile(operation_dir / name, assets / name)
              evidence(name)
          browser = evidence('BROWSER-VERIFICATION.json')
          assert browser['status'] == 'PASS' and browser['source_revision'] == source and browser['platform'] == 'linux'
          native_name = 'HARNESS_NATIVE_EVIDENCE_' + source[:12] + '.zip'
          native_path = assets / native_name
          inputs.append({'file': native_name, 'sha256': hashlib.sha256(native_path.read_bytes()).hexdigest(), 'bytes': native_path.stat().st_size})
          with zipfile.ZipFile(native_path) as native:
              for runner in ('windows-latest', 'macos-latest'):
                  receipt = json.loads(native.read(runner + '/PLATFORM-QUALIFICATION.json'))
                  assert receipt['status'] == 'PASS' and receipt['archive_sha256'] == archive and receipt['source_revision'] == source
          frontier = evidence('FRONTIER-MONITOR-VERIFICATION.json')
          assert frontier['status'] in {'PASS', 'BLOCKED'}
          for name, digest in frontier['source_sha256'].items():
              relative = Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert hashlib.sha256((product / relative).read_bytes()).hexdigest() == digest
          if frontier['status'] == 'PASS':
              assert frontier['http_dispatch_verified'] and frontier['evidence_event']['evidence_status'] == 'reported'
          foundry = evidence('UPGRADE-FOUNDRY-HOST-VERIFICATION.json')
          assert foundry['status'] in {'PASS', 'BLOCKED'}
          updates = {
              'A1': ('PASS', 'Exact extracted DOM/HTTP operation plus Linux rendered-browser workflow; authored model fixtures.'),
              'A2': ('PASS', 'Actual connector and HTTP workflow operated from the freshly extracted immutable archive.'),
              'H1': ('PASS', 'Committed source comparison, external archive digest and clean extracted operation passed.'),
              'I1': ('PASS', 'Linux headless Chromium responsive, keyboard and export checks; finite accessibility scope.'),
              'I2': ('PASS', 'Windows/macOS native source-launcher processes and headless Chromium on identical ZIP; no desktop double-click, signing, notarization or clean consumer image claim.'),
              'J1': ('PASS', 'This external report reconciles source/archive identity and hashed input receipts without modifying the customer ZIP.'),
              'O13': (frontier['status'], 'One exact authorized official source observation and reported-only replay. No verified capability improvement, frontier coverage or publication freshness.')}
          for key, (status, scope) in updates.items():
              rows[key].update(status=status, actual_test_or_required_procedure=scope,
                               remaining_dependency_or_scope='See hashed input receipts and their stated limits.', evidence_location='Release input receipts listed in this report')
          rows['O11']['remaining_dependency_or_scope'] += ' Hosted credential-free original-interpreter probe: ' + foundry['status'] + '; no authenticated model construction was tested.'
          report.update(schema='alpha-genesis-harness-release-qualification/v1', source_revision=source, archive_sha256=archive,
                        commercial_mandate_satisfied=False, commercially_validated=False, input_receipts=inputs,
                        scope='External post-freeze supplement. PASS applies only to each named engineering scope; inherited failures, unknown costs and commercial/authentication blockers remain unchanged.')
          (assets / 'RELEASE-QUALIFICATION.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          lines = ['# Exact release qualification', '', 'Source: `' + source + '`', '', 'Customer ZIP SHA-256: `' + archive + '`', '',
                   '**Complete commercial mandate: not satisfied.** Finite engineering passes do not remove live authentication, model reliability, scientific advantage or commercial authorization gaps.', '',
                   '| Criterion | Status | Tested scope / remaining limit |', '|---|---|---|']
          for row in report['criteria']:
              cells = [row['id'] + ' — ' + row['requirement'], row['status'], row['actual_test_or_required_procedure'] + ' ' + row['remaining_dependency_or_scope']]
              lines.append('| ' + ' | '.join(cell.replace('|', '\\|').replace('\n', ' ') for cell in cells) + ' |')
          lines += ['', '## Input receipts', '', '| File | SHA-256 |', '|---|---|']
          lines += ['| ' + item['file'] + ' | `' + item['sha256'] + '` |' for item in inputs]
          lines += ['', '## Français', '', 'Le mandat commercial complet reste non satisfait. Chaque réussite vise uniquement le périmètre indiqué. Les échecs du modèle local, les égalités avec les méthodes ordinaires, les coûts inconnus et les autorisations manquantes demeurent visibles. Les reçus identifient les octets testés sans modifier le ZIP client.', '']
          (assets / 'RELEASE-QUALIFICATION.md').write_text('\n'.join(lines))
          PYCODE
      - name: Publish source-specific prerelease without replacing prior releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
        run: |
          tag="alpha-genesis-harness-v0.3.0-rc-${SOURCE_SHA:0:12}"
          gh release create "$tag" "$RUNNER_TEMP/harness-received/"* --target "$SOURCE_SHA" --prerelease --latest=false --title "ALPHA GENESIS HARNESS 0.3.0 — release candidate" --notes-file products/alpha-genesis-harness/docs/RELEASE-NOTES.md
      - name: Download the published archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
        run: |
          tag="alpha-genesis-harness-v0.3.0-rc-${SOURCE_SHA:0:12}"
          gh release download "$tag" --pattern "$ARCHIVE_NAME" --dir "$RUNNER_TEMP/harness-published"
      - name: Operate the published archive without publication credentials
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          ARCHIVE_NAME: ${{ needs.qualify.outputs.archive_name }}
          ARCHIVE_SHA: ${{ needs.qualify.outputs.archive_sha }}
        run: |
          python -B products/alpha-genesis-harness/scripts/qualify_archive.py "$RUNNER_TEMP/harness-published/$ARCHIVE_NAME" --expected-sha256 "$ARCHIVE_SHA" --expected-source-revision "$SOURCE_SHA" --output "$RUNNER_TEMP/harness-published-operation" --dom-modules "$RUNNER_TEMP/harness-dom/node_modules"
      - name: Preserve released-byte operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-genesis-harness-release-operation-${{ needs.qualify.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harness-received-operation
            ${{ runner.temp }}/harness-published-operation
          if-no-files-found: warn
