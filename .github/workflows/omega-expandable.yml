name: Omega expandable compatibility qualification
on:
  pull_request:
    paths:
      - 'omega/**'
      - 'commercial/ledger.py'
      - 'adaptive_enterprise/account.py'
      - 'connected_enterprise/finance.py'
      - 'campaign/omega-expandable-5790816e/**'
      - 'tests/test_account_snapshot_expansion.py'
      - '.github/workflows/omega-expandable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-matched-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r omega/requirements.txt
      - name: Complete Omega regressions
        run: python -m unittest discover -s omega -t . -p 'test_*.py' -v
      - name: Native authority and snapshot equivalence
        run: |
          python -m unittest tests.test_account_snapshot_expansion tests.test_adaptive_account -v
          python -m unittest discover -s tests -p 'test_connected_finance.py' -v
      - name: Installed product and independently replayed engineering commerce
        run: python campaign/omega-expandable-5790816e/reproduce.py --development-smoke --output "$RUNNER_TEMP/omega-expandable-smoke"
