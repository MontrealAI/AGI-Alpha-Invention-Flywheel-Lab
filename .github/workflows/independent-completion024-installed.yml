name: Independent installed completion024 CAS and queue continuation
on:
  push:
    branches:
      - qualification/completion024-installed-cas-independent-20261107
permissions:
  contents: read
concurrency:
  group: independent-completion024-cas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed-source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing supported source dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r requirements-cycle004.txt numpy==2.3.5 scipy==1.17.0
      - name: Assert exact executing SHA and frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -s qualification/completion024-independent/PROTOCOL.md
          git show 2cfd1540af0c056e2648976c9a307d7322ec5685:qualification/completion024-independent/PROTOCOL.md > "$RUNNER_TEMP/FROZEN_PROTOCOL.md"
          cmp "$RUNNER_TEMP/FROZEN_PROTOCOL.md" qualification/completion024-independent/PROTOCOL.md
          echo "EXACT_EXECUTING_HEAD=${{ github.sha }}"
          sha256sum qualification/completion024-independent/PROTOCOL.md scripts/operate_completion024.py connected_enterprise/transition_evidence.py
      - name: Independent historical v1 refusal and v2 CAS regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/CAS_TEST_RESOURCE.txt" \
            python -B -m unittest tests.test_transition_cas_sized tests.test_transition_cas_storage tests.test_transition_cas_candidate tests.test_transition_owner -v
      - name: Exact installed-source nonempty legacy queue to v2 continuation, resume and portable audit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/time -v -o "$RUNNER_TEMP/NATIVE_RESOURCE.txt" \
            python -B scripts/operate_completion024.py --output "$RUNNER_TEMP/completion024-installed"
      - name: Independent permitted public archive hash, integrity and private-key exclusion
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'completion024-installed'
          record=json.loads((root/'PROFILE.json').read_text())
          assert record.get('accepted') is True, 'NOT_ACCEPTED'
          assert record.get('complete_resume_financially_unchanged') is True
          assert record.get('original_native_prefix_preserved') is True
          assert record.get('original_queued_state_preserved') is True
          assert record.get('key_inode_unchanged') is True
          assert record.get('maturities',0)>=1
          assert record.get('profitable_settlements_funded_after_maturity',0)>=2
          assert record.get('audit',{}).get('accepted') is True
          assert len(record.get('commands',[]))>=7 and all(row.get('returncode')==0 for row in record['commands'])
          path=root/'public.zip'
          assert path.is_file() and not path.is_symlink()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==record.get('public_archive_sha256')
          with zipfile.ZipFile(path) as z:
            names=z.namelist()
            assert len(names)==len(set(names))
            assert z.testzip() is None
            for name in names:
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
              assert all(word not in name.lower() for word in ('.sqlite','.adaptive-simulation-key','.pem','/private-key','/.git/'))
          print(json.dumps({'verdict':'ENGINEERING_ONLY_ACCEPTED','commands':len(record['commands']),
            'maturities':record['maturities'],'earned_successors':record['profitable_settlements_funded_after_maturity'],
            'keyfree_archive_sha256':record['public_archive_sha256'],
            'source':'${{ github.sha }}','real_commerce':False,'historical_original_recovered':False},sort_keys=True))
          PY
      - name: Upload only known key-free public proof and resource telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completion024-installed-keyfree-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/completion024-installed/PROFILE.json
            ${{ runner.temp }}/completion024-installed/public.zip
            ${{ runner.temp }}/completion024-installed/failed-keyfree.zip
            ${{ runner.temp }}/CAS_TEST_RESOURCE.txt
            ${{ runner.temp }}/NATIVE_RESOURCE.txt
