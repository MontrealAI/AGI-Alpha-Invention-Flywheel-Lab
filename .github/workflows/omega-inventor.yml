name: Omega autonomous inventor qualification
on:
  pull_request:
    paths:
      - 'mechanism_harness/**'
      - 'tests/test_omega_inventor.py'
      - 'campaign/omega-inventor/**'
      - '.github/workflows/omega-inventor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-inventor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inventor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual hosted job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Preserve public source only, never account authority
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/SOURCE_COMMIT.txt"
          git archive --format=zip --output="$RUNNER_TEMP/omega-runtime-source.zip" HEAD mechanism_harness adaptive_enterprise commercial connected_enterprise experiments vendor portfolio25 production060 inventory061 flexibility063 enterprise tests requirements-commercial010.txt
      - name: Existing finite game regressions
        run: python -m unittest mechanism_harness.test_game_maker -v
      - name: Qualify executable inventor when present
        shell: bash
        run: |
          if test -f tests/test_omega_inventor.py; then
            python -m pip install -r requirements-commercial010.txt
            python -m unittest discover -s tests -p test_omega_inventor.py -v
            python -m mechanism_harness.inventor run --output "$RUNNER_TEMP/omega-inventor"
            python -m mechanism_harness.inventor audit --output "$RUNNER_TEMP/omega-inventor"
          else
            echo 'Registration/source acquisition stage; inventor not yet implemented.'
          fi
      - name: Preserve reproducible source and public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-inventor-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/SOURCE_COMMIT.txt
            ${{ runner.temp }}/omega-runtime-source.zip
            ${{ runner.temp }}/omega-inventor/REPORT.json
            ${{ runner.temp }}/omega-inventor/REPORT.html
          if-no-files-found: error
