name: Blue Sky portfolio model and independent replay
on:
  pull_request:
    paths:
      - 'portfolio/blue-sky-20261102-dot/**'
      - '.github/workflows/portfolio-blue-sky-dot.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio/blue-sky-20261102-dot/**'
      - '.github/workflows/portfolio-blue-sky-dot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-models:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Offline source-bound construction and independent checks
        shell: bash
        run: |
          set -euo pipefail
          P=portfolio/blue-sky-20261102-dot
          python -m unittest discover -s "$P/W1" -p 'test_water.py' -v
          python "$P/I1/run.py" --out "$RUNNER_TEMP/optical-replay"
          python "$P/verification/replay_interface.py" "$P/I1/interface.py" > "$RUNNER_TEMP/interface-verification.json"
          python "$P/verification/replay_water.py" "$P/W1/water.py" > "$RUNNER_TEMP/water-verification.json"
          python -c 'import json,sys; assert all(json.load(open(p))["pass"] for p in sys.argv[1:])' "$RUNNER_TEMP/interface-verification.json" "$RUNNER_TEMP/water-verification.json"
      - name: Retain compact model receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-dot-model-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/optical-replay/summary.json
            ${{ runner.temp }}/interface-verification.json
            ${{ runner.temp }}/water-verification.json
