name: Native design151 adverse profitability and capital sensitivity
on:
  pull_request:
    paths:
      - 'campaign/native-design-adverse151/**'
      - 'scripts/run_native_design_adverse151.py'
      - 'tests/test_native_design_adverse151.py'
      - '.github/workflows/native-design-adverse151.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-native-adverse:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Begin observed platform clock
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout exactly tested source without persisted authentication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert same source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install included pinned crypto dependencies
        run: python3 -m pip install -r requirements-commercial010.txt
      - name: Reject invalid registration and forged native adoption
        run: |
          python3 -B -m unittest -v tests.test_native_design_adverse151
          python3 -O -B -m unittest -v tests.test_native_design_adverse151
      - name: Execute all preregistered matched native trials once
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/run_native_design_adverse151.py --output "$RUNNER_TEMP/native-design151-accounts"
      - name: Review key-free result claims before public upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/native-design151-accounts/PUBLIC.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['schema']=='agi-alpha/native-design-adverse151/v1'
          assert p['decision']['cases_completed']==6
          assert set(p['cases'])=={
            f'{r}-{c}' for r in ('potential-demand','competing-low-value','supplier-refusal-cost')
            for c in ('low','medium')}
          assert p['actual_paid_commerce_profit_microUSD'] is None
          assert p['modeled_native_trailing365_profit_microUSD'] is None
          assert all(x['actual_external_collections_microUSD']==0
                     and x['real_buyer_count']==0
                     and x['native_financial_action_authority']==[] for x in p['cases'].values())
          print('NATIVE_ADVERSE151_AUDITED_SIX_CASE_DECISION',p['decision']['support'])
          PY
      - name: Upload compact public source-bound verdict only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-design151-public
          path: |
            ${{ runner.temp }}/native-design151-accounts/PUBLIC.json
            ${{ runner.temp }}/native-design151-accounts/REGISTRATION.json
          if-no-files-found: error
          retention-days: 30
