name: Omega cost-aware discovery and expense completeness
on:
  pull_request:
    paths:
      - 'mechanism_harness/**'
      - 'tests/test_omega_economical.py'
      - 'campaign/omega-inventor/**'
      - 'adaptive_enterprise/**'
      - 'commercial/**'
      - 'connected_enterprise/**'
      - 'enterprise/**'
      - '.github/workflows/omega-economical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-economical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing declared dependencies
        run: python -m pip install -r requirements-commercial010.txt
      - name: Source identity and 23 adverse regressions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/SOURCE_COMMIT.txt"
          python -m unittest discover -s tests -p test_omega_economical.py -v 2>&1 | tee "$RUNNER_TEMP/omega-v2-tests.log"
      - name: Registered fresh discovery and native operation
        shell: bash
        run: |
          set -euo pipefail
          python -m mechanism_harness.economical_native run --output "$RUNNER_TEMP/omega-economical"
          python -m mechanism_harness.economical_native audit --output "$RUNNER_TEMP/omega-economical" > "$RUNNER_TEMP/omega-v2-audit.json"
          sha256sum "$RUNNER_TEMP/omega-economical/NATIVE_EXPORT.json" > "$RUNNER_TEMP/native-before.sha256"
          python -m mechanism_harness.economical_native resume --output "$RUNNER_TEMP/omega-economical"
          sha256sum -c "$RUNNER_TEMP/native-before.sha256"
      - name: Export compact public evidence without account authority
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); root=temp/'omega-economical'
          study=json.loads((root/'V2_STUDY.json').read_text()); report=json.loads((root/'V2_REPORT.json').read_text())
          public={'source':report['source'],'actual_revenue_usd':0,'full_objective_achieved':False,
                  'campaigns':[{'seeds':c['development_seeds'],'holdout':c['holdout_seeds'],
                  'cold_work':c['cold']['acquisition_work'],'inherited_work':c['inherited']['acquisition_work'],
                  'exhaustive_work':c['exhaustive']['acquisition_work'],'confirmation_cases':c['confirmation']['case_count'],
                  'outputs_equal':c['all_comparator_outcomes_equal'],'cpu_ns':c['cpu_ns']} for c in study['campaigns']],
                  'native_summary':report['native']['native_summary'],'settled':report['native']['settled'],
                  'refused':report['native']['refused'],'cost_boundary':report['cost_boundary'],
                  'sha256':{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ('V2_REPORT.json','V2_STUDY.json','NATIVE_EXPORT.json')}}
          (temp/'omega-v2-public.json').write_text(json.dumps(public,indent=2)+'\n')
          PY
      - name: Preserve only public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-economical-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/SOURCE_COMMIT.txt
            ${{ runner.temp }}/omega-v2-tests.log
            ${{ runner.temp }}/omega-v2-audit.json
            ${{ runner.temp }}/omega-v2-public.json
          if-no-files-found: warn
