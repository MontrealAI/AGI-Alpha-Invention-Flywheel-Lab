name: Omega coupled buyer seller probe
on:
  pull_request:
    paths:
      - 'omega/**'
      - 'commercial/ledger.py'
      - 'connected_enterprise/finance.py'
      - 'campaign/omega-water-20261103/**'
      - '.github/workflows/omega-water.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned scientific control and native account dependencies
        run: python -m pip install -r omega/requirements.txt
      - name: Qualify repository platform-window contract
        run: python -m unittest discover -s tests -p 'test_connected_platform_runtime064.py' -v
      - name: Qualify source matched buyer and seller
        run: python -m unittest omega.test_buyer omega.test_seller omega.test_http omega.test_product omega.test_strategy omega.test_operate -v
      - name: Execute buyer comparison and causal native seller controls
        run: |
          python -m omega experiment --output "$RUNNER_TEMP/omega-buyer.json"
          python -m omega.operate --output "$RUNNER_TEMP/omega-seller"
          python -c 'import os; from omega.operate import replay_audit; assert replay_audit(os.environ["RUNNER_TEMP"]+"/omega-seller")["accepted"]'
          python -c 'import os; from dataclasses import replace; from omega import operate,strategy; game=strategy.make_game(costs=replace(strategy.Costs(),packaging_hours=0,research_cents=100,outreach_cents=100,webinar_facilitation_cents=0,ai_build_bill_cents=100000,founder_total_minutes=30,founder_slots_per_quarter=0)); path=os.environ["RUNNER_TEMP"]+"/omega-autonomous"; operate.run(path,game=game,modes=("expected",)); assert operate.replay_audit(path)["accepted"]'
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/omega-buyer.json")); assert p["verdicts"]["super_alpha"]=="NOT_ESTABLISHED"; assert p["successor"]["ordinary_equal_content_reuse_identical"]; print(p["verdicts"])'
