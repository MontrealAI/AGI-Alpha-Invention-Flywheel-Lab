name: Omega coupled buyer seller probe
on:
  pull_request:
    paths:
      - 'omega/**'
      - 'campaign/omega-water-20261103/**'
      - '.github/workflows/omega-water.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned scientific control and native account dependencies
        run: python -m pip install -r omega/requirements.txt
      - name: Qualify source matched buyer and seller
        run: python -m unittest omega.test_buyer omega.test_seller omega.test_http -v
      - name: Execute registered buyer comparison and audit native 365 day research arm
        run: |
          python -m omega experiment --output "$RUNNER_TEMP/omega-buyer.json"
          python -m omega.seller --output "$RUNNER_TEMP/omega-seller"
          python -c 'import os; from omega.seller import replay_audit; assert replay_audit(os.environ["RUNNER_TEMP"]+"/omega-seller")["accepted"]'
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/omega-buyer.json")); assert p["verdicts"]["super_alpha"]=="NOT_ESTABLISHED"; assert p["successor"]["ordinary_equal_content_reuse_identical"]; print(p["verdicts"])'
