name: Independent completion024 CAS claim and maturity boundary
on:
  push:
    branches:
      - qualification/completion024-installed-cas-independent-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-cas-claim-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact head and antecedent frozen protocol
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 45478d33ef376a21e99b3907971fea8e1a90d942 HEAD
          git show 45478d33ef376a21e99b3907971fea8e1a90d942:qualification/completion024-independent/CLAIM_MATURITY_PROTOCOL.md >/dev/null
          sha256sum qualification/completion024-independent/CLAIM_MATURITY_PROTOCOL.md tests/test_completion024_cas_claim_boundary_independent.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing project dependencies only
        run: python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r requirements-cycle004.txt numpy==2.3.5 scipy==1.17.0
      - name: Execute frozen three-arm independent native CAS boundary challenge
        run: python -B -m unittest tests.test_completion024_cas_claim_boundary_independent -v
      - name: Record successful exact-head source
        if: success()
        run: git rev-parse HEAD
