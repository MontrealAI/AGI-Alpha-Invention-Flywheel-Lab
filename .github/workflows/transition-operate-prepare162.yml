name: Transition162 independent operate-prepare epoch exclusion
on:
  pull_request:
    paths:
      - 'tests/test_transition_operate_prepare162.py'
      - 'docs/transition-operate-prepare162/**'
      - '.github/workflows/transition-operate-prepare162.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conflicting-operator-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record actual hosted job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact preregistered branch protocol exists
        run: |
          test -s docs/transition-operate-prepare162/PROTOCOL.md
          python -B -c "from pathlib import Path; p=Path('docs/transition-operate-prepare162/PROTOCOL.md').read_text(); assert 'ced6c1cb004887dcdafaea59a2976020be649f8e' in p"
      - name: Owner reference control (not authenticated financial evidence)
        run: python -B -m unittest -v tests.test_transition_authorization_reuse
      - name: Execute one preregistered cross-operation failure probe
        run: python -B -m unittest -v tests.test_transition_operate_prepare162
