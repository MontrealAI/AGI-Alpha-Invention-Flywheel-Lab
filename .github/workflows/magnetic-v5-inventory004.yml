name: Magnetic rotor independent MATLAB v5 directory gate 004
on:
  pull_request:
    paths:
      - 'research/magnetic_rotor001/v5_inventory.py'
      - 'research/magnetic_rotor001/MAT_V5_INVENTORY_PROTOCOL004.md'
      - 'tests/test_magnetic_v5_inventory004.py'
      - '.github/workflows/magnetic-v5-inventory004.yml'
  push:
    branches:
      - research/magnetic-rotor-noncontact-20261108
permissions:
  contents: read
jobs:
  independent-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Declare platform start epoch
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout literal executing source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove exact source and pre-implementation protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor ea3cbf4739e55249f20afc2d9b1af49a5eab9745 HEAD
          git merge-base --is-ancestor 9c68ab9d5a14857c1084a4573b74fe98ab48ef34 HEAD
          git merge-base --is-ancestor a24c5048788f9cc5b06e266cb71ef965771f19b9 HEAD
          git merge-base --is-ancestor 002fd92a920418b8e2a89a32f4aaadcd71366647 HEAD
          test "$(git show 002fd92a920418b8e2a89a32f4aaadcd71366647:research/magnetic_rotor001/MAT_V5_INVENTORY_PROTOCOL004.md | sha256sum | cut -d ' ' -f1)" = "$(sha256sum research/magnetic_rotor001/MAT_V5_INVENTORY_PROTOCOL004.md | cut -d ' ' -f1)"
          sha256sum research/magnetic_rotor001/{gate.py,schema.py,v5_inventory.py,MAT_V5_INVENTORY_PROTOCOL004.md} tests/test_magnetic_v5_inventory004.py
      - name: Use standard Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned existing public fixture dependency
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Run structural and adversarial checks before external archive
        run: |
          python -m unittest tests.test_magnetic_v5_inventory004 -v
          python -O -m unittest tests.test_magnetic_v5_inventory004 -v
      - name: Exactly one bounded public original-source directory operation
        shell: bash
        run: |
          set -euo pipefail
          python -m research.magnetic_rotor001.v5_inventory --output "$RUNNER_TEMP/magnetic-v5-004"
          python - "$RUNNER_TEMP/magnetic-v5-004/MAT_V5_DIRECTORY_RESULT.json" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          r=json.loads(p.read_text())
          assert r['schema']=='agi-alpha/magnetic-mat-independent-directory004/v1'
          assert r['status']=='INDEPENDENT_DIRECTORY_PASS_PHYSICAL_HOLD'
          assert r['source_archive_sha256']=='a5a536b9f279604a3aee1a9caaec134b8586d8b5972cbd9733f465cdbb3d3bc8'
          assert r['inspected_member_count']==10 and r['failed_member_count']==0
          assert r['unmodified_scipy_schema002_status']=='FAILED'
          assert not r['matlab_numeric_arrays_interpreted'] and not r['actual_physical_observations_interpreted']
          assert r['external_commercial_rights']=='UNVERIFIED' and r['deployment']=='NO_DEPLOY'
          print(json.dumps({'status':r['status'],'source':r['source_archive_sha256'],'members':10,'shared':r['all_ten_common_names']},sort_keys=True))
          PY
      - name: Public key-free result hash
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/magnetic-v5-004/MAT_V5_DIRECTORY_RESULT.json"; then
            sha256sum "$RUNNER_TEMP/magnetic-v5-004/MAT_V5_DIRECTORY_RESULT.json"
          fi
      - name: Retain positive or negative original verdict without raw data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: magnetic-v5-inventory004-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magnetic-v5-004/MAT_V5_DIRECTORY_RESULT.json
          if-no-files-found: warn
