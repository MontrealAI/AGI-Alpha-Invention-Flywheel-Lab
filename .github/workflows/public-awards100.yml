name: Official CanadaBuys public-award observation100 (one GET, research only)
on:
  pull_request:
    paths:
      - 'campaign/public-awards100/**'
      - 'research/public_awards100.py'
      - 'tests/test_public_awards100.py'
      - '.github/workflows/public-awards100.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-awards100:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact checked-out source and original immutable protocol
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor abe191c3fe385ea865a3358a33d31422bf92215a HEAD
          test "$(git rev-parse HEAD:campaign/public-awards100/PROTOCOL.md)" = "$(git rev-parse abe191c3fe385ea865a3358a33d31422bf92215a:campaign/public-awards100/PROTOCOL.md)"
      - name: Run all frozen synthetic M0-M7 checks before source access
        run: python -B -m unittest discover -s tests -p 'test_public_awards100.py' -v
      - name: One fixed official GET; retain complete failures without favorable retries
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/award100-evidence"
          python -B -m research.public_awards100 --output "$RUNNER_TEMP/award100-evidence/RESULT.json"
      - name: Preserve only compact aggregated no-private-data receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-awards100-source-observation-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/award100-evidence/RESULT.json
          if-no-files-found: warn
