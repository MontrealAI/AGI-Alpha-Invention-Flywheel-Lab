name: Canonical CSV backend operating qualification 029
on:
  pull_request:
    paths:
      - 'connected_enterprise/**'
      - 'mechanism_harness/**'
      - 'adaptive_enterprise/**'
      - 'commercial/**'
      - 'campaign/mechanism-harness-027/**'
      - 'scripts/run_canonical_csv029.py'
      - 'tests/test_csv_backend029.py'
      - '.github/workflows/canonical-csv029.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-operating-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [conventional, optimized_eligible, direct, equal_content, replanned, inherited]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Native prepayment, identity and direct-control regressions
        run: |
          python -m unittest discover -s tests -p test_common_cost026.py -v
          python -m unittest discover -s tests -p test_csv_backend029.py -v
      - name: Fixed actual canonical operating world and independent audit
        run: python scripts/run_canonical_csv029.py --arm '${{ matrix.arm }}' --output RESULT.json
      - name: Compact summary only, no account authority
        run: python -c "import pathlib; assert pathlib.Path('RESULT.json').stat().st_size < 2000000"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-csv029-${{ matrix.arm }}
          path: RESULT.json
          retention-days: 7
          if-no-files-found: error
