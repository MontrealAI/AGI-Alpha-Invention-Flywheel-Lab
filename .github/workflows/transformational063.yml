name: Blue Sky frontier and historical operating controls
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transformational063-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-cycle004.txt -r requirements-commercial010.txt
      - name: Dispatch, independent verification and financial decision regressions
        run: |
          python -m unittest discover -s tests -p 'test_flexibility063*.py' -v
          python -m unittest discover -s tests -p 'test_connected_transformational*.py' -v
      - name: Execute fresh synthetic technical comparison
        run: python -m flexibility063.experiment --output "$RUNNER_TEMP/flexibility063-technical"
      - name: Qualify the five-route source and actual artifact contracts
        run: |
          python -m unittest tests.test_public_portfolio_20261102 -v
          python experiments/public_portfolio_20261102/verification/r2_guard_tests_002.py --output "$RUNNER_TEMP/public-portfolio-r2-guards.json"
          python -m unittest experiments.public_portfolio_20261102.verification.test_recovery -v
          python -m unittest experiments.public_portfolio_20261102.verification.test_dispatch_case -v
          python -m unittest experiments.public_portfolio_20261102.verification.test_recovery_fast -v
          python -m unittest experiments.public_portfolio_20261102.verification.test_finalize_run -v
          python experiments/public_portfolio_20261102/verification/verify_artifacts.py --output "$RUNNER_TEMP/public-portfolio-artifact-replay.json"
      - name: Recheck the ten retained native portfolio financial exports
        if: hashFiles('experiments/public_portfolio_20261102/evidence/economics-r2/public/RESULTS.json') != ''
        run: python experiments/public_portfolio_20261102/verification/r2_recheck_retained.py --public-root experiments/public_portfolio_20261102/evidence/economics-r2/public --audit-receipts experiments/public_portfolio_20261102/evidence/economics-r2/audit-receipts --output "$RUNNER_TEMP/public-portfolio-retained-finance.json"
      - name: Recheck separately retained actual recovery engineering
        if: hashFiles('experiments/public_portfolio_20261102/evidence/economics-r2/public/RESULTS.json') != ''
        run: |
          python experiments/public_portfolio_20261102/verification/r2_recheck_recovered_retained.py --public-root experiments/public_portfolio_20261102/evidence/economics-r2/public --original-four-report experiments/public_portfolio_20261102/verification/r2_actual_recovery_audit_001.json --output "$RUNNER_TEMP/public-portfolio-recovered-four.json"
          python experiments/public_portfolio_20261102/verification/r2_additional_recovery_replay.py --public-root experiments/public_portfolio_20261102/evidence/economics-r2/public --output "$RUNNER_TEMP/public-portfolio-recovered-two.json"
      - name: Verify the inspected research edition and retained evidence identities
        run: python docs/transformational063/verify_publication.py
      - name: Blue Sky probes, open scale and historical-custody regressions
        run: |
          python -m unittest tests.test_blue_sky064 tests.test_connected_open_scale064 tests.test_historical_publication063 -v
          python -m research.blue_sky064 --output "$RUNNER_TEMP/blue-sky064-probes"
      - name: Operate and independently audit native simulated commercial cycles
        run: |
          python -m connected_enterprise.transformational063 run --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/transformational063"
          python -m connected_enterprise.transformational063 audit --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/transformational063"
      - name: Retain compact public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: transformational063-public-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-portfolio-r2-guards.json
            ${{ runner.temp }}/public-portfolio-artifact-replay.json
            ${{ runner.temp }}/public-portfolio-retained-finance.json
            ${{ runner.temp }}/public-portfolio-recovered-four.json
            ${{ runner.temp }}/public-portfolio-recovered-two.json
            ${{ runner.temp }}/blue-sky064-probes/RESULT.json
            ${{ runner.temp }}/flexibility063-technical
            ${{ runner.temp }}/transformational063/REPORT.json
            ${{ runner.temp }}/transformational063/PROTOCOL.json
            ${{ runner.temp }}/transformational063/SOURCE.json
            ${{ runner.temp }}/transformational063/AUDIT.json
            ${{ runner.temp }}/transformational063/source
            ${{ runner.temp }}/transformational063/public
          if-no-files-found: warn
