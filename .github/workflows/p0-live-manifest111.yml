name: P0 live financial manifest closure111 (key-free dynamic qualification)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-manifest-live-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the immutable before-code protocol
        shell: bash
        run: |
          set -euo pipefail
          # The pre-code registration is an immutable sibling commit of the
          # implemented branch, NOT an ancestor. Never assert false ancestry.
          registration=5640ec69e3faedd39886707abf368c9fb7192012
          expected_blob=215191e0789cf584bf8e5acc01da9c9aba676054
          protocol=campaign/p0-live-manifest111/PROTOCOL.md
          if ! git cat-file -e "$registration^{commit}" 2>/dev/null; then
            git -c protocol.version=2 fetch --no-tags --depth=1 origin "$registration"
          fi
          test "$(git cat-file -p "$registration" | sed -n 's/^parent //p' | head -1)" = de9546ef9083f64a25186f1c5163e3a3a4eaeae5
          test "$(git rev-parse "$registration:$protocol")" = "$expected_blob"
          test "$(git hash-object "$protocol")" = "$expected_blob"
          echo "Immutable registration content and declared parent verified; no ancestry claimed."
          git show -s --format='registration commit %H %cI' "$registration"
          git show -s --format='executing source %H %cI' HEAD
      - name: Install standard qualified public dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt -r requirements-cycle004.txt numpy==2.3.5 scipy==1.17.0
      - name: Exercise five actual production dispatchers and mutation refusals
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest tests.test_p0_live_manifest_closure111 -v 2>&1 | tee "$RUNNER_TEMP/p0-manifest111-tests.txt"
      - name: Preserve key-free dynamic qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-live-manifest111-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p0-manifest111-tests.txt
          if-no-files-found: warn
