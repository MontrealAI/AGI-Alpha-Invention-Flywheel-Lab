name: P0-249 pinned owner v2-CAS differential (synthetic key-free)
on:
  pull_request:
    paths:
      - 'research/source_transition_trust246/DIFFERENTIAL249_PROTOCOL.md'
      - 'research/source_transition_trust246/owner_wire248.py'
      - 'research/source_transition_trust246/test_owner_differential249.py'
      - '.github/workflows/source-transition-differential249.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0249-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  exact-pinned-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Exact-head public checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.12 on standard public runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download immutable public historical owner codec (no auth)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --fail --location --silent --show-error --max-time 60 --retry 0 \
            'https://raw.githubusercontent.com/MontrealAI/AGI-Alpha-Invention-Flywheel-Lab/ced6c1cb004887dcdafaea59a2976020be649f8e/connected_enterprise/transition_evidence.py' \
            -o "$RUNNER_TEMP/p0249-pinned-owner.py"
      - name: Seven source-matched synthetic tests in scrubbed environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0249-home"
          cd research/source_transition_trust246
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p0249-home" \
            PINNED_OWNER_SOURCE="$RUNNER_TEMP/p0249-pinned-owner.py" \
            PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v test_owner_differential249.py
      - name: Bind exact source, owner bytes and test exit to non-authority receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0249-receipt"
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('research/source_transition_trust246')
          paths=['DIFFERENTIAL249_PROTOCOL.md','owner_wire248.py','test_owner_differential249.py']
          hist=Path(os.environ['RUNNER_TEMP'])/'p0249-pinned-owner.py'
          raw=hist.read_bytes()
          blob=hashlib.sha1(('blob %d\\0'%len(raw)).encode()+raw).hexdigest()
          assert blob=='2397091ef8e1960ad13950693d5b3cd04e2ff7c5'
          receipt={
            'schema':'agi-alpha/p0-249-pinned-owner-differential/v1',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'historical_owner_commit':'ced6c1cb004887dcdafaea59a2976020be649f8e',
            'historical_owner_blob':blob,
            'files_sha256':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths},
            'fixed_tests_exit_zero':True,
            'fixed_tests':7,
            'synthetic_no_key':True,
            'source_matched_wire_only':True,
            'original_owner_signer_repaired':False,
            'actual_account_or_hmac_exercised':False,
            'original_owner_checkpoint_known':False,
            'release_or_paid_commerce_qualified':False,
            'actual_host_model_bill_usd':None
          }
          dest=Path(os.environ['RUNNER_TEMP'])/'p0249-receipt'/'RESULT.json'
          dest.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\\n')
          PY
      - name: Upload compact exact-head evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0249-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0249-receipt/RESULT.json
          if-no-files-found: error
          retention-days: 7
