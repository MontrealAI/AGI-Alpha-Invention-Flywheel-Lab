# SPDX-License-Identifier: Apache-2.0
name: HARNESS 68 publication recovery

on:
  push:
    branches: [recovery/harness-68-publication-20261110]
    paths:
      - .github/workflows/harness-68-publication-recovery.yml
      - scripts/release_transport.py
      - tests/test_release_transport.py
      - docs/harness-68-publication-recovery.md

permissions:
  contents: write
  actions: read

concurrency:
  group: harness-68-publication-recovery
  cancel-in-progress: false

jobs:
  recover-publication:
    if: github.repository == 'MontrealAI/AGI-Alpha-Invention-Flywheel-Lab' && github.ref == 'refs/heads/recovery/harness-68-publication-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out reviewed recovery controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: recovery-control
          persist-credentials: false

      - name: Check out the exact qualified product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 68c2c1a00c78579b76788955a87f74dace8cc404
          path: qualified-source
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Test transport guards before acquiring or publishing assets
        run: python -m unittest discover -s recovery-control/tests -p 'test_release_transport.py' -v

      - name: Acquire the pinned public evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python recovery-control/scripts/release_transport.py acquire --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source"

      - name: Validate identities and prepare preserved evidence
        id: base_preparation
        shell: bash
        run: |
          python recovery-control/scripts/release_transport.py prepare --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source"
          state_sha256=$(sha256sum "$RUNNER_TEMP/harness-recovery/BASE-STATE.json" | cut -d ' ' -f1)
          echo "state_sha256=$state_sha256" >> "$GITHUB_OUTPUT"

      - name: Install the qualified source's locked verification dependencies
        run: |
          python -m pip install -r qualified-source/products/alpha-genesis-harness/requirements-chatgpt.txt
          mkdir -p "$RUNNER_TEMP/harness-recovery-dom" "$RUNNER_TEMP/harness-recovery-visual"
          cp qualified-source/products/alpha-genesis-harness/tests/dom/package*.json "$RUNNER_TEMP/harness-recovery-dom/"
          cp qualified-source/products/alpha-genesis-harness/tests/visual/package*.json "$RUNNER_TEMP/harness-recovery-visual/"
          npm ci --prefix "$RUNNER_TEMP/harness-recovery-dom" --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/harness-recovery-visual" --ignore-scripts --no-audit --no-fund

      - name: Operate the received customer archive without publication credentials
        run: python recovery-control/scripts/release_transport.py operate-received --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source" --dom-modules "$RUNNER_TEMP/harness-recovery-dom/node_modules"

      - name: Publish or verify the exact base release assets without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python recovery-control/scripts/release_transport.py publish-base --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source" --expected-base-state-sha256 "${{ steps.base_preparation.outputs.state_sha256 }}"

      - name: Download the published assets for independent byte comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: python recovery-control/scripts/release_transport.py download-base --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source" --expected-base-state-sha256 "${{ steps.base_preparation.outputs.state_sha256 }}"

      - name: Restore represented empty diagnostics and verify the download inventory
        run: python recovery-control/scripts/release_transport.py restore --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source"

      - name: Operate the downloaded customer archive without publication credentials
        run: python recovery-control/scripts/release_transport.py operate-published --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source" --dom-modules "$RUNNER_TEMP/harness-recovery-dom/node_modules"

      - name: Reconcile evidence and verify the bilingual owner handoff
        id: owner_assembly
        shell: bash
        run: |
          python recovery-control/scripts/release_transport.py assemble --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source" --visual-modules "$RUNNER_TEMP/harness-recovery-visual/node_modules"
          state_sha256=$(sha256sum "$RUNNER_TEMP/harness-recovery/FINAL-STATE.json" | cut -d ' ' -f1)
          echo "state_sha256=$state_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the verified owner bundle and receipts without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python recovery-control/scripts/release_transport.py publish-final --root "$RUNNER_TEMP/harness-recovery" --source-dir "$GITHUB_WORKSPACE/qualified-source" --expected-base-state-sha256 "${{ steps.base_preparation.outputs.state_sha256 }}" --expected-final-state-sha256 "${{ steps.owner_assembly.outputs.state_sha256 }}"

      - name: Preserve all recovery evidence, including failures and original input archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-68-publication-recovery-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-recovery
          include-hidden-files: true
          if-no-files-found: warn
