name: Materialize authorized GENESIS publication
on:
  push:
    branches: ['publication/genesis-v1.1.0-20261104']
    paths: ['docs/alpha-genesis/ALPHA_GENESIS_FLYWHEEL_OMEGA_v1.1.0_SOURCE.zip']
permissions:
  contents: write
concurrency:
  group: genesis-publication-materialize
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - name: Verify original package, reproduce studies and prepare publication
        run: python3 _publication/genesis-v1.1.0/materialize.py
      - name: Commit exact verified publication without temporary transport
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git ls-remote origin "${{ github.ref }}" | cut -f1)" = "${{ github.sha }}"
          git add docs/alpha-genesis docs/research/alpha-genesis-flywheel-omega.pdf _publication/genesis-v1.1.0 .github/workflows/genesis-publication-materialize.yml
          git diff --cached --name-only | python3 -c 'import sys; paths=sys.stdin.read().splitlines(); assert paths and all(p.startswith(("docs/alpha-genesis/", "_publication/genesis-v1.1.0/")) or p in ("docs/research/alpha-genesis-flywheel-omega.pdf", ".github/workflows/genesis-publication-materialize.yml") for p in paths)'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish byte-preserved ALPHA GENESIS1.1 research package'
          git push origin HEAD:"${{ github.ref }}"
