name: ALPHA Economic Engine integration
on:
  push:
    branches: ['feature/alpha-economic-engine-full-20261116']
    paths: ['.github/workflows/alpha-economic-engine.yml', 'connected_enterprise/alpha_economic/**', 'tests/test_alpha_economic*', 'scripts/alpha_economic*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform window
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            connected_enterprise
            adaptive_enterprise
            commercial
            enterprise
            vendor
            experiments
            portfolio25
            verification
            production060
            inventory061
            flexibility063
            mechanisms
            flywheel
            products/alpha-genesis-harness
            tests
            scripts
            docs/alpha-economic-engine
            .alpha-transfer
      - name: Assemble authorized exact public source on this feature branch only
        if: ${{ github.ref == 'refs/heads/feature/alpha-economic-engine-full-20261116' }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          manifest=pathlib.Path('scripts/alpha_economic_delivery.json')
          if not manifest.exists():
              print('No source transfer pending.');raise SystemExit(0)
          spec=json.loads(manifest.read_text())
          fragments=[]
          for name in spec['fragments']:
              if not name.startswith('part') or '/' in name or '..' in name:raise ValueError('Invalid transport fragment')
              text=''.join(pathlib.Path('.alpha-transfer',name).read_text().split())
              # Correct three identified transcription defects before checking the frozen source digest.
              if name=='part0':
                  text=text.replace('GqIxTNXUyw2c8mOmYzYDKifxE6','GqIxTNXUyw2c8mOmYzYyDKifxE6')
                  if hashlib.sha256(text.encode()).hexdigest()!='b933974d92dbe1f4262aa23d35bdf1d2ae61d8352de0266aa4d8646c951b3083b':raise ValueError('First fragment identity failed')
              elif name=='part4b':
                  text=text[:1100]+'GkG2w50df7s5GDabW34tGNSqfmurX3fr1X4wDBqNvr8ThrXtZr3eCt1hq9Wou43tWiN0W/1WfysYpowgbJVgzLaSypdEcLoSJcEZ'+text[1200:]
                  if hashlib.sha256(text.encode()).hexdigest()!='8751e6b312169f051f319801e58f989ada05521efdbf6256328d4447db8024ef':raise ValueError('Fragment 4b identity failed')
              elif name=='part4c':
                  text=text[:1700]+'BjBCw/9JosKzVQJ+7X7u9G2VvlLSFFcSipNobioYIyEVJvJfHEutatGoypHCXZA2O5Sib++GEwzaCIxQGWRYKm3UDAOO+ReC/bEw'+text[1800:]
                  if hashlib.sha256(text.encode()).hexdigest()!='a3eb636de92049b22af37a69785aa06809c1b360bd0f8ade206b5f71f19a4d4b':raise ValueError('Fragment 4c identity failed')
              fragments.append(text)
          decompressor=zlib.decompressobj()
          raw=decompressor.decompress(base64.b64decode(''.join(fragments),validate=True),2_000_001)
          if len(raw)>2_000_000 or decompressor.unconsumed_tail or not decompressor.eof:raise ValueError('Bounded source transfer required')
          if len(raw)!=spec['uncompressed_bytes'] or hashlib.sha256(raw).hexdigest()!=spec['sha256']:raise ValueError('Source transfer identity mismatch')
          payload=json.loads(raw)
          if payload['schema']!='alpha-economic/public-source-transfer/v1':raise ValueError('Unexpected source transfer schema')
          allowed=('connected_enterprise/alpha_economic/','tests/test_alpha_economic','scripts/alpha_economic','docs/alpha-economic-engine/')
          names=[]
          for item in payload['files']:
              p=pathlib.Path(item['path'])
              if p.is_absolute() or '..' in p.parts or not item['path'].startswith(allowed) or p.exists() or p.suffix not in ('.py','.md','.json'):raise ValueError('Source destination outside authorized new files')
              data=item['content'].encode()
              if hashlib.sha256(data).hexdigest()!=item['sha256']:raise ValueError('Source file identity mismatch')
              names.append(str(p));p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          if set(payload['native_before'])!={'commercial/ledger.py','connected_enterprise/finance.py'}:raise ValueError('Unexpected native integration scope')
          for name,expected in payload['native_before'].items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()!=expected:raise ValueError('Native source changed; reconcile before integration')
          subprocess.run(['git','apply','--check','-'],input=payload['native_patch'].encode(),check=True)
          subprocess.run(['git','apply','-'],input=payload['native_patch'].encode(),check=True)
          subprocess.run(['python3','-m','unittest','discover','-s','tests','-p','test_alpha_economic*.py','-v'],check=True)
          subprocess.run(['git','config','user.name','ALPHA engineering'],check=True)
          subprocess.run(['git','config','user.email','alpha-engineering@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*names,*payload['native_before']],check=True)
          subprocess.run(['git','rm','-r','--','scripts/alpha_economic_delivery.json','.alpha-transfer'],check=True)
          subprocess.run(['git','commit','-m','feat: connect ALPHA discovery, construction, delivery, native settlement and earned reinvestment'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/alpha-economic-engine-full-20261116'],check=True)
          PY
      - name: Qualify exact integrated source
        run: |
          set -euo pipefail
          if [ ! -f connected_enterprise/alpha_economic/__main__.py ]; then
            echo 'Source transfer not yet complete; no engine qualification claimed.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/alpha-public"
          git rev-parse HEAD > "$RUNNER_TEMP/alpha-public/SOURCE-REVISION.txt"
          python3 -m unittest discover -s tests -p 'test_alpha_economic*.py' -v 2>&1 | tee "$RUNNER_TEMP/alpha-public/ENGINE-TESTS.txt"
          python3 -m unittest discover -s tests -p 'test_connected_finance.py' -v 2>&1 | tee "$RUNNER_TEMP/alpha-public/NATIVE-REGRESSION.txt"
          python3 -m unittest discover -s tests -p 'test_alpha_runtime_ignition.py' -v 2>&1 | tee "$RUNNER_TEMP/alpha-public/IGNITION-REGRESSION.txt"
          python3 -m connected_enterprise.alpha_economic demo --output "$RUNNER_TEMP/alpha-demo" > "$RUNNER_TEMP/alpha-public/DEMO-LOG.txt"
          cp "$RUNNER_TEMP/alpha-demo/RESULTS.json" "$RUNNER_TEMP/alpha-public/RESULTS.json"
          python3 scripts/alpha_economic_package.py --output "$RUNNER_TEMP/alpha-public/ALPHA_ECONOMIC_ENGINE_0.2.0.zip" > "$RUNNER_TEMP/alpha-public/PACKAGE.json"
          mkdir -p "$RUNNER_TEMP/alpha-extracted"
          python3 -m zipfile -e "$RUNNER_TEMP/alpha-public/ALPHA_ECONOMIC_ENGINE_0.2.0.zip" "$RUNNER_TEMP/alpha-extracted"
          cd "$RUNNER_TEMP/alpha-extracted"
          python3 -m unittest discover -s tests -p 'test_alpha_economic*.py' -v 2>&1 | tee "$RUNNER_TEMP/alpha-public/EXTRACTED-TESTS.txt"
          python3 -m connected_enterprise.alpha_economic demo --output "$RUNNER_TEMP/alpha-extracted-demo" > "$RUNNER_TEMP/alpha-public/EXTRACTED-DEMO.txt"
      - name: Actual pinned local CPU model in the connected operating loop
        run: |
          if [ -f scripts/alpha_economic_local_model.py ]; then
            python3 scripts/alpha_economic_local_model.py --work "$RUNNER_TEMP/alpha-local-model-work" --public "$RUNNER_TEMP/alpha-public/local-model"
          else
            echo 'No integrated local-model source yet; no inference qualification claimed.'
          fi
      - name: Preserve only public code and bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-economic-engine-${{ github.run_id }}
          path: ${{ runner.temp }}/alpha-public
          if-no-files-found: warn
          retention-days: 7
