name: Consequential campaign 009 construction and downloaded package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned inherited exchange dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-consequential009.txt
          python scripts/package_consequential009.py restore-reference --root .
      - name: Meaningful exchange, independent arithmetic and forgery regressions
        run: |
          python -m unittest discover -s tests -p 'test_consequential009*.py' -v
          python -m unittest discover -s verification/consequential009 -p 'test_*.py' -v
      - name: Create exact standalone package and verify every extracted member
        run: |
          python scripts/package_consequential009.py pack --source-commit '${{ github.event.pull_request.head.sha || github.sha }}' --output "$RUNNER_TEMP/AGI_ALPHA_Consequential009.zip"
          python scripts/package_consequential009.py extract --archive "$RUNNER_TEMP/AGI_ALPHA_Consequential009.zip" --destination "$RUNNER_TEMP/consequential009-clean"
          python "$RUNNER_TEMP/consequential009-clean/scripts/package_consequential009.py" restore-reference --root "$RUNNER_TEMP/consequential009-clean"
      - name: Actually construct, independently check, retrieve, exchange and extend from clean contents
        working-directory: ${{ runner.temp }}/consequential009-clean
        env:
          PYTHONNOUSERSITE: '1'
          PYTHONPATH: ''
        run: python run_consequential009.py --output "$RUNNER_TEMP/consequential009-replay"
      - name: Preserve exact package and all receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consequential009-source-and-replay
          path: |
            ${{ runner.temp }}/AGI_ALPHA_Consequential009.zip
            ${{ runner.temp }}/consequential009-replay
          if-no-files-found: warn
  publish:
    needs: [qualify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require both unchanged exact-main qualification workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          repo, sha = os.environ['GH_REPO'], os.environ['GITHUB_SHA']
          for workflow in ['campaign.yml', 'consequential007.yml']:
              for attempt in range(60):
                  data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/workflows/{workflow}/runs?head_sha={sha}&event=push&branch=main'], text=True))
                  runs = [r for r in data['workflow_runs'] if r['head_sha'] == sha and r['event'] == 'push' and r['head_branch'] == 'main']
                  if runs:
                      current = max(runs, key=lambda r:r['id'])
                      if current['status'] == 'completed':
                          if current['conclusion'] != 'success': raise SystemExit('Exact-main inherited qualification failed; publication refused.')
                          break
                  time.sleep(5)
              else: raise SystemExit('Exact-main inherited qualification not completed within allowance.')
          PY
      - name: Download actual qualified package and test clean contents again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n consequential009-source-and-replay -D "$RUNNER_TEMP/009-qualified-artifact"
          python -m pip install --only-binary=:all: -r requirements-consequential009.txt
          python scripts/package_consequential009.py extract --archive "$RUNNER_TEMP/009-qualified-artifact/AGI_ALPHA_Consequential009.zip" --destination "$RUNNER_TEMP/009-release-clean"
          python "$RUNNER_TEMP/009-release-clean/run_consequential009.py" --output "$RUNNER_TEMP/009-release-replay"
      - name: Publish distinct experimental edition without replacing historical releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=symmetry-reference-20261030-r1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing immutable experimental edition retained.'
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RUNNER_TEMP/009-existing-tag.json" 2>/dev/null; then
            python - <<'PY'
          import json, os, pathlib
          tag = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'009-existing-tag.json').read_text())
          if tag['object']['type'] != 'commit' or tag['object']['sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Existing tag does not identify this qualified source; publication refused.')
          PY
          else
            gh api "repos/$GH_REPO/git/refs" --method POST -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/009-release-assets"
          cp "$RUNNER_TEMP/009-qualified-artifact/AGI_ALPHA_Consequential009.zip" "$RUNNER_TEMP/009-release-assets/"
          cp docs/consequential009/paper.pdf docs/consequential009/paper.tex docs/consequential009/index.html docs/consequential009/SOURCE_MANIFEST.json "$RUNNER_TEMP/009-release-assets/"
          cp "$RUNNER_TEMP/009-release-replay/RESULT.json" "$RUNNER_TEMP/009-release-assets/DOWNLOADED_PACKAGE_QUALIFICATION.json"
          (cd "$RUNNER_TEMP/009-release-assets" && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" "$RUNNER_TEMP/009-release-assets/"* --verify-tag --target "$GITHUB_SHA" --prerelease --title 'AGI ALPHA: circuit measurement construction and conditional exchange' --notes-file campaign/consequential-009/RELEASE_NOTES.md
      - name: Preserve publication and downloaded-package evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consequential009-release-qualification
          path: |
            ${{ runner.temp }}/009-release-assets
            ${{ runner.temp }}/009-release-replay
          if-no-files-found: warn
