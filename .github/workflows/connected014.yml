name: Connected 014 live enterprise qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connected014-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  connected-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact dependencies in clean hosted runtime
        run: python -m pip install -r requirements-commercial010.txt
      - name: Native finance, business lifecycle, live crash recovery and independent checker regressions
        run: python -m unittest discover -s tests -p 'test_connected*.py' -v
      - name: Clean source archive, fresh operation, resume and public key-free audit
        run: python scripts/qualify_connected014.py --smoke --output "$RUNNER_TEMP/connected014-clean" --timeout-seconds 900
      - name: Preserve qualified receipts and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected014-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/connected014-clean/QUALIFICATION.json
            ${{ runner.temp }}/connected014-clean/*.stdout
            ${{ runner.temp }}/connected014-clean/*.stderr
            ${{ runner.temp }}/connected014-clean/connected014-source.zip
            ${{ runner.temp }}/connected014-clean/connected014-keyfree.zip
          if-no-files-found: warn
