name: Magnetic rotor MATLAB schema gate 002
on:
  pull_request:
    paths:
      - 'research/magnetic_rotor001/schema.py'
      - 'research/magnetic_rotor001/SCHEMA_PROTOCOL.md'
      - 'tests/test_magnetic_rotor_schema002.py'
      - '.github/workflows/magnetic-rotor-schema002.yml'
  push:
    branches:
      - research/magnetic-rotor-noncontact-20261108
permissions:
  contents: read
jobs:
  mat-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout literal current head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable separate schema registration and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor ea3cbf4739e55249f20afc2d9b1af49a5eab9745 HEAD
          git merge-base --is-ancestor 9c68ab9d5a14857c1084a4573b74fe98ab48ef34 HEAD
          test "$(git show 9c68ab9d5a14857c1084a4573b74fe98ab48ef34:research/magnetic_rotor001/SCHEMA_PROTOCOL.md | sha256sum | cut -d ' ' -f1)" = "$(sha256sum research/magnetic_rotor001/SCHEMA_PROTOCOL.md | cut -d ' ' -f1)"
          sha256sum research/magnetic_rotor001/{PREREGISTRATION.md,SCHEMA_PROTOCOL.md,gate.py,schema.py} tests/test_magnetic_rotor_schema002.py
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned binary-only metadata reader
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Fixed synthetic metadata regressions
        run: |
          python -m unittest tests.test_magnetic_rotor_schema002 -v
          python -O -m unittest tests.test_magnetic_rotor_schema002 -v
      - name: Read only MATLAB directories of all ten pinned public files
        shell: bash
        run: |
          set -euo pipefail
          python -m research.magnetic_rotor001.schema --output "$RUNNER_TEMP/rotor-schema002"
          python - "$RUNNER_TEMP/rotor-schema002/SCHEMA_RESULT.json" <<'PY'
          import json,pathlib,sys
          x=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if x['status']!='SCHEMA_GATE_PASS_PHYSICAL_MEASUREMENT_HOLD':
              raise SystemExit('SCHEMA_GATE_NOT_QUALIFIED')
          if x['numeric_arrays_materialized'] or x['physical_force_values_interpreted'] or x['physical_hold_slide_accepted'] or x['deployment']!='NO_DEPLOY':
              raise SystemExit('INVALID_PHYSICAL_RESULT_CLAIM')
          print(json.dumps({'status':x['status'],'common_variables':x['common_top_level_variable_names'],'observations':x['observed_member_count'],'archive_sha256':x['source_archive_sha256']},sort_keys=True))
          PY
      - name: Preserve allowlisted schema-only report even if gate failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: magnetic-rotor-schema002-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rotor-schema002/SCHEMA_RESULT.json
          if-no-files-found: warn
