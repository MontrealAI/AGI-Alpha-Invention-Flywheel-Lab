name: EIT174 frozen public experimental-source preflight
on:
  pull_request:
    paths:
      - 'campaign/eit-observatory174/**'
      - 'research/eit_observability174.py'
      - 'tests/test_eit_observability174.py'
      - '.github/workflows/eit-observatory174.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eit174-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-public-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute frozen offline fail-closed controls
        run: python3 -B -m unittest -v tests.test_eit_observability174
      - name: Query one version-specific public record and reject inaccessible or inconsistent source
        run: python3 -B -m research.eit_observability174 --output "$RUNNER_TEMP/EIT174_METADATA_RECEIPT.json"
      - name: Preserve compact actual-source receipt or failed attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit174-source-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/EIT174_METADATA_RECEIPT.json
          if-no-files-found: warn
