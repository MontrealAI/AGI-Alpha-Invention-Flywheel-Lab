name: Assemble reviewed native market049 objects
on:
  push:
    branches: ['build/native-market-index-049']
permissions:
  contents: read
jobs:
  objects:
    if: github.repository == 'MontrealAI/AGI-Alpha-Invention-Flywheel-Lab' && github.ref == 'refs/heads/build/native-market-index-049'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Check reviewed hashes, test actual patched source, create blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/market049/assemble049.py
      - name: Keep only source-object identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market049-objects-${{ github.sha }}
          path: ${{ runner.temp }}/market049-objects.json
          if-no-files-found: error
          retention-days: 7
