name: Capability Forge qualification
on:
  pull_request:
    paths:
      - 'products/alpha-genesis-harness/**'
      - '.github/workflows/capability-forge.yml'
  workflow_dispatch:
    inputs:
      live:
        description: Run the pinned CPU model study and preserve its observations
        type: boolean
        default: false
      full:
        description: Include both accessible models and both response budgets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build, verify and exercise the exact-source HARNESS package
        working-directory: products/alpha-genesis-harness
        run: |
          package_dir="$RUNNER_TEMP/forge-package"
          mkdir -p "$package_dir"
          head="$(git rev-parse HEAD)"
          python scripts/package_release.py build --source-revision "$head" --output "$package_dir" > "$package_dir/build.json"
          bundle="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"])' "$package_dir/build.json")"
          python scripts/package_release.py verify "$bundle" --expected-source-revision "$head" --compare-source-revision "$head" > "$package_dir/verify.json"
          python -m zipfile -e "$bundle" "$RUNNER_TEMP/extracted-harness"
          cd "$RUNNER_TEMP/extracted-harness"/ALPHA_GENESIS_HARNESS_*
          node --check app/forge.js
          python - <<'PY'
          from bridge.forge_sandbox import execute
          assert execute("def solve(data): return 7", {})["answer"] == 7
          PY
          python -B -m unittest discover -s tests -p 'test_capability_forge.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capability-forge-harness-candidate
          path: ${{ runner.temp }}/forge-package/
          if-no-files-found: error

  live-study:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Acquire pinned public runtime and weights
        working-directory: products/alpha-genesis-harness
        env:
          FORGE_FULL: ${{ inputs.full }}
        run: |
          python -m pip install python-flint==0.8.0
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.qualify_hosted_local import BINARY_URL, BINARY_ARCHIVE_SHA, BINARY_ARCHIVE_BYTES, MODEL_URL, MODEL_SHA, MODEL_BYTES, download
          from scripts.qualify_capability_forge import MODEL_D_URL, MODEL_D_SHA
          target = Path(os.environ["RUNNER_TEMP"]) / "forge-models"
          target.mkdir()
          download(BINARY_URL, target / "llama-b12242.tar.gz", BINARY_ARCHIVE_SHA, BINARY_ARCHIVE_BYTES)
          download(MODEL_URL, target / "qwen3-4b.gguf", MODEL_SHA, MODEL_BYTES)
          if os.environ["FORGE_FULL"] == "true":
              download(MODEL_D_URL, target / "qwen-coder-7b.gguf", MODEL_D_SHA, 4683074336)
          PY
      - name: Execute the independent study from this checkout
        working-directory: products/alpha-genesis-harness
        env:
          FORGE_FULL: ${{ inputs.full }}
        run: |
          options=()
          if [[ "$FORGE_FULL" != "true" ]]; then options+=(--first); fi
          python scripts/qualify_capability_forge.py --assets "$RUNNER_TEMP/forge-models" --output "$RUNNER_TEMP/forge-study" "${options[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "forge-study/study.json").read_bytes())
          assert state["forge_status"] == "complete", state.get("forge_status")
          assert state["accuracy"]["C_qualification"] == {"passed": 24, "total": 24}
          assert state["accuracy"]["C_transfer"] == {"passed": 16, "total": 16}
          PY
      - name: Preserve measured study evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capability-forge-live-study
          path: |
            ${{ runner.temp }}/forge-study/study.json
            ${{ runner.temp }}/forge-study/forge-workflow.json
            ${{ runner.temp }}/forge-study/forge-successor.json
            ${{ runner.temp }}/forge-study/FORGE-TELEMETRY.zip
            ${{ runner.temp }}/forge-study/*.log
          if-no-files-found: ignore
