name: EIT185 original source Jacobian and reconstruction mapping gate
on:
  push:
    branches: [experiment/eit185-original-jacobian-qualification-20261119]
    paths:
      - 'campaign/eit-original-jacobian185/**'
      - 'research/eit_jacobian185/**'
      - 'tests/test_eit_jacobian185.py'
      - 'tests/test_eit_jacobian185_mat5.py'
      - '.github/workflows/eit-jacobian185.yml'
  pull_request:
    paths:
      - 'campaign/eit-original-jacobian185/**'
      - 'research/eit_jacobian185/**'
      - 'tests/test_eit_jacobian185.py'
      - 'tests/test_eit_jacobian185_mat5.py'
      - '.github/workflows/eit-jacobian185.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only exact original-source format dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Frozen adversarial original source-mapping tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_eit_jacobian185 tests.test_eit_jacobian185_mat5

  single-original-source-inventory:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned public scientific format dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Exactly one original-source hash and candidate-schema acquisition
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_eit_jacobian185 tests.test_eit_jacobian185_mat5
          /usr/bin/time -f 'wall_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' -o "$RUNNER_TEMP/EIT185_RESOURCES.txt" \
            python -B -m research.eit_jacobian185.original_source --out "$RUNNER_TEMP/EIT185_ORIGINAL_SOURCE.json"
          cat "$RUNNER_TEMP/EIT185_RESOURCES.txt"
      - name: Publish only hash and schema receipt, never archive or code from source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit185-original-jacobian-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/EIT185_ORIGINAL_SOURCE.json
            ${{ runner.temp }}/EIT185_RESOURCES.txt
          retention-days: 14
