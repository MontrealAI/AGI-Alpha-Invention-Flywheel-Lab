name: Assemble reviewed recurring051 source
on:
  push:
    branches: ['build/recurring-commerce-051']
permissions:
  contents: read
jobs:
  source-objects:
    if: github.repository == 'MontrealAI/AGI-Alpha-Invention-Flywheel-Lab' && github.ref == 'refs/heads/build/recurring-commerce-051'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Verify local hashes and test exact patched source without credentials
        run: python build/recurring051/assemble.py prepare
      - name: Store only exact tested Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/recurring051/assemble.py upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recurring051-objects-${{ github.sha }}
          path: ${{ runner.temp }}/recurring051-objects.json
          if-no-files-found: error
          retention-days: 7
