name: "🌌♾️ AGI ALPHA Flywheel Harness — Exposed strategy ablation"
on:
  pull_request:
    paths:
      - '.github/workflows/ablation025.yml'
      - 'scripts/run_strategic025_ablation.py'
      - 'scripts/summarize_ablation025.py'
      - 'campaign/strategic025-ablation/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ablation025-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  exposed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [original_incumbent, matched_incumbent, quote_only, full_joint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - name: Execute fixed horizon and native operating audit
        run: python scripts/run_strategic025_ablation.py --arm '${{ matrix.arm }}' --output "$RUNNER_TEMP/ablation025"
      - name: Retain compact success or failure receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ablation025-exposed-${{ matrix.arm }}
          path: ${{ runner.temp }}/ablation025/public/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
  compare:
    needs: [exposed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-commercial010.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ablation025-*
          path: ${{ runner.temp }}/ablation025-receipts
      - name: Verify full fixed membership and retain losses or failures
        run: python scripts/summarize_ablation025.py --input "$RUNNER_TEMP/ablation025-receipts" --output "$RUNNER_TEMP/ablation025-comparison"
      - name: Publish compact comparison only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ablation025-comparison
          path: ${{ runner.temp }}/ablation025-comparison/COMPARISON.json
          if-no-files-found: error
          retention-days: 30
