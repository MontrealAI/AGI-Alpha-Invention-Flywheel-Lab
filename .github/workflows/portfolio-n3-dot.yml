name: N3 productive-construction offline replay
on:
  pull_request:
    paths:
      - 'portfolio/n3-20261102-dot/**'
      - '.github/workflows/portfolio-n3-dot.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio/n3-20261102-dot/**'
      - '.github/workflows/portfolio-n3-dot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-models:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0 Pillow==12.3.0
      - name: Offline source-bound construction and independent checks
        shell: bash
        run: |
          set -euo pipefail
          P=portfolio/n3-20261102-dot
          python -m unittest discover -s "$P/N3B" -p 'test_*.py' -v
          python "$P/N3B/offline_replay.py" --out "$RUNNER_TEMP/n3-offline"
      - name: Retain compact model receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n3-model-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n3-offline/*.json
