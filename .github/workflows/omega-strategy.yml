name: Omega causal commerce and whole buyer acceptance
on:
  pull_request:
    paths:
      - 'omega/**'
      - 'tests/test_omega_market*.py'
      - 'tests/test_omega_qualification_pool.py'
      - 'campaign/omega-strategy-20261103/**'
      - '.github/workflows/omega-strategy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned existing dependencies
        run: python -m pip install -r omega/requirements.txt
      - name: Qualify buyer, seller, source, accounting and platform contracts
        run: >-
          python -m unittest
          omega.test_buyer omega.test_seller omega.test_http omega.test_product
          omega.test_strategy omega.test_operate omega.test_process omega.test_process_independent
          tests.test_omega_market_buyer tests.test_omega_market_strategy
          tests.test_omega_market_product tests.test_omega_market_native
          tests.test_omega_market_native_adversarial tests.test_omega_qualification_pool
          tests.test_fresh_native_capital.NativeCapitalTests.test_positive_profit_does_not_spend_committed_cash_and_stale_proof_fails
          tests.test_connected_platform_runtime064 -q
      - name: Execute the complete registered conditional comparison
        run: |
          python -m omega.market_native register --output "$RUNNER_TEMP/omega-market"
          python -m omega.market_native operate --output "$RUNNER_TEMP/omega-market" --max-steps 1
          python -m omega.market_native operate --output "$RUNNER_TEMP/omega-market"
          python -m omega.market_native audit --output "$RUNNER_TEMP/omega-market"
          python -m omega.qualification_pool
      - name: Verify scope and registered denominator
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP'])/'omega-market/result.json').read_text())
          assert result['complete'] and result['account_count'] == 48
          assert result['primary_objective_established'] is False
          assert result['actual_complete_profit'] is None and result['pooled_profit'] is None
          assert any(r['outcomes']['released'] > 0 for r in result['accounts'])
          print({'registered_native_accounts':48,'complete':True,'primary_objective_established':False,
                 'actual_profit':None,'scope':'conditional reference accounts, not original recovery'})
          PY
