name: Public-quote policy and native funding boundary
on:
  pull_request:
    paths:
      - '.github/workflows/commitment-public-quote.yml'
      - 'research/commitment_quote_policy.py'
      - 'scripts/qualify_commitment_quote.py'
      - 'tests/test_commitment_quote_policy.py'
      - 'tests/test_connected_quote_release.py'
      - 'scripts/release_connected014.py'
      - 'experiments/commerce006.py'
      - 'portfolio25/pricing.py'
      - 'requirements-commercial010.txt'
      - 'campaign/commitment-quote-20261106/**'
      - 'campaign/genesis_commitment001/**'
      - 'connected_enterprise/**'
      - 'adaptive_enterprise/**'
      - 'commercial/**'
      - 'vendor/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/commitment-public-quote.yml'
      - 'research/commitment_quote_policy.py'
      - 'scripts/qualify_commitment_quote.py'
      - 'tests/test_commitment_quote_policy.py'
      - 'tests/test_connected_quote_release.py'
      - 'scripts/release_connected014.py'
      - 'experiments/commerce006.py'
      - 'portfolio25/pricing.py'
      - 'requirements-commercial010.txt'
      - 'campaign/commitment-quote-20261106/**'
      - 'campaign/genesis_commitment001/**'
      - 'connected_enterprise/**'
      - 'adaptive_enterprise/**'
      - 'commercial/**'
      - 'vendor/**'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Exact-price oracle, information boundary and native acceptance
        run: |
          python -B -m unittest tests.test_commitment_quote_policy tests.test_connected_quote_release -v
          python -B scripts/qualify_commitment_quote.py run --output "$RUNNER_TEMP/quote-evidence"
          python -B scripts/qualify_commitment_quote.py audit --output "$RUNNER_TEMP/quote-evidence"
      - name: Retain key-free native records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-quote-native-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/quote-evidence
          if-no-files-found: warn
