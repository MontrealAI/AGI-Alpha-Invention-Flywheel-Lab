name: P0-251 synthetic owner durable transition transport
on:
  pull_request:
    paths:
      - 'research/source_transition_trust246/DURABLE251_PROTOCOL.md'
      - 'research/source_transition_trust246/owner_durable251.py'
      - 'research/source_transition_trust246/test_owner_durable251.py'
      - 'research/source_transition_trust246/owner_signed_boundary250.py'
      - 'research/source_transition_trust246/owner_wire248.py'
      - '.github/workflows/source-transition-owner-durable251.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0251-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-durable-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Exact-head credential-free checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Standard Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch the prior immutable historical owner resolver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --fail --location --silent --show-error --max-time 60 --retry 0 \
            'https://raw.githubusercontent.com/MontrealAI/AGI-Alpha-Invention-Flywheel-Lab/ced6c1cb004887dcdafaea59a2976020be649f8e/connected_enterprise/transition_evidence.py' \
            -o "$RUNNER_TEMP/p0251-old-owner.py"
      - name: Execute preregistered synthetic owner transport cases without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0251-home"
          cd research/source_transition_trust246
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p0251-home" \
            PINNED_OWNER_SOURCE="$RUNNER_TEMP/p0251-old-owner.py" \
            PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v test_owner_durable251.py
      - name: Record bounded nonsecret exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0251-receipt"
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('research/source_transition_trust246')
          paths=['DURABLE251_PROTOCOL.md','owner_durable251.py',
                 'test_owner_durable251.py','owner_signed_boundary250.py',
                 'owner_wire248.py']
          raw=(Path(os.environ['RUNNER_TEMP'])/'p0251-old-owner.py').read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert blob=='2397091ef8e1960ad13950693d5b3cd04e2ff7c5'
          receipt={
            'schema':'agi-alpha/p0-251-synthetic-owner-durable/v1',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'protocol_commit':'3f649cacb270ff3bfa3ff64b2adb6ad019f131ba',
            'historical_owner_codec_commit':'ced6c1cb004887dcdafaea59a2976020be649f8e',
            'historical_owner_codec_git_blob':blob,
            'source_file_sha256':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths},
            'registered_tests':9,'registered_tests_exit_zero':True,
            'synthetic_ephemeral_keys_persisted':False,
            'real_account_keys_or_history_accessed':False,
            'owner_selected_local_private_transport_only':True,
            'historical_pr40_key_bearing_signer_repaired':False,
            'actual_native_account_migration_qualified':False,
            'live_writer_lease_or_write_ahead_recovery_qualified':False,
            'commercial_profit_or_release_qualified':False,
            'actual_model_host_billing_usd':None}
          (Path(os.environ['RUNNER_TEMP'])/'p0251-receipt'/'RESULT.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload compact nonsecret receipt only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0251-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0251-receipt/RESULT.json
          if-no-files-found: error
          retention-days: 7
