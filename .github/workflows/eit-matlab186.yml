name: EIT186 original MATLAB source-line review, no numerical reconstruction
on:
  push:
    branches: [experiment/eit186-original-matlab-map-review-20261119]
    paths:
      - 'campaign/eit-matlab-source186/**'
      - 'research/eit_matlab_source186/**'
      - 'tests/test_eit_matlab_source186.py'
      - '.github/workflows/eit-matlab186.yml'
  pull_request:
    paths:
      - 'campaign/eit-matlab-source186/**'
      - 'research/eit_matlab_source186/**'
      - 'tests/test_eit_matlab_source186.py'
      - '.github/workflows/eit-matlab186.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-review-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen offline adversarial and claim-scope tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_eit_matlab_source186

  original-script-one-shot-review:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record actual platform job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical parsers from public packages only
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1 scipy==1.17.0
      - name: Inspect frozen original script as data only, no MATLAB execution
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest -v tests.test_eit_matlab_source186
          /usr/bin/time -f 'wall_seconds=%e user_CPU_seconds=%U system_CPU_seconds=%S max_RSS_kB=%M' -o "$RUNNER_TEMP/EIT186_RESOURCES.txt" python -B -m research.eit_matlab_source186.review --out "$RUNNER_TEMP/EIT186_SOURCE_REVIEW.json"
      - name: Publish bounded lexical source-line fingerprints and resource receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit186-original-script-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/EIT186_SOURCE_REVIEW.json
            ${{ runner.temp }}/EIT186_RESOURCES.txt
          if-no-files-found: error
          retention-days: 14
