name: Five-route computational portfolio qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-portfolio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact public computational dependencies
        run: python -m pip install --only-binary=:all: -r requirements-cycle004.txt -r requirements-commercial010.txt
      - name: Source, approval, funding, replay, renewal and tamper regressions
        run: |
          python -m unittest tests.test_public_portfolio_20261102 -v
          python experiments/public_portfolio_20261102/verification/r2_guard_tests_002.py --output "$RUNNER_TEMP/public-portfolio-r2-guards.json"
          python -m unittest experiments.public_portfolio_20261102.verification.test_recovery -v
      - name: Independently reconstruct frozen actual scientific artifacts
        run: python experiments/public_portfolio_20261102/verification/verify_artifacts.py --output "$RUNNER_TEMP/public-portfolio-artifact-replay.json"
      - name: Retain compact source-bound qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-portfolio-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-portfolio-artifact-replay.json
            ${{ runner.temp }}/public-portfolio-r2-guards.json
          if-no-files-found: warn
