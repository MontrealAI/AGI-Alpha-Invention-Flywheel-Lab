name: Five-route computational portfolio qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-portfolio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact public computational dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-cycle004.txt -r requirements-commercial010.txt
      - name: Stage exact historical R2 recovery source without changing candidate source
        run: |
          mkdir "$RUNNER_TEMP/historical-portfolio-source"
          git archive 8144ece4906b994a6957694e5469c67ab4d0ceb6 | tar -x -C "$RUNNER_TEMP/historical-portfolio-source"
          cd "$RUNNER_TEMP/historical-portfolio-source"
          python - <<'PYH'
          import json, os
          from pathlib import Path
          from connected_enterprise.finance import source_identity
          from experiments.public_portfolio_20261102 import recovery_run, service
          root = Path.cwd()
          products = json.loads((root / service.PREFIX / 'PRODUCTS.json').read_text())
          if isinstance(products, dict):
              products = products['products']
          manifest = service.prepare_manifest(root, products, 'historical-source-preflight')
          identity = source_identity(root, manifest)
          expected = 'bb74d40f7a84ca155189f908c091db32b27093e203e0d63696f327a9a2492901'
          if identity['sha256'] != expected or recovery_run.EXPECTED_NATIVE_SOURCE != expected:
              raise ValueError('EXACT_HISTORICAL_R2_NATIVE_SOURCE_REQUIRED')
          import hashlib
          candidate = Path(os.environ['GITHUB_WORKSPACE'])
          helpers = (
              'experiments/public_portfolio_20261102/recovery_run.py',
              'experiments/public_portfolio_20261102/recovery_fast.py',
              'experiments/public_portfolio_20261102/verification/test_recovery.py',
              'experiments/public_portfolio_20261102/verification/test_recovery_fast.py',
              'experiments/public_portfolio_20261102/verification/r2_recheck_retained.py',
              'experiments/public_portfolio_20261102/verification/r2_recheck_recovered_retained.py',
              'experiments/public_portfolio_20261102/verification/r2_additional_recovery_replay.py',
              'experiments/public_portfolio_20261102/verification/r2_recovery_actual_audit.py',
              'experiments/public_portfolio_20261102/verification/r2_stream_audit.py',
              'experiments/public_portfolio_20261102/verification/verify_finance.py',
              'experiments/public_portfolio_20261102/verification/verify_science.py',
          )
          helper_hashes = {}
          for relative in helpers:
              shipped, frozen = candidate / relative, root / relative
              if shipped.is_symlink() or not shipped.is_file() or shipped.read_bytes() != frozen.read_bytes():
                  raise ValueError('FROZEN_HISTORICAL_HELPER_CHANGED:' + relative)
              helper_hashes[relative] = hashlib.sha256(shipped.read_bytes()).hexdigest()
          receipt = {'source_commit': '8144ece4906b994a6957694e5469c67ab4d0ceb6',
                     'native_source_sha256': expected,
                     'shipped_historical_helper_hashes': helper_hashes,
                     'scope': 'Frozen historical recovery and retained-account controls only; separate from candidate and downloaded-release operation.'}
          (Path(os.environ['RUNNER_TEMP']) / 'historical-portfolio-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYH
      - name: Qualify historical recovery against its unchanged source identity
        working-directory: ${{ runner.temp }}/historical-portfolio-source
        run: |
          python -m unittest experiments.public_portfolio_20261102.verification.test_recovery -v
          python -m unittest experiments.public_portfolio_20261102.verification.test_recovery_fast -v
      - name: Source, approval, funding, replay, renewal and tamper regressions
        run: |
          python -m unittest tests.test_public_portfolio_20261102 -v
          python -m unittest experiments.public_portfolio_20261102.verification.test_dispatch_case experiments.public_portfolio_20261102.verification.test_finalize_run -v
          python experiments/public_portfolio_20261102/verification/r2_guard_tests_002.py --output "$RUNNER_TEMP/public-portfolio-r2-guards.json"
      - name: Independently reconstruct frozen actual scientific artifacts
        run: python experiments/public_portfolio_20261102/verification/verify_artifacts.py --output "$RUNNER_TEMP/public-portfolio-artifact-replay.json"
      - name: Recheck the ten retained native financial exports
        working-directory: ${{ runner.temp }}/historical-portfolio-source
        run: python experiments/public_portfolio_20261102/verification/r2_recheck_retained.py --public-root "$GITHUB_WORKSPACE/experiments/public_portfolio_20261102/evidence/economics-r2/public" --audit-receipts "$GITHUB_WORKSPACE/experiments/public_portfolio_20261102/evidence/economics-r2/audit-receipts" --output "$RUNNER_TEMP/public-portfolio-retained-finance.json"
      - name: Recheck the separately retained recovery engineering evidence
        working-directory: ${{ runner.temp }}/historical-portfolio-source
        run: |
          python experiments/public_portfolio_20261102/verification/r2_recheck_recovered_retained.py --public-root "$GITHUB_WORKSPACE/experiments/public_portfolio_20261102/evidence/economics-r2/public" --original-four-report "$GITHUB_WORKSPACE/experiments/public_portfolio_20261102/verification/r2_actual_recovery_audit_001.json" --output "$RUNNER_TEMP/public-portfolio-recovered-four.json"
          python experiments/public_portfolio_20261102/verification/r2_additional_recovery_replay.py --public-root "$GITHUB_WORKSPACE/experiments/public_portfolio_20261102/evidence/economics-r2/public" --output "$RUNNER_TEMP/public-portfolio-recovered-two.json"
      - name: Retain compact source-bound qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-portfolio-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-portfolio-artifact-replay.json
            ${{ runner.temp }}/historical-portfolio-source.json
            ${{ runner.temp }}/public-portfolio-r2-guards.json
            ${{ runner.temp }}/public-portfolio-retained-finance.json
            ${{ runner.temp }}/public-portfolio-recovered-four.json
            ${{ runner.temp }}/public-portfolio-recovered-two.json
          if-no-files-found: warn
