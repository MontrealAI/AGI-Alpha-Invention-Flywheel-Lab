name: Independent cell pack capability
on:
  pull_request:
    paths:
      - 'experiments/capability_transfer_20261102/**'
      - '.github/workflows/capability-transfer.yml'
      - 'connected_enterprise/runner.py'
  push:
    branches: [main]
    paths:
      - 'experiments/capability_transfer_20261102/**'
      - '.github/workflows/capability-transfer.yml'
      - 'connected_enterprise/runner.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-cell-pack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  numerical-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 scipy==1.17.0 cryptography==50.0.2
      - run: python -m unittest experiments.capability_transfer_20261102.test_instrument experiments.capability_transfer_20261102.test_catalog experiments.capability_transfer_20261102.test_economics experiments.capability_transfer_20261102.test_release_inventory experiments.capability_transfer_20261102.test_midpoint_diagnostic -v
      - name: Independently replay the retained public cost account
        run: |
          gzip -dc experiments/capability_transfer_20261102/results/RESEARCH_ACCOUNT_PUBLIC.json.gz > /tmp/cell-pack-public-account.json
          python -m experiments.capability_transfer_20261102.economics audit --artifact experiments/capability_transfer_20261102/results/STAGE_B_RESULT.json --public /tmp/cell-pack-public-account.json --registration-sha256 e94112d4784abbd81af4ee277e5a12fe354d3237c79e887b90f379da3506bb5c
      - name: Replay the frozen numerical experiment
        run: python -m experiments.capability_transfer_20261102.run_stage_b run --freeze experiments/capability_transfer_20261102/FROZEN_STAGE_B_SERIALIZATION_FIX.json --output /tmp/cell-pack-numerical
      - name: Reproduce the diagnostic against a source-matched replay in this environment
        run: python -m experiments.capability_transfer_20261102.run_midpoint_diagnostic --result experiments/capability_transfer_20261102/results/STAGE_B_RESULT.json --replay-result /tmp/cell-pack-numerical/RESULT.json --output /tmp/cell-pack-midpoint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-cell-pack-numerical
          path: |
            /tmp/cell-pack-numerical
            /tmp/cell-pack-midpoint
          retention-days: 3
          if-no-files-found: error
  public-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve public versioned metadata only
        run: python -m unittest experiments.capability_transfer_20261102.test_catalog -v
      - name: Acquire catalog with semantic response checks
        run: python experiments/capability_transfer_20261102/fetch_catalog.py --output /tmp/cell-pack-catalog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-cell-pack-catalog
          path: /tmp/cell-pack-catalog
          retention-days: 1
          if-no-files-found: error
