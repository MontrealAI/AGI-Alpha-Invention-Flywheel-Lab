name: Physical battery measured-data acquisition
on:
  pull_request:
    paths:
      - 'research/battery_physical100/**'
      - '.github/workflows/battery-physical100.yml'
permissions:
  contents: read
jobs:
  inspect-development-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Register platform start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed public conventional analysis dependencies
        run: python -m pip install --only-binary=:all: -r research/battery_physical100/requirements.txt
      - name: Test extraction, forecasting and prefix isolation
        run: python -B -m unittest research.battery_physical100.test_probe research.battery_physical100.test_measurement research.battery_physical100.test_prognosis research.battery_physical100.test_evaluate -v
      - name: Validate final extraction on exposed development cell only
        run: python -B -m research.battery_physical100.evaluate --development-only --output battery100-results
      - name: Record exact installed dependency versions
        if: always()
        run: |
          mkdir -p battery100-results
          python -m pip freeze > battery100-results/installed-versions.txt
      - name: Retain compact measured results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battery100-results
          path: battery100-results
          if-no-files-found: error
