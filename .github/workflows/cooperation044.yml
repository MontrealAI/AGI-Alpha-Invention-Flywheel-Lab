name: Cooperation 044 native funded successor
on:
  pull_request:
    paths:
      - 'connected_enterprise/cooperation044.py'
      - 'tests/test_connected_cooperation044.py'
      - '.github/workflows/cooperation044.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cooperation044-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  native-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Witness, native finance and capacity regressions
        run: python -m unittest tests.test_connected_cooperation044 tests.test_connected_capacity_contract tests.test_connected_temporal_boundaries tests.test_connected_finance -v
      - name: Operate both matched cases and independently re-audit
        shell: bash
        run: |
          set -euo pipefail
          for case in central no_demand; do
            for arm in fixed_capacity earned_capacity; do
              python -m connected_enterprise.cooperation044 run --case "$case" --arm "$arm" --output "$RUNNER_TEMP/coop044-$case-$arm"
            done
            python -m connected_enterprise.cooperation044 compare --control "$RUNNER_TEMP/coop044-$case-fixed_capacity" --candidate "$RUNNER_TEMP/coop044-$case-earned_capacity" --report "$RUNNER_TEMP/coop044-$case.json"
          done
      - name: Require positive connected sequence and negative demand control
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          central = json.loads((root/'coop044-central.json').read_text())
          negative = json.loads((root/'coop044-no_demand.json').read_text())
          assert central['status'] == 'DEMONSTRATED_IN_EXPOSED_SIMULATION'
          assert central['profit_delta_microUSD'] > 0
          assert negative['status'] == 'NOT_ESTABLISHED'
          assert all(negative[a]['paid_accepted_orders'] == 0 for a in ('control', 'candidate'))
          public = {'source_sha256': central['candidate']['source_sha256'], 'central': central, 'no_demand': negative}
          print(json.dumps(public, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Native complete-offer/capacity sequence and zero-demand control passed. Exposed simulated evidence only; no real commerce or new invention claim.\n')
      - name: Retain compact public comparisons only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cooperation044-public-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/coop044-central.json
            ${{ runner.temp }}/coop044-no_demand.json
          if-no-files-found: warn
          retention-days: 7
