name: Blue Sky 064 source-bound calibration dependency
on:
  pull_request:
    paths:
      - 'research/blue_sky064/calibration_gate/**'
      - 'tests/test_blue_sky_calibration_gate.py'
      - 'research/blue_sky064/probe.py'
      - 'research/blue_sky064/public_calibration.json'
      - 'campaign/blue-sky-064/friction-probe/**'
      - '.github/workflows/blue-sky064-calibration-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-calibration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Capture execution-start epoch
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert literal executed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install established published scientific dependencies from wheels only
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0
      - name: Source SHA-256 receipt for all bound execution files
        run: |
          sha256sum research/blue_sky064/calibration_gate/PREREGISTRATION.md research/blue_sky064/calibration_gate/plan.py research/blue_sky064/probe.py research/blue_sky064/public_calibration.json campaign/blue-sky-064/friction-probe/MIXED_REGISTRATION.json tests/test_blue_sky_calibration_gate.py
      - name: Adversarial executable 12-test source regression
        run: python -m unittest discover -s tests -p 'test_blue_sky_calibration_gate.py' -v
      - name: Execute all 768 preregistered measurement subsets and 196608 corners
        run: |
          python -m research.blue_sky064.calibration_gate.plan --output "$RUNNER_TEMP/blue-sky064-calibration"
          python - "$RUNNER_TEMP/blue-sky064-calibration/RESULT.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r["decision"]=="NO_DEPLOY_HOLD_PENDING_PHYSICAL_TRANSFER_AND_BUYER_EVIDENCE"
          assert len(r["worlds"])==3
          assert sum(w["corner_evaluations"] for w in r["worlds"].values())==196608
          assert all(len(w["all_registered_subset_outcomes"])==256 for w in r["worlds"].values())
          print("Preserved all registered conditional outcomes; no physical or commercial acceptance claimed.")
          PY
      - name: Preserve compact complete hypothetical-arm record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blue-sky064-calibration-receipt-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blue-sky064-calibration/RESULT.json
          if-no-files-found: warn
