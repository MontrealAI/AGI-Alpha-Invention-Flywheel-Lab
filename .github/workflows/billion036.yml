name: "AGI ALPHA 036 - native $100k 60-month structural preflight"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: billion036-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  bounded-native-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-commercial010.txt
      - name: Execute focused exact-capital and first-passage tests
        run: python3 -m unittest discover -s tests -p 'test_connected_billion036.py' -v
      - name: Register canonical 60-month comparison and run one bounded native event per business
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/billion036-receipts"
          python3 -m connected_enterprise.billion036 registration > "$RUNNER_TEMP/billion036-receipts/REGISTERED_INPUT.json"
          python3 -m connected_enterprise.billion036 preflight > "$RUNNER_TEMP/billion036-receipts/PREFLIGHT.json"
          python3 -m connected_enterprise register --config "$RUNNER_TEMP/billion036-receipts/REGISTERED_INPUT.json" --output "$RUNNER_TEMP/billion036-private"
          python3 -m connected_enterprise operate --max-events 1 --output "$RUNNER_TEMP/billion036-private"
          python3 -m connected_enterprise.billion036 inspect --output "$RUNNER_TEMP/billion036-private" > "$RUNNER_TEMP/billion036-receipts/OBSERVATION.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'billion036-receipts'
          r=json.loads((p/'OBSERVATION.json').read_text())
          assert r['status']=='CHECKPOINT_NOT_AUDITED_OR_COMPLETE',r
          assert all(row['opening_microUSD_per_independent_business']==100000000000 for row in r['preflight']['cases'])
          assert all(row['finite_buyer_budget_barrier'] for row in r['preflight']['cases'])
          assert len(r['preflight']['cases'])==2
          assert r['preflight']['matched_businesses']==4
          print('Native 100k accounts checkpointed; full 60-month profit claim deliberately withheld.')
          PY
      - name: Publish only non-authority, compact research receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: billion036-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/billion036-receipts/PREFLIGHT.json
            ${{ runner.temp }}/billion036-receipts/OBSERVATION.json
          if-no-files-found: warn
