name: FIRSTCASH212 source-bound PDF content acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/firstcash212.yml'
      - 'scripts/firstcash212_print_gate.py'
      - 'campaign/unseen-first-cash-212/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-pdf-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record start for genuine resource window
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout exact candidate head (not synthetic merge ref)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source owner remains unmodified
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/firstcash209_decision_kit.py)" = "cf9ca511395523415ac3aea66a7c7080a6dafb0d"
          test "$(git rev-parse HEAD:campaign/unseen-first-cash-209/PUBLIC_SELF_CASE.json)" = "f8cfbefcaf5327110c7395d77d7e977ab9d6108b"
          git merge-base --is-ancestor 03ab77bf51c6fef2308556bfc0541a965d880030 HEAD
          command -v google-chrome
          python3 --version
      - name: Install free deterministic PDF-extraction checker
        run: python3 -m pip install --disable-pip-version-check --only-binary=:all: pypdf==5.9.0
      - name: Actual two-case independently extracted PDF acceptance; no retry
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/firstcash212_print_gate.py "$RUNNER_TEMP/firstcash212"
      - name: Preserve actual full PDF and failure/success receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firstcash212-print-integrity-original-plus-synthetic
          path: |
            ${{ runner.temp }}/firstcash212/RESULT.json
            ${{ runner.temp }}/firstcash212/SYNTHETIC_INPUT.json
            ${{ runner.temp }}/firstcash212/original_self_case/audit.json
            ${{ runner.temp }}/firstcash212/original_self_case/document.pdf
            ${{ runner.temp }}/firstcash212/synthetic_stress/audit.json
            ${{ runner.temp }}/firstcash212/synthetic_stress/document.pdf
            ${{ runner.temp }}/firstcash212/original_self_case/build.log
            ${{ runner.temp }}/firstcash212/original_self_case/verify.log
            ${{ runner.temp }}/firstcash212/synthetic_stress/build.log
            ${{ runner.temp }}/firstcash212/synthetic_stress/verify.log
          retention-days: 15
          if-no-files-found: warn
