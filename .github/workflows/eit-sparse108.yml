name: EIT108 preregistered grouped direct-shape sparse comparison
on:
  pull_request:
    paths:
      - 'research/eit_sparse108/**'
      - 'tests/test_eit_sparse108.py'
      - '.github/workflows/eit-sparse108.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-shape-archive-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Record actual hosted platform start
        run: echo "AGI_JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact triggering source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install public pinned classical scientific controls
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scikit-learn==1.7.2
      - name: Normal and optimized adversarial source and grouping guards
        run: |
          python -B -m unittest tests.test_eit_sparse108 -v
          python -O -B -m unittest tests.test_eit_sparse108 -v
      - name: Frozen one-shot three-source physical archive comparison
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.eit_sparse108.study > "$RUNNER_TEMP/EIT108_RESULT.json"
          python - "$RUNNER_TEMP/EIT108_RESULT.json" "$(git rev-parse HEAD)" <<'PY'
          import json,sys
          path,head=sys.argv[1:]
          with open(path,encoding='utf-8') as f: r=json.load(f)
          if r["schema"]!="eit108/preregistered-heldout-shape-sparse/v1": raise SystemExit("WRONG_SCHEMA")
          if r["protocol_freeze_sha"]!="8d973616313547cf716a3a02d700537f968b6601": raise SystemExit("FREEZE_MISMATCH")
          if set(r["sources"])!={"circle","square","triangle"}: raise SystemExit("MISSING_PHYSICAL_SOURCE")
          if set(r["registered_comparison"])!={"rf4","rf8","rf16","extra_trees16"}: raise SystemExit("MISSING_CONTROL")
          if r["fresh_physical_specimens"]!=0 or r["native_accounts_operated"]!=0: raise SystemExit("INVENTED_REAL_ACTIVITY")
          if r["native_trailing365_complete_cost_profit_usd"] is not None: raise SystemExit("INVENTED_PROFIT")
          if r["decision"]!="HOLD_NO_BID_NO_DEPLOY": raise SystemExit("UNAUTHORIZED_ADOPTION")
          r["executing_source_commit"]=head
          with open(path,'w',encoding='utf-8') as f: json.dump(r,f,sort_keys=True,indent=2)
          print("EIT108_EXACT_FROZEN_RESEARCH_VERDICT", {n:r["registered_comparison"][n]["technical_screen"] for n in ("rf4","rf8")})
          print("HISTORICAL_OUTCOMES_UNCHANGED_NEW_PHYSICAL_SPECIMENS_ZERO")
          PY
          sha256sum "$RUNNER_TEMP/EIT108_RESULT.json"
          cat "$RUNNER_TEMP/EIT108_RESULT.json"
      - name: Preserve source-bound key-free results when produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eit108-registered-physical-archive-comparison
          path: ${{ runner.temp }}/EIT108_RESULT.json
          if-no-files-found: warn
