name: Native design041 stronger complete-cost main composition144
on:
  pull_request:
    paths:
      - "campaign/native-design-complete144/**"
      - ".github/workflows/native-design-complete144.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-design-complete144-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  exact-source-strong-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout the pinned qualified-main source into a disposable directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fe8ac39b56bc70c6b07555eed54574bd23ea2cc4
          path: baseline
          persist-credentials: false
      - name: Checkout the separately owned PR115 strongest correction read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 56a2ec5800b9b86cb8de719ccc0e8af211d3f6b5
          path: upstream-correction
          persist-credentials: false
          sparse-checkout: |
            connected_enterprise/design_flywheel.py
            tests/test_connected_design_flywheel041.py
      - name: Setup declared Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check preregistered commits, expected sha256 and no source collision
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          main = pathlib.Path("baseline")
          candidate = pathlib.Path("upstream-correction")
          commits = {
              "baseline": "fe8ac39b56bc70c6b07555eed54574bd23ea2cc4",
              "upstream-correction": "56a2ec5800b9b86cb8de719ccc0e8af211d3f6b5",
          }
          allowed = {
              "connected_enterprise/design_flywheel.py": "c8388388e2ac06fde4a462d02601514def44e4e570a79ccc77ddd0bfff2054dd",
              "tests/test_connected_design_flywheel041.py": "7f4c7ff6b2c88fb23da9ea7ce2be24aa69640c7eae83a8a1725078bda88d6404",
          }
          for folder, expected in commits.items():
              actual = subprocess.check_output(
                  ["git", "-C", folder, "rev-parse", "HEAD"], text=True).strip()
              if actual != expected:
                  raise SystemExit("PINNED_SOURCE_HEAD_MISMATCH:" + folder)
          readbacks = {}
          for path, expected_hash in allowed.items():
              source, target = candidate / path, main / path
              if not source.is_file() or source.is_symlink() or target.exists() or target.is_symlink():
                  raise SystemExit("MISSING_OR_COLLIDING_MAIN_SOURCE:" + path)
              raw = source.read_bytes()
              actual_hash = hashlib.sha256(raw).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit("PINNED_CANDIDATE_SOURCE_HASH_MISMATCH:" + path)
              shutil.copyfile(source, target)
              if hashlib.sha256(target.read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit("COPIED_SOURCE_HASH_CHANGED:" + path)
              readbacks[path] = actual_hash
          receipt = {
              "schema": "agi-alpha/native-design-complete144/v1",
              "evidence_role": "EXPOSED_ENGINEERING_REPRODUCTION",
              "frozen_current_main": commits["baseline"],
              "frozen_strong_candidate_pr115": commits["upstream-correction"],
              "source_sha256": readbacks,
              "replaced_current_main_files": [],
              "owner_financial_account_touched": False,
              "registered_original_development_seed": 341014,
              "registered_original_confirmation_seed": 341015,
              "commercial_claim": "NONE",
              "historical_runs_not_relabelled": True,
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "COMPOSITION144_SOURCE.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print("COMPOSED_ONLY_PREREGISTERED_TWO_SOURCE_FILES")
          print(json.dumps({"pinned_source": readbacks}, sort_keys=True))
          PY
      - name: Install exactly current-main declared native dependencies
        working-directory: baseline
        run: python -m pip install -r requirements-commercial010.txt
      - name: Run all corrected original and shared/transitive/heldout adversarial tests
        working-directory: baseline
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/COMPOSITION144_TEST_TIME.txt" \
            python -m unittest -v tests.test_connected_design_flywheel041
      - name: Run exactly one frozen canonical native demonstration with original seeds
        working-directory: baseline
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/COMPOSITION144_NATIVE_TIME.txt" \
            python -m connected_enterprise.design_flywheel demo \
              --output "$RUNNER_TEMP/native-design041-strong-review144"
          /usr/bin/time -v -o "$RUNNER_TEMP/COMPOSITION144_VERIFY_TIME.txt" \
            python -m connected_enterprise.design_flywheel verify \
              --output "$RUNNER_TEMP/native-design041-strong-review144"
      - name: Enforce exact complete connected component and heldout financial acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          p = root / "native-design041-strong-review144" / "PUBLIC.json"
          data = json.loads(p.read_text())
          witness = data.get("connected_earned_successor_witness")
          assert data.get("spec_sha256") and data.get("source_sha256"), "BOUND_SOURCE_ID_REQUIRED"
          assert witness is not None, "MISSING_NATIVE_WITNESS"
          assert witness.get("source_link_scope") == "COMPLETE_CONNECTED_NATIVE_ENABLER_COMPONENT", "ONLY_NARROW_COLLECTED_WITNESS"
          assert witness.get("funding") == "EARNED", "UNVERIFIED_OR_NON_EARNED_FUNDING"
          assert witness.get("all_required_native_plan_ids"), "REQUIRED_NATIVE_PLAN_INVENTORY_MISSING"
          assert witness.get("net_after_native_investment_microUSD", 0) > 0, "COMPLETE_CONNECTED_PLAN_NET_NOT_POSITIVE"
          assert data.get("confirmed_positive_funded_successor_opportunity"), "NATIVE_FUNDED_SUCCESSOR_NOT_VERIFIED"
          assert data.get("heldout_recommendation", {}).get("challenger_accepted"), "INCUMBENT_HOLDOUT_VETO"
          assert data.get("comparative_advantage_on_one_fresh_seed"), "MATCHED_CONTROL_NOT_ACCEPTED"
          assert data.get("matched_confirmation_profit_delta_microUSD", 0) > 0, "MATCHED_COMPLETE_MODELED_PROFIT_NONPOSITIVE"
          receipt = {
              "schema": "agi-alpha/native-design-complete144/verdict-v1",
              "result": "FROZEN_EXPOSED_ENGINEERING_COMPOSITION_PASSED",
              "native_source_sha256": data["source_sha256"],
              "spec_sha256": data["spec_sha256"],
              "connected_plan_net_microUSD": witness["net_after_native_investment_microUSD"],
              "matched_profit_delta_microUSD": data["matched_confirmation_profit_delta_microUSD"],
              "all_required_native_plan_ids": witness["all_required_native_plan_ids"],
              "old_financial_queue_migration": "UNQUALIFIED",
              "actual_commerce": "NONE",
              "new_causal_discovery": "UNQUALIFIED",
              "complete_real_host_and_model_billing": "UNKNOWN",
              "trailing365_3billion": "NOT_ACHIEVED",
          }
          (root / "COMPOSITION144_VERDICT.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          print("PASS: corrected connected-component synthetic profit and heldout gates only")
          print("NO claim of old-account migration, paid buyers, commercial validation or USD3B")
          PY
      - name: Retain only key-free public run result
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/native-design041-strong-review144/PUBLIC.json" ]; then
            cp "$RUNNER_TEMP/native-design041-strong-review144/PUBLIC.json" "$RUNNER_TEMP/COMPOSITION144_PUBLIC.json"
          fi
          echo "Original/native simulated private accounts, keys, journals and recovery state are never uploaded." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source, result, resources and all failure paths without secret account files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-design041-strong-composition144-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/COMPOSITION144_SOURCE.json
            ${{ runner.temp }}/COMPOSITION144_VERDICT.json
            ${{ runner.temp }}/COMPOSITION144_PUBLIC.json
            ${{ runner.temp }}/COMPOSITION144_TEST_TIME.txt
            ${{ runner.temp }}/COMPOSITION144_NATIVE_TIME.txt
            ${{ runner.temp }}/COMPOSITION144_VERIFY_TIME.txt
          if-no-files-found: warn
