name: IGNITION Pairing Lab · independent recipient
on:
  pull_request:
    paths:
      - 'products/frontier-omega-ignition/**'
      - '.github/workflows/frontier-ignition-pairing-lab.yml'
      - 'docs/frontier-omega-ignition/continuation/PAIRING_LAB.html'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  recipient:
    name: Reproduce the instrument and bilingual exhibition
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record runner start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          persist-credentials: false
          sparse-checkout: |
            products/frontier-omega-ignition
            products/alpha-genesis-harness/tests/visual
            docs/frontier-omega-ignition/continuation
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Receive the licensed upstream outcome table
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lisazhao-gz/pairing-matters
          ref: 48444d3aa8383c90de0135c55138528c90eeb8e0
          path: upstream-pairing
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /data/runs_100.csv
      - name: Recreate the exact five-column projection
        working-directory: products/frontier-omega-ignition/flagship
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/upstream-pairing" rev-parse HEAD)" = 48444d3aa8383c90de0135c55138528c90eeb8e0
          python -B project_data.py "$GITHUB_WORKSPACE/upstream-pairing/data/runs_100.csv" "$RUNNER_TEMP/derived.csv"
          cmp runs.csv "$RUNNER_TEMP/derived.csv"
      - name: Independently receive and reanalyze the qualified public cohort
        working-directory: products/frontier-omega-ignition/flagship
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p "$RUNNER_TEMP/public" "$RUNNER_TEMP/recipient"
          python -B package.py "$RUNNER_TEMP/public/Pairing_Lab.zip"
          cd "$RUNNER_TEMP/recipient"
          python -I -m zipfile -e "$RUNNER_TEMP/public/Pairing_Lab.zip" .
          python -B -m unittest discover -v
          python -B qualify.py --check receipt.json
          python -B repair_experiment.py
          python -B package.py "$RUNNER_TEMP/rebuilt.zip"
          cmp "$RUNNER_TEMP/public/Pairing_Lab.zip" "$RUNNER_TEMP/rebuilt.zip"
      - name: Inspect grounded opportunities, selection controls and the independent direct comparator
        working-directory: products/frontier-omega-ignition
        run: |
          python -B -m unittest discover -s frontier_study -p 'test*.py' -v
          python -B trials/direct_pairing_comparison.py --check trials/direct_pairing_comparison.json
      - name: Build and exercise the self-contained public exhibition
        working-directory: products/frontier-omega-ignition
        env:
          NODE_PATH: ${{ runner.temp }}/browser/node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/browser" "$RUNNER_TEMP/public/views"
          cp ../alpha-genesis-harness/tests/visual/package*.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund
          export CHROMIUM_PATH="$(command -v google-chrome)"
          python -B showcase/build.py --output "$RUNNER_TEMP/public/FRONTIER_OMEGA_Pairing_Lab.html"
          cmp "$RUNNER_TEMP/public/FRONTIER_OMEGA_Pairing_Lab.html" ../../docs/frontier-omega-ignition/continuation/PAIRING_LAB.html
          python -B showcase/identity.py "$RUNNER_TEMP/public/Pairing_Lab_Plate.svg"
          node showcase/browser.cjs "$RUNNER_TEMP/public/FRONTIER_OMEGA_Pairing_Lab.html" "$RUNNER_TEMP/public/views"
          cd "$RUNNER_TEMP/public"
          sha256sum Pairing_Lab.zip FRONTIER_OMEGA_Pairing_Lab.html
      - name: Offer the exhibition, recipient and visual qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-ignition-pairing-lab-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public/
          if-no-files-found: error
