name: Commercial076 sourced no-bid admission (research only)
on:
  pull_request:
    paths:
      - 'campaign/commercial-076/**'
      - '.github/workflows/commercial076-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record platform execution start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Eleven preregistered adverse cases
        run: python3 -B -m unittest discover -s campaign/commercial-076 -p test_admission.py -v
      - name: Actual sourced SSC admission decision
        run: |
          python3 -B campaign/commercial-076/admission.py --input campaign/commercial-076/SSC_FACTS.json --date 2026-11-15 > /tmp/commercial076-result.json
          python3 -B -c 'import json; d=json.load(open("/tmp/commercial076-result.json")); assert [x["decision"] for x in d["arrangements"]] == ["HOLD_NO_BID"]*3 + ["ADMISSIBLE_NO_DEPLOY"]; assert not d["authorized_to_bid"] and not d["authorized_to_deploy"]; print("GATE_HOLD_NO_BID; ZERO_COMMERCE; NO_NATIVE_FINANCE")'
      - name: Report source and resource scope
        run: |
          git rev-parse HEAD
          sha256sum campaign/commercial-076/PROTOCOL.md campaign/commercial-076/admission.py campaign/commercial-076/SSC_FACTS.json campaign/commercial-076/test_admission.py
          echo "Engineering test only; no buyer contract, financial account, host/model bill, or paid API."
