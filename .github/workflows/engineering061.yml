name: Industrial engineering 060 and 061
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-matched-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-engineering061.txt
      - name: Useful production and native integration
        run: |
          python -m unittest discover -s tests -p 'test_production060*.py' -v
          python -m unittest discover -s tests -p 'test_inventory061*.py' -v
      - name: Existing financial and ownership behavior
        run: |
          python -m unittest discover -s tests -p 'test_connected_finance.py' -v
          python -m unittest discover -s tests -p 'test_adaptive_account.py' -v
          python -m unittest discover -s tests -p 'test_commercial010_persistence.py' -v
      - name: Exact small industrial constructor, capacity rejection, and private-output-safe diagnostics
        run: |
          python -m unittest tests.test_industrial062_sparse_elision -v
          python -m unittest tests.test_industrial064_producer_diagnostics -v
      - name: One preregistered no-account industrial construction (review PR 127 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 127
        run: |
          python industrial062/fetch_inputs.py
          python scripts/materialize_industrial064.py
          python scripts/probe_industrial064_sparse_constructor.py --output "$RUNNER_TEMP/industrial064-sparse-free"
      - name: Retain compact standalone receipt on failure or success
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 127
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: industrial064-sparse-free-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/industrial064-sparse-free/RESULT.json
          if-no-files-found: warn
