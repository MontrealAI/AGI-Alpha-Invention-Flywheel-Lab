name: Contact Transfer150 frozen numerical metrology research
on:
  pull_request:
    paths:
      - 'research/contact_transfer150/**'
      - 'tests/test_contact_transfer150.py'
      - '.github/workflows/contact-transfer150.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record actual job start
        shell: bash
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout source with no persisted credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run registered adverse, exact boundary and provenance regressions
        run: |
          python3 -B -m unittest -v tests.test_contact_transfer150
          python3 -O -B -m unittest -v tests.test_contact_transfer150
      - name: Produce and separately verify finite numerical receipt
        run: |
          python3 -B -m research.contact_transfer150.metrology demo --output "$RUNNER_TEMP/contact-transfer150.json" > "$RUNNER_TEMP/contact-transfer150.stdout"
          python3 - "$RUNNER_TEMP/contact-transfer150.json" <<'PY'
          import json,sys,decimal
          r=json.load(open(sys.argv[1]))
          assert r["scope"]=="SOURCE_MODEL_ONLY_NOT_PHYSICAL_MEASUREMENT"
          assert r["error_2pct"]["numeric_verdict"]=="SUFFICIENT_WITHIN_DECLARED_BOUNDS"
          assert r["error_4pct"]["numeric_verdict"]=="HOLD_DECLARED_BOUNDS_ALLOW_FAILURE"
          assert not r["physical_data_acquired"] and not r["complete_comparator_or_commerce_proven"]
          a,b=map(decimal.Decimal,r["symmetric_relative_force_error_threshold_bracket"])
          assert decimal.Decimal(".0279")<a<b<decimal.Decimal(".0281")
          print("METROLOGY150_SOURCE_MODEL_PREFLIGHT_ONLY",a,b)
          PY
      - name: Publish key-free, source-matched numerics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contact-transfer150-source-model-preflight
          path: ${{ runner.temp }}/contact-transfer150.json
          if-no-files-found: error
          retention-days: 30
