name: Super Alpha coded fabric
on:
  pull_request:
    paths:
      - 'experiments/superalpha_coded_fabric/**'
      - '.github/workflows/superalpha-coded-fabric.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source and exhaustive comparison
        run: |
          git rev-parse HEAD
          python -m unittest experiments.superalpha_coded_fabric.test_fabric -v
          python -m experiments.superalpha_coded_fabric.run --output "$RUNNER_TEMP/coded-fabric-result.json"
      - name: Install existing native dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Separate fresh native reproduction and same-account resume
        run: |
          python -m experiments.superalpha_coded_fabric.replay_finance
          python -m unittest tests.test_fresh_native_capital.NativeCapitalTests.test_positive_profit_does_not_spend_committed_cash_and_stale_proof_fails -v
          python -m experiments.superalpha_coded_fabric.finance_probe --output "$RUNNER_TEMP/coded-fabric-native"
          python -m experiments.superalpha_coded_fabric.finance_probe --output "$RUNNER_TEMP/coded-fabric-native"
      - name: Compact public receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coded-fabric-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/coded-fabric-result.json
            ${{ runner.temp }}/coded-fabric-native/public/FINANCE.json
            ${{ runner.temp }}/coded-fabric-native/public/AUDIT.json
            ${{ runner.temp }}/coded-fabric-native/public/INDEPENDENT_REPLAY.json
          if-no-files-found: error
