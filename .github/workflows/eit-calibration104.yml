name: EIT104 preregistered decision recalibration

on:
  pull_request:
    paths:
      - 'research/eit_calibration104/**'
      - 'tests/test_eit_calibration104.py'
      - '.github/workflows/eit-calibration104.yml'
  workflow_dispatch:

jobs:
  frozen-level-crossvalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform start
        run: echo "AGI_JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Source and level-integrity adversarial tests
        run: python3 -m unittest discover -s tests -p 'test_eit_calibration104.py' -v
      - name: Optimized-mode adversarial tests
        run: python3 -O -m unittest discover -s tests -p 'test_eit_calibration104.py' -v
      - name: Run fixed seven-fold retrospective experiment
        run: |
          python3 research/eit_calibration104/analysis.py > "$RUNNER_TEMP/eit104-result.json"
          python3 - "$RUNNER_TEMP/eit104-result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['frozen_protocol_commit']=='7f6c0375abb06c0251ec6068ffd7245c45a543b8'
          assert r['source_projection_sha256']=='3717c65a9f1c1a8fd2171ac83307aadd8bc60e84f7f2a8391062d1f181f8d22c'
          assert (r['physical_decisions'],len(r['by_level']))==(168,7)
          assert (r['policies']['direct40']['correct'],r['policies']['full76']['correct'])==(146,147)
          assert (r['policies']['position']['correct'],r['policies']['nested']['correct'])==(145,147)
          assert not r['position_challenger_technical_gate']
          assert r['decision']=='REJECT_POSITION_CALIBRATION_NO_BID_NO_DEPLOY'
          assert r['actual_new_physical_acquisitions']==0 and r['native_accounts_operated']==0
          assert r['complete_cost_profit_usd'] is None and not r['usd_3b_trailing365_qualified']
          print('SOURCE_PINNED_FROZEN_REJECTION',r['decision'])
          PY
          sha256sum "$RUNNER_TEMP/eit104-result.json"
          cp "$RUNNER_TEMP/eit104-result.json" ./EIT104_RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: eit104-source-pinned-negative-result
          path: EIT104_RESULT.json
          retention-days: 14
