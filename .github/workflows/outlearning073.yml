name: Outlearning073 historical source 21f7899 reproduction
on:
  pull_request:
    paths:
      - 'outlearning073/**'
      - 'tests/test_outlearning073*.py'
      - 'commercial/ledger.py'
      - 'connected_enterprise/finance.py'
      - '.github/workflows/outlearning073.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: outlearning073-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  reproduce-historical-21f7899:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record platform job execution start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind candidate scientific files to the unchanged historical manifest
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          
          source_commit = '21f78996d25fe1d17b2c560be07e715ac8dc48d9'
          manifest_sha = 'bac8d23df038e26315ae8b87ccb5f27776cb78726d4469c0359de85b89c14f00'
          workflow_path = '.github/workflows/outlearning073.yml'
          original_workflow_sha = 'c38a124a859f81e0c9458dc692cad47e199945153d6a56604e50a2953f2bc37d'
          sha = lambda raw: hashlib.sha256(raw).hexdigest()
          root = Path.cwd().resolve()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['CANDIDATE_HEAD']:
              raise SystemExit('CANDIDATE_CHECKOUT_IDENTITY_CHANGED')
          if not all(re.fullmatch('[0-9a-f]{40}', value) for value in (head, os.environ['WORKFLOW_SHA'])):
              raise SystemExit('EXACT_GIT_IDENTITIES_REQUIRED')
          manifest_path = root / 'outlearning073/FROZEN_SOURCE.json'
          if manifest_path.is_symlink() or sha(manifest_path.read_bytes()) != manifest_sha:
              raise SystemExit('HISTORICAL_MANIFEST_BYTES_CHANGED')
          frozen = json.loads(manifest_path.read_text())
          hashes = frozen['source_hashes']
          if len(hashes) != 69 or hashes.get(workflow_path) != original_workflow_sha:
              raise SystemExit('HISTORICAL_FILE_SET_CHANGED')
          actual = {}
          for name in sorted(hashes):
              relative = PurePosixPath(name)
              target = root / name
              if relative.is_absolute() or '..' in relative.parts or str(relative) != name:
                  raise SystemExit('UNSAFE_SOURCE_PATH:' + name)
              if not target.is_file() or any(part.is_symlink() for part in (target, *target.parents)):
                  raise SystemExit('REGULAR_SOURCE_FILE_REQUIRED:' + name)
              actual[name] = sha(target.read_bytes())
          differences = [name for name in sorted(hashes) if actual[name] != hashes[name]]
          if differences != [workflow_path]:
              raise SystemExit('ONLY_DECLARED_ORCHESTRATION_DIFFERENCE_ALLOWED:' + repr(differences))
          receipt = {
              'schema': 'outlearning073/historical-reproduction-binding/v1',
              'scope': 'Current candidate frozen scientific files equal the original; execution below uses the historical source. Not new scientific confirmation or whole-repository qualification.',
              'candidate_head_sha': head,
              'workflow_sha': os.environ['WORKFLOW_SHA'],
              'workflow_ref': os.environ['WORKFLOW_REF'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'executed_source_commit': source_commit,
              'original_manifest_sha256': manifest_sha,
              'frozen_files': [{'path': name, 'original_sha256': hashes[name], 'candidate_sha256': actual[name]} for name in sorted(hashes)],
              'scientific_files_equal': 68,
              'declared_orchestration_differences': differences,
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'outlearning073-orchestration.json'
          path.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(json.dumps({'candidate_head_sha': head, 'workflow_sha': receipt['workflow_sha'], 'historical_source_commit': source_commit, 'scientific_files_equal': 68}, sort_keys=True))
          PY
      - name: Check out the exact historical scientific source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Preserve the historical freeze, including the original invalid workflow bytes.
          ref: 21f78996d25fe1d17b2c560be07e715ac8dc48d9
          persist-credentials: false
      - name: Verify and record the actual historical execution checkout
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          
          source_commit = '21f78996d25fe1d17b2c560be07e715ac8dc48d9'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != source_commit:
              raise SystemExit('HISTORICAL_CHECKOUT_IDENTITY_CHANGED')
          path = Path(os.environ['RUNNER_TEMP']) / 'outlearning073-orchestration.json'
          receipt = json.loads(path.read_text())
          if receipt['executed_source_commit'] != head:
              raise SystemExit('REPRODUCTION_RECEIPT_SOURCE_CHANGED')
          for item in receipt['frozen_files']:
              if hashlib.sha256(Path(item['path']).read_bytes()).hexdigest() != item['original_sha256']:
                  raise SystemExit('HISTORICAL_CHECKOUT_BYTES_CHANGED:' + item['path'])
          if hashlib.sha256(Path('outlearning073/FROZEN_SOURCE.json').read_bytes()).hexdigest() != receipt['original_manifest_sha256']:
              raise SystemExit('HISTORICAL_CHECKOUT_MANIFEST_CHANGED')
          receipt['verified_execution_checkout_sha'] = head
          path.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(json.dumps({'verified_execution_checkout_sha': head, 'frozen_files_verified': len(receipt['frozen_files'])}, sort_keys=True))
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing pinned CPU dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-commercial010.txt
      - name: Check frozen source and adversarial acceptance/account boundaries
        run: |
          python -m outlearning073.run check-source --root "$GITHUB_WORKSPACE"
          python -m unittest tests.test_outlearning073_world tests.test_outlearning073_native -v
      - name: Reproduce the registered finite comparison and native accounts
        run: python -m outlearning073.run execute --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/outlearning073-reproduction"
      - name: Independently replay public outputs and financial exports
        run: python -m outlearning073.run replay --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/outlearning073-reproduction"
      - name: Retain compact receipts without private account authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outlearning073-source-21f78996d25fe1d17b2c560be07e715ac8dc48d9-workflow-${{ github.workflow_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/outlearning073-orchestration.json
            ${{ runner.temp }}/outlearning073-reproduction/SUMMARY.json
            ${{ runner.temp }}/outlearning073-reproduction/REPLAY.json
          if-no-files-found: error
