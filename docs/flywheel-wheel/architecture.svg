<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1300" viewBox="0 0 2100 1300" role="img" aria-labelledby="title desc">
<title id="title">AGI ALPHA — Transformational Intelligence Flywheel Harness, three concentric circular flywheels</title>
<desc id="desc">One central governed hub surrounded by three circular independent but coupled loops: commercial (offer, deliver, collect, reinvest), invention (discover, invent mechanisms, verify, inherit), productive expansion (bottlenecks, pilot, measure, replicate). Side legend explains torque, inertia, friction and governance.</desc>
