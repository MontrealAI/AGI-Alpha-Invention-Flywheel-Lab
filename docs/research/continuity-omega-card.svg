<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" lang="en" xml:lang="en" role="img" aria-labelledby="title description">
<title id="title">CONTINUITY Ω — Keep the promise.</title>
<desc id="description">Independently verified cyber resilience. Research by Vincent Boucher, MONTREAL.AI and QUEBEC.AI.</desc>
<rect width="1200" height="630" fill="#111629"/>
<circle cx="1010" cy="260" r="310" fill="#2d264d"/>
<circle cx="1010" cy="260" r="240" fill="none" stroke="#b48a47" stroke-opacity=".3"/>
<text x="838" y="395" font-family="Georgia,DejaVu Serif,serif" font-size="360" fill="#b48a47" opacity=".26">Ω</text>
<path d="M70 84H1130" stroke="#b48a47" stroke-width="1"/>
<text x="70" y="61" font-family="DejaVu Sans,sans-serif" font-size="16" letter-spacing="2" fill="#dedbea">MONTREAL.AI / QUEBEC.AI</text>
<text x="1130" y="61" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" letter-spacing="1" fill="#dedbea">RESEARCH EDITION 1.1.0</text>
<text x="70" y="173" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="45" letter-spacing="2" fill="white">CONTINUITY <tspan font-family="DejaVu Serif,serif" fill="#e3c58e">Ω</tspan></text>
<text x="65" y="302" font-family="Georgia,DejaVu Serif,serif" font-size="86" fill="white">Keep the promise.</text>
<text x="70" y="371" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#d8d2e6">Independently verified cyber resilience</text>
<text x="70" y="445" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#c3b9d6">Find what recovery missed.</text>
<text x="70" y="479" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#c3b9d6">Build what keeping the promise requires.</text>
<path d="M70 540H1130" stroke="#534b68" stroke-width="1"/>
<text x="70" y="582" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#e3c58e">INVENT THE ECONOMY OF CONTINUITY</text>
<text x="1130" y="582" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#dedbea">Vincent Boucher</text>
