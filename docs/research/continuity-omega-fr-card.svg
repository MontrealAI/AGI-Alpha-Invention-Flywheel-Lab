<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" lang="fr-CA" xml:lang="fr-CA" role="img" aria-labelledby="title description">
<title id="title">CONTINUITY Ω — Tenir parole.</title>
<desc id="description">Cyberrésilience vérifiée de manière indépendante. Recherche de Vincent Boucher, MONTREAL.AI et QUEBEC.AI.</desc>
<rect width="1200" height="630" fill="#111629"/>
<circle cx="1010" cy="260" r="310" fill="#2d264d"/>
<circle cx="1010" cy="260" r="240" fill="none" stroke="#b48a47" stroke-opacity=".3"/>
<text x="838" y="395" font-family="Georgia,DejaVu Serif,serif" font-size="360" fill="#b48a47" opacity=".26">Ω</text>
<path d="M70 84H1130" stroke="#b48a47" stroke-width="1"/>
<text x="70" y="61" font-family="DejaVu Sans,sans-serif" font-size="16" letter-spacing="2" fill="#dedbea">MONTREAL.AI / QUEBEC.AI</text>
<text x="1130" y="61" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" letter-spacing="1" fill="#dedbea">ÉDITION DE RECHERCHE 1.1.0</text>
<text x="70" y="173" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="45" letter-spacing="2" fill="white">CONTINUITY <tspan font-family="DejaVu Serif,serif" fill="#e3c58e">Ω</tspan></text>
<text x="65" y="302" font-family="Georgia,DejaVu Serif,serif" font-size="86" fill="white">Tenir parole.</text>
<text x="70" y="371" font-family="DejaVu Sans,sans-serif" font-size="28" fill="#d8d2e6">Cyberrésilience vérifiée de manière indépendante</text>
<text x="70" y="445" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#c3b9d6">Découvrir ce que la reprise a omis.</text>
<text x="70" y="479" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#c3b9d6">Construire les moyens de tenir parole.</text>
<path d="M70 540H1130" stroke="#534b68" stroke-width="1"/>
<text x="70" y="582" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#e3c58e">INVENTER L’ÉCONOMIE DE LA CONTINUITÉ</text>
<text x="1130" y="582" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#dedbea">Vincent Boucher</text>
</svg>
