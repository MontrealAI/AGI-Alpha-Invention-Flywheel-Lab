","test":"Émettre chaque décision à partir des seules mesures antérieures. Examiner ensuite la prochaine mesure dans la même bande et comparer le résultat à une requête directe dans les archives."},"beneficiary":"An archival transient observer selecting candidates for review before the next available visit.","alternative":"Fink rate and uncertainty fields, an astronomer with the existing broker, direct same-band SQL on the same data, and deferral. The broker can use an upper limit; that is a different definition.","costs":"Retrospective CPU time and source acquisition are measurable. Observer review, false alerts, missed changes and follow-up allocation are unpriced. No buyer has agreed.","scale":"Repeat the same dated decision for new objects; each site supplies its own alert budget, data rights and acceptance rule.","rights":"Published survey detections only. No live telescope, classification, or right to commission follow-up is implied.","selection":"Constructed first. Existing SQL can plausibly win and frozen event times support an immediate falsification. Commercial rank remains unresolved.","sources":[{"title":"Fink science modules","url":"https://doc.ztf.fink-broker.org/broker/science_modules/"}]},{"id":"grid","source_ids":["B","A"],"url":"https://arxiv.org/abs/2610.27930","en":{"title":"Find when a learned solver earns its computing time","finding":"Across 15 test grids, a parallel conventional solver could match or exceed the tested ML methods on ordinary power flow. A separate edge study timed one distilled model at 12.2 ms per scenario.","limit":"The studies answer different questions. Speed on an edge device cannot establish bulk throughput or adequate physical accuracy on the lab’s cases.","test":"Time complete batches on unseen public grids against tuned parallel solvers. Count only solutions that pass an independent current-balance check."},"fr":{"title":"Déterminer quand un solveur appris justifie son coût","finding":"Sur 15 réseaux d’essai, un solveur classique parallélisé pouvait égaler ou dépasser les méthodes d’IA testées en calcul de répartition de puissance. Une autre étude mesure 12,2 ms par scénario sur un appareil embarqué.","limit":"Les deux études répondent à des questions différentes. Une latence embarquée ne garantit ni le débit en lots ni la précision physique sur les cas du laboratoire.","test":"Chronométrer des lots complets sur des réseaux publics inédits face à des solveurs parallèles optimisés. Ne compter que les solutions dont le bilan de courant est vérifié indépendamment."},"beneficiary":"A research-computing group comparing offline simulation methods for repeated studies on synthetic grids.","alternative":"Batched conventional CPU/GPU solvers with independent Kirchhoff current checks, or keeping the incumbent.","costs":"Training, tuning, hardware, batching, reference solutions, review and failures per accepted scenario. No validated workload volume or savings.","scale":"A routing rule validated across independent synthetic families could serve many research groups; out-of-distribution cases need qualification.","rights":"Public simulation only. Check model, benchmark and solver licences before reuse. No utility data or operating authority.","selection":"Retain the benchmark comparison. Both sources challenge a broad replacement claim; a workload-matched operating and funding case is missing.","sources":[{"title":"Benchmarking CPU, GPU, and ML Power-Flow Solvers from 14 to 70,000 Buses","url":"https://arxiv.org/abs/2610.27930"},{"title":"Towards Efficient Edge AI for Power Flow in Renewable-Rich Grids with Volt/VAR Control","url":"https://arxiv.org/abs/2611.15181"}]},{"id":"lineage","source_ids":["C","D"],"url":"https://arxiv.org/abs/2610.31566","en":{"title":"Spend an imaging core’s review time on difficult links","finding":"CellTrack-Bench selected difficult associations where multiple trackers made the same mistake. Its authors also report that weaker models can worsen a repair.","limit":"A difficulty-selected sample cannot measure the error rate across an entire movie or justify re-reviewing every link.","test":"Freeze whole microscopy sequences, a fixed review budget and hidden annotations. Compare corrected links and newly introduced errors against a specialist tracker and its own confidence ranking."},"fr":{"title":"Consacrer la relecture aux liens difficiles","finding":"CellTrack-Bench a choisi des associations où plusieurs algorithmes de suivi se trompaient ensemble. Les auteurs observent aussi que des modèles moins performants peuvent aggraver une correction.","limit":"Un sous-ensemble choisi pour sa difficulté ne permet pas d’estimer le taux d’erreur d’une séquence entière ni le bénéfice d’une relecture exhaustive.","test":"Réserver des séquences entières, masquer les annotations et fixer un budget de relecture. Comparer les liens corrigés et les erreurs introduites à un suivi spécialisé qui classe ses propres incertitudes."},"beneficiary":"A microscopy imaging core reviewing links between objects in existing, annotated, nonclinical time-lapse images.","alternative":"A specialized tracker, uncertainty-based inspection, the ordinary Cell Tracking Challenge linking benchmark, or leaving the track unchanged.","costs":"Expert minutes, review transport, segmentation quality, additional model compute, new errors and rights checks. No reviewed facility backlog or willingness to pay.","scale":"Reuse accepted prioritization across licensed datasets, while holding out sequences and imaging modalities for transfer checks.","rights":"Only approved annotated images; dataset and model licences and any clinical use need separate authority.","selection":"Potentially valuable expert-attention bottleneck. Novel beneficiary sequences, annotations and review times are needed for adoption.","sources":[{"title":"CellTrack-Bench: Microscopic Cell Tracking Benchmark for Vision-Language Models","url":"https://arxiv.org/abs/2610.31566"},{"title":"Cell Tracking Challenge","url":"https://celltrackingchallenge.net/"}]},{"id":"formal","source_ids":["M"],"url":"https://arxiv.org/abs/2610.20573","en":{"title":"Catch the wrong theorem before a library release","finding":"Mei and Douglas report that combining semantic review with numerical and vacuity checks accepted the fewest incorrect statements among the tested methods on three labelled datasets.","limit":"A compiled proof can faithfully prove a mistranslation. Finite numerical samples and one benchmark family cannot establish a whole library’s fidelity.","test":"Blind notation and domain errors in unseen identities. Compare accepted incorrect translations against a Lean reviewer, the published verifier and independent high-precision evaluations."},"fr":{"title":"Détecter un énoncé infidèle avant sa publication","finding":"Sur trois jeux annotés, Mei et Douglas rapportent que leur combinaison de relecture sémantique, de tests numériques et de contrôles de vacuité présente le plus faible taux d’acceptation d’énoncés erronés parmi les méthodes étudiées.","limit":"Une preuve compilée peut établir une traduction infidèle. Un échantillonnage numérique et une famille de tests ne garantissent pas la fidélité d’une bibliothèque entière.","test":"Masquer des erreurs de notation ou de domaine dans des identités inédites. Comparer les traductions fautives acceptées par un spécialiste de Lean, le vérificateur publié et des évaluations numériques indépendantes."},"beneficiary":"A maintainer admitting translated identities to a mathematical software library.","alternative":"Existing Lean/mathlib, upstream FLMF checking, a competent human mathematician, and rejecting an uncertain translation.","costs":"Authoritative translation, independent mathematical adjudication, diagnostics, maintainer review, toolchain pinning and future rechecking. No maintainers enrolled.","scale":"Share reusable mathematical checks across identities where assumptions and domains can be tracked exactly.","rights":"Publication and library licences require review; passing a kernel alone confers no authority to admit a library change.","selection":"Attractive because exact acceptance can be cheap after a faithful statement exists. Intended-statement labels remain an expensive dependency.","sources":[{"title":"Beyond LLM Judge: Mechanical Verification for Agentic Autoformalization","url":"https://arxiv.org/abs/2610.20573"}]},{"id":"logic","source_ids":["H"],"url":"https://arxiv.org/abs/2610.18891","en":{"title":"Build verifiable logic for scientific instruments","finding":"Two winning student teams took LLM-assisted designs through Sky130 physical sign-off. The paper reports zero design-rule and layout-versus-schematic violations for those designs.","limit":"Sign-off does not show measured chips or autonomous design. A new laboratory block still has its own reset, timing and interface requirements.","test":"Generate one passive instrument counter from a fresh timing contract. Check equivalence, reset, synthesis and resource use against existing HDL IP and a direct expert implementation."},"fr":{"title":"Construire une logique vérifiable pour un instrument","finding":"Deux équipes étudiantes lauréates ont fait valider physiquement leurs circuits Sky130 avec l’aide de modèles de langage. Leurs deux circuits respectaient les règles de dessin et correspondaient aux schémas.","limit":"La validation physique ne mesure pas une puce fabriquée et n’établit pas l’autonomie de la conception. Un nouveau bloc conserve ses exigences de réinitialisation, de temporisation et d’interface.","test":"Générer un compteur passif à partir d’un nouveau cahier des charges. Comparer équivalence, réinitialisation, synthèse et ressources avec un bloc existant et une réalisation directe par un spécialiste."},"beneficiary":"An instrumentation group integrating small digital counters into research equipment.","alternative":"A parameterized vendor or open-source IP block, an engineer using conventional EDA and a self-service design flow.","costs":"Specification, verification, debugging, EDA compute, IP review, integration and possibly hardware qualification. No quotes, device access or orders.","scale":"Reuse formally checked blocks for related envelopes; clock domains, interfaces and toolchains require independent requalification.","rights":"Evaluate a passive digital counter in simulation only; publication and redistribution require compatible IP/tool licences.","selection":"Retain as an option. The physical outcome remains outside present authority and an existing counter may meet the full need.","sources":[{"title":"From Prompts to Silicon: Scaling LLM-Assisted Chip Design with the AI Hardware Design League","url":"https://arxiv.org/abs/2610.18891"}]}],"copy":{"en":{"skip":"Skip to the exhibition","nav":"Exhibition","navField":"Possibilities","navForge":"Archive desk","navInstrument":"Take the instrument","aperture":"The aperture · Archive science","heroFirst":"Find the missing","heroSecond":"observation.","heroIntro":"One archive showed a transient brightening in two filters. A second broker held the later survey detections needed to test whether it stayed bright. Reopen the observations that changed the answer.","enter":"Open the archive desk","plate":"Sky plate · candidate positions","projCode":"Gnomonic projection","skyDescription":"Equatorial coordinates of the public candidates. Gold marks identify targets on the selected worklist. Right ascension increases to the left and declination increases upward.","marked":"on the worklist","catalog":"catalogued","goldMarks":"Gold marks · scheduled in rehearsal","orientation":"RA ←   Dec ↑","frontier":"The frontier · Public survey evidence","frontierTitle":"From a candidate to a measurement.","frontierLead":"The October search began with four targets that Fink’s software tagged as early Type Ia supernova candidates. The tag selected the objects. ZTF’s calibrated survey exposures supplied the brightness measurements.","frontierL // Each selectable midnight comes from the source-bound Python producer.
// The browser displays the exact dated queue, including decisions to defer.
function createChangeDesk(series, {el, t, num, fill, element, svg, options, setBlob, locale}) {
  const key = row => row.target_id + '/' + row.band;
  const stamp = at => new Intl.DateTimeFormat(locale()==='fr'?'fr-CA':'en-GB',
    {day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(at));
  const signed = (value,precision=6) => new Intl.NumberFormat(locale(),{signDisplay:'always',maximumFractionDigits:precision}).format(value);
  const head = window => window.days[window.days.length-1];
  const counter = row => [row.status,row.eligible_detections,row.comparisons].join('/');
  function illustrative(window) {
    const archive = head(window);
    const later = [...archive.alerts].sort((a,b)=>a.issued_utc.localeCompare(b.issued_utc)||key(a).localeCompare(key(b)));
    if (later.length) return {target:key(later[0]),issued:later[0].issued_utc,hasAlert:true,weight:0};
    const measured = archive.coverage.filter(r=>r.strongest_comparison)
      .sort((a,b)=>Math.abs(b.strongest_comparison.delta_mag)-Math.abs(a.strongest_comparison.delta_mag)||key(a).localeCompare(key(b)));
    const first = measured[0] || archive.coverage[0];
    return {target:key(first),issued:first.strongest_comparison?.issued_utc||window.start,
      hasAlert:false,weight:Math.abs(first.strongest_comparison?.delta_mag||0)};
  }
  const presets = series.map(illustrative);
  const index = presets.findIndex(s=>s.hasAlert);
  let active = index<0?series[presets.findIndex(p=>p.weight===Math.max(...presets.map(x=>x.weight)))]:series[index];
  let checkpoint, selected;
  function choose(window) {
    active=window;
    const preset=presets[series.indexOf(window)];
    selected=preset.target;
    checkpoint=window.days.find(s=>s.as_of_utc>=preset.issued) || head(window);
  }
  const requested = new URLSearchParams(location.search);
  choose(series.find(s=>s.id===requested.get('window'))||active);
  checkpoint=active.days.find(s=>s.as_of_utc===requested.get('date')+'T00:00:00Z')||checkpoint;
  const requestedFocus=requested.get('target')+'/'+requested.get('band');
  if (checkpoint.coverage.some(r=>key(r)===requestedFocus)) selected=requestedFocus;
  let useSecond=requested.get('source')==='alerce'||!requested.has('source')&&!requested.has('date');
  if (useSecond && active.second_archive && !requested.has('date')) {
    checkpoint=active.days.find(s=>active.second_archive[s.as_of_utc].witnesses.some(v=>key(v)===selected))||checkpoint;
  }
  function extras(s=checkpoint) {return useSecond?active.second_archive?.[s.as_of_utc]:null;}
  function external(keyToFind,s=checkpoint) {return extras(s)?.witnesses.find(r=>key(r)===keyToFind);}
  function statusText(status) { return t('status_'+status); }
  function plate(row, witness, alert) {
    const root=el('trace-drawing');root.replaceChildren();
    el('trace').setAttribute('viewBox','0 0 564 240');
    el('trace-title').textContent=t('traceTitle');
    el('trace-target').textContent=row.target_id;
    el('trace-band').textContent=fill(t('bandName'),{band:row.band});
    el('trace-state').textContent=statusText(row.status);
    el('trace-source').textContent=alert?.cross?'FINK + ALeRCE / ZTF':'FINK / ZTF';
    el('trace-date').textContent=stamp(checkpoint.as_of_utc)+' · 00:00 UTC';
    el('trace-delta').textContent=witness?fill(t(alert?.followup?'traceLaterDelta':'traceIssueDelta'),{
      delta:signed(alert?.followup?alert.followup_delta_mag:witness.delta_mag,4),error:num(alert?.followup?alert.followup_formal_error_mag:witness.formal_error_mag,4)}):'';
    if (!witness) {
      el('trace-desc').textContent=t('noPair');
      svg('text',{x:282,y:124,'text-anchor':'middle',class:'chart-axis'},root,t('noPair'));
      return;
    }
    const compact=matchMedia('(max-width: 540px)').matches;
    const width=compact?390:564;
    const left=compact?64:78, right=width-(compact?42:73), edge=width-22;
    el('trace').setAttribute('viewBox','0 0 '+width+' 240');
    const points=[{p:witness.baseline,role:'baseline'},{p:witness.trigger,role:'current'}];
    if (alert?.followup) points.push({p:alert.followup,role:'followup'});
    const times=points.map(({p})=>Date.parse(p.utc));
    const low=Math.min(...points.map(({p})=>p.mag-p.error_mag));
    const high=Math.max(...points.map(({p})=>p.mag+p.error_mag));
    const span=Math.max(high-low,0.04);
    const min=low-span*.20,max=high+span*.23;
    const x=i=>left+(right-left)*(times[i]-times[0])/Math.max(1,times.at(-1)-times[0]);
    // Smaller magnitudes are brighter and appear higher on the page.
    const y=m=>30+145*(m-min)/(max-min);
    svg('text',{x:14,y:16,class:'chart-title'},root,t('axisMag'));
    for(let i=0;i<4;i++) {
      const m=min+(max-min)*i/3;
      svg('line',{x1:left-11,x2:edge,y1:y(m),y2:y(m),class:'chart-guide'},root);
      svg('text',{x:left-18,y:y(m)+4,'text-anchor':'end',class:'chart-axis'},root,num(m,2));
    }
    svg('path',{d:points.map((point,i)=>(i?'L':'M')+x(i)+' '+y(point.p.mag)).join(' '),class:'chart-join'},root);
    const fmt=new Intl.DateTimeFormat(locale()==='fr'?'fr-CA':'en-GB',{month:'short',day:'numeric',timeZone:'UTC'});
    points.forEach(({p,role},i)=>{
      const cx=x(i), cy=y(p.mag), u=y(p.mag-p.error_mag), l=y(p.mag+p.error_mag);
      svg('line',{x1:cx,x2:cx,y1:30,y2:180,class:'chart-guide chart-guide-vert'},root);
      svg('path',{d:'M'+cx+' '+u+'V'+l+' M'+(cx-5)+' '+u+'h10 M'+(cx-5)+' '+l+'h10',class:'chart-error'},root);
      if(role==='followup') svg('path',{d:'M'+cx+' '+(cy-7)+'l7 7 -7 7 -7 -7Z',class:'trace-observation trace-repeat'},root);
      else svg('circle',{cx,cy,r:5.5,class:'trace-observation '+(role==='current'?'trace-trigger':'')},root);
      // End labels anchor away from a middle point even with irregular cadence.
      if(i===0 || i===points.length-1) svg('text',{x:cx,y:202,'text-anchor':i===0?'start':'end',class:'chart-axis'},root,fmt.format(new Date(p.utc)));
    });
    svg('text',{x:edge,y:227,'text-anchor':'end',class:'chart-title'},root,t('axisUTC'));
    el('trace-desc').textContent=points.map(({p,role})=>t('point_'+role)+' '+p.utc+', '+num(p.mag,6)+' ± '+num(p.error_mag,6)+' mag').join('. ');
  }
  function windowLabel(window) {
    const f=new Intl.DateTimeFormat(locale()==='fr'?'fr-CA':'en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
    const start=new Date(window.start), end=new Date(Date.parse(window.end)-1);
    return t('series_'+window.id)+' · '+f.formatRange(start,end);
  }
  function timeline(row, witness, alert) {
    const list=el('signal-points');list.replaceChildren();
    for (const [role,p] of [['baseline',witness?.baseline],['current',witness?.trigger],['followup',alert?.followup]]) {
      const li=element('li');
      li.append(element('span',t('point_'+role)+(role==='followup'&&alert?.cross?' · ALeRCE':'')));li.firstChild.className='step-label';
      if(p) {
        const when=element('time',p.utc.replace('T',' ').replace('Z',' UTC'));when.dateTime=p.utc;
        li.append(element('strong',num(p.mag,6)+' ± '+num(p.error_mag,6)+' mag'),when,element('small','ID '+p.candid));
      } else {
        const state=element('span',role==='followup' ? t('next_'+row.status) : t('pairPending'));
        state.className='awaiting';li.append(state);
      }
      list.append(li);
    }
  }
  function toCsv() {
    const fields=['target_id','band','as_of_utc','eligible_detections','comparisons','status','baseline_candid','baseline_utc','current_candid','current_utc','delta_mag','formal_error_mag','rate_mag_per_day','alert_issued_utc','repeat_deadline_utc','direction','followup_candid','followup_utc','followup_delta_mag','reference_status','additional_broker','additional_status','additional_candid','additional_utc','additional_delta_mag','additional_formal_error_mag'];
    function quote(v) { return '"'+String(v??'').replaceAll('"','""')+'"'; }
    const rows=checkpoint.coverage.map(r=>{

      const article=element('article');
      article.append(element('h3',t(arm.target==='nominal'?'fieldNominal':'fieldAdverse')));
      article.append(element('p',`${t(arm.route==='field'?'fieldRoute':'directRoute')} · ${num(arm.concurrency)} ${t('load')}`));
      article.append(element('p',`${num(arm.quality_accepted)}/${num(arm.requests)} ${t('fieldAccepted')} · ${num(arm.attempts)} ${t('attempts')} · ${num(arm.transport_complete)} ${t('transport')}.`));
      article.append(element('p',`${t('fieldLatency')} · ${num(arm.p90_first_visible_ms)} ms (${arm.visible_count}/${arm.requests}) / ${num(arm.p90_turn_ms)} ms (${arm.transport_complete}/${arm.requests})`));
      fields.append(article);
    }
    const s=data.successor;
    el('successor-description').textContent=`${s.dates} ${t('queue')} · ${[ 'reprocess', 'retain', 'review', 'defer' ].map(k=>`${num(s[k])} ${t(k)}`).join(' / ')}.`;
  }
  function render() {
    document.documentElement.lang=lang;
    document.title='FRONTIER Ω IGNITION · '+t('deskTitle');
    document.querySelectorAll('[data-i]').forEach(n=>{n.textContent=t(n.dataset.i);});
    el('navigation').setAttribute('aria-label',t('nav'));
    const toggle=el('lang');toggle.textContent=lang==='fr'?'EN':'FR';toggle.lang=lang==='fr'?'en':'fr';toggle.setAttribute('aria-label',lang==='fr'?'English':'Français');
    el('mission-scope').textContent=t('scope');
    el('choices').replaceChildren();el('choices').setAttribute('aria-label',t('oppGroup'));
    for(const c of data.opportunities){
      const button=element('button'); button.type='button';button.dataset.id=c.id;button.setAttribute('aria-controls','opportunity');
      const arrow=element('span','↗');arrow.setAttribute('aria-hidden','true');button.append(element('span',c[lang].label || c[lang].title),arrow);
      button.addEventListener('click',()=>{candidate=c.id;opportunity();});el('choices').append(button);
    }
    el('research-source').href=data.opportunities.find(o=>o.id==='transient').url;
    options('budget',[...new Set(cases.map(c=>c.budget))].sort((a,b)=>a-b),n=>`${num(n)} ${t('budgetOption')}`,current.budget);
    options('coverage',[...new Set(cases.map(c=>c.visits))].sort((a,b)=>a-b),n=>t(n===1?'coverageOne':'coverageTwo'),current.visits);
    el('csv').textContent=t('csv');el('receipt').textContent=t('receipt');
    el('command').textContent=data.command;el('kit-hash').textContent=data.archive.sha256;
    const related=el('related');related.replaceChildren();
    for(const row of data.related){const link=element('a',t(row.label)+' ↗');link.href=row.url;link.target='_blank';link.rel='noopener noreferrer';const item=element('li');item.append(link);related.append(item);}
    options('gap',data.sky.exploratory_color_counts.map(x=>x.max_gap_minutes),n=>`${num(n)} min`,gap);
    const loads=[...new Set(data.field.arms.map(a=>a.concurrency))].sort((a,b)=>a-b);
    options('service-load',loads,num,Number(el('service-load').value)||loads[0]);
    opportunity();worklist();photometry();secondWeekFinding();proof();changeDesk.render();
  }
  for(const id of ['budget','coverage']) el(id).addEventListener('change',()=>{
    current=cases.find(c=>c.budget===Number(el('budget').value)&&c.visits===Number(el('coverage').value));worklist();
  });
  el('service-load').addEventListener('change',proof);
  el('gap').addEventListener('change',()=>{gap=Number(el('gap').value);photometry();});
  el('lang').addEventListener('click',()=>{lang=lang==='en'?'fr':'en';render();});
  const changeDesk = createChangeDesk(data.changeSeries, {el, t, num, fill, element, svg, options, setBlob, locale:()=>lang});
  if (location.hash === '#forge' || location.hash === '#measurements') el('supporting').open = true;
  setBlob('second-source',data.secondWeekReport,'application/json','fink-second-week.json');
  setBlob('pilot-summary',data.pilotReport,'application/json','qwen-cpu-pilot.json');
  setBlob('download',Uint8Array.from(atob(data.archive.bytes),v=>v.charCodeAt(0)),'application/zip','FRONTIER_INSTRUMENT.zip');
  render();
})();
</script></body></html>
