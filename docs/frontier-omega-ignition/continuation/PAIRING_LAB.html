 allowance and how many systems may try each issue. Selection uses 60 calibration issues. The other 40 determine the verdict.","Choisissez le budget moyen en jetons et le nombre de syst\u00e8mes autoris\u00e9s par probl\u00e8me. La s\u00e9lection utilise 60 probl\u00e8mes d\u2019\u00e9talonnage. Les 40 autres d\u00e9terminent le verdict."],"budget":["Mean token allowance per issue","Budget moyen en jetons par probl\u00e8me"],"attempts":["Maximum attempts per issue","Nombre maximal d\u2019essais par probl\u00e8me"],"one":["One","Un"],"two":["Up to two","Deux au plus"],"cohort":["Mission","Mission"],"all":["Choose a self-hosted coding stack","Choisir un syst\u00e8me de programmation autoh\u00e9berg\u00e9"],"restricted":["Qualify Devstral on Django","Qualifier Devstral pour Django"],"outcome":["Reproduced decision","D\u00e9cision reproduite"],"auditIssues":["issues resolved on audit","probl\u00e8mes r\u00e9solus \u00e0 l\u2019audit"],"tokenMean":["mean tokens per issue","jetons moyens par probl\u00e8me"],"witness":["Inspect an individual issue","Examiner un probl\u00e8me"],"issue":["Held-out issue identifier","Identifiant du probl\u00e8me r\u00e9serv\u00e9"],"fieldTitle":["Which opportunity merits a test?","Quelle piste m\u00e9rite un essai ?"],"fieldBody":["Five routes entered the study. Open a proposal to inspect its value, its missing evidence and the observation that could change the decision.","Cinq pistes ont \u00e9t\u00e9 \u00e9tudi\u00e9es. Examinez ce que chacune apporterait et les \u00e9l\u00e9ments qui pourraient changer la d\u00e9cision."],"challenge":["Reveal the challenger \u2192","D\u00e9couvrir la sixi\u00e8me piste \u2192"],"proofTitle":["Can the result be reproduced?","Peut-on reproduire le r\u00e9sultat ?"],"proofBody":["The October 22 archive made this exact comparison inspectable. A conventional exhaustive SQL query reaches the same decision. A working instrument and a superior discovery method are separate claims.","L\u2019archive du 22 octobre permet d\u2019examiner cette comparaison pr\u00e9cise. Une requ\u00eate SQL exhaustive arrive \u00e0 la m\u00eame d\u00e9cision. La qualit\u00e9 de l\u2019instrument et la sup\u00e9riorit\u00e9 d\u2019une m\u00e9thode de d\u00e9couverte sont deux hypoth\u00e8ses distinctes."],"benchmarks":["The strongest comparisons","Les meilleures comparaisons"],"repeat":["Repeat the audit","Rejouer l\u2019audit"],"repeatBody":["Execute the selector against the public rows in this browser, independently total every attempt, and check all seven registered decisions against the recorded Python and SQL results.","Ex\u00e9cutez la s\u00e9lection sur les donn\u00e9es publiques dans ce navigateur. Recalculez chaque essai et comparez les sept d\u00e9cisions aux r\u00e9sultats Python et SQL enregistr\u00e9s."],"run":["Run seven checks","Ex\u00e9cuter les sept contr\u00f4les"],"limits":["Scope, costs and negative evidence","Port\u00e9e, co\u00fbts et r\u00e9sultats n\u00e9gatifs"],"limitBody":["These are archived outcomes. Counting a two-system resolution assumes an independent acceptance test can identify a passing patch. Hardware, verifier effort, labor and actual cash cost remain unmeasured. The public benchmark does not establish private performance, paid demand or a five-week frontier crossing.","Les r\u00e9sultats proviennent de l\u2019archive. Pour compter une r\u00e9solution \u00e0 deux syst\u00e8mes, un test ind\u00e9pendant doit pouvoir reconna\u00eetre un correctif valide. Le mat\u00e9riel, le travail de v\u00e9rification, la main-d\u2019\u0153uvre et le co\u00fbt mon\u00e9taire restent \u00e0 mesurer. Le banc d\u2019essai public ne d\u00e9montre ni le rendement en contexte priv\u00e9, ni une demande payante, ni le franchissement d\u2019une fronti\u00e8re en cinq semaines."],"prior":["Earlier IGNITION evidence remains instructive. Direct Qwen migration passed; both unattended research-led construction missions failed to deliver an accepted artifact. The original report contains the complete cohort and its resource limits.","Les essais ant\u00e9rieurs d\u2019IGNITION restent instructifs. La migration directe avec Qwen a r\u00e9ussi. Les deux missions de construction autonomes pr\u00e9c\u00e9d\u00e9es d\u2019une recherche n\u2019ont livr\u00e9 aucun artefact accept\u00e9. Le rapport original d\u00e9crit la cohorte et ses ressources."],"historicReport":["Read the frozen IGNITION cohort \u2197","Lire le rapport historique d\u2019IGNITION \u2197"],"sources":["Inspect sources and identities","Examiner les sources et les empreintes"],"exactSource":["Pinned source repository \u2197","Version exacte du d\u00e9p\u00f4t source \u2197"],"sourceId":["Five-field CSV \u00b7 SHA-256","CSV de cinq colonnes \u00b7 SHA-256"],"takeaway":["Portable instrument","Instrument portable"],"deliverTitle":["Take the lab with you.","Emportez le laboratoire."],"deliverBody":["The independent Python kit includes the licensed observations, tests, SQL reference and a pilot tool to register your own tasks and grader before collecting new observations. It runs offline with the Python standard library.","La trousse Python contient les observations sous licence, les tests, la r\u00e9f\u00e9rence SQL et un outil pour enregistrer vos t\u00e2ches et votre \u00e9valuateur avant toute nouvelle mesure. Elle fonctionne hors ligne avec la biblioth\u00e8que standard de Python."],"download":["Download the instrument \u00b7 ZIP \u2193","T\u00e9l\u00e9charger l\u2019instrument \u00b7 ZIP \u2193"],"receipt":["Save this audit \u00b7 JSON","Enregistrer cet audit \u00b7 JSON"],"archiveDigest":["Instrument archive fingerprint","Empreinte de l\u2019archive"],"engagement":["Selected engagements","Mandats sur invitation"],"ambitionTitle":["Bring your ambition to the frontier.","Portez votre ambition \u00e0 la fronti\u00e8re."],"ambitionBody":["MONTREAL.AI develops FRONTIER \u03a9 for its own research. Selected founders and enterprises may be considered for a limited IGNITION engagement spanning investigation, construction and independent verification.","MONTREAL.AI d\u00e9veloppe FRONTIER \u03a9 pour ses propres recherches. Un nombre limit\u00e9 de mandats IGNITION peut \u00eatre envisag\u00e9 avec des entreprises ou des fondateurs, de la recherche \u00e0 la construction et \u00e0 la v\u00e9rification ind\u00e9pendante."],"contact":["Visit MONTREAL.AI \u2197","Visiter MONTREAL.AI \u2197"],"yourBrief":["Your mission brief","Votre mandat"],"placeholder":["Which outcome would change what your team can do?","Quel r\u00e9sultat changerait les possibilit\u00e9s de votre \u00e9quipe ?"],"privateNote":["Your words stay in this tab. Save a brief for your private workspace; the public exhibit runs only the published missions.","Votre texte reste dans cet onglet. Enregistrez le mandat pour votre espace priv\u00e9. L\u2019exposition publique ex\u00e9cute uniquement les missions publi\u00e9es."],"saveBrief":["Save my brief","Enregistrer mon mandat"],"footer":["Built in Montr\u00e9al. Open to the world.","Cr\u00e9\u00e9 \u00e0 Montr\u00e9al. Ouvert sur le monde."],"up":["Back to top \u2191","Haut de page \u2191"],"scopeMain":["Acceptance requires at least 45% of audit issues resolved and a mean volume inside the selected allowance.","La d\u00e9cision exige au moins 45 % de r\u00e9solutions \u00e0 l\u2019audit et un volume moyen conforme au budget choisi."],"scopeSuccessor":["Frozen successor mission. Devstral only, Django issues, 2 million tokens per issue, up to two attempts, 45% resolution required. Filtering follows the original split.","Mission de r\u00e9utilisation enregistr\u00e9e. Devstral seulement, probl\u00e8mes Django, 2 millions de jetons par probl\u00e8me, deux essais au plus et 45 % de r\u00e9solutions exig\u00e9es. Le filtre suit la partition initiale."],"pass":["Within both conditions","Deux crit\u00e8res satisfaits"],"fail":["Outside the conditions","Crit\u00e8res non satisfaits"],"solved":["Resolved","R\u00e9solu"],"open":["Unresolved","Non r\u00e9solu"], ur\u00e9s."],"verified":["Confirmed","Confirm\u00e9"],"mismatch":["Mismatch: see Python evidence","\u00c9cart d\u00e9tect\u00e9 : voir les donn\u00e9es Python"],"sourceAttribution":["Dataset by Zhao, Poskitt and Lo (2026). Five fields selected, renamed and reserialized under CC BY 4.0.","Donn\u00e9es de Zhao, Poskitt et Lo (2026). Cinq champs s\u00e9lectionn\u00e9s, renomm\u00e9s et res\u00e9rialis\u00e9s sous licence CC BY 4.0."]},"archive":"UEsDBBQAAAAIAAAAcV0T8jYydQ4AAKweAAAJAAAAUkVBRE1FLm1ktVnbktvGEX3nV0zZTjnegCDAO/0mrSTbldXFWtupxJVaDoABOVoAA2MAUlTp43O6ZwCSkpU8xVUr7+Iy09N9+vTpxtfijdSNrnbiTiaj0e3eGKvEca/TvbCqyMd7Y1uVidRk9JBtZfpoRaka3Qop6kYfZKtErQvThuKXvRK6sm3Tlapq8U5Zy0ZZEa9FaTJVTPayqZS1dCfRlWy1qawwlYijSNRdUmi7x17W5O0RLwptbadsIFK8t8M6uWlEV9kuTbFI3hVCtq0q6xaPFIbsgkWm0OlJdJasXUbDErLKhOwy3VoBy7FlC1sN/mnEPArF267i63le6Arn1+1evDm1ezw4C+Pob/w+vQwHVJlsMlHopJHNKRyNttut3Y9qfnomaufOh0ImYX0S47HtyhIPfvmBpMt2qhWLiP/DhaPOsP30y2+wM0WmDnC1LHChUbWxujXNSWTvZLUzDw/u/+flp8Pynxo0firGJfyq4Uzbikzb1Bzgl/FheOSPThY6P7nd071KH0WjUqXrNnxnTTU8Bztg64N6XwMghAG8Qf4Zjd6qEouK7bD9VrSGwFKrtBUK+51cfFzEAlrKNIS8XSMz/M3I4zA4NGR4/1FVgFKHbTiA27PD0ke5U2SuR/cD0B1+0DXv2qik00XGEKBNZFIoIZt0rw8qFLcG9lWZFQ1hgoCiLZyC87J/AUHCgXoP16cuM2pCwddfM/wzlWqrPb7UQWeqSpWwXU0b2dGInkHWkAdgx04juRosMrwmi8IccUHiVzgFpwAoRXs0otRFQU9cHd8KeLp3GaNWivniL1jamqKj/BJ5YUyDY0lGLF+qdfqIFX4+qmo2vgWYmvErHEhMxJMdglZQilKuGaSCTzGXQe1etj4SddFZ8cPdy/E8XI1fFNLu6fWuNbTeWwbQcY/4kOl9moojDksWl4S1LBT/IIuvniC3IbMLuNXiT5z95iZBnt7cgHSk7chZCIx1cadEdthhF4TiSeV+c7eJW1Ll7FCak912idscIGnBcbW0Vjko6CpTtcI/WLerkVpKlg59cF/Pkmysg4o3RBPtNKptDGMZN9zmqskBECROKH4CV8KqEhQmmbsIhbK62pFu1CAX2MtpmMqacQkPpETKtLlkc+k3ZzzQmXctfAK+U8DgR/H2DCmXTXQJUCBrP4pfTAu6+ARAdPkaSbj0m2oyjcT8OPo4Ho/p5/vrf3BD3KtCcQqQSQUAOH1JZuP1eDmZR/j/erUOlssZfpvGwWa5wi9PFQD+GT7F1XpEIperrd1q8TxYzqfBarnGH7PlMoiWG/z2UilEmkCCMGLhvSkySlB4vzgRQi42o22eOvee08GZL/SuMhxjx5gB5wdA/Roh+pEZAceYOVNm61UQx7Mg2pAtm2C5WgXrKZ3v+ftUKTzbW//5uRb9uaZTf67VMlhu8LNa4q95MI9X9PPFo9Gazzz5j02FQz5zZO8ro7l03mIST8lg2DiHjfOY/ghm0SzYrHkLhFxZTjdO8 const $ = id => document.getElementById(id);
const grid = new Map(), stacks = new Set();
for (const row of data.csv.trimEnd().split('\n').slice(1)) {

function make(tag,text,attrs={}) {

  for (const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
  return el;
}
function svg(tag,attrs) {

function label(stack){

function measure(tasks,policy,detail=false) {

  for (const id of tasks) {

function compute(key) {

 'paired-replay':['Rejouer les configurations sur les mêmes problèmes réservés','Sélectionner sous budget sur 60 problèmes, puis examiner la stratégie verrouillée sur les 40 autres. La même mesure existe pour chaque configuration.','Un évaluateur indépendant doit reconnaître un correctif qui passe en pratique. Une requête SQL exhaustive retrouve le même résultat.']
};
function renderRoutes() {
  const list=ui.revealed?data.options:data.options.slice(0,5);
  const head=item=>ui.lang?translatedRoutes[item.id][0]:item.title;
  $('routes').replaceChildren(...list.map((item,index)=>{
    const button=make('button',head(item),{'aria-pressed':String(index===ui.candidate)});
    button.onclick=()=>{ui.candidate=index;renderRoutes();};return button;
  }));
  const item=list[ui.candidate],trans=translatedRoutes[item.id];
  const url=data.sources[item.source_ids[0]];
  const body=make('p',ui.lang?trans[1]:item.value);
  const limit=make('p',ui.lang?trans[2]:item.tradeoff);
  const link=make('a',t('seeSource'),{href:url,target:'_blank',rel:'noopener noreferrer'});
  const status=item.id===data.winner?'challenger':'proposal';
  $('route-card').replaceChildren(make('div',t(status),{class:'micro'}),make('h3',head(item)),body,document.createElement('br'),limit,link);
  $('challenge').hidden=ui.revealed;
}
function updateChecks() {
  $('events').replaceChildren(...ui.checks.map(row=>make('li',(row.key==='successor'?fr('Django successor','Réutilisation sur Django'):row.key)+' · '+row.solved+'/'+row.tasks+' · '+t(row.verified?'verified':'mismatch'))));
}
function renderLanguage(){
  document.documentElement.lang=ui.lang?'fr-CA':'en';$('language').textContent=ui.lang?'EN':'FR';
  $('language').setAttribute('aria-label',ui.lang?'English':'Français');
  document.querySelectorAll('[data-t]').forEach(node=>node.textContent=t(node.dataset.t));
  document.querySelectorAll('[data-ph]').forEach(node=>node.placeholder=t(node.dataset.ph));
  for(const opt of $('budget').options) opt.textContent=n(Number(opt.value));
  renderInstrument();renderRoutes();updateChecks();
}
function download(bytes,filename,type){
  const url=URL.createObjectURL(new Blob([bytes],{type}));
  const a=make('a',undefined,{href:url,download:filename});document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
$('scope').onchange=e=>{ui.scope=e.target.value;ui.issue=0;renderInstrument();};
$('budget').onchange=e=>{ui.budget=Number(e.target.value);ui.issue=0;renderInstrument();};
document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{ui.width=Number(button.dataset.width);ui.issue=0;renderInstrument();});
$('case').onchange=e=>{ui.issue=Number(e.target.value);renderWitness();};
$('challenge').onclick=()=>{ui.revealed=true;ui.candidate=data.options.findIndex(x=>x.id===data.winner);renderRoutes();$('routes').lastElementChild.focus();};
$('language').onclick=()=>{ui.lang=1-ui.lang;renderLanguage();};
$('replay').onclick=()=>{
  ui.checks=Object.keys(data.receipt.arms).map(key=>{const result=compute(key);return {key,verified:result.verified,...result.score};});
  updateChecks();
};
$('download').onclick=()=>download(Uint8Array.from(atob(data.archive),c=>c.charCodeAt(0)),'FRONTIER_OMEGA_Pairing_Lab.zip','application/zip');
$('receipt').onclick=()=>download(JSON.stringify({schema:'frontier-showcase-reproduction/1',arm:current.key,recorded:current.ref,
  reproduced:{selected:current.policy,calibration:current.train,audit:current.score,qualifies:current.pass,witnesses:current.witnesses},
  matches_recorded:current.verified},null,2),'pairing-lab-audit.json','application/json');
$('purpose').oninput=()=>{$('savebrief').disabled=!$('purpose').value.trim();};
$('savebrief').onclick=()=>download(JSON.stringify({schema:'frontier-omega-mission-brief/1',purpose:$('purpose').value.trim(),status:'unsubmitted'},null,2),'frontier-mission-brief.json','application/json');
$('datahash').textContent=data.receipt.study.data_sha256;$('archivehash').textContent=data.archive_sha256;
$('source-commit').href=data.receipt.study.source;
renderLanguage();
</script></body></html>
