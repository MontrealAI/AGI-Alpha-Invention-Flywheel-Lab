<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="@@POLICY@@"><title>FRONTIER Ω IGNITION · Endpoint Lab</title><style>@@CSS@@</style></head>
<body><a href="#main" class="skip" data-t="skip"></a>
<header class="mast"><div class="wrap mast-inner"><a class="wordmark" href="#main" lang="en">FRONTIER <i>Ω</i> <span>IGNITION</span></a><nav id="main-nav" aria-label="Exhibition"><a href="#lab" data-t="labNav"></a><a href="#field" data-t="fieldNav"></a><a href="#instrument" data-t="take"></a></nav><button id="locale" lang="fr" aria-label="Français">FR</button></div></header>
<main id="main">
<section class="opening"><div class="wrap opening-inner">
<div class="lead"><p class="overline">MONTREAL.AI <span>×</span> QUEBEC.AI</p><h1><span data-t="title"></span><em data-t="titleEnd"></em></h1><p class="dek" data-t="lead"></p><a class="cta" href="#lab"><span data-t="start"></span><span aria-hidden="true">↓</span></a></div>
<figure id="hero-plate"><div class="plate-kicker"><span data-t="plate"></span><span id="sweep-count"></span></div><svg id="hero-plot" role="img" aria-labelledby="plot-title plot-desc" viewBox="0 0 560 320"><title id="plot-title"></title><desc id="plot-desc"></desc><g id="plot-drawing"></g></svg><figcaption><strong data-t="atlas"></strong><span data-t="atlasCaption"></span></figcaption></figure>
</div></section>
<section id="lab" class="paper"><div class="wrap content"><p class="overline" data-t="decisionKicker"></p><div class="section-head"><h2 data-t="decisionTitle"></h2><p data-t="decisionIntro"></p></div>
<div class="scenario-layout"><div class="scenario-controls"><label for="scenario" data-t="contract"></label><select id="scenario"></select><p id="contract-desc"></p><div class="source-tape"><span data-t="modelLabel"></span><b id="model"></b><span data-t="datasetLabel"></span><b id="dataset"></b></div></div>
<article class="ticket" aria-live="polite"><div class="ticket-head"><span data-t="decision"></span><span id="decision-state"></span></div><div id="decision-body"></div><p id="decision-note"></p><a class="text-link" id="receipt" download="endpoint-decision.json" data-t="saveDecision"></a></article></div>
<details class="inspect"><summary data-t="inspect"></summary><div class="inspect-grid"><div><h3 data-t="comparison"></h3><p id="peak-text"></p></div><div><h3 data-t="verify"></h3><p data-t="checkDetail"></p><a id="study-link" class="text-link" href="#instrument" data-t="getStudy"></a></div></div></details>
</div></section>
<section id="semantics"><div class="wrap content"><p class="overline" data-t="rateKicker"></p><div class="section-head"><h2 data-t="rateTitle"></h2><p data-t="rateIntro"></p></div><div class="rate-box"><div><label for="rate" data-t="rateControl"></label><output id="rate-value" for="rate"></output><input type="range" id="rate" min="1" max="400" value="110" step="1"><p id="rate-stat"></p></div><div class="rate-readout" aria-live="polite"><div><span data-t="rateReported"></span><strong id="reported-load"></strong></div><div><span data-t="rateInverse"></span><strong id="inverse-load"></strong></div><p data-t="rateUnit"></p></div></div></div></section>
<section id="explore"><div class="wrap content"><p class="overline" data-t="frontierKicker"></p><div class="section-head"><h2 data-t="filterTitle"></h2><p data-t="filterIntro"></p></div><form class="filter-form" id="filter-form"><label><span data-t="filterSystem"></span><select id="system"></select></label><label><span data-t="latency"></span><input type="number" min="0" step="any" id="latency" inputmode="decimal" required></label><label><span data-t="speed"></span><input type="number" min="0" step="any" id="speed" inputmode="decimal" required></label><button class="cta" data-t="filterApply"></button></form><p id="filter-result" class="filter-result" aria-live="polite"></p><div class="data-table" role="region" tabindex="0" id="table-wrap" aria-label="Measured runs"><table><caption data-t="measurements"></caption><thead><tr><th scope="col" data-t="run"></th><th scope="col" data-t="load"></th><th scope="col" data-t="ttft"></th><th scope="col" data-t="perUser"></th><th scope="col" data-t="aggregate"></th><th scope="col" data-t="within"></th></tr></thead><tbody id="rows"></tbody></table></div><p><span data-t="source"></span> <a class="text-link" id="report" target="_blank" rel="noopener noreferrer"></a></p></div></section>
<section class="paper" id="field"><div class="wrap content"><p class="overline" data-t="fieldKicker"></p><div class="section-head"><h2 data-t="fieldTitle"></h2><p id="ambition"></p></div><div class="field-grid"><div class="choices" id="choices" role="group" aria-label="Opportunities"></div><article class="field-detail" aria-live="polite"><span class="overline" id="candidate-state"></span><h3 id="candidate-title"></h3><p id="candidate-benefit"></p><dl id="candidate-detail"></dl><a class="text-link" id="candidate-source" target="_blank" rel="noopener noreferrer"></a></article></div></div></section>
<section id="forge"><div class="wrap content"><p class="overline" data-t="forgeKicker"></p><div class="section-head"><h2 data-t="forgeTitle"></h2><p data-t="forgeIntro"></p></div><dl class="forge-rows" id="events"></dl></div></section>
<section id="instrument"><div class="wrap content"><p class="overline" data-t="instrumentKicker"></p><div class="section-head"><h2 data-t="instrumentTitle"></h2><p data-t="instrumentIntro"></p></div><div class="instrument-grid"><div><a class="cta" id="download" download="FRONTIER_OMEGA_Endpoint_Lab.zip"><span data-t="download"></span><span aria-hidden="true">↓</span></a><p data-t="offline"></p><a class="text-link" id="standalone" download="FRONTIER_LAB.html" data-t="savePage"></a></div><div><code id="command"></code><details><summary data-t="hash"></summary><code id="kit-hash"></code></details></div></div><div class="handoff"><label for="purpose" data-t="purpose"></label><textarea id="purpose" rows="2" maxlength="1200" aria-describedby="purpose-hint"></textarea><p id="purpose-hint" data-t="purposeHint"></p><a id="brief" class="text-link" download="next-experiment.json" data-t="saveBrief"></a></div></div></section>
<section id="next" class="paper"><div class="wrap content"><p class="overline" data-t="nextKicker"></p><div class="section-head"><h2 data-t="nextTitle"></h2><p data-t="nextIntro"></p></div><div class="next-grid"><article><h3 data-t="readerTitle"></h3><p id="reader-note"></p><a class="text-link" id="reading" data-t="readingLink"></a></article><article><h3 data-t="numericTitle"></h3><p id="numeric-note"></p><a class="text-link" id="numeric-link" data-t="numericLink" download="numeric-study.json"></a></article><article><h3 data-t="pairTitle"></h3><p data-t="pairText"></p><a class="text-link" id="pairing" data-t="pairLink"></a></article></div></div></section>
</main><footer><div class="wrap foot"><span>FRONTIER Ω</span><p data-t="footer"></p><a href="#main" data-t="top"></a></div></footer>
<noscript>Enable JavaScript to inspect the measurements. Activez JavaScript pour examiner les mesures.</noscript><script type="application/json" id="public-data">@@DATA@@</script><script>@@APP@@</script></body></html>
